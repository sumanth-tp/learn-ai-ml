            - strong [ref=f2e391]: Reading the output.
            - text: Near 32 the fp16 gap is 0.03125, so
            - code [ref=f2e392]: 32 + 0.01 = 32
            - text: . After 10,000 additions of 0.01, fp16 sits at 32.0, bf16 at 4.0 and fp32 at 100.0030. With bf16 inputs and an fp32 accumulator the answer is 100.0977, which is off only because each bf16 input is really 0.010009766. The 2e-8 gradient is stored as zero at scale 1 and as 2.0504e-05 at scale 1,024, which divides back to 2.0023e-08. The median rounding errors are 0.00017 (fp16), 0.00135 (bf16), 0.02183 (e4m3) and 0.04338 (e5m2).

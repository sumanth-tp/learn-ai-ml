        - generic [ref=f2e71]:
          - heading "Mixed Precision and Numerics" [level=1] [ref=f2e73]
          - paragraph [ref=f2e74]:
            - strong [ref=f2e75]: In one line.
            - text: Training stores most numbers in 16 or 8 bits to save memory and time, and stays correct only because a few things (a full-precision copy of the weights, a scaled loss, running sums in 32 bits) protect the numbers that small formats would destroy.
          - generic [ref=f2e76]:
            - generic [ref=f2e77]: Before you start
            - list [ref=f2e82]:
              - listitem [ref=f2e83]:
                - strong [ref=f2e84]: You should already know
                - text: that a model is a set of numbers called weights and that training nudges them with gradients (
                - link "Adam optimiser" [ref=f2e85] [cursor=pointer]:
                  - /url: /docs/theory/dnn/adam-optimizer
                - text: ), and where the 2 + 2 + 12 bytes per parameter come from (
                - link "DDP, FSDP and ZeRO" [ref=f2e86] [cursor=pointer]:
                  - /url: /docs/llm-engineering/ddp-fsdp-and-zero
                - text: ).
              - listitem [ref=f2e87]:
                - strong [ref=f2e88]: "Reading time:"
                - text: about 40 minutes, plus about a minute to run the code.
              - listitem [ref=f2e89]:
                - strong [ref=f2e90]: After this chapter you can
                - text: read a floating-point format's range and step size, explain why bf16 needs no loss scale and fp16 does, predict when an update or a sum is lost to rounding, and say when fp8 needs a scale per block.
          - generic [ref=f2e91]:
            - generic [ref=f2e92]: Not from a lecture
            - paragraph [ref=f2e97]: "This chapter was written for this site from the sources under Go deeper. Every experiment runs in this chapter's environment: Python 3.14, PyTorch 2.14.1 on the CPU, Transformers 5.18.0. NVIDIA Transformer Engine (release 2.20.2 on PyPI on 5 October 2026) needs GPUs, so its snippet is not run. Sources were opened on 7 October 2026."
          - heading [level=2] [ref=f2e98]:
            - text: In 30 seconds
            - link "Direct link to In 30 seconds" [ref=f2e99] [cursor=pointer]:
              - /url: "#in-30-seconds"
              - text: "#"
          - paragraph [ref=f2e100]: "A computer stores a decimal number like 0.1 with a fixed number of binary digits, so it keeps only an approximation. More digits give a better approximation and cost more memory. Think of a ruler: a ruler marked in millimetres cannot show half a millimetre, and a pocket ruler marked in whole centimetres cannot show a millimetre at all."
          - paragraph [ref=f2e101]: "Language-model training uses rulers of four sizes: 32 bits, 16 bits (in two layouts) and 8 bits. The smaller rulers are faster and use less memory, but they have two failure modes. A small number can fall between two marks and become zero, and a small number added to a big one can vanish. Mixed precision is the set of tricks that avoids both."
          - heading [level=2] [ref=f2e102]:
            - text: Words you will meet
            - link "Direct link to Words you will meet" [ref=f2e103] [cursor=pointer]:
              - /url: "#words-you-will-meet"
              - text: "#"
          - table [ref=f2e104]:
            - rowgroup [ref=f2e105]:
              - row [ref=f2e106]:
                - columnheader "Term" [ref=f2e107]
                - columnheader "Plain meaning" [ref=f2e108]
                - columnheader "Tiny example" [ref=f2e109]
            - rowgroup [ref=f2e110]:
              - row [ref=f2e111]:
                - cell "Bit" [ref=f2e112]
                - cell "One binary digit, 0 or 1" [ref=f2e113]
                - cell "A 16-bit number has 16 of them" [ref=f2e114]
              - row [ref=f2e115]:
                - cell "Exponent" [ref=f2e116]
                - cell "The bits that say how big the number is, as a power of 2" [ref=f2e117]
                - cell "Large exponent field = large number" [ref=f2e118]
              - row [ref=f2e119]:
                - cell "Mantissa" [ref=f2e120]
                - cell "The bits that say which digits the number has" [ref=f2e121]
                - cell "More mantissa bits = a finer ruler" [ref=f2e122]
              - row [ref=f2e123]:
                - cell "Subnormal" [ref=f2e124]
                - cell "A very small number stored with reduced precision, below the smallest normal number" [ref=f2e125]
                - cell "fp16 below 6.1e-5" [ref=f2e126]
              - row [ref=f2e127]:
                - cell "Overflow and underflow" [ref=f2e128]
                - cell "A number too big for the format (becomes infinity), or too small (becomes zero)" [ref=f2e129]
                - cell "70,000 in fp16 is inf" [ref=f2e130]
              - row [ref=f2e131]:
                - cell "Master weights" [ref=f2e132]
                - cell "A 32-bit copy of the weights that the optimiser updates" [ref=f2e133]
                - cell "Next to the 16-bit working copy" [ref=f2e134]
              - row [ref=f2e135]:
                - cell "Loss scaling" [ref=f2e136]
                - cell "Multiplying the loss by a constant so small gradients stay representable" [ref=f2e137]
                - cell "Scale 1,024" [ref=f2e138]
              - row [ref=f2e139]:
                - cell "Autocast" [ref=f2e140]
                - cell "PyTorch's switch that runs chosen operations in lower precision" [ref=f2e141]
                - cell [ref=f2e142]:
                  - code [ref=f2e143]: torch.autocast
              - row [ref=f2e144]:
                - cell "Quantisation scale" [ref=f2e145]
                - cell "A multiplier that moves a tensor into a small format's range" [ref=f2e146]
                - cell "448 divided by the largest value" [ref=f2e147]
          - heading [level=2] [ref=f2e148]:
            - text: The idea in plain words
            - link "Direct link to The idea in plain words" [ref=f2e149] [cursor=pointer]:
              - /url: "#the-idea-in-plain-words"
              - text: "#"
          - paragraph [ref=f2e150]: "Start with one number, 0.1. In binary it is 1.6 times 2 to the power minus 4, and 1.6 in binary never ends: 1.1001100110011 and so on. A format with 7 digits after the point (bf16) must cut it: 1.1001101, which is 1.6015625. So bf16 stores 0.1 as 0.10009765625. A format with 10 digits (fp16) stores 0.0999755859375, and one with 23 (fp32) stores 0.10000000149. Each is a nearby number, not the number."
          - paragraph [ref=f2e151]:
            - text: Now take two ideas from that. First, the
            - strong [ref=f2e152]: step size
            - text: between neighbouring numbers depends on how many digits you keep and how big the number is. Near 1 the step in bf16 is 0.0078; near 32 it is 0.25. Second, the
            - strong [ref=f2e153]: range
            - text: "(the largest and smallest numbers) depends on the exponent bits. bf16 gives 8 exponent bits, like fp32, so it covers almost the same range. fp16 gives only 5, so its range is tiny: the largest number is 65,504."
          - paragraph [ref=f2e154]: Those two facts explain every rule of mixed precision. A tiny gradient can sit below the smallest number a format can hold. A small update added to a big weight can be smaller than half a step, so it rounds to nothing. A running sum can grow until each new item is smaller than half a step, and then it stops growing.
          - 'figure "Compare the orange exponent boxes first: fp32 and bf16 have the same, so they have the same range. Then compare the blue mantissa boxes: they set the step size. Figures are printed by block 1." [ref=f2e155]':
            - generic [ref=f2e156]:
              - 'button "Enlarge: Bit layouts of fp32, bf16, fp16, fp8 e4m3 and fp8 e5m2 as sign, exponent and mantissa boxes beside a table of the largest number, smallest normal number, smallest subnormal number and the gap above 1, with three notes on bf16, fp16 and fp8" [ref=f2e157]':
                - img "Bit layouts of fp32, bf16, fp16, fp8 e4m3 and fp8 e5m2 as sign, exponent and mantissa boxes beside a table of the largest number, smallest normal number, smallest subnormal number and the gap above 1, with three notes on bf16, fp16 and fp8" [ref=f2e158]
              - button "View infographic larger" [ref=f2e159] [cursor=pointer]:
                - generic [ref=f2e162]: Expand
          - heading [level=2] [ref=f2e164]:
            - text: Worked example, step by step
            - link "Direct link to Worked example, step by step" [ref=f2e165] [cursor=pointer]:
              - /url: "#worked-example-step-by-step"
              - text: "#"
          - paragraph [ref=f2e166]: Three small calculations, each of which the code in block 2 prints.
          - list [ref=f2e167]:
            - listitem [ref=f2e168]:
              - strong [ref=f2e169]: Store 0.1.
              - text: "In fp16, 0.1 is 1.6 times 2 to the power minus 4, with 10 digits kept: 0.0999755859375. The error is 2.4e-5. In bf16 only 7 digits are kept, so the value is 0.10009765625 and the error is 9.8e-5, four times larger. fp32 is off by 1.5e-9."
            - listitem [ref=f2e170]:
              - strong [ref=f2e171]: Add 0.01 to 32.
              - text: In fp16 the gap between neighbours near 32 is 0.03125. Half a gap is 0.0156, which is bigger than 0.01, so the sum rounds back to 32. Do it 10,000 times and fp16 stops at 32.0 (after 2,798 additions). bf16 has a coarser step and stops at 4.0 (after 350). The true answer is 100. An fp32 accumulator gets 100.0030.
            - listitem [ref=f2e172]:
              - strong [ref=f2e173]: A gradient of 2e-8 in fp16.
              - text: "The smallest fp16 number is 5.96e-8. Half of that is 2.98e-8, and 2e-8 is below it, so the gradient is stored as zero. Now multiply the loss by 1,024 first. The scaled gradient is 2.05e-5, which fp16 stores as 2.0504e-5. After the backward pass, divide by 1,024: 2.0023e-8. That is within 0.12 per cent of 2e-8. This is"
              - strong [ref=f2e174]: loss scaling
              - text: .
          - 'figure "Read each column top to bottom: the problem, the size of the damage, the cure. All numbers are printed by block 2." [ref=f2e175]':
            - generic [ref=f2e176]:
              - 'button "Enlarge: Three columns: storing 0.1 in fp32, fp16 and bf16 with their errors; adding 0.01 to 32 in fp16 and bf16 stopping at 32 and 4; and a 2e-8 gradient lost in fp16 until the loss is scaled by 1024" [ref=f2e177]':
                - 'img "Three columns: storing 0.1 in fp32, fp16 and bf16 with their errors; adding 0.01 to 32 in fp16 and bf16 stopping at 32 and 4; and a 2e-8 gradient lost in fp16 until the loss is scaled by 1024" [ref=f2e178]'
              - button "View infographic larger" [ref=f2e179] [cursor=pointer]:
                - generic [ref=f2e182]: Expand
          - heading [level=2] [ref=f2e184]:
            - text: How it works
            - link "Direct link to How it works" [ref=f2e185] [cursor=pointer]:
              - /url: "#how-it-works"
              - text: "#"
          - heading [level=3] [ref=f2e186]:
            - text: What is inside a floating-point number?
            - link "Direct link to What is inside a floating-point number?" [ref=f2e187] [cursor=pointer]:
              - /url: "#what-is-inside-a-floating-point-number"
              - text: "#"
          - paragraph [ref=f2e188]:
            - text: A floating-point number has a sign bit, some exponent bits and some mantissa bits. For a normal number the value is the sign, times
            - code [ref=f2e189]: 1.m
            - text: ", times 2 to the power"
            - code [ref=f2e190]: e - bias
            - text: . Here
            - code [ref=f2e191]: m
            - text: is the mantissa digits and
            - code [ref=f2e192]: e
            - text: "the exponent field. In words: the exponent picks a power of two, and the mantissa picks one of"
            - code [ref=f2e193]: 2^k
            - text: evenly spaced values between that power and the next, where
            - code [ref=f2e194]: k
            - text: is the number of mantissa bits.
          - paragraph [ref=f2e195]:
            - text: That spacing is the step size. Below the smallest normal number, the format switches to
            - strong [ref=f2e196]: subnormal
            - text: numbers, which have a fixed step and gradually lose digits until they reach zero. Block 1 prints the numbers for five formats from PyTorch's own
            - code [ref=f2e197]: torch.finfo
            - text: ":"
          - table [ref=f2e198]:
            - rowgroup [ref=f2e199]:
              - row [ref=f2e200]:
                - columnheader "Format" [ref=f2e201]
                - columnheader "Exponent / mantissa bits" [ref=f2e202]
                - columnheader "Largest" [ref=f2e203]
                - columnheader "Smallest normal" [ref=f2e204]
                - columnheader "Gap just above 1" [ref=f2e205]
            - rowgroup [ref=f2e206]:
              - row [ref=f2e207]:
                - cell "fp32" [ref=f2e208]
                - cell "8 / 23" [ref=f2e209]
                - cell "3.40e38" [ref=f2e210]
                - cell "1.18e-38" [ref=f2e211]
                - cell "1.19e-7" [ref=f2e212]
              - row [ref=f2e213]:
                - cell "bf16" [ref=f2e214]
                - cell "8 / 7" [ref=f2e215]
                - cell "3.39e38" [ref=f2e216]
                - cell "1.18e-38" [ref=f2e217]
                - cell "0.0078" [ref=f2e218]
              - row [ref=f2e219]:
                - cell "fp16" [ref=f2e220]
                - cell "5 / 10" [ref=f2e221]
                - cell "65,504" [ref=f2e222]
                - cell "6.10e-5" [ref=f2e223]
                - cell "0.00098" [ref=f2e224]
              - row [ref=f2e225]:
                - cell "fp8 e4m3" [ref=f2e226]
                - cell "4 / 3" [ref=f2e227]
                - cell "448" [ref=f2e228]
                - cell "0.0156" [ref=f2e229]
                - cell "0.125" [ref=f2e230]
              - row [ref=f2e231]:
                - cell "fp8 e5m2" [ref=f2e232]
                - cell "5 / 2" [ref=f2e233]
                - cell "57,344" [ref=f2e234]
                - cell "6.10e-5" [ref=f2e235]
                - cell "0.25" [ref=f2e236]
          - paragraph [ref=f2e237]: "bf16 (brain floating point) keeps fp32's exponent and cuts the mantissa. fp8 comes in two layouts: e4m3 for more digits, e5m2 for more range. The FP8 paper defines both, and notes that e4m3 gives up infinities to extend its range to 448."
          - heading [level=3] [ref=f2e238]:
            - text: What does mixed precision mean?
            - link "Direct link to What does mixed precision mean?" [ref=f2e239] [cursor=pointer]:
              - /url: "#what-does-mixed-precision-mean"
              - text: "#"
          - paragraph [ref=f2e240]:
            - text: The 2018 paper that introduced it names three techniques. Keep a
            - strong [ref=f2e241]: master copy
            - text: of the weights in fp32 and update that; use the 16-bit copy for the forward and backward passes.
            - strong [ref=f2e242]: Scale the loss
            - text: so that small gradients survive. Do arithmetic in 16 bits but
            - strong [ref=f2e243]: accumulate in fp32
            - text: . Block 3 and block 5 test the first two. Accumulation in fp32 is a hardware property of the matrix units, so it is shown here only with the running sum of block 2.
          - paragraph [ref=f2e244]:
            - text: In PyTorch the switch is
            - code [ref=f2e245]: torch.autocast
            - text: . Its documentation says matrix operations such as
            - code [ref=f2e246]: linear
            - text: ","
            - code [ref=f2e247]: matmul
            - text: and convolutions run in the lower precision, while reductions and sensitive operations such as
            - code [ref=f2e248]: softmax
            - text: ","
            - code [ref=f2e249]: layer_norm
            - text: ","
            - code [ref=f2e250]: sum
            - text: and
            - code [ref=f2e251]: cross_entropy
            - text: run in float32. On the CPU the default autocast dtype is bfloat16; on CUDA it is float16.
          - heading [level=3] [ref=f2e252]:
            - text: Why does fp16 need a loss scale and bf16 not?
            - link "Direct link to Why does fp16 need a loss scale and bf16 not?" [ref=f2e253] [cursor=pointer]:
              - /url: "#why-does-fp16-need-a-loss-scale-and-bf16-not"
              - text: "#"
          - paragraph [ref=f2e254]: The gradient of a loss can be tiny. fp16's smallest normal number is 6.1e-5 and its smallest subnormal 5.96e-8, so gradients below those lose digits or become zero. The 2018 paper found in one network that about 5 per cent of weight gradients had exponents below -24 and would be lost. bf16's smallest normal number is 1.18e-38, the same as fp32, so a gradient that fits in fp32 almost always fits in bf16. The PyTorch documentation notes that CPU mixed precision with bfloat16 only uses autocast, with no scaler.
          - paragraph [ref=f2e255]:
            - strong [ref=f2e256]: Loss scaling
            - text: multiplies the loss by a constant before the backward pass. By the chain rule every gradient is multiplied by the same constant, so tiny gradients move up into the range fp16 can hold. Before the optimiser step the gradients are divided by the constant again. It must come before gradient clipping, so the clipping threshold means what you think it means.
          - paragraph [ref=f2e257]:
            - text: The constant cannot be too big. fp16 overflows above 65,504, and an overflow gives an infinity that poisons the update. So PyTorch's
            - code [ref=f2e258]: GradScaler
            - text: is dynamic. It starts at 65,536, doubles the scale after 2,000 clean steps, and halves it and skips the step when it finds an infinity or NaN. Block 4 runs it with an overflow injected on purpose.
          - heading [level=3] [ref=f2e259]:
            - text: What does a master copy buy?
            - link "Direct link to What does a master copy buy?" [ref=f2e260] [cursor=pointer]:
              - /url: "#what-does-a-master-copy-buy"
              - text: "#"
          - paragraph [ref=f2e261]: An update of 0.001 added to a weight of 1.0 is smaller than half a step in bf16 (the step near 1 is 0.0078). It is lost. In fp32 (step 1.2e-7) it is kept. Without a master copy, small updates to big weights disappear. With one, the update is added in fp32 and the bf16 copy is re-cast from it, so tiny updates pile up until they cross a step.
          - paragraph [ref=f2e262]: "The master copy costs memory. The recipe is 2 bytes of working weight, 2 of gradient and 12 of optimiser state (the 4-byte master plus Adam's two 4-byte moments): 16 bytes per parameter. That is the same 16 bytes as plain fp32 (4 + 4 + 8). Mixed precision does not shrink model state. It shrinks activations, memory traffic and compute time, which is where most of the savings are. DeepSeek-V3 goes further: it keeps master weights and gradients in fp32 but stores Adam's moments in bf16, and reports no observable loss in quality."
          - figure "Follow the loop from the blue master box to the purple update box and back. The table at the bottom left is the memory bill for each recipe." [ref=f2e263]:
            - generic [ref=f2e264]:
              - 'button "Enlarge: Five connected boxes for the fp32 master weights, bf16 working copy, forward pass, backward pass and the update that returns to the master, above a table of bytes per parameter for three recipes and a note that pure bf16 left more weights unchanged" [ref=f2e265]':
                - img "Five connected boxes for the fp32 master weights, bf16 working copy, forward pass, backward pass and the update that returns to the master, above a table of bytes per parameter for three recipes and a note that pure bf16 left more weights unchanged" [ref=f2e266]
              - button "View infographic larger" [ref=f2e267] [cursor=pointer]:
                - generic [ref=f2e270]: Expand
          - heading [level=3] [ref=f2e272]:
            - text: What changes with fp8?
            - link "Direct link to What changes with fp8?" [ref=f2e273] [cursor=pointer]:
              - /url: "#what-changes-with-fp8"
              - text: "#"
          - paragraph [ref=f2e274]:
            - text: With 3 or 2 mantissa bits, fp8 has a median rounding error of about 2 per cent (e4m3) or 4 per cent (e5m2) in block 2, and a very small range. So fp8 needs a
            - strong [ref=f2e275]: scale
            - text: for each tensor, chosen so the largest value lands near the format's largest (448 for e4m3). That works until one huge value sets the scale and everything else is pushed toward zero.
          - paragraph [ref=f2e276]: "Large language models have such values. The paper \"Massive Activations in Large Language Models\" reports a few activations hundreds or thousands of times larger than typical ones, and block 6 finds one in a real small model. The fix, as in DeepSeek-V3, is a scale per small group: one per 1 x 128 tile of an activation and one per 128 x 128 block of a weight. DeepSeek-V3 then uses e4m3 for all tensors, promotes partial sums to higher precision every 128 elements, and keeps the embeddings, output head, mixture-of-experts gating, normalisation and attention operators in bf16 or fp32."
          - paragraph [ref=f2e277]: "NVIDIA's Transformer Engine documentation describes three recipes: delayed scaling (scale from a history of maxima), current scaling (scale from the tensor in hand) and MXFP8 (a scale per 32 values, on Blackwell GPUs). In its hybrid mode, forward uses e4m3 and backward uses e5m2. NVFP4 goes to 4 bits with a scale per 16 values."
          - heading [level=2] [ref=f2e278]:
            - text: A real system that works this way
            - link "Direct link to A real system that works this way" [ref=f2e279] [cursor=pointer]:
              - /url: "#a-real-system-that-works-this-way"
              - text: "#"
          - paragraph [ref=f2e280]:
            - strong [ref=f2e281]: Llama 3
            - text: "trained in bf16: the \"BF16 MFU\" column in the last chapter's Table 4 says so. The paper's own inference experiments used the native FP8 support of H100 GPUs, not training."
          - paragraph [ref=f2e282]:
            - strong [ref=f2e283]: DeepSeek-V3
            - text: is the public example of fp8 training at scale. Its report describes e4m3 for all three matrix multiplications of each linear layer (forward, activation gradient and weight gradient), the tile and block scales above, and a relative loss error against a bf16 baseline that stays below 0.25 per cent on the two smaller models they trained for about 1 trillion tokens. Those are the authors' measurements on their cluster.
          - paragraph [ref=f2e284]:
            - strong [ref=f2e285]: NVFP4 pretraining
            - text: (arXiv 2509.25149, submitted 29 September 2025, revised March 2026) reports a 12-billion-parameter model trained on 10 trillion tokens in 4-bit precision, with loss and downstream accuracy comparable to an fp8 baseline. That is the authors' claim about their recipe; this chapter does not reproduce it.
          - heading [level=2] [ref=f2e286]:
            - text: Code you can run
            - link "Direct link to Code you can run" [ref=f2e287] [cursor=pointer]:
              - /url: "#code-you-can-run"
              - text: "#"
          - paragraph [ref=f2e288]:

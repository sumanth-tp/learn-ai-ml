            - generic [ref=f2e577]: "print(f\" {name}: {(v == 0).float().mean().item():.1%}\")"
          - paragraph [ref=f2e578]:
            - strong [ref=f2e579]: Reading the output.
            - text: "fp32, bf16 autocast and fp16 autocast with a scaler end at loss 1.7358, 1.7386 and 1.7363: indistinguishable. Pure bf16 (weights stored in bf16, no master copy) ends at 2.0277, and 34.7 per cent of its weights did not change in the last step, against 12.5 per cent in fp32. Pure fp16 gives NaN from the second step. The reason is Adam's"
            - code [ref=f2e580]: eps
            - text: of 1e-8, which is 0.0 in fp16, so a zero second moment gives a division by zero. With
            - code [ref=f2e581]: eps
            - text: of 1e-4 it survives but 79.2 per cent of the second moments are exactly zero, against 12.5 per cent in fp32 and bf16, because squaring a small gradient underflows.
          - paragraph [ref=f2e582]:
            - strong [ref=f2e583]: What this does and does not show.
            - text: "The 12.5 per cent is not an error: it is the embedding rows for tokens that never appear in the batch, which have zero gradient. The comparison is one seed, one fixed batch and a model with 158,016 parameters, so it shows a mechanism, not a ranking of recipes at scale. bf16 autocast on the CPU shows the numerics, not the speed."
          - paragraph [ref=f2e584]:
            - strong [ref=f2e585]: Line by line.
          - list [ref=f2e586]:
            - listitem [ref=f2e587]:
              - code [ref=f2e588]: model.to(torch.bfloat16)
              - text: makes the weights themselves bf16 and removes the master copy, which is the point of the "pure" modes.
            - listitem [ref=f2e589]:
              - code [ref=f2e590]: torch.autocast(..., enabled=dtype is not None)
              - text: is a no-op for the fp32 and pure modes.
            - listitem [ref=f2e591]:
              - code [ref=f2e592]: s["exp_avg_sq"]
              - text: is Adam's running mean of squared gradients; its zeros show where squaring underflowed.
          - heading [level=3] [ref=f2e593]:
            - text: 6. fp8 with one scale, and with a scale per tile
            - link "Direct link to 6. fp8 with one scale, and with a scale per tile" [ref=f2e594] [cursor=pointer]:
              - /url: "#6-fp8-with-one-scale-and-with-a-scale-per-tile"
              - text: "#"
          - paragraph [ref=f2e595]: We run a real sentence through SmolLM2-135M, take the hidden states after blocks 1, 15 and 30, and quantise them to e4m3 and back, once with a single scale and once with a scale per group of 64 values. The same is done for one real weight matrix. (DeepSeek-V3 uses groups of 128; this model's width, 576, is not a multiple of 128.)
          - code [ref=f2e599]:
            - generic [ref=f2e600]: import os
            - generic [ref=f2e602]: os.environ["HF_HUB_DISABLE_PROGRESS_BARS"] = "1"
            - generic [ref=f2e603]: import torch
            - generic [ref=f2e604]: from transformers import AutoModelForCausalLM, AutoTokenizer
            - generic [ref=f2e606]: NAME = "HuggingFaceTB/SmolLM2-135M-Instruct"
            - generic [ref=f2e607]: E4M3_MAX = torch.finfo(torch.float8_e4m3fn).max
            - generic [ref=f2e608]: tokenizer = AutoTokenizer.from_pretrained(NAME)
            - generic [ref=f2e609]: model = AutoModelForCausalLM.from_pretrained(NAME, dtype=torch.float32).eval()
            - generic [ref=f2e610]: text = "Mixed precision training keeps a master copy of the weights in float32 and does most arithmetic in fewer bits."
            - generic [ref=f2e611]: "with torch.no_grad():"
            - generic [ref=f2e612]: states = model(**tokenizer(text, return_tensors="pt"), output_hidden_states=True).hidden_states
            - generic [ref=f2e615]: "def to_fp8(x, scale):"
            - generic [ref=f2e616]: return (x * scale).to(torch.float8_e4m3fn).float() / scale
            - generic [ref=f2e619]: "def per_tensor(x):"
            - generic [ref=f2e620]: return to_fp8(x, E4M3_MAX / x.abs().max())
            - generic [ref=f2e623]: "def per_tile(x, tile=64):"
            - generic [ref=f2e624]: rows, cols = x.shape
            - generic [ref=f2e625]: parts = x.reshape(rows, cols // tile, tile)
            - generic [ref=f2e626]: scale = E4M3_MAX / parts.abs().amax(dim=-1, keepdim=True).clamp(min=1e-12)
            - generic [ref=f2e627]: return to_fp8(parts, scale).reshape(rows, cols)
            - generic [ref=f2e630]: "def report(label, x, y):"
            - generic [ref=f2e631]: flushed = ((y == 0) & (x != 0)).float().mean().item()
            - generic [ref=f2e632]: typical = ((y - x).abs() / x.abs().clamp(min=1e-12)).median().item()
            - generic [ref=f2e633]: "print(f\" {label:<22} flushed to zero {flushed:7.2%} median relative error {typical:.4f}\")"
            - generic [ref=f2e636]: print("SmolLM2-135M hidden states, one 23-token sentence, quantised to fp8 e4m3 and back")
            - generic [ref=f2e637]: "for layer in (1, 15, 30):"
            - generic [ref=f2e638]: h = states[layer][0]
            - generic [ref=f2e639]: "print(f\"layer {layer}: largest value {h.abs().max().item():,.1f}, median {h.abs().median().item():.2f}, ratio {h.abs().max().item() / h.abs().median().item():,.0f}\")"
            - generic [ref=f2e640]: report("one scale per tensor", h, per_tensor(h))
            - generic [ref=f2e641]: report("one scale per 64 values", h, per_tile(h))
            - generic [ref=f2e643]: w = model.model.layers[10].mlp.gate_proj.weight.detach()
            - generic [ref=f2e644]: "print(f\"layer 10 gate_proj weight {tuple(w.shape)}: largest {w.abs().max().item():.2f}, median {w.abs().median().item():.3f}\")"
            - generic [ref=f2e645]: report("one scale per tensor", w, per_tensor(w))
            - generic [ref=f2e646]: report("one scale per 64 values", w, per_tile(w))
          - paragraph [ref=f2e647]:
            - strong [ref=f2e648]: Reading the output.
            - text: "After block 15 the largest hidden-state value is 24,946.1 against a median of 2.09, a ratio of 11,946. With one scale per tensor, 1.46 per cent of the non-zero values are flushed to zero and the median relative error is 0.0257. With a scale per 64 values nothing is flushed and the error is 0.0214. Blocks 1 and 30 have ratios of 43 and 60, so the two methods barely differ (0.0215 against 0.0211 and 0.0220 against 0.0215). For the weight matrix, whose largest value is only 20 times its median, the two methods give 0.0213 and 0.0214: no gain."
          - paragraph [ref=f2e649]:
            - strong [ref=f2e650]: Check by hand.
            - text: Scale 448 / 24,946 = 0.01796. A value smaller than half the smallest e4m3 subnormal (0.00098) after scaling becomes zero. That means any original value under 0.00098 / 0.01796 = 0.054 is lost, which is why 1.46 per cent of this tensor goes to zero.
          - paragraph [ref=f2e651]:
            - strong [ref=f2e652]: Line by line.
          - list [ref=f2e653]:
            - listitem [ref=f2e654]:
              - code [ref=f2e655]: E4M3_MAX / x.abs().max()
              - text: is the per-tensor scale; the
              - code [ref=f2e656]: to(torch.float8_e4m3fn)
              - text: cast does the rounding.
            - listitem [ref=f2e657]:
              - code [ref=f2e658]: per_tile
              - text: reshapes each row into groups of 64 and finds one maximum per group.
            - listitem [ref=f2e659]:
              - code [ref=f2e660]: report
              - text: counts values that were non-zero before and zero after, and the median of the relative error.

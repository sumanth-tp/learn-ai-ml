          - list [ref=f2e729]:
            - listitem [ref=f2e730]: "Leave the value at 2e-8 and move the loss scale to 10. fp16 now stores 2.0504e-05 and returns 2.0023e-08, an error of 0.12 per cent. Why: 2e-8 times 1,024 is above fp16's smallest number. bf16 stored 2.0023e-08 all along, because its range already reached."

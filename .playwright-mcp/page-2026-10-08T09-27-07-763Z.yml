              - text: "#"
          - generic [ref=f2e792]:
            - generic [ref=f2e793]: Industry view
            - list [ref=f2e798]:
              - listitem [ref=f2e799]:
                - strong [ref=f2e800]: bf16 is the default for large-model training.
                - text: Llama 3's reported MFU is for bf16 training.
              - listitem [ref=f2e801]:
                - strong [ref=f2e802]: fp8 training is documented and published.
                - text: DeepSeek-V3 reports fp8 training with fine-grained scales, and NVIDIA's Transformer Engine ships delayed, current and MXFP8 recipes (release 2.20.2, 5 October 2026).
              - listitem [ref=f2e803]:
                - strong [ref=f2e804]: 4-bit training has a published recipe.
                - text: The NVFP4 paper (March 2026 revision) reports parity with fp8 on a 12B model over 10T tokens, as the authors' own result.
              - listitem [ref=f2e805]:
                - strong [ref=f2e806]: "Not verified here:"
                - text: GPU speed-ups, the accuracy of any fp8 or fp4 recipe on your model, and which labs currently train in fp8. This chapter measured numerics on a CPU.
          - heading [level=2] [ref=f2e807]:
            - text: Common mistakes
            - link "Direct link to Common mistakes" [ref=f2e808] [cursor=pointer]:
              - /url: "#common-mistakes"
              - text: "#"
          - list [ref=f2e809]:
            - listitem [ref=f2e810]:
              - strong [ref=f2e811]: Casting a model to fp16 and training it directly.
              - text: It is the easy way to save memory. Block 5 shows NaN from step 2 (Adam's
              - code [ref=f2e812]: eps
              - text: ) and 79 per cent zero second moments. Use autocast with a master copy and a scaler.
            - listitem [ref=f2e813]:
              - strong [ref=f2e814]: Using fp16 without a scaler "because it worked on my small model".
              - text: Block 3 shows the tiny model loses almost nothing. A deeper model with smaller gradients may. The safe choice costs little.
            - listitem [ref=f2e815]:
              - strong [ref=f2e816]: Summing in low precision.
              - text: "Totals, means and losses should be accumulated in fp32. Block 2: fp16 stops at 32.0 on a sum whose answer is 100."
            - listitem [ref=f2e817]:
              - strong [ref=f2e818]: Using one fp8 scale for a whole tensor.
              - text: One large activation then crushes the rest. Block 6 shows 1.46 per cent of a tensor flushed to zero.
            - listitem [ref=f2e819]:
              - strong [ref=f2e820]: Expecting mixed precision to halve the model-state memory.
              - text: "The master copy and the optimiser state remain 32-bit: 16 bytes per parameter either way. The saving is in activations and compute."

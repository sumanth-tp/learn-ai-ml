            - text: Designing with it
            - link "Direct link to Designing with it" [ref=f2e774] [cursor=pointer]:
              - /url: "#designing-with-it"
              - text: "#"
          - list [ref=f2e775]:
            - listitem [ref=f2e776]:
              - strong [ref=f2e777]: Default to bf16 autocast with an fp32 master copy.
              - text: It needs no scaler and matches fp32 in block 5.
            - listitem [ref=f2e778]:
              - strong [ref=f2e779]: Use fp16 only with a dynamic scaler,
              - text: and unscale before clipping gradients.
            - listitem [ref=f2e780]:
              - strong [ref=f2e781]: "Keep sensitive operations in fp32:"
              - text: softmax, normalisation, the loss, the optimiser state (or at most bf16 moments, as DeepSeek-V3 does).
            - listitem [ref=f2e782]:
              - strong [ref=f2e783]: Never keep the only copy of the weights in a 16-bit format.
              - text: "Block 5: a third of the weights stopped moving."
            - listitem [ref=f2e784]:
              - strong [ref=f2e785]: Check Adam's epsilon if you ever store the optimiser in 16 bits.
              - text: 1e-8 is zero in fp16.
            - listitem [ref=f2e786]:
              - strong [ref=f2e787]: For fp8, scale per block, not per tensor,
              - text: and compare the loss curve with bf16 before trusting it. Measure the ratio of a tensor's maximum to its median first, as block 6 does.
            - listitem [ref=f2e788]:
              - strong [ref=f2e789]: Plan memory with the recipe in mind.
              - text: Mixed precision does not change the 16 bytes per parameter of model state; it changes activations and speed.
          - heading [level=2] [ref=f2e790]:
            - text: Where this stands in 2026

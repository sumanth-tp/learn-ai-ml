            - generic [ref=f3e620]: "for repo, (e_key, f_key, h_key, layers, card) in ESTIMATED.items():"
            - generic [ref=f3e621]: c = json.load(open(hf_hub_download(repo, "config.json")))
            - generic [ref=f3e622]: c = c.get("text_config", c)
            - generic [ref=f3e623]: per_expert = 3 * c[h_key] * c[f_key]
            - generic [ref=f3e624]: routed = layers * c[e_key] * per_expert
            - generic [ref=f3e625]: "print(f\"{repo.split('/')[-1]:<30} {c[e_key]:>5} experts of {per_expert / 1e6:6.1f}M in {layers} layers = {routed / 1e9:8.1f}B card total / active: {card}\")"
          - paragraph [ref=f3e626]:
            - strong [ref=f3e627]: Reading the output.
            - text: "Counts match the cards: Mixtral 46.70 billion total and 12.88 active (card 47B and 13B), DeepSeek-V3 671.03 and 37.55 (671B and 37B), Qwen3-30B-A3B 30.53 and 3.35 (30.5B and 3.3B). For gpt-oss-120b the total is 116.83 (117B), and the active count is 5.71, or 5.13 without the input embedding, which is how the card's 5.1B arises. In the second table, routed experts alone account for most of each model: 1,547 billion of DeepSeek-V4-Pro's 1.6 trillion, 2,723 billion of Kimi K3's 2.8 trillion, 75.5 of Kolibri-1's 78.1 and 32.2 of Qwen3.6's 35."

                - link "parallelism strategies for LLMs" [ref=f3e86] [cursor=pointer]:
                  - /url: /docs/llm-engineering/parallelism-strategies-for-llms
                - text: ", and why decoding is limited by memory traffic ("
                - link "why decoding is memory-bound" [ref=f3e87] [cursor=pointer]:
                  - /url: /docs/llm-engineering/why-decoding-is-memory-bound
                - text: ).
              - listitem [ref=f3e88]:
                - strong [ref=f3e89]: "Reading time:"
                - text: about 45 minutes, plus a minute or two to run the code.
              - listitem [ref=f3e90]:
                - strong [ref=f3e91]: After this chapter you can
                - text: compute total and active parameters from a config, say what the load-balancing loss and capacity factor do, explain how expert parallelism moves tokens, and read a current model card's mixture-of-experts numbers critically.
          - generic [ref=f3e92]:
            - generic [ref=f3e93]: Not from a lecture
            - paragraph [ref=f3e98]: "This chapter was written for this site from the papers and model cards under Go deeper. Model sizes are counted from real configs read from the Hugging Face Hub by the code below. Versions used: Python 3.14, PyTorch 2.14.1 (CPU), Transformers 5.18.0. Model cards and papers were opened on 7 and 8 October 2026; this field changes monthly, so check the card before you rely on a number."
          - heading [level=2] [ref=f3e99]:
            - text: In 30 seconds
            - link "Direct link to In 30 seconds" [ref=f3e100] [cursor=pointer]:
              - /url: "#in-30-seconds"
              - text: "#"
          - paragraph [ref=f3e101]: "Imagine a hospital with eight specialist doctors and one receptionist. The receptionist glances at each patient and sends them to the two doctors who seem most useful. The hospital as a whole knows far more than any one doctor, yet each patient only spends time with two. That is a mixture-of-experts layer: the receptionist is the router and the doctors are the experts."
          - paragraph [ref=f3e102]: Two warnings from real systems. The "specialists" do not become experts in subjects like law or biology; the Mixtral paper looked and found no obvious topic pattern. And the receptionist can send too many patients to the same doctor, so training adds tricks to spread the load.
          - heading [level=2] [ref=f3e103]:

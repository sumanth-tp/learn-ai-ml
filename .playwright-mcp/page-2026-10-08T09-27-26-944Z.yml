          - heading [level=2] [ref=f3e872]:
            - text: Designing with it
            - link "Direct link to Designing with it" [ref=f3e873] [cursor=pointer]:
              - /url: "#designing-with-it"
              - text: "#"
          - list [ref=f3e874]:
            - listitem [ref=f3e875]:
              - strong [ref=f3e876]: Plan memory with total parameters and compute with active ones.
              - text: A 2.8-trillion-parameter model with 104 billion active still needs the memory for 2.8 trillion.
            - listitem [ref=f3e877]:
              - strong [ref=f3e878]: Compare models by both numbers, and by how the card counts.
              - text: Block 4 shows the embedding convention moving gpt-oss-120b from 5.71 to 5.13 billion.
            - listitem [ref=f3e879]:
              - strong [ref=f3e880]: Watch the load, not only the loss.
              - text: Log the share of tokens per expert and the drop rate during training. Block 2 shows the loss can look fine while one expert gets 27 per cent of the traffic.
            - listitem [ref=f3e881]:
              - strong [ref=f3e882]: Prefer gentle balancing.
              - text: A large auxiliary loss costs quality (block 2); a bias update or a small coefficient costs less.
            - listitem [ref=f3e883]:
              - strong [ref=f3e884]: Budget capacity on purpose.
              - text: Capacity factor 1.25 means 20 per cent of slots empty even when perfectly balanced (block 1).
            - listitem [ref=f3e885]:
              - strong [ref=f3e886]: Keep the router in higher precision.
              - text: The Switch paper casts the router to float32 selectively, and the Kolibri-1 card keeps the router in bf16 while the experts are fp8.
            - listitem [ref=f3e887]:
              - strong [ref=f3e888]: Choose the parallel layout for the routing.
              - text: Expert parallelism turns every layer into two all-to-alls; keep them on fast links, as DeepSeek-V3's node limit does.
          - heading [level=2] [ref=f3e889]:
            - text: Where this stands in 2026
            - link "Direct link to Where this stands in 2026" [ref=f3e890] [cursor=pointer]:
              - /url: "#where-this-stands-in-2026"
              - text: "#"
          - generic [ref=f3e891]:
            - generic [ref=f3e892]: Industry view
            - list [ref=f3e897]:
              - listitem [ref=f3e898]:
                - strong [ref=f3e899]: Mixture of experts is the common design in the large open models listed in the table above.
                - text: The cards for DeepSeek-V4, Kimi K3, Qwen3.6, gpt-oss and Kolibri-1 all describe mixture-of-experts models; read on 7 and 8 October 2026.
              - listitem [ref=f3e900]:
                - strong [ref=f3e901]: The recipe is moving.
                - text: More and smaller experts, shared experts, sigmoid or square-root-softplus scoring in several configs, and bias-based balancing. The Kolibri-1 card names its own balancing method (Exact Quantile Balancing); this chapter did not study it beyond what the card states.
              - listitem [ref=f3e902]:
                - strong [ref=f3e903]: Low-bit experts are normal.
                - text: Cards report FP4, MXFP4 or fp8 experts for DeepSeek-V4, Kimi K3, gpt-oss and Kolibri-1.
              - listitem [ref=f3e904]:
                - strong [ref=f3e905]: "Not verified here:"
                - text: benchmark claims in any card, GPU throughput, and the exact layer layouts of the 2026 models beyond what each config.json shows. The 2026 models were not downloaded or run.
          - heading [level=2] [ref=f3e906]:
            - text: Common mistakes
            - link "Direct link to Common mistakes" [ref=f3e907] [cursor=pointer]:
              - /url: "#common-mistakes"
              - text: "#"
          - list [ref=f3e908]:
            - listitem [ref=f3e909]:
              - strong [ref=f3e910]: Reading "8x7B" as 56 billion.
              - text: The experts share attention and embeddings, so Mixtral has 46.70 billion. The names are marketing, not arithmetic. Count from the config, as block 4 does.
            - listitem [ref=f3e911]:
              - strong [ref=f3e912]: Sizing the GPU by active parameters.
              - text: It feels right because that is what a token uses. But every expert must be resident. Use total parameters for weights.
            - listitem [ref=f3e913]:
              - strong [ref=f3e914]: Assuming experts are subject specialists.
              - text: The Mixtral paper found no obvious topic pattern in routing. Routing is more syntactic than semantic.
            - listitem [ref=f3e915]:
              - strong [ref=f3e916]: Dropping the balancing and hoping.
              - text: Without it, block 2's quietest expert got 3 per cent of the slots. In a real run that is wasted capacity, and under expert parallelism it is a slow GPU.
            - listitem [ref=f3e917]:
              - strong [ref=f3e918]: Setting the balancing loss very high.
              - text: It balances, but block 2 shows the loss rises sharply. Raise it gently or use a bias.
          - heading [level=2] [ref=f3e919]:
            - text: Practice questions
            - link "Direct link to Practice questions" [ref=f3e920] [cursor=pointer]:
              - /url: "#practice-questions"
              - text: "#"
          - group [ref=f3e921]:
            - generic [ref=f3e922] [cursor=pointer]:
              - strong [ref=f3e923]: Q1 (Easy).
              - text: Mixtral 8x7B has 46.70 billion parameters, 45.10 billion of them in experts. Each token uses 2 of 8. How many parameters are active?
          - group [ref=f3e924]:
            - generic [ref=f3e925] [cursor=pointer]:
              - strong [ref=f3e926]: Q2 (Easy).
              - text: Only 2 of 8 experts run for a token. Why must all 8 stay in GPU memory?
          - group [ref=f3e927]:
            - generic [ref=f3e928] [cursor=pointer]:
              - strong [ref=f3e929]: Q3 (Medium).
              - text: In block 1's example, what would the balance term be if the tokens were split 2, 2, 2, 2 and the average router probabilities were 0.25 each? What would the capacity factor 1.0 drop?
          - group [ref=f3e930]:
            - generic [ref=f3e931] [cursor=pointer]:
              - strong [ref=f3e932]: Q4 (Medium).
              - text: With 1,024 tokens, top-2, 16 experts and a capacity factor of 1.25, what is the capacity, and how many slots does the busiest expert drop at skew 0.5 (3.72 times the average)?
          - group [ref=f3e933]:
            - generic [ref=f3e934] [cursor=pointer]:
              - strong [ref=f3e935]: Q5 (Stretch).
              - text: DeepSeek-V3 adds a bias to the scores for choosing experts but not to the gate weights. Why is that important, and how big can the bias get with a step of 0.001?
          - group [ref=f3e936]:
            - generic [ref=f3e937] [cursor=pointer]:
              - strong [ref=f3e938]: Q6 (Stretch).
              - text: In block 5 with the favouring router, rank 0 receives 40 slots and rank 1 receives 24. How much of the cluster's capacity is wasted, and what are two ways to fix it?
          - heading [level=2] [ref=f3e939]:
            - text: Go deeper
            - link "Direct link to Go deeper" [ref=f3e940] [cursor=pointer]:
              - /url: "#go-deeper"
              - text: "#"

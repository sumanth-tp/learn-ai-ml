              - text: "#"
          - paragraph [ref=f3e359]: The 8-token example in numpy, with its capacity table, then a seeded simulation of 1,024 tokens, 16 experts and top-2 routing with a "skew" that makes some experts favourites. This simulation is the one the lab runs.
          - code [ref=f3e363]:
            - generic [ref=f3e364]: import math
            - generic [ref=f3e366]: import numpy as np
            - generic [ref=f3e368]: probs = np.array([
            - generic [ref=f3e369]: "[0.7, 0.1, 0.1, 0.1], [0.6, 0.2, 0.1, 0.1], [0.5, 0.3, 0.1, 0.1], [0.4, 0.3, 0.2, 0.1],"
            - generic [ref=f3e370]: "[0.4, 0.2, 0.3, 0.1], [0.2, 0.5, 0.2, 0.1], [0.2, 0.4, 0.3, 0.1], [0.1, 0.2, 0.6, 0.1],"
            - generic [ref=f3e371]: "])"
            - generic [ref=f3e372]: T, N = probs.shape
            - generic [ref=f3e373]: choice = probs.argmax(axis=1)
            - generic [ref=f3e374]: counts = np.bincount(choice, minlength=N)
            - generic [ref=f3e375]: f = counts / T
            - generic [ref=f3e376]: P = probs.mean(axis=0)
            - generic [ref=f3e377]: aux = N * float((f * P).sum())
            - generic [ref=f3e378]: "print(\"the hand example: 8 tokens, 4 experts, each token goes to its top expert\")"
            - generic [ref=f3e379]: print("tokens per expert:", counts.tolist(), " f =", f.tolist())
            - generic [ref=f3e380]: print("mean router probability P =", np.round(P, 4).tolist())
            - generic [ref=f3e381]: "print(f\"balance term N * sum(f * P) = {aux:.4f} (1.0000 when perfectly balanced)\")"
            - generic [ref=f3e382]: "for cf in (1.0, 1.5, 2.5):"
            - generic [ref=f3e383]: capacity = math.ceil(cf * T / N)
            - generic [ref=f3e384]: kept = np.minimum(counts, capacity)
            - generic [ref=f3e385]: "print(f\"capacity factor {cf}: room for {capacity} tokens per expert, dropped {T - kept.sum()} of {T}, slots used {kept.sum()} of {capacity * N}\")"
            - generic [ref=f3e388]: "def mulberry32(seed):"
            - generic [ref=f3e389]: state = [seed & 0xFFFFFFFF]
            - generic [ref=f3e391]: "def draw():"
            - generic [ref=f3e392]: state[0] = (state[0] + 0x6D2B79F5) & 0xFFFFFFFF
            - generic [ref=f3e393]: t = state[0]
            - generic [ref=f3e394]: t = ((t ^ (t >> 15)) * (t | 1)) & 0xFFFFFFFF
            - generic [ref=f3e395]: t ^= (t + (((t ^ (t >> 7)) * (t | 61)) & 0xFFFFFFFF)) & 0xFFFFFFFF
            - generic [ref=f3e396]: return ((t ^ (t >> 14)) & 0xFFFFFFFF) / 4294967296.0
            - generic [ref=f3e398]: return draw
            - generic [ref=f3e401]: "def simulate(n_experts, k, tokens, cf, skew, seed=7):"
            - generic [ref=f3e402]: draw = mulberry32(seed)
            - generic [ref=f3e404]: "def gauss():"
            - generic [ref=f3e405]: u1, u2 = max(draw(), 1e-12), draw()
            - generic [ref=f3e406]: return math.sqrt(-2 * math.log(u1)) * math.cos(2 * math.pi * u2)
            - generic [ref=f3e408]: bias = np.array([gauss() for _ in range(n_experts)])
            - generic [ref=f3e409]: logits = np.array([[gauss() + skew * bias[e] for e in range(n_experts)] for _ in range(tokens)])
            - generic [ref=f3e410]: p = np.exp(logits - logits.max(axis=1, keepdims=True))
            - generic [ref=f3e411]: p /= p.sum(axis=1, keepdims=True)
            - generic [ref=f3e412]: top = np.argsort(-logits, axis=1)[:, :k]
            - generic [ref=f3e413]: counts = np.bincount(top.ravel(), minlength=n_experts)
            - generic [ref=f3e414]: f = counts / (tokens * k)
            - generic [ref=f3e415]: aux = n_experts * float((f * p.mean(axis=0)).sum())
            - generic [ref=f3e416]: capacity = math.ceil(cf * tokens * k / n_experts)
            - generic [ref=f3e417]: kept = np.minimum(counts, capacity)
            - generic [ref=f3e418]: return aux, counts.max() / (tokens * k / n_experts), 1 - kept.sum() / (tokens * k), kept.sum() / (capacity * n_experts)
            - generic [ref=f3e421]: print()
            - generic [ref=f3e422]: print("1,024 tokens, 16 experts, top-2, capacity factor 1.25, seeded router; skew makes some experts favourites")
            - generic [ref=f3e423]: print("skew balance term busiest expert / average slots dropped capacity used")
            - generic [ref=f3e424]: "for skew in (0.0, 0.25, 0.5, 1.0):"
            - generic [ref=f3e425]: aux, busiest, dropped, used = simulate(16, 2, 1024, 1.25, skew)
            - generic [ref=f3e426]: "print(f\"{skew:5.2f} {aux:12.4f} {busiest:24.2f} {dropped:13.1%} {used:13.1%}\")"
            - generic [ref=f3e427]: print()
            - generic [ref=f3e428]: print("same router, skew 0.5, different capacity factors")
            - generic [ref=f3e429]: "for cf in (1.0, 1.25, 1.5, 2.0, 3.0):"
            - generic [ref=f3e430]: aux, busiest, dropped, used = simulate(16, 2, 1024, cf, 0.5)
            - generic [ref=f3e431]: "print(f\"capacity factor {cf:4.2f}: dropped {dropped:6.1%}, capacity used {used:6.1%}\")"
          - paragraph [ref=f3e432]:
            - strong [ref=f3e433]: Reading the output.
            - text: The hand example prints counts 5, 2, 1, 0, a balance term of 1.3625 and drops of 3, 2 and 0 tokens at capacity factors 1.0, 1.5 and 2.5. In the simulation, no skew gives a balance term of 1.0019, a busiest expert 1.10 times the average, and 80.0 per cent of capacity used, which is exactly 1 / 1.25. Skew 0.5 gives 1.5836, 3.72 times the average and 28.5 per cent of slots dropped. At that skew, raising the capacity factor from 1.25 to 3.0 cuts drops from 28.5 to 4.5 per cent but leaves only 31.8 per cent of capacity in use.
          - paragraph [ref=f3e434]:
            - strong [ref=f3e435]: Line by line.
          - list [ref=f3e436]:
            - listitem [ref=f3e437]:
              - code [ref=f3e438]: mulberry32
              - text: is a small seeded random generator; the lab uses the same one so both give the same numbers.
            - listitem [ref=f3e439]:
              - code [ref=f3e440]: skew * bias[e]
              - text: gives each expert a fixed advantage for every token, which is how a router develops favourites.
            - listitem [ref=f3e441]:
              - code [ref=f3e442]: kept = np.minimum(counts, capacity)
              - text: "is the capacity rule: whatever an expert receives beyond its room is dropped."
          - heading [level=3] [ref=f3e443]:
            - text: 2. Training a toy mixture of experts with three kinds of balancing
            - link "Direct link to 2. Training a toy mixture of experts with three kinds of balancing" [ref=f3e444] [cursor=pointer]:
              - /url: "#2-training-a-toy-mixture-of-experts-with-three-kinds-of-balancing"
              - text: "#"
          - paragraph [ref=f3e445]: Eight small experts, top-2 routing, and data in which cluster 0 is eight times as common as cluster 7. We train with no balancing, with the Switch-style loss at two strengths, and with a DeepSeek-style bias update, and look at the last 100 steps averaged over 3 seeds.
          - code [ref=f3e449]:
            - generic [ref=f3e450]: import numpy as np
            - generic [ref=f3e451]: import torch
            - generic [ref=f3e452]: import torch.nn as nn
            - generic [ref=f3e453]: import torch.nn.functional as F
            - generic [ref=f3e455]: E, D, K, STEPS, BATCH = 8, 16, 2, 600, 256
            - generic [ref=f3e458]: "def train(method, seed, alpha=0.0, gamma=0.003):"
            - generic [ref=f3e459]: torch.manual_seed(seed)
            - generic [ref=f3e460]: centres = torch.randn(E, D) * 2.0
            - generic [ref=f3e461]: maps = torch.randn(E, D, D) / D**0.5
            - generic [ref=f3e462]: router = nn.Linear(D, E, bias=False)
            - generic [ref=f3e463]: "with torch.no_grad():"
            - generic [ref=f3e464]: router.weight.mul_(0.1)
            - generic [ref=f3e465]: experts = nn.ModuleList([nn.Sequential(nn.Linear(D, 32), nn.GELU(), nn.Linear(32, D)) for _ in range(E)])
            - generic [ref=f3e466]: opt = torch.optim.Adam(list(router.parameters()) + list(experts.parameters()), lr=3e-3)
            - generic [ref=f3e467]: freq = 1.0 / torch.arange(1, E + 1).float()
            - generic [ref=f3e468]: freq = freq / freq.sum()
            - generic [ref=f3e469]: bias = torch.zeros(E)
            - generic [ref=f3e470]: data = torch.Generator().manual_seed(seed + 100)
            - generic [ref=f3e471]: history = []
            - generic [ref=f3e472]: "for _ in range(STEPS):"
            - generic [ref=f3e473]: cluster = torch.multinomial(freq, BATCH, replacement=True, generator=data)
            - generic [ref=f3e474]: x = centres[cluster] + 0.5 * torch.randn(BATCH, D, generator=data)
            - generic [ref=f3e475]: target = torch.einsum("bd,bde->be", x, maps[cluster])
            - generic [ref=f3e476]: logits = router(x)
            - generic [ref=f3e477]: chosen = (logits + bias).topk(K, dim=-1).indices
            - generic [ref=f3e478]: gate = torch.gather(logits, 1, chosen).softmax(-1)
            - generic [ref=f3e479]: out = torch.zeros_like(x)
            - generic [ref=f3e480]: "for e in range(E):"
            - generic [ref=f3e481]: rows, slot = (chosen == e).nonzero(as_tuple=True)
            - generic [ref=f3e482]: "if len(rows):"
            - generic [ref=f3e483]: out[rows] += gate[rows, slot].unsqueeze(-1) * experts[e](x[rows])
            - generic [ref=f3e484]: share = torch.bincount(chosen.reshape(-1), minlength=E).float() / (BATCH * K)
            - generic [ref=f3e485]: balance = E * (share * logits.softmax(-1).mean(0)).sum()
            - generic [ref=f3e486]: task = F.mse_loss(out, target)
            - generic [ref=f3e487]: opt.zero_grad()
            - generic [ref=f3e488]: (task + alpha * balance).backward()
            - generic [ref=f3e489]: opt.step()
            - generic [ref=f3e490]: "if method == \"bias\":"
            - generic [ref=f3e491]: bias -= gamma * torch.sign(share - 1.0 / E)
            - generic [ref=f3e492]: history.append((task.item(), share.max().item(), share.min().item()))
            - generic [ref=f3e493]: return np.array(history[-100:]).mean(axis=0)
            - generic [ref=f3e496]: print("top-2 routing, 8 experts, cluster 0 is 8 times as common as cluster 7; mean of the last 100 steps and 3 seeds")
            - generic [ref=f3e497]: print("method task loss busiest expert share quietest expert share")
            - generic [ref=f3e498]: for label, kw in [("no balancing", dict(method="none")), ("aux loss, alpha 0.01", dict(method="aux", alpha=0.01)),
            - generic [ref=f3e499]: "(\"aux loss, alpha 0.1\", dict(method=\"aux\", alpha=0.1)), (\"bias update (loss-free)\", dict(method=\"bias\"))]:"
            - generic [ref=f3e500]: r = np.mean([train(seed=s, **kw) for s in range(3)], axis=0)
            - generic [ref=f3e501]: "print(f\"{label:<24} {r[0]:9.4f} {r[1]:19.3f} {r[2]:21.3f}\")"
            - generic [ref=f3e502]: "print(f\"a perfectly even share is {1 / E:.3f} for every expert\")"
          - paragraph [ref=f3e503]:
            - strong [ref=f3e504]: Reading the output.
            - text: With no balancing the busiest expert takes 26.8 per cent of the slots, the quietest only 3.0 per cent (an even share is 12.5 per cent), and the task loss is 0.0177. A balance loss of 0.01 improves the spread slightly (20.5 and 6.0 per cent) at the same loss, 0.0180. A coefficient of 0.1 balances better (17.5 and 8.7 per cent) but the loss rises to 0.0290. The bias update gets 18.4 and 9.7 per cent with the lowest loss, 0.0171.
          - paragraph [ref=f3e505]:
            - strong [ref=f3e506]: What this does and does not show.
            - text: "The pattern agrees with DeepSeek's argument: a strong auxiliary loss trades quality for balance and a bias does not. But this is a toy: 600 steps, 3 seeds, a made-up skewed dataset and one bias step size (0.003; in a separate run, not shown here, steps of 0.01 and 0.03 gave worse losses, 0.0233 and 0.0270). The data is skewed on purpose, because with evenly spread clusters the router balanced itself and no method was needed. It is evidence of the mechanism, not a ranking."
          - paragraph [ref=f3e507]:
            - strong [ref=f3e508]: Line by line.
          - list [ref=f3e509]:
            - listitem [ref=f3e510]:
              - code [ref=f3e511]: (logits + bias).topk(K)
              - text: picks the experts with the bias;
              - code [ref=f3e512]: gate
              - text: is computed from the original
              - code [ref=f3e513]: logits
              - text: ", as in DeepSeek-V3."
            - listitem [ref=f3e514]:
              - code [ref=f3e515]: bias -= gamma * torch.sign(share - 1.0 / E)
              - text: lowers the bias of experts above an even share and raises those below.
            - listitem [ref=f3e516]:
              - code [ref=f3e517]: balance
              - text: is the Switch term, computed from the share of slots and the mean router probability.
          - heading [level=3] [ref=f3e518]:
            - text: 3. The real library's balancing loss
            - link "Direct link to 3. The real library's balancing loss" [ref=f3e519] [cursor=pointer]:
              - /url: "#3-the-real-librarys-balancing-loss"
              - text: "#"
          - paragraph [ref=f3e520]:
            - text: We build a tiny Mixtral with the real Transformers classes (8 experts, top-2), take its router outputs and compare the library's
            - code [ref=f3e521]: load_balancing_loss_func
            - text: with the formula from block 1.
          - code [ref=f3e525]:
            - generic [ref=f3e526]: import torch
            - generic [ref=f3e527]: from transformers import MixtralConfig, MixtralForCausalLM
            - generic [ref=f3e528]: from transformers.models.mixtral.modeling_mixtral import load_balancing_loss_func
            - generic [ref=f3e530]: E, K, COEF = 8, 2, 0.02
            - generic [ref=f3e531]: CFG = MixtralConfig(vocab_size=512, hidden_size=64, intermediate_size=128, num_hidden_layers=2,
            - generic [ref=f3e532]: num_attention_heads=4, num_key_value_heads=2, num_local_experts=E,
            - generic [ref=f3e533]: num_experts_per_tok=K, router_aux_loss_coef=COEF)
            - generic [ref=f3e536]: "def switch_balance(router_logits):"
            - generic [ref=f3e537]: p = torch.cat(router_logits).softmax(-1)
            - generic [ref=f3e538]: chosen = p.topk(K, dim=-1).indices
            - generic [ref=f3e539]: counts = torch.bincount(chosen.reshape(-1), minlength=E).float()
            - generic [ref=f3e540]: share = counts / counts.sum()
            - generic [ref=f3e541]: return E * (share * p.mean(0)).sum()
            - generic [ref=f3e544]: torch.manual_seed(0)
            - generic [ref=f3e545]: model = MixtralForCausalLM(CFG).eval()
            - generic [ref=f3e546]: tokens = torch.randint(0, 512, (4, 32), generator=torch.Generator().manual_seed(1))
            - generic [ref=f3e547]: "with torch.no_grad():"
            - generic [ref=f3e548]: plain = model(tokens, labels=tokens)
            - generic [ref=f3e549]: routed = model(tokens, labels=tokens, output_router_logits=True)
            - generic [ref=f3e551]: lib = load_balancing_loss_func(routed.router_logits, E, K)
            - generic [ref=f3e552]: mine = switch_balance(routed.router_logits)
            - generic [ref=f3e553]: "print(f\"router logits per layer: {len(routed.router_logits)} tensors of shape {tuple(routed.router_logits[0].shape)} (tokens x experts)\")"
            - generic [ref=f3e554]: "print(f\"library balance loss {lib.item():.4f} Switch formula {mine.item():.4f} formula x k {K * mine.item():.4f}\")"
            - generic [ref=f3e555]: "print(f\"output aux_loss {routed.aux_loss.item():.4f} equals the library function: {torch.allclose(routed.aux_loss, lib)}\")"
            - generic [ref=f3e556]: "print(f\"loss without routing outputs {plain.loss.item():.4f} loss with them {routed.loss.item():.4f} difference {routed.loss.item() - plain.loss.item():.4f}\")"
            - generic [ref=f3e557]: "print(f\"coefficient x aux loss = {COEF * lib.item():.4f}\")"
            - generic [ref=f3e559]: experts = sum(p.numel() for n, p in model.named_parameters() if ".experts." in n)
            - generic [ref=f3e560]: total = sum(p.numel() for p in model.parameters())
            - generic [ref=f3e561]: active = total - experts * (E - K) / E
            - generic [ref=f3e562]: print()
            - generic [ref=f3e563]: "print(f\"tiny Mixtral: {total:,} parameters, {experts:,} of them in experts ({experts / total:.1%})\")"
            - generic [ref=f3e564]: "print(f\"each token uses {K} of {E} experts: {active:,.0f} active parameters ({active / total:.1%})\")"
          - paragraph [ref=f3e565]:
            - strong [ref=f3e566]: Reading the output.
            - text: The library's balance loss is 2.0059, exactly twice the Switch formula (1.0030), because the library counts every one of the k selections per token, so a perfectly even router scores k, here 2, not 1. The loss with routing outputs enabled is 6.2624, against 6.2223 without, and the difference of 0.0401 is the coefficient 0.02 times 2.0059. In this tiny model 81.1 per cent of parameters are in experts and 39.2 per cent are active.
          - paragraph [ref=f3e567]:

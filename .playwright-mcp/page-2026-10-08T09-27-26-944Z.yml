          - heading [level=3] [ref=f3e640]:
            - text: 5. Expert parallelism on two real processes
            - link "Direct link to 5. Expert parallelism on two real processes" [ref=f3e641] [cursor=pointer]:
              - /url: "#5-expert-parallelism-on-two-real-processes"
              - text: "#"
          - paragraph [ref=f3e642]:
            - text: Four experts, two per rank, 16 tokens per rank, top-2. Each rank sends token copies to the ranks that hold their experts with
            - code [ref=f3e643]: all_to_all_single
            - text: ", runs its experts, sends the results back, and combines them. The output is compared with one process running everything. We run it with an even router and with one that favours expert 0."
          - code [ref=f3e647]:
            - generic [ref=f3e648]: import os
            - generic [ref=f3e649]: import socket
            - generic [ref=f3e651]: import torch
            - generic [ref=f3e652]: import torch.distributed as dist
            - generic [ref=f3e653]: import torch.multiprocessing as mp
            - generic [ref=f3e654]: import torch.nn as nn
            - generic [ref=f3e656]: E, K, D, TOKENS, WORLD = 4, 2, 16, 32, 2
            - generic [ref=f3e659]: "def build(seed):"
            - generic [ref=f3e660]: torch.manual_seed(seed)
            - generic [ref=f3e661]: router = nn.Linear(D, E, bias=False)
            - generic [ref=f3e662]: experts = nn.ModuleList([nn.Sequential(nn.Linear(D, 32), nn.GELU(), nn.Linear(32, D)) for _ in range(E)])
            - generic [ref=f3e663]: return router, experts
            - generic [ref=f3e666]: "def route(router, x, skew):"
            - generic [ref=f3e667]: logits = router(x) + torch.tensor([skew, 0.0, 0.0, 0.0])
            - generic [ref=f3e668]: top = logits.topk(K, dim=-1)
            - generic [ref=f3e669]: return top.indices, top.values.softmax(-1)
            - generic [ref=f3e672]: "def reference(router, experts, x, skew):"
            - generic [ref=f3e673]: chosen, gate = route(router, x, skew)
            - generic [ref=f3e674]: out = torch.zeros_like(x)
            - generic [ref=f3e675]: "for t in range(x.shape[0]):"
            - generic [ref=f3e676]: "for s in range(K):"
            - generic [ref=f3e677]: out[t] += gate[t, s] * experts[chosen[t, s]](x[t])
            - generic [ref=f3e678]: return out
            - generic [ref=f3e681]: "def free_port():"
            - generic [ref=f3e682]: "with socket.socket() as s:"
            - generic [ref=f3e683]: s.bind(("127.0.0.1", 0))
            - generic [ref=f3e684]: return s.getsockname()[1]
            - generic [ref=f3e687]: "def worker(rank, world, port, skew):"
            - generic [ref=f3e688]: os.environ["MASTER_ADDR"] = "127.0.0.1"
            - generic [ref=f3e689]: os.environ["MASTER_PORT"] = str(port)
            - generic [ref=f3e690]: dist.init_process_group("gloo", rank=rank, world_size=world)
            - generic [ref=f3e691]: router, experts = build(0)
            - generic [ref=f3e692]: x_all = torch.randn(TOKENS, D, generator=torch.Generator().manual_seed(1))
            - generic [ref=f3e693]: mine = slice(rank * TOKENS // world, (rank + 1) * TOKENS // world)
            - generic [ref=f3e694]: x = x_all[mine]
            - generic [ref=f3e695]: "with torch.no_grad():"
            - generic [ref=f3e696]: chosen, gate = route(router, x, skew)
            - generic [ref=f3e697]: slots = [(t, s) for t in range(x.shape[0]) for s in range(K)]
            - generic [ref=f3e698]: "slots.sort(key=lambda ts: int(chosen[ts]) // (E // world))"
            - generic [ref=f3e699]: dest = torch.tensor([int(chosen[ts]) // (E // world) for ts in slots])
            - generic [ref=f3e700]: send_counts = torch.bincount(dest, minlength=world)
            - generic [ref=f3e701]: recv_counts = torch.zeros_like(send_counts)
            - generic [ref=f3e702]: dist.all_to_all_single(recv_counts, send_counts)
            - generic [ref=f3e703]: payload = torch.stack([x[t] for t, _ in slots])
            - generic [ref=f3e704]: ids = torch.tensor([int(chosen[ts]) for ts in slots], dtype=torch.float32)[:, None]
            - generic [ref=f3e705]: packet = torch.cat([payload, ids], dim=1)
            - generic [ref=f3e706]: inbox = torch.zeros(int(recv_counts.sum()), D + 1)
            - generic [ref=f3e707]: dist.all_to_all_single(inbox, packet, recv_counts.tolist(), send_counts.tolist())
            - generic [ref=f3e708]: done = torch.zeros(len(inbox), D)
            - generic [ref=f3e709]: "for row, packet_row in enumerate(inbox):"
            - generic [ref=f3e710]: done[row] = experts[int(packet_row[-1])](packet_row[:-1])
            - generic [ref=f3e711]: back = torch.zeros(len(slots), D)
            - generic [ref=f3e712]: dist.all_to_all_single(back, done, send_counts.tolist(), recv_counts.tolist())
            - generic [ref=f3e713]: out = torch.zeros_like(x)
            - generic [ref=f3e714]: "for row, (t, s) in enumerate(slots):"
            - generic [ref=f3e715]: out[t] += gate[t, s] * back[row]
            - generic [ref=f3e716]: err = (out - reference(router, experts, x_all, skew)[mine]).abs().max().item()
            - generic [ref=f3e717]: stats = torch.tensor([err, float(send_counts[0]), float(send_counts[1]), float(recv_counts.sum())], dtype=torch.float64)
            - generic [ref=f3e718]: table = [torch.zeros(4, dtype=torch.float64) for _ in range(world)]
            - generic [ref=f3e719]: dist.all_gather(table, stats)
            - generic [ref=f3e720]: "if rank == 0:"
            - generic [ref=f3e721]: "print(f\"router favours expert 0 by {skew}\")"
            - generic [ref=f3e722]: "for r, t in enumerate(table):"
            - generic [ref=f3e723]: "print(f\" rank {r}: sends {int(t[1])} to rank 0 and {int(t[2])} to rank 1, receives {int(t[3])}, max error {t[0].item():.2e}\")"
            - generic [ref=f3e724]: dist.barrier()
            - generic [ref=f3e725]: dist.destroy_process_group()
            - generic [ref=f3e728]: "if __name__ == \"__main__\":"
            - generic [ref=f3e729]: "for skew in (0.0, 2.0):"
            - generic [ref=f3e730]: mp.spawn(worker, args=(WORLD, free_port(), skew), nprocs=WORLD, join=True)
          - paragraph [ref=f3e731]:
            - strong [ref=f3e732]: Reading the output.
            - text: The result matches a single process exactly (maximum error 0.00e+00) in both runs. With the favouring router, rank 0 sends 21 of its 32 token copies to itself and 11 to rank 1, and rank 1 sends 19 to rank 0 and 13 to itself, so rank 0 receives 40 and rank 1 only 24. The even mean is 32, so rank 0 is 25 per cent over it, and the step runs at the speed of rank 0, leaving rank 1 idle for 40 per cent of the time. With the even router, the two ranks receive 27 and 37, because 4 experts and 32 slots are too few for a perfectly even split.
          - paragraph [ref=f3e733]:
            - strong [ref=f3e734]: Line by line.
          - list [ref=f3e735]:
            - listitem [ref=f3e736]:
              - code [ref=f3e737]: send_counts
              - text: and
              - code [ref=f3e738]: recv_counts
              - text: are exchanged first with a small all-to-all, so each rank knows how big a message to expect.
            - listitem [ref=f3e739]:
              - code [ref=f3e740]: all_to_all_single(inbox, packet, recv_counts, send_counts)
              - text: "takes the output and input split sizes: how many rows come from each rank, and how many go to each."
            - listitem [ref=f3e741]: The expert id travels with each token as an extra column, so the receiver knows which expert to run.

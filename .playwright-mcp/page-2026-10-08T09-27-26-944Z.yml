            - strong [ref=f3e348]: Mixtral 8x7B
            - text: "is the clearest open example: a Mistral 7B-style model with the feed-forward block replaced by eight experts and top-2 routing. The paper reports that it matches or outperforms Llama 2 70B and GPT-3.5 across the benchmarks it evaluated, using 13B active parameters. Those are the authors' evaluations, from December 2023."

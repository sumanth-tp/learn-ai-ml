          - list [ref=f3e971]:
            - listitem [ref=f3e972]: I can explain what a router, a top-k choice and an expert are, and why a mixture-of-experts model has more parameters than it uses.
            - listitem [ref=f3e973]: I can compute total and active parameters from a config and say how a model card counted them.
            - listitem [ref=f3e974]: I can compute the balance term and a capacity from router probabilities by hand.
            - listitem [ref=f3e975]: I can describe routing collapse and compare a balancing loss with a bias update and a capacity limit.
            - listitem [ref=f3e976]: I can explain dispatch and combine in expert parallelism and why the busiest rank sets the speed.
            - listitem [ref=f3e977]: I can say why memory is sized by total parameters and compute by active ones.

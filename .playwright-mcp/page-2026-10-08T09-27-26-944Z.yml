          - paragraph [ref=f3e861]: "Loading a mixture-of-experts model is no different from loading a dense one; the library handles the routing:"
          - code [ref=f3e865]:
            - generic [ref=f3e866]: from transformers import pipeline
            - generic [ref=f3e868]: pipe = pipeline("text-generation", model="openai/gpt-oss-120b", dtype="auto", device_map="auto")
            - generic [ref=f3e869]: "messages = [{\"role\": \"user\", \"content\": \"Explain quantum mechanics clearly and concisely.\"}]"

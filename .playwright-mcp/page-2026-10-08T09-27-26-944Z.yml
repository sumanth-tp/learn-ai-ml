          - heading "Mixture of Experts" [level=1] [ref=f3e73]
          - paragraph [ref=f3e74]:
            - strong [ref=f3e75]: In one line.
            - text: A mixture-of-experts model stores many feed-forward networks (experts) in each layer but sends each token through only a few of them, so it holds the knowledge of a very large model while paying the arithmetic of a small one, in exchange for keeping every expert in memory and keeping the load between experts balanced.
          - generic [ref=f3e76]:
            - generic [ref=f3e77]: Before you start
            - list [ref=f3e82]:

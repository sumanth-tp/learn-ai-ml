          - heading [level=2] [ref=f3e148]:
            - text: The idea in plain words
            - link "Direct link to The idea in plain words" [ref=f3e149] [cursor=pointer]:
              - /url: "#the-idea-in-plain-words"
              - text: "#"
          - paragraph [ref=f3e150]: In an ordinary transformer, every token goes through the same feed-forward network in every layer. To make the model know more you make that network bigger, and every token then pays for the extra size. A mixture-of-experts layer breaks the link between "how much the model stores" and "how much each token costs". It keeps several feed-forward networks and a router, and only the top few run for each token.
          - paragraph [ref=f3e151]:
            - text: Take the smallest example. Four experts, eight tokens, and the router gives each token a probability for each expert. Each token goes to its single best expert. If five of the eight tokens pick expert A, then A does most of the work and the others sit idle. That is a
            - strong [ref=f3e152]: load imbalance
            - text: ", and it is the main thing that goes wrong with these models. It wastes compute, and with expert parallelism the busiest GPU sets the pace for everyone."
          - paragraph [ref=f3e153]: "So a mixture-of-experts model has three jobs beyond a dense one: choose the experts, keep them evenly used, and move the tokens to wherever the experts live. The next sections take them in that order."
          - 'figure "Look at the right panel: eight experts are stored, two run. The yellow box at the bottom gives the price and the prize in Mixtral''s own numbers." [ref=f3e154]':
            - generic [ref=f3e155]:
              - 'button "Enlarge: A dense feed-forward block beside a mixture-of-experts block in which a token passes through a router, two chosen experts out of eight, and a weighted sum, with Mixtral 8x7B''s 46.70 billion stored and 12.88 billion used parameters" [ref=f3e156]':
                - img "A dense feed-forward block beside a mixture-of-experts block in which a token passes through a router, two chosen experts out of eight, and a weighted sum, with Mixtral 8x7B's 46.70 billion stored and 12.88 billion used parameters" [ref=f3e157]
              - button "View infographic larger" [ref=f3e158] [cursor=pointer]:
                - generic [ref=f3e161]: Expand
          - heading [level=2] [ref=f3e163]:
            - text: Worked example, step by step
            - link "Direct link to Worked example, step by step" [ref=f3e164] [cursor=pointer]:
              - /url: "#worked-example-step-by-step"
              - text: "#"
          - paragraph [ref=f3e165]: The eight tokens and four experts from the smallest example, with the router's probabilities. Block 1 computes every number below.
          - list [ref=f3e166]:
            - listitem [ref=f3e167]:
              - strong [ref=f3e168]: Pick the top expert.
              - text: Tokens 0 to 4 prefer expert A (probabilities 0.7, 0.6, 0.5, 0.4, 0.4). Tokens 5 and 6 prefer B. Token 7 prefers C. No token prefers D.
            - listitem [ref=f3e169]:
              - strong [ref=f3e170]: Count the share of tokens.
              - text: f = A 5/8 = 0.625, B 2/8 = 0.25, C 1/8 = 0.125, D 0.
            - listitem [ref=f3e171]:
              - strong [ref=f3e172]: Average the router probabilities.
              - text: P = A 0.3875, B 0.275, C 0.2375, D 0.1.
            - listitem [ref=f3e173]:
              - strong [ref=f3e174]: Compute the balance term.
              - text: "N times the sum of f times P, with N = 4 experts: 4 x (0.625 x 0.3875 + 0.25 x 0.275 + 0.125 x 0.2375 + 0 x 0.1) = 4 x 0.340625 = 1.3625. A perfectly even router would score exactly 1.0. In words: the term is large when the experts that get most of the tokens are also the ones the router likes most."
            - listitem [ref=f3e175]:
              - strong [ref=f3e176]: Apply a capacity.
              - text: With a capacity factor of 1.0, each expert has room for 8 / 4 = 2 tokens. A can keep 2 of its 5, so 3 tokens are dropped, 37.5 per cent. With a capacity factor of 1.5 (room for 3) 2 are dropped. With 2.5 (room for 5) none are dropped, but only 8 of 20 slots are used.
          - figure "Read the left table first, then the orange boxes top to bottom, then the capacity table. All figures are printed by block 1." [ref=f3e177]:
            - generic [ref=f3e178]:
              - 'button "Enlarge: A table of eight tokens with router probabilities for four experts and each token''s chosen expert, beside the shares f, the balance term 1.3625 and a table of capacity factors 1.0, 1.5 and 2.5 with tokens dropped and slots used" [ref=f3e179]':
                - img "A table of eight tokens with router probabilities for four experts and each token's chosen expert, beside the shares f, the balance term 1.3625 and a table of capacity factors 1.0, 1.5 and 2.5 with tokens dropped and slots used" [ref=f3e180]
              - button "View infographic larger" [ref=f3e181] [cursor=pointer]:
                - generic [ref=f3e184]: Expand
          - heading [level=2] [ref=f3e186]:
            - text: How it works
            - link "Direct link to How it works" [ref=f3e187] [cursor=pointer]:
              - /url: "#how-it-works"
              - text: "#"
          - heading [level=3] [ref=f3e188]:
            - text: What is inside a mixture-of-experts layer?
            - link "Direct link to What is inside a mixture-of-experts layer?" [ref=f3e189] [cursor=pointer]:
              - /url: "#what-is-inside-a-mixture-of-experts-layer"
              - text: "#"
          - paragraph [ref=f3e190]:
            - text: The router is one linear layer from the hidden size to the number of experts. It gives each token a score for each expert. The top-k scores pick the experts. Mixtral then applies a softmax to those k scores only to get the weights, and the layer's output is the weighted sum of the chosen experts' outputs. The paper writes it as
            - code [ref=f3e191]: y = sum of Softmax(Top2(x Wg))_i times SwiGLU_i(x)
            - text: ". In words: score the experts, keep the best two, turn their scores into weights, and add up their answers."
          - paragraph [ref=f3e192]:
            - text: The experts are ordinary feed-forward blocks. Mixtral's are three-matrix SwiGLU blocks, so the layer has the same shape as a dense Llama layer, repeated eight times. Newer models change the recipe in three ways, which you can see in their
            - code [ref=f3e193]: config.json
            - text: "files:"
          - table [ref=f3e194]:
            - rowgroup [ref=f3e195]:
              - row [ref=f3e196]:
                - columnheader "Change" [ref=f3e197]
                - columnheader "What it is" [ref=f3e198]
                - columnheader "Where you can see it" [ref=f3e199]
            - rowgroup [ref=f3e200]:
              - row [ref=f3e201]:
                - cell "Many small experts" [ref=f3e202]
                - cell "128 to 896 experts instead of 8, each smaller" [ref=f3e203]
                - cell "DeepSeek-V3 has 256 routed experts, top 8; Kimi K3 has 896, top 16" [ref=f3e204]
              - row [ref=f3e205]:
                - cell "Shared experts" [ref=f3e206]
                - cell "One or two experts every token always uses, besides the routed ones" [ref=f3e207]
                - cell [ref=f3e208]:
                  - text: DeepSeek-V3
                  - code [ref=f3e209]: n_shared_experts
                  - text: 1; Kimi K3
                  - code [ref=f3e210]: num_shared_experts
                  - text: "2"
              - row [ref=f3e211]:
                - cell "New scoring functions" [ref=f3e212]
                - cell "Sigmoid or square-root-softplus scores instead of a softmax" [ref=f3e213]
                - cell [ref=f3e214]:
                  - text: DeepSeek-V3
                  - code [ref=f3e215]: sigmoid
                  - text: ; DeepSeek-V4-Pro
                  - code [ref=f3e216]: sqrtsoftplus
          - paragraph [ref=f3e217]: "The DeepSeekMoE paper argues for the first two: finer experts let each token combine a more flexible mix, and shared experts hold knowledge that every token needs, so the routed ones need not duplicate it."
          - heading [level=3] [ref=f3e218]:
            - text: Total parameters against active parameters
            - link "Direct link to Total parameters against active parameters" [ref=f3e219] [cursor=pointer]:
              - /url: "#total-parameters-against-active-parameters"
              - text: "#"
          - paragraph [ref=f3e220]:
            - text: Parameters in experts are stored for all experts but used for only k of E. So
            - code [ref=f3e221]: active = total - expert parameters x (1 - k/E)
            - text: . For Mixtral 8x7B, block 4 counts 46.70 billion parameters, of which 45.10 billion are in experts. With k = 2 of 8, the active count is 46.70 - 45.10 x 0.75 = 12.88 billion. The paper reports "47B" and "13B".
          - paragraph [ref=f3e222]: Counting conventions differ. Qwen's card for Qwen3-30B-A3B gives 3.3 billion active, which matches counting everything (3.35). OpenAI's card for gpt-oss-120b gives 5.1 billion, which matches only if the 0.58 billion input embedding is left out (5.71 - 0.58 = 5.13). When you compare models, check how the card counts.
          - heading [level=3] [ref=f3e223]:
            - text: Why do experts become unbalanced, and what fixes it?
            - link "Direct link to Why do experts become unbalanced, and what fixes it?" [ref=f3e224] [cursor=pointer]:
              - /url: "#why-do-experts-become-unbalanced-and-what-fixes-it"
              - text: "#"
          - paragraph [ref=f3e225]:
            - text: Early in training a few experts get slightly more tokens, learn faster, look better to the router, and get even more tokens. This is
            - strong [ref=f3e226]: routing collapse
            - text: ", and Shazeer and colleagues described it in the paper that introduced the sparsely-gated layer. Three remedies are in use."
          - paragraph [ref=f3e227]:
            - strong [ref=f3e228]: A balancing loss.
            - text: The Switch Transformer adds
            - code [ref=f3e229]: alpha x N x sum of f_i x P_i
            - text: to the training loss, where
            - code [ref=f3e230]: f_i
            - text: is the share of tokens sent to expert
            - code [ref=f3e231]: i
            - text: and
            - code [ref=f3e232]: P_i
            - text: "is the router's average probability for it. In words: the product is small only when no expert is both busy and favoured. Block 1 shows it equals 1.0 for a perfectly even router. The Switch paper used"
            - code [ref=f3e233]: alpha = 0.01
            - text: ", found by sweeping from 0.1 to 0.00001. The loss reaches the router through"
            - code [ref=f3e234]: P_i
            - text: ", which is differentiable;"
            - code [ref=f3e235]: f_i
            - text: is a count and is not.
          - paragraph [ref=f3e236]:
            - strong [ref=f3e237]: A capacity limit.
            - text: Each expert gets room for
            - code [ref=f3e238]: capacity factor x tokens x k / experts
            - text: "slots. Extra tokens are dropped: their computation is skipped and they pass through the layer on the residual connection. The Switch paper notes that more capacity wastes compute and memory, and that low drop rates matter for quality."
          - paragraph [ref=f3e239]:
            - strong [ref=f3e240]: A bias instead of a loss.
            - text: DeepSeek-V3 argues that a big auxiliary loss hurts quality. It adds a bias to each expert's score, used only to choose the top-k, never in the gate weights. After each step it lowers the bias of overloaded experts and raises it for underloaded ones by a fixed step, 0.001 for most of training. It keeps a tiny sequence-level balance loss, coefficient 0.0001, to stop extreme cases within one sequence. The method comes from an earlier paper on auxiliary-loss-free balancing.
          - paragraph [ref=f3e241]: Block 2 runs all three on a toy problem.
          - heading [level=3] [ref=f3e242]:
            - text: What does expert parallelism do?
            - link "Direct link to What does expert parallelism do?" [ref=f3e243] [cursor=pointer]:
              - /url: "#what-does-expert-parallelism-do"
              - text: "#"
          - paragraph [ref=f3e244]:
            - text: With expert parallelism, each GPU holds a few experts, so a token's chosen experts may live on other GPUs. Each step has two
            - strong [ref=f3e245]: all-to-all
            - text: exchanges. Dispatch sends each token to the rank that holds each of its experts. After the experts compute, combine sends the results back, and each token's outputs are added with their gate weights. Block 5 runs this on two real processes and matches a single process.
          - paragraph [ref=f3e246]: The weak point is balance. Every rank must wait for the slowest, so a rank that receives 40 token slots while another receives 24 sets the pace, with the other idle 40 per cent of the time. DeepSeek-V3 limits each token to experts on at most 4 nodes to keep traffic on the faster links. Its experts for each layer are spread over 64 GPUs on 8 nodes.
          - 'figure "Follow a token copy from its own rank to the rank of its expert and back. The red box is the lesson: rank 0 receives 40 slots and rank 1 only 24. Counts are printed by block 5." [ref=f3e247]':
            - generic [ref=f3e248]:
              - 'button "Enlarge: Two ranks each holding two experts, a dispatch all-to-all in which rank 0 sends 21 slots to itself and 11 to rank 1 while rank 1 sends 19 to rank 0 and 13 to itself, and a combine all-to-all that returns the outputs" [ref=f3e249]':
                - img "Two ranks each holding two experts, a dispatch all-to-all in which rank 0 sends 21 slots to itself and 11 to rank 1 while rank 1 sends 19 to rank 0 and 13 to itself, and a combine all-to-all that returns the outputs" [ref=f3e250]
              - button "View infographic larger" [ref=f3e251] [cursor=pointer]:
                - generic [ref=f3e254]: Expand
          - heading [level=3] [ref=f3e256]:
            - text: What does it mean for memory and serving?
            - link "Direct link to What does it mean for memory and serving?" [ref=f3e257] [cursor=pointer]:
              - /url: "#what-does-it-mean-for-memory-and-serving"
              - text: "#"
          - paragraph [ref=f3e258]:
            - text: "Compute follows the active parameters; memory follows the total. Every expert must be resident because the next token may choose any of them. So a mixture-of-experts model is cheap per token but needs many GPUs' worth of memory. The previous inference chapters apply:"
            - link "KV cache and paged attention" [ref=f3e259] [cursor=pointer]:
              - /url: /docs/llm-engineering/kv-cache-and-paged-attention
            - text: still sizes the context, and
            - link "GPU sizing" [ref=f3e260] [cursor=pointer]:
              - /url: /docs/llm-engineering/gpu-sizing-and-capacity-planning
            - text: must use total parameters for weights, not active ones.
          - heading [level=3] [ref=f3e261]:
            - text: Which models are current?
            - link "Direct link to Which models are current?" [ref=f3e262] [cursor=pointer]:
              - /url: "#which-models-are-current"
              - text: "#"
          - paragraph [ref=f3e263]: The table is built from the official model cards and configs, read on 7 and 8 October 2026. Dates are when each repository was created on the Hub, which is not always the announcement date.

          - list [ref=f3e569]:
            - listitem [ref=f3e570]:
              - code [ref=f3e571]: output_router_logits=True
              - text: asks each layer to return its router scores, one tensor per layer, tokens by experts.
            - listitem [ref=f3e572]:
              - code [ref=f3e573]: torch.cat(router_logits)

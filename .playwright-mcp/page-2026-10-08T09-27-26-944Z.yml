            - generic [ref=f3e610]: "print(f\"{repo.split('/')[-1]:<30} {n_exp:>7} {k:>6} {total / 1e9:7.2f} {experts / 1e9:12.2f} {active / 1e9:14.2f} {(active - embedding) / 1e9:29.2f} {card}\")"
            - generic [ref=f3e612]: "ESTIMATED = {"
            - generic [ref=f3e613]: "\"deepseek-ai/DeepSeek-V4-Pro\": (\"n_routed_experts\", \"moe_intermediate_size\", \"hidden_size\", 61, \"1.6T / 49B\"),"
            - generic [ref=f3e614]: "\"moonshotai/Kimi-K3\": (\"num_experts\", \"moe_intermediate_size\", \"routed_expert_hidden_size\", 92, \"2.8T / 104B\"),"
            - generic [ref=f3e615]: "\"Aleph-Alpha/Kolibri-1\": (\"num_experts\", \"moe_intermediate_size\", \"hidden_size\", 50, \"78.1B / 3.46B\"),"

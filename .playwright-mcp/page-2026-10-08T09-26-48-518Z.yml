              - text: "#"
          - generic [ref=f1e882]:
            - generic [ref=f1e883]: Industry view
            - list [ref=f1e888]:
              - listitem [ref=f1e889]:
                - strong [ref=f1e890]: FSDP2 is documented as the per-parameter design.
                - text: The PyTorch 2.14 FSDP2 page describes
                - code [ref=f1e891]: fully_shard
                - text: with
                - code [ref=f1e892]: DTensor
                - text: "-based per-parameter sharding. The original"
                - code [ref=f1e893]: FullyShardedDataParallel
                - text: class is still documented in 2.14 without a deprecation notice, as of 7 October 2026.
              - listitem [ref=f1e894]:
                - strong [ref=f1e895]: DeepSpeed is still maintained.
                - text: PyPI listed 0.19.7 as the latest release, uploaded on 16 September 2026.
              - listitem [ref=f1e896]:
                - strong [ref=f1e897]: Sharding is one layer of a stack.
                - text: The Llama 3 paper and the Ultra-Scale Playbook both combine it with tensor, pipeline and context parallelism rather than using it alone.
              - listitem [ref=f1e898]:
                - strong [ref=f1e899]: "Not verified here:"
                - text: GPU throughput, offload speed, or which framework a given lab uses today.
          - heading [level=2] [ref=f1e900]:
            - text: Common mistakes
            - link "Direct link to Common mistakes" [ref=f1e901] [cursor=pointer]:
              - /url: "#common-mistakes"
              - text: "#"
          - list [ref=f1e902]:
            - listitem [ref=f1e903]:
              - strong [ref=f1e904]: Expecting ZeRO to shrink activations.
              - text: It shards weights, gradients and optimiser state only. If you run out of memory in activations, use the savings from the previous chapter.
            - listitem [ref=f1e905]:
              - strong [ref=f1e906]: Using stage 1 or 2 to fit a model whose weights alone are too big.
              - text: They keep the weights whole. Block 2 shows stage 2 never fits Llama 3.1 70B at any GPU count on 80 GB.
            - listitem [ref=f1e907]:
              - strong [ref=f1e908]: Wrapping the whole model as one FSDP unit.
              - text: It feels simple. But then the entire model is gathered at once, and the memory saving disappears. Wrap per block.
            - listitem [ref=f1e909]:
              - strong [ref=f1e910]: Forgetting the recipe.
              - text: "\"ZeRO divides memory by N\" is only true for the part it shards. Lab experiment 3 shows how the share changes with the recipe."
            - listitem [ref=f1e911]:
              - strong [ref=f1e912]: Comparing a sharded run to a single process after many steps and expecting zero difference.
              - text: Adam magnifies ordering differences in float arithmetic. Compare after a few steps, with a tolerance, as blocks 3 to 5 do.

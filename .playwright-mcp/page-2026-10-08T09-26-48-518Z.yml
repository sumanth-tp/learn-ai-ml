                - cell [ref=f1e143]:
                  - code [ref=f1e144]: fully_shard(layer)
              - row [ref=f1e145]:
                - cell "Bucket" [ref=f1e146]
                - cell "A group of gradients sent together so small messages are not wasteful" [ref=f1e147]
                - cell "25 MB of gradients" [ref=f1e148]
          - heading [level=2] [ref=f1e149]:
            - text: The idea in plain words
            - link "Direct link to The idea in plain words" [ref=f1e150] [cursor=pointer]:
              - /url: "#the-idea-in-plain-words"
              - text: "#"
          - paragraph [ref=f1e151]: Start with a model so small you can do it by hand. It has 8 parameters. Two GPUs train it, and each sees half of the examples, so each computes a gradient for all 8 parameters. Plain data parallelism averages those two gradients, so both GPUs hold the same 8 averaged numbers and both apply the same update.
          - paragraph [ref=f1e152]: "Now ask what each GPU actually needs. To update parameters 0 to 3, a GPU needs only the averaged gradient for 0 to 3 and the optimiser state for 0 to 3. It does not need anything about 4 to 7. So split the job: GPU 0 owns parameters 0 to 3, GPU 1 owns 4 to 7. Each GPU receives only its half of the averaged gradient, updates only its half, and then the two halves are put back together so both GPUs have all 8 new weights for the next forward pass."
          - paragraph [ref=f1e153]:
            - text: That is ZeRO in one paragraph. The two operations in the middle have names.
            - strong [ref=f1e154]: Reduce-scatter
            - text: adds the gradients up and hands each GPU only its slice.
            - strong [ref=f1e155]: All-gather
            - text: collects the slices back into the whole. Everything in this chapter is a variation on those two moves.
          - paragraph [ref=f1e156]: "The ZeRO paper names three stages by what they stop duplicating:"
          - table [ref=f1e157]:
            - rowgroup [ref=f1e158]:
              - row [ref=f1e159]:
                - columnheader "Stage" [ref=f1e160]
                - columnheader "What each GPU keeps only a slice of" [ref=f1e161]
                - columnheader "In PyTorch" [ref=f1e162]
            - rowgroup [ref=f1e163]:
              - row [ref=f1e164]:
                - cell "0" [ref=f1e165]
                - 'cell "Nothing: everything is copied" [ref=f1e166]'
                - cell "DDP" [ref=f1e167]
              - row [ref=f1e168]:
                - cell "1" [ref=f1e169]
                - cell "The optimiser state" [ref=f1e170]
                - cell [ref=f1e171]:
                  - code [ref=f1e172]: ZeroRedundancyOptimizer
              - row [ref=f1e173]:
                - cell "2" [ref=f1e174]
                - cell "Optimiser state and gradients" [ref=f1e175]
                - cell [ref=f1e176]:
                  - text: No separate switch in PyTorch;
                  - code [ref=f1e177]: fully_shard
                  - text: with
                  - code [ref=f1e178]: reshard_after_forward=False
                  - text: behaves like it during a step
              - row [ref=f1e179]:
                - cell "3" [ref=f1e180]
                - cell "Optimiser state, gradients and weights" [ref=f1e181]
                - cell [ref=f1e182]:
                  - text: FSDP,
                  - code [ref=f1e183]: fully_shard
          - 'figure "Compare the purple optimiser box first: it is by far the biggest, so stage 1 already removes most of the memory. The numbers are the ZeRO paper''s example and are reproduced by block 2." [ref=f1e184]':
            - generic [ref=f1e185]:
              - 'button "Enlarge: Four columns for DDP and ZeRO stages 1 to 3, each showing three boxes for weights, gradients and optimiser state with the part a GPU keeps shaded, and the per-GPU memory 120.0, 31.4, 16.6 and 1.9 GB for a 7.5B model on 64 GPUs" [ref=f1e186]':
                - img "Four columns for DDP and ZeRO stages 1 to 3, each showing three boxes for weights, gradients and optimiser state with the part a GPU keeps shaded, and the per-GPU memory 120.0, 31.4, 16.6 and 1.9 GB for a 7.5B model on 64 GPUs" [ref=f1e187]
              - button "View infographic larger" [ref=f1e188] [cursor=pointer]:
                - generic [ref=f1e191]: Expand
          - heading [level=2] [ref=f1e193]:
            - text: Worked example, step by step
            - link "Direct link to Worked example, step by step" [ref=f1e194] [cursor=pointer]:
              - /url: "#worked-example-step-by-step"
              - text: "#"
          - paragraph [ref=f1e195]:
            - strong [ref=f1e196]: The 8-parameter toy.
            - text: Every weight starts at 1.0, the learning rate is 0.1, and the two GPUs computed these gradients on their own halves of the batch. Block 1 runs it with real collectives.
          - list [ref=f1e197]:
            - listitem [ref=f1e198]: GPU 0's gradients are 1, 2, 3, 4, 5, 6, 7, 8. GPU 1's are 3, 2, 1, 0, 1, 2, 3, 4.
            - listitem [ref=f1e199]:
              - strong [ref=f1e200]: Reduce-scatter with averaging.
              - text: "Add them slot by slot and halve: 2, 2, 2, 2, 3, 4, 5, 6. GPU 0 receives the first four (2, 2, 2, 2). GPU 1 receives the last four (3, 4, 5, 6)."
            - listitem [ref=f1e201]:
              - strong [ref=f1e202]: Update only the owned slice.
              - text: New weight = 1.0 minus 0.1 times the gradient. GPU 0 gets 0.8 for each of its four. GPU 1 gets 0.7, 0.6, 0.5, 0.4.
            - listitem [ref=f1e203]:
              - strong [ref=f1e204]: All-gather.
              - text: Both GPUs now hold 0.8, 0.8, 0.8, 0.8, 0.7, 0.6, 0.5, 0.4, the same as plain data parallelism would give.
          - 'figure "Read top to bottom: gradients, reduce-scatter, update, all-gather. Every number here is printed by block 1." [ref=f1e205]':
            - generic [ref=f1e206]:
              - 'button "Enlarge: Four stacked bands showing eight gradients on two GPUs, the reduce-scatter to two averaged halves, the update of each owned half, and the all-gather that rebuilds the eight weights" [ref=f1e207]':
                - img "Four stacked bands showing eight gradients on two GPUs, the reduce-scatter to two averaged halves, the update of each owned half, and the all-gather that rebuilds the eight weights" [ref=f1e208]
              - button "View infographic larger" [ref=f1e209] [cursor=pointer]:
                - generic [ref=f1e212]: Expand
          - paragraph [ref=f1e214]:
            - strong [ref=f1e215]: The paper's real-size example.
            - text: A model with 7.5 billion parameters and 64 GPUs, using the mixed-precision recipe of 2 + 2 + 12 bytes per parameter.
          - list [ref=f1e216]:
            - listitem [ref=f1e217]: "Plain data parallelism: 16 bytes x 7.5 billion = 120 GB per GPU."
            - listitem [ref=f1e218]: "Stage 1 shards the 12-byte optimiser part: 4 + 12/64 = 4.19 bytes, so 31.4 GB."
            - listitem [ref=f1e219]: "Stage 2 also shards the 2-byte gradients: 2 + 14/64 = 2.22 bytes, so 16.6 GB."
            - listitem [ref=f1e220]: "Stage 3 shards everything: 16/64 = 0.25 bytes, so 1.9 GB."
          - paragraph [ref=f1e221]: Memory fell from 120 GB to 1.9 GB. Block 2 prints exactly these numbers.
          - heading [level=2] [ref=f1e222]:
            - text: How it works
            - link "Direct link to How it works" [ref=f1e223] [cursor=pointer]:
              - /url: "#how-it-works"
              - text: "#"
          - heading [level=3] [ref=f1e224]:
            - text: What does plain DDP do?
            - link "Direct link to What does plain DDP do?" [ref=f1e225] [cursor=pointer]:
              - /url: "#what-does-plain-ddp-do"
              - text: "#"
          - paragraph [ref=f1e226]: DDP, PyTorch's DistributedDataParallel, copies the model to every GPU. At construction it broadcasts the state from rank 0 so all replicas start identical. It groups gradients into buckets, roughly in the reverse order of the model's parameters, because that is the order they become ready. When every gradient in a bucket is ready, it starts an asynchronous all-reduce, so communication overlaps with the rest of the backward pass. After the backward pass every replica holds the same averaged gradient, and each applies the same optimiser step. This is described in the PyTorch 2.14 DDP notes.
          - paragraph [ref=f1e227]: "DDP's weakness is the one in the picture above. It makes no attempt to share anything: three full copies per GPU, so a bigger replica count never makes the model fit."
          - heading [level=3] [ref=f1e228]:
            - text: Why are stages 1 and 2 almost free?
            - link "Direct link to Why are stages 1 and 2 almost free?" [ref=f1e229] [cursor=pointer]:
              - /url: "#why-are-stages-1-and-2-almost-free"
              - text: "#"
          - paragraph [ref=f1e230]: An all-reduce is the same as a reduce-scatter followed by an all-gather. Plain DDP moves about 2 model-sizes of data per step. ZeRO stage 2 does a reduce-scatter on the gradients (1 model-size) and, after the owned slice is updated, an all-gather of the new weights (1 model-size). The total is the same 2. The ZeRO paper states that stages 1 and 2 add no communication over the baseline. You get a large memory saving for nothing but a re-ordering of the same traffic.
          - heading [level=3] [ref=f1e231]:
            - text: What does stage 3 cost?
            - link "Direct link to What does stage 3 cost?" [ref=f1e232] [cursor=pointer]:
              - /url: "#what-does-stage-3-cost"
              - text: "#"
          - paragraph [ref=f1e233]:
            - text: "At stage 3 the weights themselves are in slices, so a GPU must all-gather a layer's weights before it can compute with them, and free them afterwards. That gather happens in the forward pass and again in the backward pass, then the gradients are reduce-scattered. Three model-sizes of traffic instead of two: 1.5 times, as the paper computes. The cost is hidden when the gather for layer"
            - code [ref=f1e234]: i + 1
            - text: runs while layer
            - code [ref=f1e235]: i
            - text: computes.
          - 'figure "Follow one layer: it is gathered, used, freed, gathered again for the backward pass, and its gradient is scattered. Only about two layers are whole at any time." [ref=f1e236]':
            - generic [ref=f1e237]:
              - 'button "Enlarge: Three lanes for all-gather, compute and reduce-scatter across a forward and backward pass over three layers, with each layer gathered once going forward and again going backward and its gradient scattered afterwards" [ref=f1e238]':
                - img "Three lanes for all-gather, compute and reduce-scatter across a forward and backward pass over three layers, with each layer gathered once going forward and again going backward and its gradient scattered afterwards" [ref=f1e239]
              - button "View infographic larger" [ref=f1e240] [cursor=pointer]:
                - generic [ref=f1e243]: Expand
          - heading [level=3] [ref=f1e245]:
            - text: What is FSDP, and how is it different from ZeRO?
            - link "Direct link to What is FSDP, and how is it different from ZeRO?" [ref=f1e246] [cursor=pointer]:
              - /url: "#what-is-fsdp-and-how-is-it-different-from-zero"
              - text: "#"
          - paragraph [ref=f1e247]:
            - text: FSDP is PyTorch's own implementation of the stage 3 idea. The PyTorch 2.14 documentation describes FSDP2 (
            - code [ref=f1e248]: fully_shard
            - text: ) as "a fully sharded data parallelism (FSDP) implementation targeting performant eager-mode while using per-parameter sharding". Each parameter becomes a
            - code [ref=f1e249]: DTensor
            - text: "whose local piece is one slice, which block 5 shows. Four settings matter:"
          - table [ref=f1e250]:
            - rowgroup [ref=f1e251]:
              - row [ref=f1e252]:
                - columnheader "Setting" [ref=f1e253]
                - columnheader "What it does" [ref=f1e254]
            - rowgroup [ref=f1e255]:
              - row [ref=f1e256]:
                - cell "Which modules you wrap" [ref=f1e257]
                - cell "Each wrapped module is one unit that is gathered and freed together; wrap each transformer block, then the root" [ref=f1e258]
              - row [ref=f1e259]:
                - cell [ref=f1e260]:
                  - code [ref=f1e261]: reshard_after_forward
                - cell [ref=f1e262]:
                  - code [ref=f1e263]: "True"
                  - text: frees the gathered weights after forward and gathers them again in backward (less memory, more traffic).
                  - code [ref=f1e264]: "False"
                  - text: keeps them until backward (the reverse). By default it is
                  - code [ref=f1e265]: "True"
                  - text: for inner modules and
                  - code [ref=f1e266]: "False"
                  - text: for the root
              - row [ref=f1e267]:
                - cell [ref=f1e268]:
                  - code [ref=f1e269]: mp_policy
                - cell [ref=f1e270]:
                  - text: A
                  - code [ref=f1e271]: MixedPrecisionPolicy
                  - text: with
                  - code [ref=f1e272]: param_dtype
                  - text: (compute and gather),
                  - code [ref=f1e273]: reduce_dtype
                  - text: (gradient reduction) and
                  - code [ref=f1e274]: output_dtype
              - row [ref=f1e275]:
                - cell [ref=f1e276]:
                  - code [ref=f1e277]: offload_policy
                - cell "Whether to push sharded state to the CPU" [ref=f1e278]
          - paragraph [ref=f1e279]:
            - text: Llama 3's training used a FSDP that shards optimiser state and gradients but does not reshard the weights after the forward pass, to avoid the extra gather in backward. That is the
            - code [ref=f1e280]: "False"
            - text: setting. The weights stay whole from forward until backward is done with them, so for memory this behaves like stage 2 during a step.
          - paragraph [ref=f1e281]:
            - text: DeepSpeed ZeRO is the original library. Its
            - code [ref=f1e282]: zero_optimization.stage
            - text: setting takes 0 to 3 with the same meanings, and it can offload optimiser state or parameters to CPU memory with
            - code [ref=f1e283]: offload_optimizer
            - text: and
            - code [ref=f1e284]: offload_param
            - text: .
          - heading [level=3] [ref=f1e285]:
            - text: Which should you use?
            - link "Direct link to Which should you use?" [ref=f1e286] [cursor=pointer]:
              - /url: "#which-should-you-use"
              - text: "#"
          - paragraph [ref=f1e287]: Use plain DDP while the model state fits. Stage 1 is the cheapest step up, because the optimiser is most of the memory and the traffic is unchanged. Move to stage 2 or 3 when weights are the problem. At very large scale the ZeRO-3 gathers cross the network, so the Ultra-Scale Playbook found pure data parallelism or ZeRO-3 to become communication-bound at 512 GPUs and beyond. That is why the previous chapter combines them with tensor and pipeline parallelism.
          - heading [level=2] [ref=f1e288]:
            - text: A real system that works this way
            - link "Direct link to A real system that works this way" [ref=f1e289] [cursor=pointer]:
              - /url: "#a-real-system-that-works-this-way"
              - text: "#"
          - paragraph [ref=f1e290]:
            - strong [ref=f1e291]: Llama 3 405B
            - text: is the example from the last chapter. The paper reports FSDP with sharded optimiser state and gradients for the data-parallel dimension of its 4D layout, and that it chose not to reshard the weights after forward.
          - paragraph [ref=f1e292]:
            - strong [ref=f1e293]: The ZeRO paper itself
            - text: is the origin of the three stages. Its authors report training models of over 100B parameters with super-linear speedup on 400 GPUs at 15 petaflops, an 8x increase in model size over the state of the art they compared against. Those are the authors' own 2019 measurements on their cluster.
          - heading [level=2] [ref=f1e294]:
            - text: Code you can run
            - link "Direct link to Code you can run" [ref=f1e295] [cursor=pointer]:
              - /url: "#code-you-can-run"
              - text: "#"
          - paragraph [ref=f1e296]: Five blocks. Block 1 is the toy with real collectives. Block 2 is arithmetic on real configs. Blocks 3 to 5 train a small real Llama model, 158,016 parameters, on two processes with PyTorch's gloo backend on the CPU, and compare against one process. Each takes a few seconds.
          - heading [level=3] [ref=f1e297]:
            - text: 1. The 8-parameter toy, with real collectives
            - link "Direct link to 1. The 8-parameter toy, with real collectives" [ref=f1e298] [cursor=pointer]:
              - /url: "#1-the-8-parameter-toy-with-real-collectives"
              - text: "#"
          - paragraph [ref=f1e299]:
            - text: Two gloo processes run steps 1 to 4 of the worked example, using
            - code [ref=f1e300]: reduce_scatter_single
            - text: and
            - code [ref=f1e301]: all_gather_single
            - text: ", the names current in PyTorch 2.14."
          - code [ref=f1e305]:
            - generic [ref=f1e306]: import os
            - generic [ref=f1e307]: import socket
            - generic [ref=f1e309]: import torch
            - generic [ref=f1e310]: import torch.distributed as dist

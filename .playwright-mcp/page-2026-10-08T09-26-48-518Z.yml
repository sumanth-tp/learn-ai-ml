          - heading "DDP, FSDP and ZeRO" [level=1] [ref=f1e73]
          - paragraph [ref=f1e74]:
            - strong [ref=f1e75]: In one line.
            - text: Plain data parallelism keeps a full copy of the weights, the gradients and the optimiser state on every GPU, and ZeRO and FSDP remove those copies one at a time by giving each GPU a slice and fetching the rest only at the moment it is needed.
          - generic [ref=f1e76]:
            - generic [ref=f1e77]: Before you start
            - list [ref=f1e82]:
              - listitem [ref=f1e83]:
                - strong [ref=f1e84]: You should already know
                - text: how data parallelism averages gradients (
                - link "data parallelism" [ref=f1e85] [cursor=pointer]:
                  - /url: /docs/mlops/distributed/data-parallelism
                - text: ), what Adam keeps for each parameter (
                - link "Adam optimiser" [ref=f1e86] [cursor=pointer]:
                  - /url: /docs/theory/dnn/adam-optimizer
                - text: ), and the five parallelism axes and the 16-bytes-per-parameter sum from the previous chapter (
                - link "parallelism strategies for LLMs" [ref=f1e87] [cursor=pointer]:
                  - /url: /docs/llm-engineering/parallelism-strategies-for-llms
                - text: ).
              - listitem [ref=f1e88]:
                - strong [ref=f1e89]: "Reading time:"
                - text: about 40 minutes, plus a minute or two to run the code.
              - listitem [ref=f1e90]:
                - strong [ref=f1e91]: After this chapter you can
                - text: say what each ZeRO stage shards and what it costs in traffic, run real sharded training on two processes and check it against a single process, and write the FSDP2 and DeepSpeed settings you would use on GPUs.
          - generic [ref=f1e92]:
            - generic [ref=f1e93]: Not from a lecture
            - paragraph [ref=f1e98]: "This chapter was written for this site from the ZeRO paper, the PyTorch 2.14 documentation and the DeepSpeed configuration reference listed under Go deeper. Versions used: Python 3.14, PyTorch 2.14.1 (CPU, gloo backend), Transformers 5.18.0. DeepSpeed 0.19.7 (released 16 September 2026 on PyPI) is not installed here, so its snippet is not run. Sources were opened on 7 October 2026."
          - heading [level=2] [ref=f1e99]:
            - text: In 30 seconds
            - link "Direct link to In 30 seconds" [ref=f1e100] [cursor=pointer]:
              - /url: "#in-30-seconds"
              - text: "#"
          - paragraph [ref=f1e101]: Eight friends each want to bake from the same cookbook. If every friend buys a full set of three things, the cookbook, a notebook of corrections and a thick logbook of every past bake, then eight sets of identical books fill eight kitchens. Most of that is waste. Give each friend only one eighth of the logbook, and have them swap pages when they need them.
          - paragraph [ref=f1e102]: Data parallel training has exactly this waste. Every GPU holds the same weights, the same gradients and the same optimiser state. ZeRO and FSDP are the ways to stop holding identical copies. They save memory at the cost of a little extra talking between GPUs.
          - heading [level=2] [ref=f1e103]:
            - text: Words you will meet
            - link "Direct link to Words you will meet" [ref=f1e104] [cursor=pointer]:

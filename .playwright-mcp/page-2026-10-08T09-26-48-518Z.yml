          - list [ref=f1e864]:
            - listitem [ref=f1e865]:
              - strong [ref=f1e866]: Count before you shard.
              - text: Use block 2's formula. If the state already fits with room for activations, plain DDP is the fastest option.
            - listitem [ref=f1e867]:
              - strong [ref=f1e868]: Try stage 1 first.
              - text: It removes most of the memory with no extra traffic.
            - listitem [ref=f1e869]:
              - strong [ref=f1e870]: Wrap at the block level.
              - text: Gather-and-free units should be transformer blocks, so the gather for the next block can overlap with the current one.
            - listitem [ref=f1e871]:
              - strong [ref=f1e872]:
                - text: Choose
                - code [ref=f1e873]: reshard_after_forward
                - text: on purpose.
              - text: "Memory-tight:"
              - code [ref=f1e874]: "True"
              - text: ". Network-tight:"
              - code [ref=f1e875]: "False"
              - text: .
            - listitem [ref=f1e876]:
              - strong [ref=f1e877]: Watch the traffic when you cross servers.
              - text: Stage 3 moves 1.5 times as much as DDP; if your links are slow, prefer stage 2 or combine with tensor and pipeline parallelism.
            - listitem [ref=f1e878]:
              - strong [ref=f1e879]: Do not compare absolute memory across recipes.
              - text: "\"ZeRO saves 8x\" depends on the bytes-per-parameter recipe; the lab's fp32 setting shows the difference."
          - heading [level=2] [ref=f1e880]:
            - text: Where this stands in 2026
            - link "Direct link to Where this stands in 2026" [ref=f1e881] [cursor=pointer]:

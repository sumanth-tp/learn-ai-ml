              - paragraph [ref=e811]: Two gloo processes each hold the zigzag chunks of a 32-token sequence, all-gather keys and values, and compute causal attention for their own queries. The result is compared with attention on the whole sequence, and the work per rank is counted under the zigzag and a contiguous split.
              - code [ref=e815]:
                - generic [ref=e816]: import os
                - generic [ref=e817]: import socket
                - generic [ref=e819]: import torch
                - generic [ref=e820]: import torch.distributed as dist
                - generic [ref=e821]: import torch.multiprocessing as mp

                    - cell "One learned number inside the model" [ref=e247]
                    - cell "Llama 3.1 405B has 405,853,388,800" [ref=e248]
                  - row [ref=e249]:
                    - cell "HBM (high-bandwidth memory)" [ref=e250]
                    - cell "The fast memory on the GPU card" [ref=e251]
                    - cell "80 GB on the H100 cards Llama 3 used" [ref=e252]
                  - row [ref=e253]:
                    - cell "Activation" [ref=e254]
                    - cell "An intermediate result saved during the forward pass so the backward pass can use it" [ref=e255]
                    - cell "The output of each layer for each token" [ref=e256]

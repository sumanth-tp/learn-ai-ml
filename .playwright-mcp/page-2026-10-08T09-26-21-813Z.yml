                - generic [ref=e599]: weights = weights / d + 2 * layer_params(c) / t
                - generic [ref=e600]: return weights / GB, grads / GB, opt / GB
                - generic [ref=e603]: c70 = load("NousResearch/Meta-Llama-3.1-70B")
                - generic [ref=e604]: "print(f\"70B: {params(c70):,} parameters, {16 * params(c70) / GB:,.1f} GB of states at 16 bytes each\")"
                - generic [ref=e605]: print("70B on 64 GPUs as TP 8 x PP 2 x DP 4, per-GPU states in GB")
                - generic [ref=e606]: "for z in range(4):"
                - generic [ref=e607]: w, g, o = states(c70, 8, 2, 4, z)
                - generic [ref=e608]: "print(f\" ZeRO {z}: weights {w:6.2f} grads {g:6.2f} optimiser {o:6.2f} total {w + g + o:6.2f}\")"
                - generic [ref=e610]: c405 = load("NousResearch/Hermes-3-Llama-3.1-405B")
                - generic [ref=e611]: rows = [(8192, 8, 1, 16, 64, 32, 8192), (16384, 8, 1, 16, 128, 16, 8192), (16384, 8, 16, 16, 8, 16, 131072)]
                - generic [ref=e612]: print()
                - generic [ref=e613]: "print(\"Llama 3 405B, Table 4 of the paper: do the layouts multiply out?\")"
                - generic [ref=e614]: print("GPUs TP CP PP DP seq tokens per batch GPUs ok")
                - generic [ref=e615]: "for gpus, t, cp, p, d, bs, s in rows:"
                - generic [ref=e616]: "print(f\"{gpus:>5} {t:>2} {cp:>2} {p:>2} {d:>3} {s:>6} {d * bs * s:>16,} {t * cp * p * d == gpus}\")"
                - generic [ref=e618]: print()
                - generic [ref=e619]: print("405B on 16,384 GPUs as TP 8 x PP 16 x DP 128, per-GPU states in GB")
                - generic [ref=e620]: "for z in range(4):"
                - generic [ref=e621]: w, g, o = states(c405, 8, 16, 128, z)
                - generic [ref=e622]: "print(f\" ZeRO {z}: weights {w:6.2f} grads {g:6.2f} optimiser {o:6.2f} total {w + g + o:6.2f}\")"
              - paragraph [ref=e623]:
                - strong [ref=e624]: Reading the output.
                - text: "The 70B rows are the worked example: 70.55, 30.87, 24.25 and 17.85 GB. All three published layouts multiply out to their GPU counts and to exactly 16,777,216 tokens per batch, which the paper rounds to 16M. For the 405B layout on 16,384 GPUs, state falls from 50.73 GB with no sharding to 6.69 GB at stage 2, which is what Llama 3 does."
              - paragraph [ref=e625]:
                - strong [ref=e626]: Line by line.
              - list [ref=e627]:
                - listitem [ref=e628]:
                  - code [ref=e629]: states
                  - text: divides all three parts by
                  - code [ref=e630]: t * p
                  - text: ", then divides optimiser, gradients and weights by"
                  - code [ref=e631]: d
                  - text: as the ZeRO stage rises.
                - listitem [ref=e632]:
                  - text: At stage 3 it adds
                  - code [ref=e633]: 2 * layer_params / t
                  - text: ": the one layer that is gathered into full size while it computes."
                - listitem [ref=e634]: The embeddings and output head are not spread evenly over pipeline stages in a real run, so this is an average, not a per-stage truth.
              - heading [level=3] [ref=e635]:
                - text: 3. Activations for each saving, and does it fit?
                - link "Direct link to 3. Activations for each saving, and does it fit?" [ref=e636] [cursor=pointer]:
                  - /url: "#3-activations-for-each-saving-and-does-it-fit"
                  - text: "#"
              - paragraph [ref=e637]: We apply the five activation formulas to the 405B layout at 8,192 tokens, add them to the model state of block 2 and compare with the 80 GB card.
              - code [ref=e641]:
                - generic [ref=e642]: import json
                - generic [ref=e643]: import os
                - generic [ref=e645]: os.environ["HF_HUB_DISABLE_PROGRESS_BARS"] = "1"
                - generic [ref=e646]: from huggingface_hub import hf_hub_download
                - generic [ref=e648]: GB = 1e9
                - generic [ref=e649]: c = json.load(open(hf_hub_download("NousResearch/Hermes-3-Llama-3.1-405B", "config.json")))
                - generic [ref=e650]: L, H, A = c["num_hidden_layers"], c["hidden_size"], c["num_attention_heads"]
                - generic [ref=e651]: kv_dim = H * c["num_key_value_heads"] // A
                - generic [ref=e652]: layer = 2 * H * H + 2 * H * kv_dim + 3 * H * c["intermediate_size"] + 2 * H
                - generic [ref=e653]: P = 2 * c["vocab_size"] * H + L * layer + H
                - generic [ref=e656]: "def activations(s, b, t, cp, mode):"
                - generic [ref=e657]: sl = s / cp
                - generic [ref=e658]: sbh = sl * b * H
                - generic [ref=e659]: attn_scores = 5 * A * sl / H
                - generic [ref=e660]: "per_layer = {"
                - generic [ref=e661]: "\"nothing saved\": sbh * (34 + attn_scores),"
                - generic [ref=e662]: "\"tensor parallel\": sbh * (10 + 24 / t + attn_scores / t),"
                - generic [ref=e663]: "\"tensor + sequence parallel\": sbh / t * (34 + attn_scores),"
                - generic [ref=e664]: "\"+ selective recomputation\": sbh * 34 / t,"
                - generic [ref=e665]: "\"full recomputation\": 2 * sbh,"
                - generic [ref=e666]: "}[mode]"
                - generic [ref=e667]: return per_layer * L
                - generic [ref=e670]: modes = ["nothing saved", "tensor parallel", "tensor + sequence parallel", "+ selective recomputation", "full recomputation"]
                - generic [ref=e671]: t, p, d = 8, 16, 128
                - generic [ref=e672]: print("activations on the first pipeline stage, 8,192 tokens, micro-batch 1, TP 8 (GB)")
                - generic [ref=e673]: "for mode in modes:"
                - generic [ref=e674]: "print(f\" {mode:<28} {activations(8192, 1, t, 1, mode) / GB:9.1f}\")"
                - generic [ref=e676]: states = 2 * P / (t * p) + 2 * P / (t * p) / d + 12 * P / (t * p) / d
                - generic [ref=e677]: acts = activations(8192, 1, t, 1, "+ selective recomputation")
                - generic [ref=e678]: print()
                - generic [ref=e679]: "print(f\"ZeRO 2 states {states / GB:.1f} GB + activations {acts / GB:.1f} GB = {(states + acts) / GB:.1f} GB against 80 GB of HBM\")"
                - generic [ref=e680]: a_long = activations(131072, 1, 8, 16, "+ selective recomputation")
                - generic [ref=e681]: "print(f\"CP 16 at 131,072 tokens: {a_long / GB:.1f} GB, each rank holds {131072 // 16:,} tokens\")"
                - generic [ref=e682]: "print(f\"without context parallelism at 131,072 tokens: {activations(131072, 1, 8, 1, '+ selective recomputation') / GB:.1f} GB\")"
              - paragraph [ref=e683]:
                - strong [ref=e684]: Reading the output.
                - text: With nothing saved, activations would take 5,986.6 GB on the first stage. Tensor and sequence parallelism bring that to 748.3 GB. Only selective recomputation gets it to 71.9 GB. Add 6.7 GB of stage 2 state and the total is 78.6 GB against 80 GB. Without context parallelism the 131,072-token case would need 1,150 GB. With CP 16, each rank holds 8,192 tokens and the term returns to 71.9 GB.
              - paragraph [ref=e685]:
                - strong [ref=e686]: What did not work.
                - text: Treat the 78.6 GB as a sanity check, not a measurement. The Megatron formula was derived for a GPT-style layer with a 4h feed-forward block. Llama uses a three-matrix SwiGLU block and grouped-query attention, so the real byte counts differ. The estimate also leaves out the output logits, communication buffers and fragmentation. The lab below shows the third published layout giving 83.8 GB with this formula, over the card, even though Meta trained it. The formula is a guide to which saving matters, not a promise that a layout fits.
              - heading [level=3] [ref=e687]:
                - text: 4. Bubbles and bytes on the wire
                - link "Direct link to 4. Bubbles and bytes on the wire" [ref=e688] [cursor=pointer]:
                  - /url: "#4-bubbles-and-bytes-on-the-wire"
                  - text: "#"
              - paragraph [ref=e689]: First the pipeline bubble for different micro-batch counts. Then the bytes each GPU sends in one step for tensor, pipeline and data parallelism in the 405B layout, counting bf16 activation-sized messages.
              - code [ref=e693]:
                - generic [ref=e694]: import json
                - generic [ref=e695]: import os
                - generic [ref=e697]: os.environ["HF_HUB_DISABLE_PROGRESS_BARS"] = "1"
                - generic [ref=e698]: from huggingface_hub import hf_hub_download

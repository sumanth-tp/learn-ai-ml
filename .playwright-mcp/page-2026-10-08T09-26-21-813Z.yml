              - list [ref=e1012]:
                - listitem [ref=e1013]:
                  - strong [ref=e1014]: Start from the memory wall, not the speed wall.
                  - text: Compute 16 bytes per parameter and the activation formula for your sequence length. Only parallelism that removes a real wall is worth its communication.
                - listitem [ref=e1015]:
                  - strong [ref=e1016]: Fill the server with tensor parallelism, then stop.
                  - text: Keep tensor groups inside a server (commonly 8) on the fastest links.
                - listitem [ref=e1017]:
                  - strong [ref=e1018]: Use pipeline parallelism for what is left.
                  - text: It needs far less bandwidth, so it can cross servers, but give it enough micro-batches that the bubble stays small, and balance the first and last stages.
                - listitem [ref=e1019]:
                  - strong [ref=e1020]: Spend the remaining GPUs on data parallelism,
                  - text: sharded with ZeRO or FSDP when state is the constraint.
                - listitem [ref=e1021]:
                  - strong [ref=e1022]: Add context parallelism only for long sequences,
                  - text: and use the zigzag split with causal attention.
                - listitem [ref=e1023]:
                  - strong [ref=e1024]: Prefer less parallelism.
                  - text: The Playbook's decision order says to fit one instance first and scale out second. Every axis you add is a failure mode and a debugging cost.
                - listitem [ref=e1025]:
                  - strong [ref=e1026]: Measure MFU.
                  - text: Llama 3 reports 38 to 43 per cent. If yours is far lower, look for a talkative axis crossing a slow link.
              - heading [level=2] [ref=e1027]:
                - text: Where this stands in 2026
                - link "Direct link to Where this stands in 2026" [ref=e1028] [cursor=pointer]:
                  - /url: "#where-this-stands-in-2026"
                  - text: "#"
              - generic [ref=e1029]:
                - generic [ref=e1030]: Industry view
                - list [ref=e1035]:
                  - listitem [ref=e1036]:
                    - strong [ref=e1037]: The vocabulary is stable.
                    - text: "Tensor, pipeline, data (sharded) and context parallelism appear in the Llama 3 paper and in the Ultra-Scale Playbook (2025), which treats expert parallelism as the fifth axis. This chapter's version check: the Playbook page was read on 7 October 2026."
                  - listitem [ref=e1038]:
                    - strong [ref=e1039]: PyTorch has first-party pieces for most axes.
                    - text: PyTorch 2.14 ships
                    - code [ref=e1040]: fully_shard
                    - text: (FSDP2), a tensor-parallel module, a pipelining module and
                    - code [ref=e1041]: DeviceMesh
                    - text: for composing them. Importing each worked in this chapter's environment.
                  - listitem [ref=e1042]:
                    - strong [ref=e1043]: The published recipe is a 2024 recipe.
                    - text: Use the Llama 3 paper as a worked example of how the degrees combine. Newer systems differ in detail, and chapter 4 covers the mixture-of-experts models that now share the frontier.
                  - listitem [ref=e1044]:
                    - strong [ref=e1045]: "Not verified here:"
                    - text: any GPU timing, any cluster's real MFU, and which exact layout any current lab uses. Those are not published for most models.
              - heading [level=2] [ref=e1046]:
                - text: Common mistakes
                - link "Direct link to Common mistakes" [ref=e1047] [cursor=pointer]:
                  - /url: "#common-mistakes"
                  - text: "#"
              - list [ref=e1048]:
                - listitem [ref=e1049]:
                  - strong [ref=e1050]: Spanning a tensor-parallel group across servers.
                  - text: "It feels natural to use all 16 GPUs of two servers as one tensor group. Block 4 shows why not: tensor traffic is an order of magnitude larger than the others. Keep it inside a server and use pipeline parallelism between servers."
                - listitem [ref=e1051]:
                  - strong [ref=e1052]: Sizing by weights alone.
                  - text: "\"70B in bf16 is 140 GB, so 2 cards will do.\" Training stores gradients, optimiser state and activations too: 16 bytes per parameter, plus activations. Do the whole sum."
                - listitem [ref=e1053]:
                  - strong [ref=e1054]: Adding data parallelism to fix an out-of-memory error.
                  - text: More replicas make training faster, not smaller. Unless you shard the replicas (chapter 2), each still holds the full copy.
                - listitem [ref=e1055]:
                  - strong [ref=e1056]: Using a plain contiguous split for causal context parallelism.
                  - text: It looks like the obvious cut. Block 6 shows one rank doing nearly three times the work of the other. Use the zigzag assignment.
                - listitem [ref=e1057]:
                  - strong [ref=e1058]: Trusting a memory formula as proof.
                  - text: The Megatron formula is for GPT-style layers. Use it to pick which saving matters, then measure the real peak on one node.
              - heading [level=2] [ref=e1059]:
                - text: Practice questions
                - link "Direct link to Practice questions" [ref=e1060] [cursor=pointer]:
                  - /url: "#practice-questions"
                  - text: "#"
              - group [ref=e1061]:
                - generic [ref=e1062] [cursor=pointer]:
                  - strong [ref=e1063]: Q1 (Easy).
                  - text: The Llama 3 405B run used TP 8, PP 16 and DP 128. How many GPUs is that, and how many 8,192-token sequences does each data-parallel replica process per step if the batch is 16,777,216 tokens?
              - group [ref=e1064]:
                - generic [ref=e1065] [cursor=pointer]:
                  - strong [ref=e1066]: Q2 (Easy).
                  - text: A 13B-parameter model trains with plain bf16 and Adam, with no sharding. How much model state does one GPU need?
              - group [ref=e1067]:
                - generic [ref=e1068] [cursor=pointer]:
                  - strong [ref=e1069]: Q3 (Medium).
                  - text: Why do practitioners keep tensor-parallel groups inside one server?
              - group [ref=e1070]:
                - generic [ref=e1071] [cursor=pointer]:
                  - strong [ref=e1072]: Q4 (Medium).
                  - text: A 16-stage pipeline processes 48 micro-batches per step in the plain schedule. What fraction of time is idle, and what would 4-way interleaving change?
              - group [ref=e1073]:
                - generic [ref=e1074] [cursor=pointer]:
                  - strong [ref=e1075]: Q5 (Stretch).
                  - text: Training a 70B model with TP 8, PP 2, DP 4 and ZeRO 1, you run out of memory. The lab says activations are 22.8 GB with selective recomputation. Name two changes and what each saves.
              - group [ref=e1076]:
                - generic [ref=e1077] [cursor=pointer]:
                  - strong [ref=e1078]: Q6 (Stretch).
                  - text: Explain why 78.6 GB is not proof that Llama 3 fits in 80 GB, and what the lab's 83.8 GB for the third layout tells you.
              - heading [level=2] [ref=e1079]:
                - text: Go deeper
                - link "Direct link to Go deeper" [ref=e1080] [cursor=pointer]:
                  - /url: "#go-deeper"
                  - text: "#"

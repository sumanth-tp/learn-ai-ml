                - generic [ref=e852]: g = torch.Generator().manual_seed(0)
                - generic [ref=e853]: q, k, v = (torch.randn(SEQ, DIM, generator=g) for _ in range(3))
                - generic [ref=e854]: all_pos = torch.arange(SEQ)
                - generic [ref=e855]: reference = causal_attention(q, k, v, all_pos, all_pos)
                - generic [ref=e857]: mine = chunks_for(rank, world, SEQ)
                - generic [ref=e858]: k_full = [torch.zeros(SEQ // world, DIM) for _ in range(world)]
                - generic [ref=e859]: v_full = [torch.zeros(SEQ // world, DIM) for _ in range(world)]

                - generic [ref=e533]: c = json.load(open(hf_hub_download(repo, "config.json")))
                - generic [ref=e534]: configs[name] = c
                - generic [ref=e535]: f, _ = formula(c)
                - generic [ref=e536]: n = counted(c)
                - generic [ref=e537]: "print(f\"{name:<5} {c['num_hidden_layers']:>6} {c['hidden_size']:>7} {c['intermediate_size']:>6} \""
                - generic [ref=e538]: "f\"{c['num_attention_heads']:>6} {c['num_key_value_heads']:>3} {c['vocab_size']:>6} \""
                - generic [ref=e539]: "f\"{f / 1e9:>13.3f} {n / 1e9:>17.3f} {f == n}\")"
                - generic [ref=e541]: big = formula(configs["405B"])[0]
                - generic [ref=e542]: print()
                - generic [ref=e543]: "print(f\"405B parameters: {big:,}\")"
                - generic [ref=e544]: "print(f\"405B model states at 16 bytes per parameter: {big * 16 / 1e12:.2f} TB\")"
                - generic [ref=e545]: "print(f\"80 GB cards needed just for those states: {int(big * 16 / 80e9) + 1}\")"
                - generic [ref=e546]: paper_vocab = dict(configs["405B"], vocab_size=128000)
                - generic [ref=e547]: "print(f\"with the paper's rounded vocabulary of 128,000: {formula(paper_vocab)[0]:,}\")"
              - paragraph [ref=e548]:
                - strong [ref=e549]: Reading the output.
                - text: The formula and the library agree to the last digit on all three sizes. The 405B model has 405,853,388,800 parameters, so 16 bytes each is 6.49 TB. That needs at least 82 cards of 80 GB for model state alone. The paper's Table 3 says the vocabulary is 128,000; the real config says 128,256. That difference moves the total by only 8.4 million parameters, 0.002 per cent.
              - paragraph [ref=e550]:
                - strong [ref=e551]: Line by line.
              - list [ref=e552]:
                - listitem [ref=e553]:
                  - code [ref=e554]: with torch.device("meta")
                  - text: builds the model with shapes but no storage, so counting parameters is instant.
                - listitem [ref=e555]:
                  - code [ref=e556]: kv_dim
                  - text: "is the width of the key and value projections: with 8 key-value heads and 128 query heads it is one sixteenth of"
                  - code [ref=e557]: hidden_size
                  - text: .
                - listitem [ref=e558]:
                  - code [ref=e559]: 2 * vocab_size * hidden_size
                  - text: counts the input embedding and the separate output head, because
                  - code [ref=e560]: tie_word_embeddings
                  - text: is false.
              - heading [level=3] [ref=e561]:
                - text: 2. Check the layout and the model state per GPU
                - link "Direct link to 2. Check the layout and the model state per GPU" [ref=e562] [cursor=pointer]:
                  - /url: "#2-check-the-layout-and-the-model-state-per-gpu"
                  - text: "#"
              - paragraph [ref=e563]: We check that Table 4's rows multiply out, then compute per-GPU model state for each ZeRO stage, first for the 70B worked example and then for the 405B layout.
              - code [ref=e567]:
                - generic [ref=e568]: import json
                - generic [ref=e569]: import os
                - generic [ref=e571]: os.environ["HF_HUB_DISABLE_PROGRESS_BARS"] = "1"
                - generic [ref=e572]: from huggingface_hub import hf_hub_download
                - generic [ref=e574]: GB = 1e9
                - generic [ref=e577]: "def load(repo):"
                - generic [ref=e578]: return json.load(open(hf_hub_download(repo, "config.json")))
                - generic [ref=e581]: "def layer_params(c):"
                - generic [ref=e582]: h = c["hidden_size"]
                - generic [ref=e583]: kv_dim = h * c["num_key_value_heads"] // c["num_attention_heads"]
                - generic [ref=e584]: return 2 * h * h + 2 * h * kv_dim + 3 * h * c["intermediate_size"] + 2 * h
                - generic [ref=e587]: "def params(c):"
                - generic [ref=e588]: return 2 * c["vocab_size"] * c["hidden_size"] + c["num_hidden_layers"] * layer_params(c) + c["hidden_size"]
                - generic [ref=e591]: "def states(c, t, p, d, zero):"
                - generic [ref=e592]: n = params(c)
                - generic [ref=e593]: weights, grads, opt = 2 * n / (t * p), 2 * n / (t * p), 12 * n / (t * p)
                - generic [ref=e594]: "if zero >= 1:"

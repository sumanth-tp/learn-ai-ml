                    - cell "Micro-batch" [ref=e270]
                    - cell "A slice of the batch that is pushed through the model on its own" [ref=e271]
                    - cell "1 sequence of 8,192 tokens" [ref=e272]
                  - row [ref=e273]:
                    - cell "Bubble" [ref=e274]
                    - cell "Time a GPU sits idle while a pipeline fills and drains" [ref=e275]
                    - cell "The last stage waits for the first" [ref=e276]
                  - row [ref=e277]:
                    - cell "MFU (model FLOPs utilisation)" [ref=e278]
                    - cell "Useful arithmetic done, as a share of what the hardware could do" [ref=e279]
                    - cell "Llama 3 reports 38 to 43 per cent" [ref=e280]
              - heading [level=2] [ref=e281]:
                - text: The idea in plain words
                - link "Direct link to The idea in plain words" [ref=e282] [cursor=pointer]:
                  - /url: "#the-idea-in-plain-words"
                  - text: "#"
              - paragraph [ref=e283]: "Start with the smallest case you can do by hand. A model with 1 billion parameters needs about 16 GB while training with the Adam optimiser: 2 bytes for the weight, 2 for its gradient and 12 for the optimiser's copies (explained below). One 80 GB card holds it easily. Now take a model with 10 billion parameters. It needs 160 GB, so it no longer fits on one card, however fast the card is."
              - paragraph [ref=e284]:
                - text: You have two broad remedies.
                - strong [ref=e285]: Split the model
                - text: so each GPU holds only part of it. Or
                - strong [ref=e286]: split the examples
                - text: so many GPUs work at once, each with a full copy. Splitting the model fixes the memory wall. Splitting the examples fixes the speed wall but not the memory wall, because every copy is still full size.
              - paragraph [ref=e287]: Real runs need both, and there is more than one way to split a model. You can cut each weight matrix in half, cut the stack of layers into stages, cut a long input into pieces, or give different experts to different GPUs. That makes five axes in all.
              - table [ref=e288]:
                - rowgroup [ref=e289]:
                  - row [ref=e290]:
                    - columnheader "Axis" [ref=e291]
                    - columnheader "What it splits" [ref=e292]
                    - columnheader "What it sends" [ref=e293]
                    - columnheader "Where it lives" [ref=e294]
                - rowgroup [ref=e295]:
                  - row [ref=e296]:
                    - cell "Data parallel (DP)" [ref=e297]
                    - cell "The batch of examples" [ref=e298]
                    - cell "Gradients, once per step" [ref=e299]
                    - cell "Across servers" [ref=e300]
                  - row [ref=e301]:
                    - cell "Tensor parallel (TP)" [ref=e302]
                    - cell "Each weight matrix inside a layer" [ref=e303]
                    - cell "Partial results, several times in every layer" [ref=e304]
                    - cell "Inside one server" [ref=e305]
                  - row [ref=e306]:
                    - cell "Pipeline parallel (PP)" [ref=e307]
                    - cell "The stack of layers into stages" [ref=e308]
                    - cell "Activations between neighbouring stages" [ref=e309]
                    - cell "Across servers" [ref=e310]
                  - row [ref=e311]:
                    - cell "Context parallel (CP)" [ref=e312]
                    - cell "The tokens of one long sequence" [ref=e313]
                    - cell "Keys and values" [ref=e314]
                    - cell "Where inputs are very long" [ref=e315]
                  - row [ref=e316]:
                    - cell "Expert parallel (EP)" [ref=e317]
                    - cell "The experts of a mixture-of-experts layer" [ref=e318]
                    - cell "Tokens, to the expert that will process them" [ref=e319]
                    - cell "Only for MoE models" [ref=e320]
              - paragraph [ref=e321]: "No axis is free. Data parallelism keeps a full copy of the model on every replica, so on its own it cannot help when the model does not fit. Tensor parallelism makes the model fit but talks inside every layer. Pipeline parallelism talks little but leaves GPUs idle while the line fills. A real run combines them: data, tensor and pipeline together are called 3D parallelism, and adding context parallelism gives 4D."
              - 'figure "Look at the bottom row first: it says which wall you are hitting. The columns above say which cut removes it. Expert parallelism returns in chapter 4, and sharded data parallelism (ZeRO and FSDP) is chapter 2." [ref=e322]':
                - generic [ref=e323]:
                  - 'button "Enlarge: Five columns, one per parallelism axis, each saying what it splits and what it communicates, above three cards that map a memory or speed problem to the axis that fixes it" [ref=e324]':
                    - img "Five columns, one per parallelism axis, each saying what it splits and what it communicates, above three cards that map a memory or speed problem to the axis that fixes it" [ref=e325]
                  - button "View infographic larger" [ref=e326] [cursor=pointer]:
                    - generic [ref=e329]: Expand
              - heading [level=2] [ref=e331]:
                - text: Worked example, step by step
                - link "Direct link to Worked example, step by step" [ref=e332] [cursor=pointer]:
                  - /url: "#worked-example-step-by-step"
                  - text: "#"
              - paragraph [ref=e333]: We will fit a 70-billion-parameter model on 64 GPUs, using tensor parallel 8, pipeline parallel 2 and data parallel 4 (8 x 2 x 4 = 64). The code in block 2 prints every number below.
              - list [ref=e334]:
                - listitem [ref=e335]:
                  - strong [ref=e336]: Count the parameters.
                  - text: The config of Llama 3.1 70B says 80 layers, hidden size 8,192, feed-forward size 28,672, 64 attention heads, 8 key-value heads and a vocabulary of 128,256. One layer holds 855,654,400 parameters. Eighty layers give 68,452,352,000. The input and output embeddings add 2,101,346,304, and the final norm adds 8,192. The total is 70,553,706,496.
                - listitem [ref=e337]:
                  - strong [ref=e338]: Count the bytes.
                  - text: "Plain mixed-precision training stores a 2-byte weight, a 2-byte gradient and 12 bytes of optimiser state per parameter: a 4-byte master copy of the weight plus Adam's two running averages (4 bytes each). That is 16 bytes. 70.55 billion x 16 = 1,128.9 GB."
                - listitem [ref=e339]:
                  - strong [ref=e340]: Cut across the model-parallel GPUs.
                  - text: Tensor 8 x pipeline 2 means 16 GPUs share one copy of the model. 1,128.9 / 16 = 70.55 GB each. That is the "ZeRO stage 0" row, with no sharding across replicas. It is nearly the whole of an 80 GB card before a single activation.
                - listitem [ref=e341]:
                  - strong [ref=e342]: Shard the optimiser state across the 4 replicas (ZeRO stage 1).
                  - text: The optimiser share is 12 x 70.55 / 16 = 52.92 GB. Divide by 4 and you get 13.23 GB. The total falls to 8.82 + 8.82 + 13.23 = 30.87 GB.
                - listitem [ref=e343]:
                  - strong [ref=e344]: Shard the gradients too (stage 2).
                  - text: Gradients drop from 8.82 GB to 2.20 GB. Total 24.25 GB.
                - listitem [ref=e345]:
                  - strong [ref=e346]: Shard the weights too (stage 3).
                  - text: Weights drop to 8.82 / 4 = 2.21 GB, plus 0.21 GB for the one layer that is gathered while it is being used. Total 17.85 GB.
              - figure "Read the left column top to bottom, then watch the purple optimiser bar shrink in the right panel. Activations come on top of these bars." [ref=e347]:
                - generic [ref=e348]:
                  - 'button "Enlarge: Four steps that count a 70B model''s parameters, multiply by 16 bytes, divide by 16 model-parallel GPUs and then shard across 4 replicas, beside bars of per-GPU memory for ZeRO stages 0 to 3 against an 80 GB marker" [ref=e349]':
                    - img "Four steps that count a 70B model's parameters, multiply by 16 bytes, divide by 16 model-parallel GPUs and then shard across 4 replicas, beside bars of per-GPU memory for ZeRO stages 0 to 3 against an 80 GB marker" [ref=e350]
                  - button "View infographic larger" [ref=e351] [cursor=pointer]:
                    - generic [ref=e354]: Expand
              - paragraph [ref=e356]: Notice what moved. Tensor and pipeline parallelism divide all three parts equally. Sharding across replicas, which chapter 2 develops, divides them one at a time. That is the whole memory story for the model itself. The remaining part, activations, behaves differently, and the next section covers it.
              - heading [level=2] [ref=e357]:
                - text: How it works
                - link "Direct link to How it works" [ref=e358] [cursor=pointer]:
                  - /url: "#how-it-works"
                  - text: "#"
              - heading [level=3] [ref=e359]:
                - text: What fills a GPU's memory?
                - link "Direct link to What fills a GPU's memory?" [ref=e360] [cursor=pointer]:
                  - /url: "#what-fills-a-gpus-memory"
                  - text: "#"
              - paragraph [ref=e361]: "Training memory has four parts. The first three belong to the model: weights, gradients and optimiser state. They scale with the number of parameters, and the 16-bytes-per-parameter figure holds for the common recipe (bf16, a 2-byte format with a wide range, for weights and gradients, and fp32 master weights and Adam moments). The Hugging Face Ultra-Scale Playbook gives the same 2 + 2 + 4 + 8 accounting. The fourth part, activations, scales with the batch and the sequence length instead."
              - paragraph [ref=e362]:
                - text: The Megatron-LM team's analysis of activations gives the bytes per layer for sequence length
                - code [ref=e363]: s
                - text: ", micro-batch"
                - code [ref=e364]: b
                - text: ", hidden size"
                - code [ref=e365]: h
                - text: ","
                - code [ref=e366]: a
                - text: attention heads and tensor-parallel size
                - code [ref=e367]: t
                - text: ":"
              - table [ref=e368]:
                - rowgroup [ref=e369]:
                  - row [ref=e370]:
                    - columnheader "Setting" [ref=e371]
                    - columnheader "Activation bytes per layer" [ref=e372]
                - rowgroup [ref=e373]:
                  - row [ref=e374]:
                    - cell "Nothing saved or shared" [ref=e375]
                    - cell [ref=e376]:
                      - code [ref=e377]: sbh(34 + 5as/h)
                  - row [ref=e378]:
                    - cell "Tensor parallel" [ref=e379]
                    - cell [ref=e380]:
                      - code [ref=e381]: sbh(10 + 24/t + 5as/(ht))
                  - row [ref=e382]:
                    - cell "Tensor + sequence parallel" [ref=e383]
                    - cell [ref=e384]:
                      - code [ref=e385]: sbh/t (34 + 5as/h)
                  - row [ref=e386]:
                    - cell "Tensor + sequence parallel + selective recomputation" [ref=e387]
                    - cell [ref=e388]:
                      - code [ref=e389]: 34 sbh / t
                  - row [ref=e390]:
                    - cell "Full recomputation" [ref=e391]
                    - cell [ref=e392]:
                      - code [ref=e393]: 2 sbh
              - paragraph [ref=e394]:
                - text: "In words: the"
                - code [ref=e395]: 5as/h
                - text: term is the attention score matrices, which grow with the square of the sequence length.
                - strong [ref=e396]: Selective recomputation
                - text: throws those matrices away and recomputes them in the backward pass, because they are cheap to recompute and large to store.
                - strong [ref=e397]: Sequence parallelism
                - text: (not the same as context parallelism) splits layer norm and dropout along the tokens, because they work on each token separately and need no copy of the whole sequence on every tensor-parallel GPU.
              - paragraph [ref=e398]:
                - text: The first pipeline stage holds the activations of
                - code [ref=e399]: p
                - text: micro-batches in flight, and each stage owns
                - code [ref=e400]: L/p
                - text: layers. So it holds the equivalent of all
                - code [ref=e401]: L
                - text: layers at once, whatever
                - code [ref=e402]: p
                - text: is. That is why block 3 multiplies the per-layer figure by the full layer count.
              - heading [level=3] [ref=e403]:
                - text: What does tensor parallelism cost?
                - link "Direct link to What does tensor parallelism cost?" [ref=e404] [cursor=pointer]:
                  - /url: "#what-does-tensor-parallelism-cost"
                  - text: "#"
              - paragraph [ref=e405]: A transformer layer is cut so that each GPU holds a slice of the attention heads and a column slice of each feed-forward matrix. The Megatron-LM paper reports only two all-reduces in the forward pass and two in the backward pass per layer. That sounds small, but it is four collective operations in every layer, thousands of times per step.
              - paragraph [ref=e406]: "Block 4 turns that into bytes for the Llama 3 405B layout. A GPU sends about 237 GB per step for tensor parallelism, against about 12.6 GB for data parallelism and 8.6 GB for pipeline parallelism. That ratio is why the Megatron follow-up paper says to use tensor parallelism up to the number of GPUs in a server and only then add pipeline parallelism. The Ultra-Scale Playbook measured the cliff: it saw \"significant drops\" going from TP 8 to TP 16, because the second group of eight GPUs sits in another server on a slower link. Each GPU needs at least one attention head to work on, so the tensor-parallel size has an upper limit set by the head count."
              - paragraph [ref=e407]:
                - text: Block 5 shows the mechanism on a real
                - code [ref=e408]: LlamaMLP
                - text: . Each rank holds half of the gate and up columns and half of the down rows. Alone, each rank's answer is wrong by about 0.2. After one all-reduce, the sum matches the unsplit layer to 1.34e-07.
              - heading [level=3] [ref=e409]:
                - text: What does pipeline parallelism cost?
                - link "Direct link to What does pipeline parallelism cost?" [ref=e410] [cursor=pointer]:
                  - /url: "#what-does-pipeline-parallelism-cost"
                  - text: "#"
              - paragraph [ref=e411]:
                - text: "Think of a laundrette line: wash, dry, fold. While the first load is in the dryer, the folder has nothing to do. That idle time is the"
                - strong [ref=e412]: bubble
                - text: . With
                - code [ref=e413]: p
                - text: stages and
                - code [ref=e414]: m
                - text: micro-batches in the plain schedule, the idle fraction is
                - code [ref=e415]: (p - 1)/(m + p - 1)
                - text: ". In words: more micro-batches mean the line stays full for longer, so the idle ends are a smaller part of the whole."
              - paragraph [ref=e416]:
                - text: With 16 stages and 16 micro-batches, nearly half the time is idle (15/31 = 0.484). With 128 micro-batches it is 0.105.
                - strong [ref=e417]: Interleaved schedules
                - text: give each GPU several small, non-adjacent chunks of layers, which cuts the bubble roughly by the number of chunks
                - code [ref=e418]: V
                - text: . Llama 3 uses one and writes the overall ratio as
                - code [ref=e419]: (PP - 1)/(V x M)
                - text: . The paper does not give
                - code [ref=e420]: V
                - text: or
                - code [ref=e421]: M
                - text: ", so block 4 shows"
                - code [ref=e422]: V = 4
                - text: as an illustration only.
              - heading [level=3] [ref=e423]:
                - text: What does context parallelism do for long inputs?
                - link "Direct link to What does context parallelism do for long inputs?" [ref=e424] [cursor=pointer]:
                  - /url: "#what-does-context-parallelism-do-for-long-inputs"
                  - text: "#"
              - paragraph [ref=e425]: "When inputs reach 128K tokens, even one sequence's activations do not fit. The fix is to split the tokens. Llama 3 uses an all-gather of keys and values: each context-parallel rank keeps its own queries, gathers everyone's keys and values, and computes attention for its own chunk. The paper notes this works because grouped-query attention makes keys and values much smaller than queries."
              - paragraph [ref=e426]:
                - text: Causal attention makes the work lopsided, because a late token attends to many more tokens than an early one. So the paper cuts the sequence into
                - code [ref=e427]: 2 x CP
                - text: chunks and gives rank
                - code [ref=e428]: i
                - text: chunks
                - code [ref=e429]: i
                - text: and
                - code [ref=e430]: 2 x CP - 1 - i
                - text: . Block 6 runs this on two processes and counts the work.
              - heading [level=3] [ref=e431]:
                - text: How do the degrees fit together?
                - link "Direct link to How do the degrees fit together?" [ref=e432] [cursor=pointer]:
                  - /url: "#how-do-the-degrees-fit-together"
                  - text: "#"
              - paragraph [ref=e433]:
                - text: "The product of the degrees is the number of GPUs:"
                - code [ref=e434]: TP x CP x PP x DP
                - text: . The Llama 3 paper orders the dimensions as [TP, CP, PP, DP], innermost to outermost, so the most talkative axis gets the best network. The Ultra-Scale Playbook turns this into a decision order. First fit one model instance (under 10B parameters, one technique such as ZeRO-3 over 8 GPUs may do), then reach the target batch size with data parallelism, then tune throughput. For 10B to 100B parameters it suggests TP 8 with pipeline parallelism or with ZeRO-3. At 512 GPUs and more, pure data parallelism becomes communication-bound. At 1,024 GPUs and more, it suggests TP 8 with ZeRO-2 and pipeline parallelism. It also says you must run experiments on your own cluster.
              - paragraph [ref=e435]:
                - text: "Expert parallelism, the fifth axis, only applies to mixture-of-experts models and gets its own chapter:"
                - link "mixture of experts" [ref=e436] [cursor=pointer]:
                  - /url: /docs/llm-engineering/mixture-of-experts
                - text: .
              - heading [level=2] [ref=e437]:
                - text: A real system that works this way
                - link "Direct link to A real system that works this way" [ref=e438] [cursor=pointer]:
                  - /url: "#a-real-system-that-works-this-way"
                  - text: "#"
              - paragraph [ref=e439]: "Meta's Llama 3 paper (v3, 23 November 2024) describes the largest open recipe. The 405B model has 126 layers, hidden size 16,384, 128 attention heads and 8 key-value heads. It trained on up to 16,384 H100 GPUs with 80 GB of HBM each, using 4D parallelism. Table 4 of the paper gives three configurations, each with 16M tokens per batch:"
              - table [ref=e440]:
                - rowgroup [ref=e441]:
                  - row [ref=e442]:
                    - columnheader "GPUs" [ref=e443]
                    - columnheader "TP" [ref=e444]
                    - columnheader "CP" [ref=e445]
                    - columnheader "PP" [ref=e446]
                    - columnheader "DP" [ref=e447]
                    - columnheader "Sequence length" [ref=e448]
                    - columnheader "BF16 MFU" [ref=e449]
                - rowgroup [ref=e450]:
                  - row [ref=e451]:
                    - cell "8,192" [ref=e452]
                    - cell "8" [ref=e453]
                    - cell "1" [ref=e454]
                    - cell "16" [ref=e455]
                    - cell "64" [ref=e456]
                    - cell "8,192" [ref=e457]
                    - cell "43%" [ref=e458]
                  - row [ref=e459]:
                    - cell "16,384" [ref=e460]
                    - cell "8" [ref=e461]
                    - cell "1" [ref=e462]
                    - cell "16" [ref=e463]
                    - cell "128" [ref=e464]
                    - cell "8,192" [ref=e465]
                    - cell "41%" [ref=e466]
                  - row [ref=e467]:
                    - cell "16,384" [ref=e468]
                    - cell "8" [ref=e469]
                    - cell "16" [ref=e470]
                    - cell "16" [ref=e471]
                    - cell "8" [ref=e472]
                    - cell "131,072" [ref=e473]
                    - cell "38%" [ref=e474]
              - paragraph [ref=e475]: The paper also says its FSDP shards optimiser state and gradients but does not reshard the weights after the forward pass, which avoids an extra all-gather in the backward pass. In ZeRO terms the weights then behave as in stage 2 during a step, because the full weights stay in memory from the forward pass until the backward pass is done with them. It pre-trained at 8K tokens without activation checkpointing, after removing the first and last transformer layer from the first and last pipeline stages to balance the load.
              - 'figure "Start with the green box at the bottom right: states plus activations come to 78.6 GB, just under the 80 GB card. Every figure is printed by blocks 2 and 3." [ref=e476]':
                - generic [ref=e477]:
                  - 'button "Enlarge: The 16,384 GPU Llama 3 405B layout as nested data, pipeline and tensor groups, with a table of model state per ZeRO stage and a table of activation memory per saving that sums to 78.6 GB" [ref=e478]':
                    - img "The 16,384 GPU Llama 3 405B layout as nested data, pipeline and tensor groups, with a table of model state per ZeRO stage and a table of activation memory per saving that sums to 78.6 GB" [ref=e479]
                  - button "View infographic larger" [ref=e480] [cursor=pointer]:
                    - generic [ref=e483]: Expand
              - heading [level=2] [ref=e485]:
                - text: Code you can run
                - link "Direct link to Code you can run" [ref=e486] [cursor=pointer]:
                  - /url: "#code-you-can-run"
                  - text: "#"
              - paragraph [ref=e487]: Six blocks. Blocks 1 to 4 read real configs from the Hub and do arithmetic. Blocks 5 and 6 start two real processes with PyTorch's gloo backend on the CPU. Everything runs in about a minute after the config downloads.
              - heading [level=3] [ref=e488]:
                - text: 1. Count parameters from real configs
                - link "Direct link to 1. Count parameters from real configs" [ref=e489] [cursor=pointer]:
                  - /url: "#1-count-parameters-from-real-configs"
                  - text: "#"
              - paragraph [ref=e490]:
                - text: We read three Llama 3.1 configs from the Hub, count the parameters with a formula, and check the formula against the real
                - code [ref=e491]: LlamaForCausalLM
                - text: built on the
                - code [ref=e492]: meta
                - text: device, which allocates no memory even for 405B. The 405B config comes from the Hermes 3 fine-tune, which keeps the architecture of Llama 3.1 405B, because Meta's own repository is gated.
              - code [ref=e496]:
                - generic [ref=e497]: import json
                - generic [ref=e498]: import os
                - generic [ref=e500]: os.environ["HF_HUB_DISABLE_PROGRESS_BARS"] = "1"
                - generic [ref=e501]: import torch
                - generic [ref=e502]: from huggingface_hub import hf_hub_download
                - generic [ref=e503]: from transformers import LlamaConfig, LlamaForCausalLM
                - generic [ref=e505]: "REPOS = {"
                - generic [ref=e506]: "\"8B\": \"NousResearch/Meta-Llama-3.1-8B\","
                - generic [ref=e507]: "\"70B\": \"NousResearch/Meta-Llama-3.1-70B\","
                - generic [ref=e508]: "\"405B\": \"NousResearch/Hermes-3-Llama-3.1-405B\","
                - generic [ref=e509]: "}"
                - generic [ref=e512]: "def formula(c):"
                - generic [ref=e513]: kv_dim = c["hidden_size"] * c["num_key_value_heads"] // c["num_attention_heads"]
                - generic [ref=e514]: attn = 2 * c["hidden_size"] ** 2 + 2 * c["hidden_size"] * kv_dim
                - generic [ref=e515]: mlp = 3 * c["hidden_size"] * c["intermediate_size"]
                - generic [ref=e516]: per_layer = attn + mlp + 2 * c["hidden_size"]
                - generic [ref=e517]: total = 2 * c["vocab_size"] * c["hidden_size"] + c["num_hidden_layers"] * per_layer + c["hidden_size"]
                - generic [ref=e518]: return total, per_layer
                - generic [ref=e521]: "def counted(c):"
                - generic [ref=e522]: "cfg = LlamaConfig(**{k: c[k] for k in ("
                - generic [ref=e523]: "\"vocab_size\", \"hidden_size\", \"intermediate_size\", \"num_hidden_layers\","
                - generic [ref=e524]: "\"num_attention_heads\", \"num_key_value_heads\", \"tie_word_embeddings\")})"
                - generic [ref=e525]: "with torch.device(\"meta\"):"

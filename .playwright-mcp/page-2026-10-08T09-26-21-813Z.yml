              - heading "Parallelism Strategies for LLMs" [level=1] [ref=e202]
              - paragraph [ref=e203]:
                - strong [ref=e204]: In one line.
                - text: A large language model is trained by cutting the job along several axes at once (examples, weight matrices, layers, tokens, experts), and the craft is choosing the cuts so that what must fit in one GPU's memory fits and the chatty communication stays on the fastest links.
              - generic [ref=e205]:
                - generic [ref=e206]: Before you start
                - list [ref=e211]:
                  - listitem [ref=e212]:
                    - strong [ref=e213]: You should already know
                    - text: what a training step is and why workers average gradients (
                    - link "data parallelism" [ref=e214] [cursor=pointer]:
                      - /url: /docs/mlops/distributed/data-parallelism
                    - text: ), how a network can be cut by layer or by matrix (
                    - link "model parallelism" [ref=e215] [cursor=pointer]:
                      - /url: /docs/mlops/distributed/model-parallelism
                    - text: ), and why plain training costs 16 bytes per parameter (
                    - link "why distribute machine learning" [ref=e216] [cursor=pointer]:
                      - /url: /docs/mlops/distributed/why-distribute-machine-learning
                    - text: ).
                  - listitem [ref=e217]:
                    - strong [ref=e218]: You should be able to picture
                    - text: "one decoder layer: attention, then a feed-forward block ("
                    - link "transformer decoder architecture" [ref=e219] [cursor=pointer]:
                      - /url: /docs/theory/dnn/transformer-decoder-architecture
                    - text: ).
                  - listitem [ref=e220]:
                    - strong [ref=e221]: "Reading time:"
                    - text: about 40 minutes, plus a few minutes to run the code.
                  - listitem [ref=e222]:
                    - strong [ref=e223]: After this chapter you can
                    - text: work out how much memory one GPU needs for a given layout, say which of the five axes fixes which problem, and read a published training configuration such as Llama 3's.
              - generic [ref=e224]:
                - generic [ref=e225]: Not from a lecture
                - paragraph [ref=e230]:
                  - text: This chapter was written for this site from the sources listed under Go deeper. Model sizes come from real
                  - code [ref=e231]: config.json
                  - text: "files read from the Hugging Face Hub by the code below. Versions used: Python 3.14, PyTorch 2.14.1 (CPU), Transformers 5.18.0. Sources were opened on 7 October 2026."
              - heading [level=2] [ref=e232]:
                - text: In 30 seconds
                - link "Direct link to In 30 seconds" [ref=e233] [cursor=pointer]:
                  - /url: "#in-30-seconds"
                  - text: "#"
              - paragraph [ref=e234]: A modern language model has hundreds of billions of numbers to store, and every number needs several copies while it trains. No single graphics card (GPU) can hold that. So we cut the work up and spread it over thousands of GPUs.
              - paragraph [ref=e235]: Think of printing a huge encyclopaedia. You can add presses that each print different copies, cut every plate in half so two presses share it, or set up an assembly line where each press does some chapters. Each choice solves one problem and makes a new one. This chapter names the five cuts and counts what each costs.
              - heading [level=2] [ref=e236]:
                - text: Words you will meet
                - link "Direct link to Words you will meet" [ref=e237] [cursor=pointer]:
                  - /url: "#words-you-will-meet"
                  - text: "#"
              - table [ref=e238]:
                - rowgroup [ref=e239]:
                  - row [ref=e240]:
                    - columnheader "Term" [ref=e241]

                - generic [ref=e833]: scores = q @ k.T / DIM**0.5
                - generic [ref=e834]: scores = scores.masked_fill(k_pos[None, :] > q_pos[:, None], float("-inf"))
                - generic [ref=e835]: return torch.softmax(scores, dim=-1) @ v
                - generic [ref=e838]: "def chunks_for(rank, world, seq):"
                - generic [ref=e839]: size = seq // (2 * world)
                - generic [ref=e840]: mine = [rank, 2 * world - 1 - rank]
                - generic [ref=e841]: return torch.cat([torch.arange(c * size, (c + 1) * size) for c in mine])
                - generic [ref=e844]: "def pairs(positions):"
                - generic [ref=e845]: return int((positions + 1).sum())
                - generic [ref=e848]: "def worker(rank, world, port):"
                - generic [ref=e849]: os.environ["MASTER_ADDR"] = "127.0.0.1"
                - generic [ref=e850]: os.environ["MASTER_PORT"] = str(port)

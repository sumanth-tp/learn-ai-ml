n Mono',monospace" font-size="15" font-weight="700" fill="#0b7285">What the harness measures</text><text xml:space="preserve" x="642" y="661.0" text-anchor="start" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" fill="#343a40">Attack success rate per category, each attack</text><text xml:space="preserve" x="642" y="679.8" text-anchor="start" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" fill="#343a40">tried 10 times, scored by code that looks for the</text><text xml:space="preserve" x="642" y="698.7" text-anchor="start" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" fill="#343a40">leaked key, the bad tool call or the planted fact.</text></svg>

" font-size="16" font-weight="700" fill="#5f3dc4">DP-SGD against a membership attack (mean of 8 seeds)</text><rect x="620" y="140" width="620" height="38" rx="6" fill="#7048e8"/><text xml:space="preserve" x="628" y="160.0" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" font-weight="700" fill="#ffffff">model</text><text xml:space="preserve" x="868" y="160.0" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" font-weight="700" fill="#ffffff">test acc</text><text xml:space="preserve" x="988" y="160.0" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" font-weight="700" fill="#ffffff">attack AUC</text><text xml:space="preserve" x="1128" y="160.0" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" font-weight="700" fill="#ffffff">epsilon</text><line x1="620" y1="178" x2="1240" y2="178" stroke="#dee2e6"/><text xml:space="preserve" x="628" y="198.0" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" font-weight="400" fill="#343a40">plain training</text><text xml:space="preserve" x="868" y="198.0" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" font-weight="400" fill="#343a40">0.585</text><text xml:space="preserve" x="988" y="198.0" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" font-weight="400" fill="#343a40">0.865</text><text xml:space="preserve" x="1128" y="198.0" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" font-weight="400" fill="#343a40">none</text><line x1="620" y1="216" x2="1240" y2="216" stroke="#dee2e6"/><rect x="620" y="216" width="620" height="38" fill="#f3f0ff"/><text xml:space="preserve" x="628" y="236.0" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" font-weight="400" fill="#343a40">noise multiplier 0.5</text><text xml:space="preserve" x="868" y="236.0" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" font-weight="400" fill="#343a40">0.583</text><text xml:space="preserve" x="988" y="236.0" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" font-weight="400" fill="#343a40">0.830</text><text xml:space="preserve" x="1128" y="236.0" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" font-weight="400" fill="#343a40">136.05</text><line x1="620" y1="254" x2="1240" y2="254" stroke="#dee2e6"/><text xml:space="preserve" x="628" y="274.0" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" font-weight="400" fill="#343a40">noise multiplier 1.0</text><text xml:space="preserve" x="868" y="274.0" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" font-weight="400" fill="#343a40">0.571</text><text xml:space="preserve" x="988" y="274.0" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" font-weight="400" fill="#343a40">0.781</text><text xml:space="preserve" x="1128" y="274.0" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" font-weight="400" fill="#343a40">27.16</text><line x1="620" y1="292" x2="1240" y2="292" stroke="#dee2e6"/><rect x="620" y="292" width="620" height="38" fill="#f3f0ff"/><text xml:space="preserve" x="628" y="312.0" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" font-weight="400" fill="#343a40">noise multiplier 2.0</text><text xml:space="preserve" x="868" y="312.0" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" font-weight="400" fill="#343a40">0.552</text><text xml:space="preserve" x="988" y="312.0" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" font-weight="400" fill="#343a40">0.691</text><text xml:space="preserve" x="1128" y="312.0" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" font-weight="400" fill="#343a40">8.94</text><line x1="620" y1="330" x2="1240" y2="330" stroke="#dee2e6"/><text xml:space="preserve" x="628" y="350.0" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" font-weight="400" fill="#343a40">noise multiplier 4.0</text><text xml:space="preserve" x="868" y="350.0" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" font-weight="400" fill="#343a40">0.528</text><text xml:space="preserve" x="988" y="350.0" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" font-weight="400" fill="#343a40">0.614</text><text xml:space="preserve" x="1128" y="350.0" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" font-weight="400" fill="#343a40">3.74</text><line x1="620" y1="368" x2="1240" y2="368" stroke="#dee2e6"/><text xml:space="preserve" x="930" y="386.0" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" font-weight="400" fill="#5f3dc4" font-style="italic">100 rows, 200 features, 1,000 steps, delta 1e-5</text><rect x="20" y="420" width="400" height="130" rx="9" fill="#fff4e6" stroke="#e8590c" stroke-width="1.6"/><rect x="19.5" y="419.0" width="400.5" height="128.7" rx="10" fill="none" stroke="#e8590c" stroke-width="1.1" stroke-opacity="0.45"/><text xml:space="preserve" x="32" y="451.8" text-anchor="start" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="14" font-weight="700" fill="#c2410c">Composition adds epsilons</text><text xml:space="preserve" x="32" y="475.1" text-anchor="start" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" fill="#343a40">One count at epsilon 0.1 has error 9.23.</text><text xml:space="preserve" x="32" y="492.5" text-anchor="start" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" fill="#343a40">Ten releases cost epsilon 1.0 and a</text><text xml:space="preserve" x="32" y="509.9" text-anchor="start" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" fill="#343a40">thousand cost 100.0 (error 0.34): the</text><text xml:space="preserve" x="32" y="527.3" text-anchor="start" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" fill="#343a40">average removes the noise.</text><rect x="440" y="420" width="400" height="130" rx="9" fill="#ebfbee" stroke="#2f9e44" stroke-width="1.6"/><rect x="440.1" y="419.6" width="398.7" height="130.0" rx="10" fill="none" stroke="#2f9e44" stroke-width="1.1" stroke-opacity="0.45"/><text xml:space="preserve" x="452" y="451.8" text-anchor="start" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="14" font-weight="700" fill="#2b8a3e">The guarantee</text><text xml:space="preserve" x="452" y="475.1" text-anchor="start" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" fill="#343a40">Adding or removing one person changes</text><text xml:space="preserve" x="452" y="492.5" text-anchor="start" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" fill="#343a40">any output probability by at most a</text><text xml:space="preserve" x="452" y="509.9" text-anchor="start" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" fill="#343a40">factor e^epsilon: 1.649 at epsilon 0.5,</text><text xml:space="preserve" x="452" y="527.3" text-anchor="start" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" fill="#343a40">1/1.649 = 0.607 the other way.</text><rect x="860" y="420" width="400" height="130" rx="9" fill="#fff5f5" stroke="#e03131" stroke-width="1.6"/><rect x="858.6" y="419.8" width="398.7" height="128.8" rx="10" fill="none" stroke="#e03131" stroke-width="1.1" stroke-opacity="0.45"/><text xml:space="preserve" x="872" y="451.8" text-anchor="start" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="14" font-weight="700" fill="#c92a2a">Privacy costs accuracy</text><text xml:space="preserve" x="872" y="475.1" text-anchor="start" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" fill="#343a40">At 100 rows, noise multiplier 4 cuts the</text><text xml:space="preserve" x="872" y="492.5" text-anchor="start" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" fill="#343a40">attack AUC from 0.865 to 0.614 and test</text><text xml:space="preserve" x="872" y="509.9" text-anchor="start" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" fill="#343a40">accuracy from 0.585 to 0.528. Small data</text><text xml:space="preserve" x="872" y="527.3" text-anchor="start" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" fill="#343a40">makes privacy expensive.</text><rect x="20" y="575" width="1240" height="120" rx="9" fill="#fff9db" stroke="#e8a300" stroke-width="1.6"/><rect x="19.8" y="576.0" width="1238.9" height="119.2" rx="10" fill="none" stroke="#e8a300" stroke-width="1.1" stroke-opacity="0.45"/><text xml:space="preserve" x="640.0" y="619.1" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="14" font-weight="700" fill="#b35c00">Epsilon is a bound, the attack AUC is one measurement</text><text xml:space="preserve" x="640.0" y="642.5" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" fill="#343a40">Epsilon 136 is a weak guarantee and still cut the attack from 0.865 to 0.830. A low attack AUC does not prove privacy: a stronger attack</text><text xml:space="preserve" x="640.0" y="659.9" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" fill="#343a40">may do better, which is why the epsilon accountant matters. Carlini and colleagues extracted hundreds of verbatim training sequences from GPT-2 with queries alone.</text></svg>

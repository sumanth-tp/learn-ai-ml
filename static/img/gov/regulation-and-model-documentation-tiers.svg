on Mono',monospace" font-size="11" font-weight="700" fill="#5f3dc4">9 Caveats and recommendations</text><rect x="20" y="520" width="620" height="215" rx="14" fill="#ebfbee" fill-opacity="0.35" stroke="#2f9e44" stroke-width="2" stroke-dasharray="9 6"/><text xml:space="preserve" x="330.0" y="546" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="16" font-weight="700" fill="#2b8a3e">Audit trail: hash-chained log</text><rect x="40" y="565" width="580" height="70" rx="9" fill="#ebfbee" stroke="#2f9e44" stroke-width="1.6"/><rect x="40.1" y="563.7" width="578.7" height="69.1" rx="10" fill="none" stroke="#2f9e44" stroke-width="1.1" stroke-opacity="0.45"/><text xml:space="preserve" x="330.0" y="592.9" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="14" font-weight="700" fill="#2b8a3e">edit entry 2: verification fails at position 2</text><text xml:space="preserve" x="330.0" y="616.2" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" fill="#343a40">delete entry 1: fails at position 1</text><rect x="40" y="650" width="580" height="70" rx="9" fill="#fff5f5" stroke="#e03131" stroke-width="1.6"/><rect x="40.5" y="649.8" width="579.4" height="70.3" rx="10" fill="none" stroke="#e03131" stroke-width="1.1" stroke-opacity="0.45"/><text xml:space="preserve" x="330.0" y="677.9" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="14" font-weight="700" fill="#c92a2a">rewrite the last entry and recompute its hash: passes</text><text xml:space="preserve" x="330.0" y="701.2" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" fill="#343a40">only a copy of the previous head held elsewhere exposes it</text><rect x="660" y="575" width="620" height="160" rx="9" fill="#fff4e6" stroke="#e8590c" stroke-width="1.6"/><rect x="659.9" y="574.4" width="620.9" height="160.6" rx="10" fill="none" stroke="#e8590c" stroke-width="1.1" stroke-opacity="0.45"/><text xml:space="preserve" x="672" y="613.0" text-anchor="start" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="14" font-weight="700" fill="#c2410c">Deployers keep logs at least six months</text><text xml:space="preserve" x="672" y="636.4" text-anchor="start" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" fill="#343a40">Art 12 requires high-risk systems to record events;</text><text xml:space="preserve" x="672" y="653.8" text-anchor="start" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" fill="#343a40">Art 26(6) sets at least six months for deployers</text><text xml:space="preserve" x="672" y="671.2" text-anchor="start" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" fill="#343a40">and Art 19 the same for providers, unless other</text><text xml:space="preserve" x="672" y="688.6" text-anchor="start" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" fill="#343a40">law provides otherwise. Art 73: serious incidents</text><text xml:space="preserve" x="672" y="706.0" text-anchor="start" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" fill="#343a40">reported within 15 days (10 for a death, 2 for widespread).</text></svg>

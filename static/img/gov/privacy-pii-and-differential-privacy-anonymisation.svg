ains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" font-weight="400" fill="#343a40">card, no check</text><text xml:space="preserve" x="218" y="280.0" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" font-weight="400" fill="#343a40">0.488</text><text xml:space="preserve" x="328" y="280.0" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" font-weight="400" fill="#343a40">1.000</text><text xml:space="preserve" x="428" y="280.0" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" font-weight="400" fill="#343a40">104 false alarms</text><line x1="40" y1="300" x2="590" y2="300" stroke="#dee2e6"/><rect x="40" y="300" width="550" height="40" fill="#e7f5ff"/><text xml:space="preserve" x="48" y="320.0" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" font-weight="400" fill="#343a40">card, Luhn</text><text xml:space="preserve" x="218" y="320.0" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" font-weight="400" fill="#343a40">0.900</text><text xml:space="preserve" x="328" y="320.0" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" font-weight="400" fill="#343a40">1.000</text><text xml:space="preserve" x="428" y="320.0" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" font-weight="400" fill="#343a40">11 false alarms</text><line x1="40" y1="340" x2="590" y2="340" stroke="#dee2e6"/><text xml:space="preserve" x="48" y="360.0" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" font-weight="400" fill="#343a40">name (Mr, Ms, Dr)</text><text xml:space="preserve" x="218" y="360.0" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" font-weight="400" fill="#343a40">1.000</text><text xml:space="preserve" x="328" y="360.0" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" font-weight="400" fill="#343a40">0.334</text><text xml:space="preserve" x="428" y="360.0" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" font-weight="400" fill="#343a40">197 names missed</text><line x1="40" y1="380" x2="590" y2="380" stroke="#dee2e6"/><text xml:space="preserve" x="310" y="400.0" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" font-weight="400" fill="#1864ab" font-style="italic">plain names need a trained recogniser, not a pattern</text><rect x="620" y="95" width="600" height="330" rx="14" fill="#f3f0ff" fill-opacity="0.35" stroke="#7048e8" stroke-width="2" stroke-dasharray="9 6"/><text xml:space="preserve" x="920.0" y="121" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="16" font-weight="700" fill="#5f3dc4">k-anonymity by generalising a 3,000-row table</text><rect x="640" y="140" width="560" height="40" rx="6" fill="#7048e8"/><text xml:space="preserve" x="648" y="159.0" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" font-weight="700" fill="#ffffff">generalisation</text><text xml:space="preserve" x="838" y="159.0" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" font-weight="700" fill="#ffffff">unique as is</text><text xml:space="preserve" x="953" y="159.0" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" font-weight="700" fill="#ffffff">rows cut for k=5</text><text xml:space="preserve" x="1098" y="159.0" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" font-weight="700" fill="#ffffff">re-id after</text><line x1="640" y1="180" x2="1200" y2="180" stroke="#dee2e6"/><text xml:space="preserve" x="648" y="199.0" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" font-weight="400" fill="#343a40">zip 5 digits, age 1</text><text xml:space="preserve" x="838" y="199.0" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" font-weight="400" fill="#343a40">0.985</text><text xml:space="preserve" x="953" y="199.0" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" font-weight="400" fill="#343a40">1.000</text><text xml:space="preserve" x="1098" y="199.0" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" font-weight="400" fill="#343a40">0.000</text><line x1="640" y1="220" x2="1200" y2="220" stroke="#dee2e6"/><rect x="640" y="220" width="560" height="40" fill="#f3f0ff"/><text xml:space="preserve" x="648" y="239.0" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" font-weight="400" fill="#343a40">zip 4 digits, age 5</text><text xml:space="preserve" x="838" y="239.0" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" font-weight="400" fill="#343a40">0.539</text><text xml:space="preserve" x="953" y="239.0" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" font-weight="400" fill="#343a40">0.991</text><text xml:space="preserve" x="1098" y="239.0" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" font-weight="400" fill="#343a40">0.000</text><line x1="640" y1="260" x2="1200" y2="260" stroke="#dee2e6"/><text xml:space="preserve" x="648" y="279.0" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" font-weight="400" fill="#343a40">zip 3 digits, age 5</text><text xml:space="preserve" x="838" y="279.0" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" font-weight="400" fill="#343a40">0.017</text><text xml:space="preserve" x="953" y="279.0" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" font-weight="400" fill="#343a40">0.269</text><text xml:space="preserve" x="1098" y="279.0" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" font-weight="400" fill="#343a40">0.000</text><line x1="640" y1="300" x2="1200" y2="300" stroke="#dee2e6"/><rect x="640" y="300" width="560" height="40" fill="#f3f0ff"/><text xml:space="preserve" x="648" y="319.0" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" font-weight="400" fill="#343a40">zip 3 digits, age 20</text><text xml:space="preserve" x="838" y="319.0" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" font-weight="400" fill="#343a40">0.003</text><text xml:space="preserve" x="953" y="319.0" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" font-weight="400" fill="#343a40">0.028</text><text xml:space="preserve" x="1098" y="319.0" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" font-weight="400" fill="#343a40">0.000</text><line x1="640" y1="340" x2="1200" y2="340" stroke="#dee2e6"/><rect x="640" y="350" width="560" height="62" rx="9" fill="#fff4e6" stroke="#e8590c" stroke-width="1.6"/><rect x="639.5" y="349.0" width="560.5" height="60.7" rx="10" fill="none" stroke="#e8590c" stroke-width="1.1" stroke-opacity="0.45"/><text xml:space="preserve" x="920.0" y="373.9" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="14" font-weight="700" fill="#c2410c">the cost of anonymity</text><text xml:space="preserve" x="920.0" y="397.2" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" fill="#343a40">safer tables lose rows or detail: 0.991 of rows at zip 4 digits</text><rect x="20" y="450" width="400" height="120" rx="9" fill="#ebfbee" stroke="#2f9e44" stroke-width="1.6"/><rect x="20.1" y="449.6" width="398.7" height="120.0" rx="10" fill="none" stroke="#2f9e44" stroke-width="1.1" stroke-opacity="0.45"/><text xml:space="preserve" x="32" y="485.4" text-anchor="start" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="14" font-weight="700" fill="#2b8a3e">Mask or pseudonymise</text><text xml:space="preserve" x="32" y="508.8" text-anchor="start" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" fill="#343a40">Masking gives [EMAIL]. A keyed hash gives</text><text xml:space="preserve" x="32" y="526.2" text-anchor="start" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" fill="#343a40">[EMAIL:b27510]: the same address maps to</text><text xml:space="preserve" x="32" y="543.6" text-anchor="start" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" fill="#343a40">the same token, so joins still work.</text><rect x="440" y="450" width="360" height="120" rx="9" fill="#fff5f5" stroke="#e03131" stroke-width="1.6"/><rect x="438.6" y="449.8" width="358.7" height="118.8" rx="10" fill="none" stroke="#e03131" stroke-width="1.1" stroke-opacity="0.45"/><text xml:space="preserve" x="452" y="485.4" text-anchor="start" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="14" font-weight="700" fill="#c92a2a">k-anonymity is not enough</text><text xml:space="preserve" x="452" y="508.8" text-anchor="start" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" fill="#343a40">After suppressing to k = 5, 23 groups hold</text><text xml:space="preserve" x="452" y="526.2" text-anchor="start" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" fill="#343a40">283 of 2,917 people, and 90% or more of</text><text xml:space="preserve" x="452" y="543.6" text-anchor="start" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" fill="#343a40">each group share one diagnosis.</text><rect x="820" y="450" width="400" height="120" rx="9" fill="#fff4e6" stroke="#e8590c" stroke-width="1.6"/><rect x="819.8" y="451.0" width="398.9" height="119.2" rx="10" fill="none" stroke="#e8590c" stroke-width="1.1" stroke-opacity="0.45"/><text xml:space="preserve" x="832" y="485.4" text-anchor="start" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="14" font-weight="700" fill="#c2410c">Linkage beats removal of names</text><text xml:space="preserve" x="832" y="508.8" text-anchor="start" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" fill="#343a40">Without generalisation 0.985 of people are</text><text xml:space="preserve" x="832" y="526.2" text-anchor="start" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" fill="#343a40">unique on zip, age and sex, so a public list</text><text xml:space="preserve" x="832" y="543.6" text-anchor="start" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" fill="#343a40">with those three columns names them.</text><rect x="20" y="595" width="1200" height="85" rx="9" fill="#fff9db" stroke="#e8a300" stroke-width="1.6"/><rect x="20.4" y="596.3" width="1200.2" height="84.7" rx="10" fill="none" stroke="#e8a300" stroke-width="1.1" stroke-opacity="0.45"/><text xml:space="preserve" x="620.0" y="630.0" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="15" font-weight="700" fill="#b35c00">Automated detection finds most, never all</text><text xml:space="preserve" x="620.0" y="654.8" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" fill="#343a40">Presidio&#x27;s documentation gives no guarantee of finding all sensitive information: add retention limits and access control.</text></svg>

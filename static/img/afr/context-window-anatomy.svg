','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="15" font-weight="700" fill="#c2255c">5  Remember</text><text xml:space="preserve" x="620.0" y="596.0" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" fill="#343a40">write findings into the</text><text xml:space="preserve" x="620.0" y="614.8" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" fill="#343a40">message stream or a notes file:</text><text xml:space="preserve" x="620.0" y="633.7" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" fill="#343a40">sliding window kept 1 of 6</text><rect x="830" y="535" width="370" height="125" rx="9" fill="#fff9db" stroke="#e8a300" stroke-width="1.6"/><rect x="831.4" y="533.6" width="371.1" height="124.4" rx="10" fill="none" stroke="#e8a300" stroke-width="1.1" stroke-opacity="0.45"/><text xml:space="preserve" x="1015.0" y="571.1" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="15" font-weight="700" fill="#b35c00">6  Layout</text><text xml:space="preserve" x="1015.0" y="596.0" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" fill="#343a40">stable text first: 91.6%</text><text xml:space="preserve" x="1015.0" y="614.8" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" fill="#343a40">cache hits, against 0.1%</text><text xml:space="preserve" x="1015.0" y="633.7" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" fill="#343a40">with a clock at the top</text></sv
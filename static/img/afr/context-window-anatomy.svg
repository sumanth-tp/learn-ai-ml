.0" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" font-weight="400" fill="#343a40">1,060 tokens, 87.7%</text><rect x="1108.6" y="150.0" width="18.5" height="56.0" rx="4" fill="#e3fafc" stroke="#0c8599" stroke-width="2"/><rect x="1127.2" y="150.0" width="47.3" height="56.0" rx="4" fill="#f3f0ff" stroke="#7048e8" stroke-width="2"/><rect x="1174.4" y="150.0" width="5.6" height="56.0" rx="4" fill="#ebfbee" stroke="#2f9e44" stroke-width="2"/><path d="M92.9,208.0 L92.9,236.0" fill="none" stroke="#1c7ed6" stroke-width="1.2" stroke-linejoin="round" marker-end="url(#ah1c7ed6)"/><text xml:space="preserve" x="60.0" y="258.0" text-anchor="start" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" font-weight="700" fill="#1864ab">system prompt  71 tokens</text><rect x="560.0" y="232" width="176.4" height="22" rx="11.0" fill="#0c8599" stroke="#0c8599" stroke-width="1.2"/><text xml:space="preserve" x="648.2" y="247.3" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" font-weight="700" fill="#ffffff">memory 20 tokens, 1.7%</text><rect x="760.0" y="232" width="183.6" height="22" rx="11.0" fill="#7048e8" stroke="#7048e8" stroke-width="1.2"/><text xml:space="preserve" x="851.8" y="247.3" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" font-weight="700" fill="#ffffff">history 51 tokens, 4.2%</text><rect x="960.0" y="232" width="176.4" height="22" rx="11.0" fill="#2f9e44" stroke="#2f9e44" stroke-width="1.2"/><text xml:space="preserve" x="1048.2" y="247.3" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" font-weight="700" fill="#ffffff">message 6 tokens, 0.5%</text><text xml:space=
middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" fill="#343a40">tokenizer your model uses</text><rect x="435" y="385" width="370" height="125" rx="9" fill="#e3fafc" stroke="#0c8599" stroke-width="1.6"/><rect x="435.1" y="384.6" width="368.7" height="125.0" rx="10" fill="none" stroke="#0c8599" stroke-width="1.1" stroke-opacity="0.45"/><text xml:space="preserve" x="620.0" y="421.1" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="15" font-weight="700" fill="#0b7285">2  Trim</text><text xml:space="preserve" x="620.0" y="446.0" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" fill="#343a40">keep the head and tail of a</text><text xml:space="preserve" x="620.0" y="464.8" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" fill="#343a40">long tool output: one result</text><text xml:space="preserve" x="620.0" y="483.7" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" fill="#343a40">went from 1,233 to 508 tokens</text><rect x="830" y="385" width="370" height="125" rx="9" fill="#fff4e6" stroke="#e8590c" stroke-width="1.6"/><rect x="828.6" y="384.8" width="368.7" height="123.8" rx="10" fill="none" stroke="#e8590c" stroke-width="1.1" stroke-opacity="0.45"/><text xml:space="preserve" x="1015.0" y="421.1" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="15" font-weight="700" fill="#c2410c">3  Mask</text><text xml:space="preserve" x="1015.0" y="446.0" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" fill="
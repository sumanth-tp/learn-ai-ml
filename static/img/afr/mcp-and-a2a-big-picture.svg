monospace" font-size="16" font-weight="700" fill="#5f3dc4">A2A: an agent hands work to another agent</text><rect x="650" y="140" width="160" height="110" rx="9" fill="#f8f9fa" stroke="#6c757d" stroke-width="1.6"/><rect x="650.4" y="141.3" width="160.2" height="109.7" rx="10" fill="none" stroke="#6c757d" stroke-width="1.1" stroke-opacity="0.45"/><text xml:space="preserve" x="730.0" y="179.2" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="14" font-weight="700" fill="#343a40">client agent</text><text xml:space="preserve" x="730.0" y="202.6" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" fill="#343a40">has a goal it</text><text xml:space="preserve" x="730.0" y="220.0" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" fill="#343a40">cannot meet alone</text><rect x="1045" y="140" width="155" height="110" rx="9" fill="#f3f0ff" stroke="#7048e8" stroke-width="1.6"/><rect x="1046.4" y="138.6" width="156.1" height="109.4" rx="10" fill="none" stroke="#7048e8" stroke-width="1.1" stroke-opacity="0.45"/><text xml:space="preserve" x="1122.5" y="170.4" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="14" font-weight="700" fill="#5f3dc4">remote agent</text><text xml:space="preserve" x="1122.5" y="193.8" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" fill="#343a40">opaque: you see</text><text xml:space="preserve" x="1122.5" y="211.2" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" fill="#343a40">its card, not</text><text xml:space="preserve" x="1122.5" y="228.7" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" fill="#343a40">its internals</text><path d="M810.0,195.0 L1045.0,195.0" fill="none" stroke="#343a40" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#ah343a40)"/><rect x="650" y="285" width="550" height="110" rx="9" fill="#f3f0ff" stroke="#7048e8" stroke-width="1.6"/><rect x="648.9" y="283.9" width="549.4" height="110.9" rx="10" fill="none" stroke="#7048e8" stroke-width="1.1" stroke-opacity="0.45"/><text xml:space="preserve" x="925.0" y="315.4" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="14" font-weight="700" fill="#5f3dc4">what a task carries</text><text xml:space="preserve" x="925.0" y="338.8" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" fill="#343a40">a Task with an id and a state, a context id</text><text xml:space="preserve" x="925.0" y="356.2" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" fill="#343a40">for the conversation, artifacts for results,</text><text xml:space="preserve" x="925.0" y="373.6" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" fill="#343a40">messages when it needs more input</text><rect x="30" y="445" width="1180" height="40" rx="6" fill="#0c8599"/><text xml:space="preserve" x="38" y="465.0" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" font-weight="700" fill="#ffffff"></text><text xml:space="preserve" x="238" y="465.0" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" font-weight="700" fill="#ffffff">MCP 2026-07-28</text><text xml:space="preserve" x="728" y="465.0" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" font-weight="700" fill="#ffffff">A2A 1.0.0</text><line x1="30" y1="485" x2="1210" y2="485" stroke="#dee2e6"/><text xml:space="preserve" x="38" y="505.0" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" font-weight="400" fill="#343a40">unit of work</text><text xml:space="preserve" x="238" y="505.0" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" font-weight="400" fill="#343a40">a call: tools/call, resources/read</text><text xml:space="preserve" x="728" y="505.0" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" font-weight="400" fill="#343a40">a Task that can run, pause and resume</text><line x1="30" y1="525" x2="1210" y2="525" stroke="#dee2e6"/><rect x="30" y="525" width="1180" height="40" fill="#e3fafc"/><text xml:space="preserve" x="38" y="545.0" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" font-weight="400" fill="#343a40">discovery</text><text xml:space="preserve" x="238" y="545.0" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" font-weight="400" fill="#343a40">server/discover (and tools/list)</text><text xml:space="preserve" x="728" y="545.0" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" font-weight="400" fill="#343a40">Agent Card at /.well-known/agent-card.json</text><line x1="30" y1="565" x2="1210" y2="565" stroke="#dee2e6"/><text xml:space="preserve" x="38" y="585.0" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" font-weight="400" fill="#343a40">state</text><text xml:space="preserve" x="238" y="585.0" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" font-weight="400" fill="#343a40">none in the protocol; use handles</text><text xml:space="preserve" x="728" y="585.0" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" font-weight="400" fill="#343a40">task id and context id</text><line x1="30" y1="605" x2="1210" y2="605" stroke="#dee2e6"/><rect x="30" y="605" width="1180" height="40" fill="#e3fafc"/><text xml:space="preserve" x="38" y="625.0" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" font-weight="400" fill="#343a40">transports</text><text xml:space="preserve" x="238" y="625.0" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" font-weight="400" fill="#343a40">stdio, Streamable HTTP</text><text xml:space="preserve" x="728" y="625.0" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" font-weight="400" fill="#343a40">JSON-RPC, gRPC, HTTP+JSON</text><line x1="30" y1="645" x2="1210" y2="645" stroke="#dee2e6"/><text xml:space="preserve" x="38" y="665.0" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" font-weight="400" fill="#343a40">authorisation</text><text xml:space="preserve" x="238" y="665.0" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" font-weight="400" fill="#343a40">OAuth 2.1 style, resource indicators</text><text xml:space="preserve" x="728" y="665.0" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" font-weight="400" fill="#343a40">schemes declared in the Agent Card</text><line x1="
',Menlo,Consolas,'Liberation Mono',monospace" font-size="14" font-weight="400" fill="#343a40">6,800</text><line x1="45" y1="545" x2="585" y2="545" stroke="#dee2e6"/><rect x="45" y="545" width="540" height="40" fill="#e7f5ff"/><text xml:space="preserve" x="53" y="566.0" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="14" font-weight="400" fill="#343a40">peak</text><text xml:space="preserve" x="143" y="566.0" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="14" font-weight="400" fill="#343a40">1,800</text><text xml:space="preserve" x="293" y="566.0" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="14" font-weight="400" fill="#343a40">780</text><text xml:space="preserve" x="443" y="566.0" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="14" font-weight="400" fill="#343a40">1,000</text><line x1="45" y1="585" x2="585" y2="585" stroke="#dee2e6"/><text xml:space="preserve" x="310.0" y="600.0" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" font-weight="700" fill="#c92a2a">keep all passes the 1,000 window at request 5 (1,200)</text><text xml:space="preserve" x="310.0" y="630.0" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" font-weight="400" fill="#343a40">mask: 200 + 6 x 30 + 2 x 200 = 780 at request 8</text><text xml:space="preserve" x="310.0" y="656.0" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" font-weight="400" fill="#343a40">slide: drops the oldest whole step when over 1,000</text><text xml:space="preserve" x="310.0" y="690.0" text-anchor="middle" font-family=
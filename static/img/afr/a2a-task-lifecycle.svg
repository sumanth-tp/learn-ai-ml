" width="218.9" height="69.2" rx="10" fill="none" stroke="#e8590c" stroke-width="1.1" stroke-opacity="0.45"/><text xml:space="preserve" x="710.0" y="257.9" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="14" font-weight="700" fill="#c2410c">AUTH_REQUIRED</text><text xml:space="preserve" x="710.0" y="281.2" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" fill="#343a40">interrupted: wants auth</text><path d="M210.0,215.0 L290.0,215.0" fill="none" stroke="#343a40" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#ah343a40)"/><path d="M460.0,201.0 L600.0,165.0" fill="none" stroke="#343a40" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#ah343a40)"/><path d="M460.0,229.0 L600.0,265.0" fill="none" stroke="#343a40" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#ah343a40)"/><path d="M710.0,130.0 L710.0,105.0 L375.0,105.0 L375.0,180.0" fill="none" stroke="#e8590c" stroke-width="1.8" stroke-dasharray="7 5" stroke-linejoin="round" marker-end="url(#ahe8590c)"/><rect x="290" y="340" width="930" height="130" rx="14" fill="#fff5f5" fill-opacity="0.35" stroke="#e03131" stroke-width="2" stroke-dasharray="9 6"/><text xml:space="preserve" x="755.0" y="366" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="16" font-weight="700" fill="#c92a2a">Terminal states: the task is over and cannot restart</text><rect x="310" y="385" width="170" height="70" rx="9" fill="#ebfbee" stroke="#2f9e44" stroke-width="1.6"/><rect x="310.4" y="386.3" width="170.2" height="69.7" rx="10" fill="none" stroke="#2f9e44" stroke-width="1.1" stroke-opacity="0.45"/><text xml:space="preserve" x="395.0" y="405.3" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" font-weight="700" fill="#2b8a3e">COMPLETED</text><text xml:space="preserve" x="395.0" y="427.2" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="11" fill="#343a40">finished,</text><text xml:space="preserve" x="395.0" y="443.2" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="11" fill="#343a40">artifacts ready</text><rect x="550" y="385" width="170" height="70" rx="9" fill="#fff5f5" stroke="#e03131" stroke-width="1.6"/><rect x="551.4" y="383.6" width="171.1" height="69.4" rx="10" fill="none" stroke="#e03131" stroke-width="1.1" stroke-opacity="0.45"/><text xml:space="preserve" x="635.0" y="405.3" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" font-weight="700" fill="#c92a2a">FAILED</text><text xml:space="preserve" x="635.0" y="427.2" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="11" fill="#343a40">ended with</text><text xml:space="preserve" x="635.0" y="443.2" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="11" fill="#343a40">an error</text><rect x="790" y="385" width="170" height="70" rx="9" fill="#fff5f5" stroke="#e03131" stroke-width="1.6"/><rect x="788.9" y="383.9" width="169.4" height="70.9" rx="10" fill="none" stroke="#e03131" stroke-width="1.1" stroke-opacity="0.45"/><text xml:space="preserve" x="875.0" y="405.3" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" font-weight="700" fill="#c92a2a">CANCELED</text><text xml:space="preserve" x="875.0" y="427.2" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="11" fill="#343a40">stopped before</text><text xml:space="preserve" x="875.0" y="443.2" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="11" fill="#343a40">finishing</text><rect x="1030" y="385" width="170" height="70" rx="9" fill="#fff5f5" stroke="#e03131" stroke-width="1.6"/><rect x="1029.0" y="385.2" width="170.4" height="69.6" rx="10" fill="none" stroke="#e03131" stroke-width="1.1" stroke-opacity="0.45"/><text xml:space="preserve" x="1115.0" y="405.3" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" font-weight="700" fill="#c92a2a">REJECTED</text><text xml:space="preserve" x="1115.0" y="427.2" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="11" fill="#343a40">the agent</text><text xml:space="preserve" x="1115.0" y="443.2" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="11" fill="#343a40">declined it</text><path d="M375.0,250.0 L375.0,338.0" fill="none" stroke="#343a40" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#ah343a40)"/><rect x="20" y="500" width="1200" height="280" rx="14" fill="#f3f0ff" fill-opacity="0.35" stroke="#7048e8" stroke-width="2" stroke-dasharray="9 6"/><text xml:space="preserve" x="620.0" y="526" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="16" font-weight="700" fill="#5f3dc4">The two-turn example, as the wire shows it</text><rect x="40" y="545" width="560" height="110" rx="9" fill="#fff4e6" stroke="#e8590c" stroke-width="1.6"/><rect x="40.1" y="543.7" width="558.7" height="109.1" rx="10" fill="none" stroke="#e8590c" stroke-width="1.1" stroke-opacity="0.45"/><text xml:space="preserve" x="320.0" y="573.6" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="15" font-weight="700" fill="#c2410c">turn 1: SendMessage</text><text xml:space="preserve" x="320.0" y="598.5" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" fill="#343a40">text: please approve my expense</text><text xml:space="preserve" x="320.0" y="617.3" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" fill="#343a40">reply: a Task, new id and contextId</text><text xml:space="preserve" x="320.0" y="636.2" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" fill="#343a40">state INPUT_REQUIRED: What is the amount?</text><rect x="640" y="545" width="560" height="110" rx="9" fill="#ebfbee" stroke="#2f9e44" stroke-width="1.6"/><rect x="640.5" y="544.8" width="559.4" height="110.3" rx="10" fill="none" stroke="#2f9e44" stroke-width="1.1" stroke-opacity="0.45"/><text xml:space="preserve" x="920.0" y="573.6" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="15" font-weight="700" fill="#2b8a3e">turn 2: SendMessage with taskId</text><text xml:space="preserve" x="920.0" y="598.5" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" fill="#343a40">text: amount 120, same taskId and contextId</text><text xml:space="preserve" x="920.0" y="617.3" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" fill="#343a40">reply: the same Task, history of 3 messages</text><text xml:space="preserve" x="920.0" y="636.2" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" fill="#343a40">state COMPLETED, artifact: expense of 120: approved</text><path d="M320.0,657.0 L320.0,685.0" fill="none" stroke="#7048e8" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#ah7048e8)"/><path d="M920.0,657.0 L920.0,685.0" fill="none" stroke="#7048e8" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#ah7048e8)"/><rect x="40" y="685" width="1160" height="78" rx="9" fill="#f3f0ff" stroke="#7048e8" stroke-width="1.6"/><rect x="39.9" y="684.4" width="1160.9" height="78.6" rx="10" fill="none" stroke="#7048e8" stroke-width="1.1" stroke-opacity="0.45"/><text xml:space="preserve" x="620.0" y="708.1" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="14" font-weight="700" fill="#5f3dc4">what makes it a task and not a chat</text><text xml:space="preserve" x="620.0" y="731.5" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" fill="#343a40">the server stores the Task between calls, so the client sends only the new message and the ids</text><text xml:space="preserve" x="620.0" y="748.9" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" fill="#343a40">GetTask returns the final state later; a streaming client would receive status and artifact updates instead</text><rect x="482.7" y="160.0" width="82.6" height="18" rx="4" fill="#fffdf7" fill-opacity="0.95"/><text xml:space="preserve" x="524.0" y="173.0" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="11" font-weight="700" fill="#343a40">needs input</text><rect x="462.9" y="252.0" width="122.2" height="18" rx="4" fill="#fffdf7" fill-opacity="0.95"/><text xml:space="preserve" x="524.0" y="265.0" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="11" font-weight="700" fill="#343a40">needs credentials</text><rect x="395.6" y="96.0" width="293.8" height="18" rx="4" fill="#fffdf7" fill-opacity="0.95"/><text xml:space="preserve" x="542.5" y="109.0" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="11" font-weight="700" fill="#e8590c">client replies: SendMessage with the taskId</text><rect x="389.3" y="285.0" width="135.4" height="18" rx="4" fill="#fffdf7" fill-opacity="0.95"/><text xml:space="preserve" x="457.0" y="298.0" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="11" font-weight="700" fill="#343a40">ends in one of four</text></svg>

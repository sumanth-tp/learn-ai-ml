<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 730" width="1240" height="730" role="img" aria-label="Where to cut a sentence"><defs></defs><rect x="0" y="0" width="1240" height="730" rx="18" fill="#fffdf7"/><text xml:space="preserve" x="620.0" y="44" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="24" font-weight="700" fill="#1864ab">Where to cut a sentence</text><text xml:space="preserve" x="620.0" y="70" text-anchor="middle" font-family="'Inter','Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="14" fill="#868e96">A 3.2 second request with a natural 400 ms pause, replayed with three silence rules (chapter code block 1)</text><rect x="20" y="90" width="1200" height="190" rx="14" fill="#e7f5ff" fill-opacity="0.35" stroke="#1c7ed6" stroke-width="2" stroke-dasharray="9 6"/><text xml:space="preserve" x="620.0" y="116" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="16" font-weight="700" fill="#1864ab">What the user said</text><rect x="60.0" y="150.0" width="590.0" height="60.0" rx="5" fill="#e7f5ff" stroke="#1c7ed6" stroke-width="2"/><text xml:space="preserve" x="355.0" y="186.0" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="15" font-weight="700" fill="#1864ab">I would like to book a flight</text><text xml:space="preserve" x="355.0" y="232.0" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" font-weight="400" fill="#343a40">1,900 ms</text><rect x="650.0" y="150.0" width="130.0" height="60.0" rx="5" fill="#fff5f5" stroke="#e03131" stroke-width="2"/><text xml:space="preserve" x="715.0" y="186.0" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="14" font-weight="700" fill="#c92a2a">pause</text><text xml:space="preserve" x="715.0" y="232.0" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" font-weight="400" fill="#343a40">400 ms</text><rect x="780.0" y="150.0" width="360.0" height="60.0" rx="5" fill="#e7f5ff" stroke="#1c7ed6" stroke-width="2"/><text xml:space="preserve" x="960.0" y="186.0" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="15" font-weight="700" fill="#1864ab">to Lisbon</text><text xml:space="preserve" x="960.0" y="232.0" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" font-weight="400" fill="#343a40">900 ms</text><text xml:space="preserve" x="620.0" y="262.0" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" font-weight="400" fill="#868e96">a person pauses to think; the detector sees 400 ms of silence</text><rect x="30" y="305" width="1160" height="46" rx="6" fill="#0c8599"/><text xml:space="preserve" x="38" y="325.0" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" font-weight="700" fill="#ffffff">silence rule</text><text xml:space="preserve" x="208" y="325.0" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" font-weight="700" fill="#ffffff">400 ms pause</text><text xml:space="preserve" x="488" y="325.0" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" font-weight="700" fill="#ffffff">turns sent on</text><text xml:space="preserve" x="758" y="325.0" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" font-weight="700" fill="#ffffff">first audio after the last word</text><line x1="30" y1="351" x2="1190" y2="351" stroke="#dee2e6"/><text xml:space="preserve" x="38" y="371.0" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" font-weight="400" fill="#343a40">300 ms</text><text xml:space="preserve" x="208" y="371.0" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" font-weight="400" fill="#343a40">longer than the rule: cut</text><text xml:space="preserve" x="488" y="371.0" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" font-weight="400" fill="#343a40">2: the sentence is split</text><text xml:space="preserve" x="758" y="371.0" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" font-weight="400" fill="#343a40">300 + 400 + 300 + 150 + 80 = 1,230 ms</text><line x1="30" y1="397" x2="1190" y2="397" stroke="#dee2e6"/><rect x="30" y="397" width="1160" height="46" fill="#e3fafc"/><text xml:space="preserve" x="38" y="417.0" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" font-weight="400" fill="#343a40">500 ms</text><text xml:space="preserve" x="208" y="417.0" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" font-weight="400" fill="#343a40">shorter than the rule: kept</text><text xml:space="preserve" x="488" y="417.0" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" font-weight="400" fill="#343a40">1: the whole request</text><text xml:space="preserve" x="758" y="417.0" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" font-weight="400" fill="#343a40">500 + 400 + 300 + 150 + 80 = 1,430 ms</text><line x1="30" y1="443" x2="1190" y2="443" stroke="#dee2e6"/><text xml:space="preserve" x="38" y="463.0" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" font-weight="400" fill="#343a40">800 ms</text><text xml:space="preserve" x="208" y="463.0" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" font-weight="400" fill="#343a40">shorter than the rule: kept</text><text xml:space="preserve" x="488" y="463.0" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" font-weight="400" fill="#343a40">1: the whole request</text><text xml:space="preserve" x="758" y="463.0" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" font-weight="400" fill="#343a40">800 + 400 + 300 + 150 + 80 = 1,730 ms</text><line x1="30" y1="489" x2="1190" y2="489" stroke="#dee2e6"/><rect x="20" y="520" width="1200" height="185" rx="14" fill="#fff4e6" fill-opacity="0.35" stroke="#e8590c" stroke-width="2" stroke-dasharray="9 6"/><text xml:space="preserve" x="620.0" y="546" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="16" font-weight="700" fill="#c2410c">The same trade-off on real speech: 10 LibriSpeech utterances, 124.8 s, Silero VAD</text><rect x="40" y="565" width="1160" height="40" rx="6" fill="#e8590c"/><text xml:space="preserve" x="48" y="585.0" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" font-weight="700" fill="#ffffff">silence rule (ms)</text><text xml:space="preserve" x="308" y="585.0" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" font-weight="700" fill="#ffffff">100</text><text xml:space=
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 720" width="1240" height="720" role="img" aria-label="Why small targets and long tasks fail"><defs><marker id="ah1c7ed6" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1c7ed6"/></marker><marker id="ah1c7ed6s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1c7ed6"/></marker></defs><rect x="0" y="0" width="1240" height="720" rx="18" fill="#fffdf7"/><text xml:space="preserve" x="620.0" y="44" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="24" font-weight="700" fill="#1864ab">Why small targets and long tasks fail</text><text xml:space="preserve" x="620.0" y="70" text-anchor="middle" font-family="'Inter','Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="14" fill="#868e96">Grounding error 12 px (one standard deviation), the chapter&#x27;s default</text><rect x="40" y="100" width="560" height="130" rx="9" fill="#e7f5ff" stroke="#1c7ed6" stroke-width="1.6"/><rect x="39.5" y="99.0" width="560.5" height="128.7" rx="10" fill="none" stroke="#1c7ed6" stroke-width="1.1" stroke-opacity="0.45"/><text xml:space="preserve" x="320.0" y="138.6" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="15" font-weight="700" fill="#1864ab">one click on the submit button, 120 x 40 px</text><text xml:space="preserve" x="320.0" y="163.4" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" fill="#343a40">half-sizes 60 and 20, error 12</text><text xml:space="preserve" x="320.0" y="182.3" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" fill="#343a40">erf(60 / (12 x 1.414)) = erf(3.54) = 1.000 across</text><text xml:space="preserve" x="320.0" y="201.1" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" fill="#343a40">erf(20 / (12 x 1.414)) = erf(1.18) = 0.904 down</text><rect x="640" y="100" width="560" height="130" rx="9" fill="#e7f5ff" stroke="#1c7ed6" stroke-width="1.6"/><rect x="640.1" y="99.6" width="558.7" height="130.0" rx="10" fill="none" stroke="#1c7ed6" stroke-width="1.1" stroke-opacity="0.45"/><text xml:space="preserve" x="920.0" y="138.6" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="15" font-weight="700" fill="#1864ab">so P(hit submit) = 1.000 x 0.904</text><text xml:space="preserve" x="920.0" y="163.4" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" fill="#343a40">= 0.904</text><text xml:space="preserve" x="920.0" y="182.3" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" fill="#343a40">the 300 x 32 fields: erf(16 / 16.97) = erf(0.943) = 0.818</text><text xml:space="preserve" x="920.0" y="201.1" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" fill="#343a40">the 16 x 16 close button: 0.245</text><path d="M320.0,232.0 L320.0,270.0" fill="none" stroke="#1c7ed6" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#ah1c7ed6)"/><path d="M920.0,232.0 L920.0,270.0" fill="none" stroke="#1c7ed6" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#ah1c7ed6)"/><rect x="40" y="270" width="1160" height="120" rx="9" fill="#ebfbee" stroke="#2f9e44" stroke-width="1.6"/><rect x="38.6" y="269.8" width="1158.7" height="118.8" rx="10" fill="none" stroke="#2f9e4
D</text><path d="M260.0,260.0 L420.0,260.0" fill="none" stroke="#e03131" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#ahe03131)"/><path d="M632.5,330.0 L632.5,425.0 L800.0,425.0" fill="none" stroke="#e8590c" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#ahe8590c)"/><path d="M910.0,390.0 L910.0,290.0 L670.0,302.0" fill="none" stroke="#2f9e44" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#ah2f9e44)"/><path d="M670.0,218.0 L865.0,218.0" fill="none" stroke="#7048e8" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#ah7048e8)"/><rect x="40" y="400" width="330" height="150" rx="9" fill="#e3fafc" stroke="#0c8599" stroke-width="1.6"/><rect x="40.4" y="401.3" width="330.2" height="149.7" rx="10" fill="none" stroke="#0c8599" stroke-width="1.1" stroke-opacity="0.45"/><text xml:space="preserve" x="52" y="433.1" text-anchor="start" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="14" font-weight="700" fill="#0b7285">Reason, act, observe</text><text xml:space="preserve" x="52" y="456.4" text-anchor="start" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" fill="#343a40">Reason: the LLM works out what is</text><text xml:space="preserve" x="52" y="473.8" text-anchor="start" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" fill="#343a40">still unanswered.</text><text xml:space="preserve" x="52" y="491.2" text-anchor="start" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" fill="#343a40">Act: it calls a tool.</text><text xml:space="preserve" x="52" y="508.6" text-anchor="start" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" fill="#343a40">Observe: it reads the tool result and</text><text xml:space="preserve" x=
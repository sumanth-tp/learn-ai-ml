<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 700" width="1240" height="700" role="img" aria-label="LangChain implements guardrails as middleware"><defs><marker id="ah1c7ed6" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1c7ed6"/></marker><marker id="ah1c7ed6s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1c7ed6"/></marker><marker id="ahd6336c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d6336c"/></marker><marker id="ahd6336cs" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d6336c"/></marker></defs><rect x="0" y="0" width="1240" height="700" rx="18" fill="#fffdf7"/><text xml:space="preserve" x="620.0" y="44" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="24" font-weight="700" fill="#1864ab">LangChain implements guardrails as middleware</text><text xml:space="preserve" x="620.0" y="70" text-anchor="middle" font-family="'Inter','Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="14" fill="#868e96">Hooks before the agent, around the model and tools, and after the agent</text><rect x="380.0" y="88" width="99.0" height="25" rx="12.5" fill="#e7f5ff" stroke="#1c7ed6" stroke-width="1.2"/><text xml:space="preserve" x="429.5" y="105.9" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="15" font-weight="700" fill="#1864ab">LangChain</text><rect x="560.0" y="88" width="108.0" height="25" rx="12.5" fill="#fff0f6" stroke="#d6336c" stroke-width="1.2"/><text xml:space="preserve" x="614.0" y="105.9" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="15" font-weight="700" fill="#c2255c">Guardrails</text><rect x="740.0" y="88" width="108.0" height="25" rx="12.5" fill="#e8590c" stroke="#e8590c" stroke-width="1.2"/><text xml:space="preserve" x="794.0" y="105.9" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="15" font-weight="700" fill="#ffffff">Middleware</text><path d="M479.0,100.5 L560.0,100.5" fill="none" stroke="#1c7ed6" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#ah1c7ed6)"/><path d="M668.0,100.5 L740.0,100.5" fill="none" stroke="#d6336c" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#ahd6336c)"/><rect x="20" y="150" width="580" height="250" rx="14" fill="#e7f5ff" fill-opacity="0.35" stroke="#1c7ed6" stroke-width="2" stroke-dasharray="9 6"/><text xml:space="preserve" x="310.0" y="176" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="16" font-weight="700" fill="#1864ab">Built in</text><rect x="640" y="150" width="580" height="250" rx="14" fill="#ebfbee" fill-opacity="0.35" stroke="#2f9e44" stroke-width="2" stroke-dasharray="9 6"/><text xml:space="preserve" x="930.0" y="176" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="16" font-weight="700" fill="#2b8a3e">Custom hooks you write</text><rect x="20" y="430" width="1200" height="240" rx="14" fill="#f3f0ff" fill-opacity="0.35" stroke="#7048e8" stroke-width="2" stroke-dasharray="9 6"/><text xml:space="preserve" x="620.0" y="456" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="16" font-weight="700" fill="#5f3dc4">Combine them</text><rect x="40" y="190" width="265" height="190" rx="9" fill="#e7f5ff" stroke="#1c7ed6" stroke-width="1.6"/><rect x="39.5" y="189.0" width="265.5" height="188.7" rx="10" fill="none" stroke="#1c7ed6" stroke-width="1.1" stroke-opacity="0.45"/><text xml:space="preserve" x="172.5" y="243.1" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="14" font-weight="700" fill="#1864ab">1  PII middleware</text><text xml:space="preserve" x="172.5" y="266.4" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" fill="#343a40">detects email, credit card,</text><text xml:space="preserve" x="172.5" y="283.8" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" fill="#343a40">IP, URL</text><text xml:space="preserve" x="172.5" y="301.2" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" fill="#343a40">masks or hashes</text><text xml:space="preserve" x="172.5" y="318.6" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" fill="#343a40">works on input, output,</text><text xml:space="preserve" x="172.5" y="336.0" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" fill="#343a40">and tool calls</text><rect x="320" y="190" width="265" height="190" rx="9" fill="#e7f5ff" stroke="#1c7ed6" stroke-width="1.6"/><rect x="320.1" y="189.6" width="263.7" height="190.0" rx="10" fill="none" stroke="#1c7ed6" stroke-width="1.1" stroke-opacity="0.45"/><text xml:space="preserve" x="452.5" y="243.1" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="14" font-weight="700" fill="#1864ab">2  Human in the loop</text><text xml:space="preserve" x="452.5" y="266.4" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" fill="#343a40">pauses before sensitive</text><text xml:space="preserve" x="452.5" y="283.8" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" fill="#343a40">tools</text><text xml:space="preserve" x="452.5" y="301.2" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" fill="#343a40">waits: approve or reject</text><text xml:space="preserve" x="452.5" y="318.6" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" fill="#343a40">needs a thread and a</text><text xml:space="preserve" x="452.5" y="336.0" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" fill="#343a40">checkpointer</text><rect x="660" y="190" width="265" height="190" rx="9" fill="#ebfbee" stroke="#2f9e44" stroke-width="1.6"/><rect x="658.6" y="189.8" width="263.7" height="188.8" rx="10" fill="none" stroke="#2f9e44" stroke-width="1.1" stroke-opacity="0.45"/><text xml:space="preserve" x="792.5" y="243.1" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="14" font-weight="700" fill="#2b8a3e">3  before_agent hook</text><text xml:space="preserve" x="792.5" y="266.4" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" fill="#343a40">runs before any LLM call</text><text xml:space="preserve" x="792.5" y="283.8" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" fill="#343a40">zero LLM cost for blocked</text><text xml:space="preserve" x="792.5" y="301.2" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" fill="#343a40">requests</text><text xml:space="preserve" x="792.5" y="318.6" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" fill="#343a40">a blocked request jumps</text><text xml:space="preserve" x="792.5" y="336.0" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" fill="#343a40">straight to the end</text><rect x="940" y="190" width="265" height="190" rx="9" fill="#ebfbee" stroke="#2f9e44" stroke-width="1.6"/><rect x="939.8" y="191.0" width="263.9" height="189.2" rx="10" fill="none" stroke="#2f9e44" stroke-width="1.1" stroke-opacity="0.45"/><text xml:space="preserve" x="1072.5" y="243.1" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="14" font-weight="700" fill="#2b8a3e">4  after_agent hook</text><text xml:space="preserve" x="1072.5" y="266.4" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" fill="#343a40">validates the final response</text><text xml:space="preserve" x="1072.5" y="283.8" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" fill="#343a40">before the user sees it</text><text xml:space="preserve" x="1072.5" y="301.2" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" fill="#343a40">can replace or mutate</text><text xml:space="preserve" x="1072.5" y="318.6" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" fill="#343a40">unsafe content</text><text xml:space="preserve" x="1072.5" y="336.0" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" fill="#343a40">a small, cheap model will do</text><rect x="40" y="475" width="1160" height="170" rx="9" fill="#f3f0ff" stroke="#7048e8" stroke-width="1.6"/><rect x="40.4" y="476.3" width="1160.2" height="169.7" rx="10" fill="none" stroke="#7048e8" stroke-width="1.1" stroke-opacity="0.45"/><text xml:space="preserve" x="620.0" y="533.6" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="15" font-weight="700" fill="#5f3dc4">5  Layered guardrails</text><text xml:space="preserve" x="620.0" y="558.5" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" fill="#343a40">stack everything above in one middleware list: cheap deterministic checks first,</text><text xml:space="preserve" x="620.0" y="577.3" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" fill="#343a40">PII handling next, human approval on risky tools, a model-based output check last.</text><text xml:space="preserve" x="620.0" y="596.2" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" fill="#343a40">Defence in depth: no single layer has to be perfect.</text></svg>

vetica Neue',Arial,sans-serif" font-size="14" fill="#868e96">Explanatory board (not shown in the video): the interrupt and Command(resume=...) cycle from 6-middleware.ipynb</text><rect x="30" y="100" width="320" height="100" rx="9" fill="#e7f5ff" stroke="#1c7ed6" stroke-width="1.6"/><rect x="29.5" y="99.0" width="320.5" height="98.7" rx="10" fill="none" stroke="#1c7ed6" stroke-width="1.1" stroke-opacity="0.45"/><text xml:space="preserve" x="190.0" y="133.8" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" font-weight="700" fill="#1864ab">1. agent.invoke(messages, config)</text><text xml:space="preserve" x="190.0" y="157.2" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" fill="#343a40">same thread_id every time,</text><text xml:space="preserve" x="190.0" y="174.6" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" fill="#343a40">the checkpointer remembers the pause</text><rect x="420" y="100" width="340" height="100" rx="9" fill="#f3f0ff" stroke="#7048e8" stroke-width="1.6"/><rect x="420.1" y="99.6" width="338.7" height="100.0" rx="10" fill="none" stroke="#7048e8" stroke-width="1.1" stroke-opacity="0.45"/><text xml:space="preserve" x="590.0" y="133.8" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" font-weight="700" fill="#5f3dc4">2. model picks send_email_tool</text><text xml:space="preserve" x="590.0" y="157.2" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" fill="#343a40">read_email_tool is set to False,</text><text xml:space="preserve" x="590.0" y="174.6" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" fill="#343a40">so it would not pause</text><rect x="830" y="100" width="340" height="100" rx="9" fill="#fff5f5" stroke="#e03131" stroke-width="1.6"/><rect x="828.6" y="99.8" width="338.7" height="98.8" rx="10" fill="none" stroke="#e03131" stroke-width="1.1" stroke-opacity="0.45"/><text xml:space="preserve" x="1000.0" y="133.8" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" font-weight="700" fill="#c92a2a">3. middleware interrupts</text><text xml:space="preserve" x="1000.0" y="157.2" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" fill="#343a40">send_email_tool is in interrupt_on</text><text xml:space="preserve" x="1000.0" y="174.6" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" fill="#343a40">the tool has NOT run yet</text><path d="M350.0,150.0 L420.0,150.0" fill="none" stroke="#343a40" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#ah343a40)"/><path d="M760.0,150.0 L830.0,150.0" fill="none" stroke="#343a40" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#ah343a40)"/><rect x="830" y="250" width="340" height="130" rx="9" fill="#fff9db" stroke="#e8a300" stroke-width="1.6"/><rect x="829.8" y="251.0" width="338.9" height="129.2" rx="10" fill="none" stroke="#e8a300" stroke-width="1.1" stroke-opacity="0.45"/><text xml:space="preserve" x="1000.0" y="290.1" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" font-weight="700" fill="#b35c00">result[&quot;__interrupt__&quot;]</text><text xml:space="preserve" x="1000.0" y="313.5" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-s
text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" font-weight="700" fill="#2b8a3e">LLM navigates: root, chapter, section, answer</text><text xml:space="preserve" x="340" y="480.0" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" font-weight="400" fill="#868e96">Each node has a summary the LLM reads to</text><text xml:space="preserve" x="340" y="496.8" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" font-weight="400" fill="#868e96">decide where to go.</text><rect x="700" y="95" width="460" height="470" rx="14" fill="#f3f0ff" fill-opacity="0.35" stroke="#7048e8" stroke-width="2" stroke-dasharray="9 6"/><text xml:space="preserve" x="930.0" y="121" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="16" font-weight="700" fill="#5f3dc4">How the LLM navigates</text><rect x="750" y="140" width="390" height="78" rx="9" fill="#f3f0ff" stroke="#7048e8" stroke-width="1.6"/><rect x="749.0" y="140.2" width="390.4" height="77.6" rx="10" fill="none" stroke="#7048e8" stroke-width="1.1" stroke-opacity="0.45"/><text xml:space="preserve" x="762" y="164.3" text-anchor="start" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" font-weight="700" fill="#5f3dc4">Build the tree</text><text xml:space="preserve" x="762" y="186.2" text-anchor="start" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="11" fill="#343a40">Parse structure (headings, sections), summarise each</text><text xml:space="preserve" x="762" y="202.2" text-anchor="start" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="11" fill="#343a40">node. Done once, offline.</text><circle cx="730" cy="179" r="13" fill="#f3f0ff" stroke="#7048e8" stroke-width="2"/><text x="730" y="184" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="14" font-weight="700" fill="#5f3dc4">1</text><rect x="750" y="228" width="390" height="78" rx="9" fill="#f3f0ff" stroke="#7048e8" stroke-width="1.6"/><rect x="750.1" y="226.7" width="388.7" height="77.1" rx="10" fill="none" stroke="#7048e8" stroke-width="1.1" stroke-opacity="0.45"/><text xml:space="preserve" x="762" y="260.2" text-anchor="start" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" font-weight="700" fill="#5f3dc4">LLM reads root summary</text><text xml:space="preserve" x="762" y="282.2" text-anchor="start" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="11" fill="#343a40">&quot;Which chapter is most likely to contain the answer?&quot;</text><circle cx="730" cy="267" r="13" fill="#f3f0ff" stroke="#7048e8" stroke-width="2"/><text x="730" y="272" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="14" font-weight="700" fill="#5f3dc4">2</text><rect x="750" y="316" width="390" height="78" rx="9" fill="#f3f0ff" stroke="#7048e8" stroke-width="1.6"/><rect x="750.5" y="315.8" width="389.4" height="78.3" rx="10" fill="none" stroke="#7048e8" stroke-width="1.1" stroke-opacity="0.45"/><text xml:space="preserve" x="762" y="348.2" text-anchor="start" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" font-weight="700" fill="#5f3dc4">Descend the tree</text><text xml:space="preserve" x="762" y="370.2" text-anchor="start" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="11" fill="#343a40">Repeat at each level until a leaf section is reached.</text><circle cx="730" cy="355" r="13" fill="#f3f0ff" stroke="#7048e8" stroke-width="2"/><text x="730" y="360" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="14" font-weight="700" fill="#5f3dc4">3</text><rect x="750" y="404" width="390" height="78" rx="9" fill="#f3f0ff" stroke="#7048e8" stroke-width="1.6"/><rect x="749.9" y="403.4" width="390.9" height="78.6" rx="10" fill="none" stroke="#7048e8" stroke-width="1.1" stroke-opacity="0.45"/><text xml:space="preserve" x="762" y="436.2" text-anchor="start" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" font-weight="700" fill="#5f3dc4">Read full section</text><text xml:space="preserve" x="762" y="458.2" text-anchor="start" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="11" fill="#343a40">No chunking, full context preserved.</text><circle cx="730" cy="443" r="13" fill="#f3f0ff" stroke="#7048e8" stroke-width="2"/><text x="730" y="448" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="14" font-weight="700" fill="#5f3dc4">4</text><rect x="750" y="492" width="390" height="78" rx="9" fill="#f3f0ff" stroke="#7048e8" stroke-width="1.6"/><rect x="749.2" y="492.2" width="390.1" height="79.1" rx="10" fill="none" stroke="#7048e8" stroke-width="1.1" stroke-opacity="0.45"/><text xml:space="preserve" x="762" y="524.2" text-anchor="start" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" font-weight="700" fill="#5f3dc4">Answer + cite path</text><text xml:space="preserve" x="762" y="546.2" text-anchor="start" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="11" fill="#343a40">Returns the answer and the navigation path.</text><circle cx="730" cy="531" r="13" fill="#f3f0ff" stroke="#7048e8" stroke-width="2"/><text x="730" y="536" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="14" font-weight="700" fill="#5f3dc4">5</text></svg>

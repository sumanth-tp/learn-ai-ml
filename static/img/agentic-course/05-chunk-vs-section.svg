<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 600" width="1060" height="600" role="img" aria-label="Token-count chunking vs section-aware splitting"><defs></defs><rect x="0" y="0" width="1060" height="600" rx="18" fill="#fffdf7"/><text xml:space="preserve" x="530.0" y="44" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="24" font-weight="700" fill="#1864ab">Token-count chunking vs section-aware splitting</text><text xml:space="preserve" x="530.0" y="70" text-anchor="middle" font-family="'Inter','Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="14" fill="#868e96">The same three-section document cut two ways (the instructor&#x27;s evenly-split scribble, redrawn)</text><rect x="20" y="95" width="490" height="450" rx="14" fill="#fff5f5" fill-opacity="0.35" stroke="#e03131" stroke-width="2" stroke-dasharray="9 6"/><text xml:space="preserve" x="265.0" y="121" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="16" font-weight="700" fill="#c92a2a">Vector RAG: cut every N tokens</text><rect x="50" y="160" width="90" height="52" fill="#e7f5ff" stroke="#1c7ed6" stroke-width="1.6"/><text x="95.0" y="191" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" font-weight="700" fill="#1864ab" xml:space="preserve">Intro</text><rect x="140" y="160" width="230" height="52" fill="#fff4e6" stroke="#e8590c" stroke-width="1.6"/><text x="255.0" y="191" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" font-weight="700" fill="#c2410c" xml:space="preserve">AI</text><rect x="370" y="160" width="80" height="52" fill="#f3f0ff" stroke="#7048e8" stroke-width="1.6"/><text x="410.0" y="191" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" font-weight="700" fill="#5f3dc4" xml:space="preserve">Risks</text><path d="M150.0,150.0 L150.0,224.0" fill="none" stroke="#e03131" stroke-width="2.4" stroke-dasharray="7 5" stroke-linejoin="round" stroke-linecap="round"/><path d="M250.0,150.0 L250.0,224.0" fill="none" stroke="#e03131" stroke-width="2.4" stroke-dasharray="7 5" stroke-linejoin="round" stroke-linecap="round"/><path d="M350.0,150.0 L350.0,224.0" fill="none" stroke="#e03131" stroke-width="2.4" stroke-dasharray="7 5" stroke-linejoin="round" stroke-linecap="round"/><rect x="54" y="260" width="92" height="56" rx="9" fill="#fff5f5" stroke="#e03131" stroke-width="1.6"/><rect x="53.5" y="259.0" width="92.5" height="54.7" rx="10" fill="none" stroke="#e03131" stroke-width="1.1" stroke-opacity="0.45"/><text xml:space="preserve" x="100.0" y="292.2" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" font-weight="700" fill="#c92a2a">chunk 1</text><rect x="154" y="260" width="92" height="56" rx="9" fill="#fff5f5" stroke="#e03131" stroke-width="1.6"/><rect x="154.1" y="259.6" width="90.7" height="56.0" rx="10" fill="none" stroke="#e03131" stroke-width="1.1" stroke-opacity="0.45"/><text xml:space="preserve" x="200.0" y="292.2" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" font-weight="700" fill="#c92a2a">chunk 2</text><rect x="254" y="260" width="92" height="56" rx="9" fill="#fff5f5" stroke="#e03131" stroke-width="1.6"/><rect x="252.6" y="259.8" width="90.7" height="54.8" rx="10" fill="none" stroke="#e03131" stroke-width="1.1" stroke-opacity="0.45"/><text xml:space="preserve" x="300.0" y="292.2" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" font-weight="700" fill="#c92a2a">chunk 3</text><rect x="354" y="260" width="92" height="56" rx="9" fill="#fff5f5" stroke="#e03131" stroke-width="1.6"/><rect x="353.8" y="261.0" width="90.9" height="55.2" rx="10" fill="none" stroke="#e03131" stroke-width="1.1" stroke-opacity="0.45"/><text xml:space="preserve" x="400.0" y="292.2" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" font-weight="700" fill="#c92a2a">chunk 4</text><text xml:space="preserve" x="265" y="345.0" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" font-weight="700" fill="#c92a2a">The AI section is torn across all four chunks</text><rect x="60" y="380" width="410" height="140" rx="9" fill="#fff5f5" stroke="#e03131" stroke-width="1.6" stroke-dasharray="6 5"/><text xml:space="preserve" x="265.0" y="416.8" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="14" font-weight="700" fill="#c92a2a">What retrieval sees</text><text xml:space="preserve" x="265.0" y="440.1" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" fill="#343a40">Only the top-scoring chunks come back.</text><text xml:space="preserve" x="265.0" y="457.5" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" fill="#343a40">If chunk 3 wins, the start of the AI</text><text xml:space="preserve" x="265.0" y="474.9" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" fill="#343a40">section and the Risks heading are missing.</text><text xml:space="preserve" x="265.0" y="492.3" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" fill="#343a40">The model answers from a fragment.</text><rect x="550" y="95" width="490" height="450" rx="14" fill="#ebfbee" fill-opacity="0.35" stroke="#2f9e44" stroke-width="2" stroke-dasharray="9 6"/><text xml:space="preserve" x="795.0" y="121" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="16" font-weight="700" fill="#2b8a3e">PageIndex: split at section boundaries</text><rect x="580" y="160" width="90" height="52" fill="#e7f5ff" stroke="#1c7ed6" stroke-width="1.6"/><text x="625.0" y="191" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" font-weight="700" fill="#1864ab" xml:space="preserve">Intro</text><rect x="670" y="160" width="230" height="52" fill="#fff4e6" stroke="#e8590c" stroke-width="1.6"/><text x="785.0" y="191" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" font-weight="700" fill="#c2410c" xml:space="preserve">AI</text><rect x="900" y="160" width="80" height="52" fill="#f3f0ff" stroke="#7048e8" stroke-width="1.6"/><text x="940.0" y="191" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" font-weight="700" fill="#5f3dc4" xml:space="preserve">Risks</text><rect x="582" y="260" width="86" height="56" rx="9" fill="#ebfbee" stroke="#2f9e44" stroke-width="1.6"/><rect x="582.4" y="261.3" width="86.2" height="55.7" rx="10" fill="none" stroke="#2f9e44" stroke-width="1.1" stroke-opacity="0.45"/><text xml:space="preserve" x="625.0" y="281.2" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" font-weight="700" fill="#2b8a3e">node</text><text xml:space="preserve" x="625.0" y="303.2" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="11" fill="#343a40">Intro</text><rect x="672" y="260" width="226" height="56" rx="9" fill="#ebfbee" stroke="#2f9e44" stroke-width="1.6"/><rect x="673.4" y="258.6" width="227.1" height="55.4" rx="10" fill="none" stroke="#2f9e44" stroke-width="1.1" stroke-opacity="0.45"/><text xml:space="preserve" x="785.0" y="281.2" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" font-weight="700" fill="#2b8a3e">node</text><text xml:space="preserve" x="785.0" y="303.2" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="11" fill="#343a40">AI</text><rect x="902" y="260" width="76" height="56" rx="9" fill="#ebfbee" stroke="#2f9e44" stroke-width="1.6"/><rect x="900.9" y="258.9" width="75.4" height="56.9" rx="10" fill="none" stroke="#2f9e44" stroke-width="1.1" stroke-opacity="0.45"/><text xml:space="preserve" x="940.0" y="281.2" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" font-weight="700" fill="#2b8a3e">node</text><text xml:space="preserve" x="940.0" y="303.2" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="11" fill="#343a40">Risks</text><path d="M657.0,345.0 L663.0,352.0 L674.0,337.0" fill="none" stroke="#2f9e44" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round"/><text xml:space="preserve" x="800" y="350.0" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" font-weight="700" fill="#2b8a3e">Every section stays whole</text><rect x="590" y="380" width="410" height="140" rx="9" fill="#ebfbee" stroke="#2f9e44" stroke-width="1.6" stroke-dasharray="6 5"/><text xml:space="preserve" x="795.0" y="416.8" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="14" font-weight="700" fill="#2b8a3e">What retrieval sees</text><text xml:space="preserve" x="795.0" y="440.1" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" fill="#343a40">The LLM picks a node, and the whole</text><text xml:space="preserve" x="795.0" y="457.5" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" fill="#343a40">section comes back with its title and</text><text xml:space="preserve" x="795.0" y="474.9" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" fill="#343a40">page number. Summaries sit on each node</text><text xml:space="preserve" x="795.0" y="492.3" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" fill="#343a40">so the choice can be made from the tree.</text></svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="1200" height="700" role="img" aria-label="The eight core capabilities of an LLM gateway"><defs></defs><rect x="0" y="0" width="1200" height="700" rx="18" fill="#fffdf7"/><text xml:space="preserve" x="600.0" y="44" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="24" font-weight="700" fill="#1864ab">The eight core capabilities of an LLM gateway</text><text xml:space="preserve" x="600.0" y="70" text-anchor="middle" font-family="'Inter','Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="14" fill="#868e96">In the order he writes them down, with the one-line meaning of each</text><rect x="40" y="110" width="255" height="190" rx="9" fill="#e7f5ff" stroke="#1c7ed6" stroke-width="1.6"/><rect x="39.5" y="109.0" width="255.5" height="188.7" rx="10" fill="none" stroke="#1c7ed6" stroke-width="1.1" stroke-opacity="0.45"/><text xml:space="preserve" x="167.5" y="187.2" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="17" font-weight="700" fill="#1864ab">Unified API</text><text xml:space="preserve" x="167.5" y="213.5" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="14" fill="#343a40">one function call</text><text xml:space="preserve" x="167.5" y="233.8" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="14" fill="#343a40">for every provider</text><circle cx="67" cy="137" r="14" fill="#e7f5ff" stroke="#1c7ed6" stroke-width="2"/><text x="67" y="142" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="14" font-weight="700" fill="#1864ab">1</text><rect x="325" y="110" width="255" height="190" rx="9" fill="#fff5f5" stroke="#e03131" stroke-width="1.6"/><rect x="325.1" y="109.6" width="253.7" height="190.0" rx="10" fill="none" stroke="#e03131" stroke-width="1.1" stroke-opacity="0.45"/><text xml:space="preserve" x="452.5" y="187.2" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="17" font-weight="700" fill="#c92a2a">Automatic fallbacks</text><text xml:space="preserve" x="452.5" y="213.5" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="14" fill="#343a40">primary fails, the</text><text xml:space="preserve" x="452.5" y="233.8" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="14" fill="#343a40">backup answers</text><circle cx="352" cy="137" r="14" fill="#fff5f5" stroke="#e03131" stroke-width="2"/><text x="352" y="142" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="14" font-weight="700" fill="#c92a2a">2</text><rect x="610" y="110" width="255" height="190" rx="9" fill="#f3f0ff" stroke="#7048e8" stroke-width="1.6"/><rect x="608.6" y="109.8" width="253.7" height="188.8" rx="10" fill="none" stroke="#7048e8" stroke-width="1.1" stroke-opacity="0.45"/><text xml:space="preserve" x="737.5" y="187.2" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="17" font-weight="700" fill="#5f3dc4">Smart routing</text><text xml:space="preserve" x="737.5" y="213.5" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="14" fill="#343a40">different requests go</text><text xml:space="preserve" x="737.5" y="233.8" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="14" fill="#343a40">to different models</text><circle cx="637" cy="137" r="14" fill="#f3f0ff" stroke="#7048e8" stroke-width="2"/><text x="637" y="142" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="14" font-weight="700" fill="#5f3dc4">3</text><rect x="895" y="110" width="255" height="190" rx="9" fill="#e3fafc" stroke="#0c8599" stroke-width="1.6"/><rect x="894.8" y="111.0" width="253.9" height="189.2" rx="10" fill="none" stroke="#0c8599" stroke-width="1.1" stroke-opacity="0.45"/><text xml:space="preserve" x="1022.5" y="187.2" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="17" font-weight="700" fill="#0b7285">Load balancing</text><text xml:space="preserve" x="1022.5" y="213.5" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="14" fill="#343a40">spread traffic over</text><text xml:space="preserve" x="1022.5" y="233.8" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="14" fill="#343a40">keys and providers</text><circle cx="922" cy="137" r="14" fill="#e3fafc" stroke="#0c8599" stroke-width="2"/><text x="922" y="142" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="14" font-weight="700" fill="#0b7285">4</text><rect x="40" y="360" width="255" height="190" rx="9" fill="#fff4e6" stroke="#e8590c" stroke-width="1.6"/><rect x="40.4" y="361.3" width="255.2" height="189.7" rx="10" fill="none" stroke="#e8590c" stroke-width="1.1" stroke-opacity="0.45"/><text xml:space="preserve" x="167.5" y="437.2" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="17" font-weight="700" fill="#c2410c">Caching</text><text xml:space="preserve" x="167.5" y="463.5" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="14" fill="#343a40">same question again,</text><text xml:space="preserve" x="167.5" y="483.8" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="14" fill="#343a40">no second LLM call</text><circle cx="67" cy="387" r="14" fill="#fff4e6" stroke="#e8590c" stroke-width="2"/><text x="67" y="392" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="14" font-weight="700" fill="#c2410c">5</text><rect x="325" y="360" width="255" height="190" rx="9" fill="#ebfbee" stroke="#2f9e44" stroke-width="1.6"/><rect x="326.4" y="358.6" width="256.1" height="189.4" rx="10" fill="none" stroke="#2f9e44" stroke-width="1.1" stroke-opacity="0.45"/><text xml:space="preserve" x="452.5" y="437.2" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="17" font-weight="700" fill="#2b8a3e">Observability</text><text xml:space="preserve" x="452.5" y="463.5" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="14" fill="#343a40">every prompt, response,</text><text xml:space="preserve" x="452.5" y="483.8" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="14" fill="#343a40">token and dollar logged</text><circle cx="352" cy="387" r="14" fill="#ebfbee" stroke="#2f9e44" stroke-width="2"/><text x="352" y="392" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="14" font-weight="700" fill="#2b8a3e">6</text><rect x="610" y="360" width="255" height="190" rx="9" fill="#fff0f6" stroke="#d6336c" stroke-width="1.6"/><rect x="608.9" y="358.9" width="254.4" height="190.9" rx="10" fill="none" stroke="#d6336c" stroke-width="1.1" stroke-opacity="0.45"/><text xml:space="preserve" x="737.5" y="437.2" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="17" font-weight="700" fill="#c2255c">Guardrails</text><text xml:space="preserve" x="737.5" y="463.5" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="14" fill="#343a40">block or mask PII</text><text xml:space="preserve" x="737.5" y="483.8" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="14" fill="#343a40">before the LLM sees it</text><circle cx="637" cy="387" r="14" fill="#fff0f6" stroke="#d6336c" stroke-width="2"/><text x="637" y="392" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="14" font-weight="700" fill="#c2255c">7</text><rect x="895" y="360" width="255" height="190" rx="9" fill="#fff9db" stroke="#e8a300" stroke-width="1.6"/><rect x="894.0" y="360.2" width="255.4" height="189.6" rx="10" fill="none" stroke="#e8a300" stroke-width="1.1" stroke-opacity="0.45"/><text xml:space="preserve" x="1022.5" y="437.2" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="17" font-weight="700" fill="#b35c00">Evals</text><text xml:space="preserve" x="1022.5" y="463.5" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="14" fill="#343a40">plug in evaluation</text><text xml:space="preserve" x="1022.5" y="483.8" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="14" fill="#343a40">frameworks</text><circle cx="922" cy="387" r="14" fill="#fff9db" stroke="#e8a300" stroke-width="2"/><text x="922" y="392" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="14" font-weight="700" fill="#b35c00">8</text><rect x="40" y="600" width="520" height="60" rx="9" fill="#ebfbee" stroke="#2f9e44" stroke-width="1.6"/><rect x="40.1" y="598.7" width="518.7" height="59.1" rx="10" fill="none" stroke="#2f9e44" stroke-width="1.1" stroke-opacity="0.45"/><text xml:space="preserve" x="300.0" y="622.9" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="14" font-weight="700" fill="#2b8a3e">Langfuse / LangSmith</text><text xml:space="preserve" x="300.0" y="646.2" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" fill="#343a40">named as plug-ins for the observability item</text><rect x="600" y="600" width="560" height="60" rx="9" fill="#e7f5ff" stroke="#1c7ed6" stroke-width="1.6"/><rect x="600.5" y="599.8" width="559.4" height="60.3" rx="10" fill="none" stroke="#1c7ed6" stroke-width="1.1" stroke-opacity="0.45"/><text xml:space="preserve" x="880.0" y="622.9" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="14" font-weight="700" fill="#1864ab">Why it matters</text><text xml:space="preserve" x="880.0" y="646.2" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" fill="#343a40">the app asks for &#x27;an answer&#x27;; the gateway decides who gives it</text></svg>

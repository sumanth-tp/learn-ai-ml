<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 600" width="1180" height="600" role="img" aria-label="Chunking with overlap"><defs></defs><rect x="0" y="0" width="1180" height="600" rx="18" fill="#fffdf7"/><text xml:space="preserve" x="590.0" y="44" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="24" font-weight="700" fill="#1864ab">Chunking with overlap</text><text xml:space="preserve" x="590.0" y="70" text-anchor="middle" font-family="'Inter','Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="14" fill="#868e96">Explanatory board (not shown in the video)</text><text xml:space="preserve" x="40" y="112" text-anchor="start" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" font-weight="700" fill="#343a40">one long text (a PDF page, a section, a whole file)</text><rect x="40" y="125" width="1100" height="34" rx="8" fill="#f8f9fa" stroke="#6c757d" stroke-width="2"/><rect x="40" y="210" width="400" height="40" rx="8" fill="#e7f5ff" stroke="#1c7ed6" stroke-width="2"/><text xml:space="preserve" x="240" y="235" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" font-weight="700" fill="#1864ab">chunk 1: up to 1000 characters</text><rect x="360" y="272" width="400" height="40" rx="8" fill="#ebfbee" stroke="#2f9e44" stroke-width="2"/><text xml:space="preserve" x="560" y="297" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" font-weight="700" fill="#2b8a3e">chunk 2: up to 1000 characters</text><rect x="680" y="334" width="400" height="40" rx="8" fill="#fff4e6" stroke="#e8590c" stroke-width="2"/><text xml:space="preserve" x="880" y="359" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" font-weight="700" fill="#c2410c">chunk 3: up to 1000 characters</text><rect x="360" y="210" width="80" height="102" fill="#e8a300" fill-opacity="0.28" stroke="#e8a300" stroke-dasharray="5 4"/><rect x="680" y="272" width="80" height="102" fill="#e8a300" fill-opacity="0.28" stroke="#e8a300" stroke-dasharray="5 4"/><text xml:space="preserve" x="1000" y="250" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" font-weight="700" fill="#b35c00">the yellow band is shared:</text><text xml:space="preserve" x="1000" y="268" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" font-weight="400" fill="#b35c00">the last 200 characters of</text><text xml:space="preserve" x="1000" y="286" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" font-weight="400" fill="#b35c00">one chunk open the next</text><path d="M40.0,160.0 L40.0,205.0" fill="none" stroke="#6c757d" stroke-width="1.6" stroke-dasharray="7 5" stroke-linejoin="round" stroke-linecap="round"/><path d="M360.0,160.0 L360.0,270.0" fill="none" stroke="#6c757d" stroke-width="1.6" stroke-dasharray="7 5" stroke-linejoin="round" stroke-linecap="round"/><path d="M680.0,160.0 L680.0,330.0" fill="none" stroke="#6c757d" stroke-width="1.6" stroke-dasharray="7 5" stroke-linejoin="round" stroke-linecap="round"/><rect x="20" y="390" width="560" height="190" rx="14" fill="#fff9db" fill-opacity="0.35" stroke="#e8a300" stroke-width="2" stroke-dasharray="9 6"/><text xml:space="preserve" x="300.0" y="416" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="16" font-weight="700" fill="#b35c00">Why overlap</text><text xml:space="preserve" x="40" y="440" text-anchor="start" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" font-weight="400" fill="#343a40">a sentence cut at a chunk boundary is</text><text xml:space="preserve" x="40" y="460" text-anchor="start" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" font-weight="400" fill="#343a40">still whole in at least one chunk, so</text><text xml:space="preserve" x="40" y="480" text-anchor="start" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" font-weight="400" fill="#343a40">retrieval does not lose it at the seam.</text><text xml:space="preserve" x="40" y="520" text-anchor="start" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" font-weight="400" fill="#c92a2a">cost: about 20 percent more chunks to</text><text xml:space="preserve" x="40" y="540" text-anchor="start" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" font-weight="400" fill="#c92a2a">embed and store (200 of 1000).</text><rect x="600" y="390" width="560" height="190" rx="14" fill="#f3f0ff" fill-opacity="0.35" stroke="#7048e8" stroke-width="2" stroke-dasharray="9 6"/><text xml:space="preserve" x="880.0" y="416" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="16" font-weight="700" fill="#5f3dc4">separators=[&quot;\n\n&quot;, &quot;\n&quot;, &quot; &quot;, &quot;&quot;]</text><rect x="630.0" y="438" width="54.0" height="22" rx="11.0" fill="#7048e8" stroke="#7048e8" stroke-width="1.2"/><text xml:space="preserve" x="657.0" y="453.3" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" font-weight="700" fill="#ffffff">try 1</text><text xml:space="preserve" x="720" y="454" text-anchor="start" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" font-weight="400" fill="#343a40">paragraph break</text><rect x="630.0" y="470" width="54.0" height="22" rx="11.0" fill="#7048e8" stroke="#7048e8" stroke-width="1.2"/><text xml:space="preserve" x="657.0" y="485.3" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" font-weight="700" fill="#ffffff">try 2</text><text xml:space="preserve" x="720" y="486" text-anchor="start" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" font-weight="400" fill="#343a40">line break</text><rect x="630.0" y="502" width="54.0" height="22" rx="11.0" fill="#7048e8" stroke="#7048e8" stroke-width="1.2"/><text xml:space="preserve" x="657.0" y="517.3" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" font-weight="700" fill="#ffffff">try 3</text><text xml:space="preserve" x="720" y="518" text-anchor="start" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" font-weight="400" fill="#343a40">space (between words)</text><rect x="630.0" y="534" width="54.0" height="22" rx="11.0" fill="#7048e8" stroke="#7048e8" stroke-width="1.2"/><text xml:space="preserve" x="657.0" y="549.3" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" font-weight="700" fill="#ffffff">try 4</text><text xml:space="preserve" x="720" y="550" text-anchor="start" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" font-weight="400" fill="#343a40">any character</text><text xml:space="preserve" x="930" y="458" text-anchor="start" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" font-weight="400" fill="#343a40">the splitter tries</text><text xml:space="preserve" x="930" y="476" text-anchor="start" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" font-weight="400" fill="#343a40">the first separator</text><text xml:space="preserve" x="930" y="494" text-anchor="start" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" font-weight="400" fill="#343a40">that keeps pieces</text><text xml:space="preserve" x="930" y="512" text-anchor="start" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" font-weight="400" fill="#343a40">under chunk_size and</text><text xml:space="preserve" x="930" y="530" text-anchor="start" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" font-weight="400" fill="#343a40">falls back only if</text><text xml:space="preserve" x="930" y="548" text-anchor="start" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" font-weight="400" fill="#343a40">it must</text></svg>

" y="270" width="460" height="150" rx="9" fill="#fff9db" stroke="#e8a300" stroke-width="1.6"/><rect x="601.4" y="268.6" width="461.1" height="149.4" rx="10" fill="none" stroke="#e8a300" stroke-width="1.1" stroke-opacity="0.45"/><text xml:space="preserve" x="612" y="309.2" text-anchor="start" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="15" font-weight="700" fill="#b35c00">A custom tool is a function</text><text xml:space="preserve" x="612" y="334.0" text-anchor="start" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" fill="#343a40">def add(a, b):</text><text xml:space="preserve" x="612" y="352.9" text-anchor="start" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" fill="#343a40">    &quot;&quot;&quot;Doc string:</text><text xml:space="preserve" x="612" y="371.7" text-anchor="start" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" fill="#343a40">    what it does, and its inputs/args</text><text xml:space="preserve" x="612" y="390.6" text-anchor="start" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" fill="#343a40">    &quot;&quot;&quot;</text><path d="M830.0,230.0 L830.0,270.0" fill="none" stroke="#7048e8" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#ah7048e8)"/><rect x="600" y="460" width="460" height="120" rx="9" fill="#ebfbee" stroke="#2f9e44" stroke-width="1.6"/><rect x="598.9" y="458.9" width="459.4" height="120.9" rx="10" fill="none" stroke="#2f9e44" stroke-width="1.1" stroke-opacity="0.45"/><text xml:space="preserve" x="612" y="495.4" text-anchor="start" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="14" font-weight="700" fill="#2b8a3e">How the LLM picks a tool</text><text xml:space="preserve" x="612" y="518.9" text-anchor="start" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" fill="#343a40">It reads each tool&#x27;s doc string. If the user&#x27;s</text><text xml:space="preserve" x="612" y="536.2" text-anchor="start" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" fill="#343a40">request matches a tool&#x27;s inputs and purpose,</text><text xml:space="preserve" x="612" y="553.6" text-anchor="start" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" fill="#343a40">the LLM emits a tool call for it.</text><path d="M830.0,420.0 L830.0,460.0" fill="none" stroke="#e8590c" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#ahe8590c)"/><rect x="190.3" y="366.0" width="69.4" height="18" rx="4" fill="#fffdf7" fill-opacity="0.95"/><text xml:space="preserve" x="225.0" y="379.0" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="11" font-weight="700" fill="#e8590c">tool call</text><rect x="197.7" y="617.0" width="49.6" height="18" rx="4" fill="#fffdf7" fill-opacity="0.95"/><text xml:space="preserve" x="222.5" y="630.0" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="11" font-weight="700" fill="#e8590c">output</text><rect x="735.9" y="431.0" width="188.2" height="18" rx="4" fill="#fffdf7" fill-opacity="0.95"/><text xml:space="preserve" x="830.0" y="444.0" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="11" font-weight="700" fill="#e8590c">doc string is what it reads</text></svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 800" width="1100" height="800" role="img" aria-label="What one invoke() does"><defs><marker id="ah0c8599" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0c8599"/></marker><marker id="ah0c8599s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0c8599"/></marker><marker id="ah2f9e44" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2f9e44"/></marker><marker id="ah2f9e44s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2f9e44"/></marker><marker id="ah343a40" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#343a40"/></marker><marker id="ah343a40s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#343a40"/></marker><marker id="ah6c757d" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6c757d"/></marker><marker id="ah6c757ds" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6c757d"/></marker></defs><rect x="0" y="0" width="1100" height="800" rx="18" fill="#fffdf7"/><text xml:space="preserve" x="550.0" y="44" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="24" font-weight="700" fill="#1864ab">What one invoke() does</text><text xml:space="preserve" x="550.0" y="70" text-anchor="middle" font-family="'Inter','Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="14" fill="#868e96">Explanatory board (not shown in the video), based on the notebook run at 8:40 to 8:44</text><rect x="30" y="90" width="1040" height="310" rx="14" fill="#fff4e6" fill-opacity="0.35" stroke="#e8590c" stroke-width="2" stroke-dasharray="9 6"/><text xml:space="preserve" x="550.0" y="116" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="16" font-weight="700" fill="#c2410c">The loop inside the graph</text><rect x="50" y="140" width="210" height="80" rx="9" fill="#e7f5ff" stroke="#1c7ed6" stroke-width="1.6"/><rect x="49.5" y="139.0" width="210.5" height="78.7" rx="10" fill="none" stroke="#1c7ed6" stroke-width="1.1" stroke-opacity="0.45"/><text xml:space="preserve" x="155.0" y="165.3" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" font-weight="700" fill="#1864ab">invoke(...)</text><text xml:space="preserve" x="155.0" y="187.2" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="11" fill="#343a40">&quot;What is deepagent?&quot;</text><text xml:space="preserve" x="155.0" y="203.2" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="11" fill="#343a40">as a user message</text><rect x="295" y="140" width="200" height="80" rx="9" fill="#fff4e6" stroke="#e8590c" stroke-width="1.6"/><rect x="295.1" y="139.6" width="198.7" height="80.0" rx="10" fill="none" stroke="#e8590c" stroke-width="1.1" stroke-opacity="0.45"/><text xml:space="preserve" x="395.0" y="165.3" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" font-weight="700" fill="#c2410c">Middleware hooks</text><text xml:space="preserve" x="395.0" y="187.2" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="11" fill="#343a40">repair dangling calls,</text><text xml:space="preserve" x="395.0" y="203.2" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="11" fill="#343a40">summarise if long</text><rect x="530" y="140" width="220" height="80" rx="9" fill="#1f2937" stroke="#1f2937" stroke-width="1.6"/><rect x="528.6" y="139.8" width="218.7" height="78.8" rx="10" fill="none" stroke="#1f2937" stroke-width="1.1" stroke-opacity="0.45"/><text xml:space="preserve" x="640.0" y="165.3" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" font-weight="700" fill="#ffffff">Model</text><text xml:space="preserve" x="640.0" y="187.2" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="11" fill="#e9ecef">Qwen3 32B on Groq,</text><text xml:space="preserve" x="640.0" y="203.2" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="11" fill="#e9ecef">decides the next step</text><polygon points="910,125.0 1025.0,180 910,235.0 795.0,180" fill="#fff9db" stroke="#e8a300" stroke-width="1.8"/><text xml:space="preserve" x="910" y="175.8" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" font-weight="700" fill="#b35c00">plan, call a</text><text xml:space="preserve" x="910" y="192.6" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" font-weight="700" fill="#b35c00">tool, or answer?</text><rect x="530" y="295" width="220" height="70" rx="9" fill="#e3fafc" stroke="#0c8599" stroke-width="1.6"/><rect x="529.8" y="296.0" width="218.9" height="69.2" rx="10" fill="none" stroke="#0c8599" stroke-width="1.1" stroke-opacity="0.45"/><text xml:space="preserve" x="640.0" y="323.2" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" font-weight="700" fill="#0b7285">web_search (Tavily)</text><text xml:space="preserve" x="640.0" y="345.2" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="11" fill="#343a40">returns a big JSON result</text><path d="M260.0,180.0 L295.0,180.0" fill="none" stroke="#343a40" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#ah343a40)"/><path d="M495.0,180.0 L530.0,180.0" fill="none" stroke="#343a40" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#ah343a40)"/><path d="M750.0,180.0 L795.0,180.0" fill="none" stroke="#6c757d" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#ah6c757d)"/><path d="M910.0,235.0 L910.0,330.0 L750.0,330.0" fill="none" stroke="#0c8599" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#ah0c8599)"/><path d="M640.0,295.0 L640.0,220.0" fill="none" stroke="#0c8599" stroke-width="1.8" stroke-dasharray="7 5" stroke-linejoin="round" marker-end="url(#ah0c8599)"/><rect x="40" y="450" width="470" height="190" rx="9" fill="#e3fafc" stroke="#0c8599" stroke-width="1.6"/><rect x="40.4" y="451.3" width="470.2" height="189.7" rx="10" fill="none" stroke="#0c8599" stroke-width="1.1" stroke-opacity="0.45"/><text xml:space="preserve" x="52" y="506.4" text-anchor="start" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" font-weight="700" fill="#0b7285">If the result is too large (over about 20,000 tokens)</text><text xml:space="preserve" x="52" y="528.3" text-anchor="start" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="11" fill="#343a40">1. The full text is written to the virtual file system</text><text xml:space="preserve" x="52" y="544.2" text-anchor="start" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="11" fill="#343a40">   at /large_tool_results/&lt;tool-call id&gt;</text><text xml:space="preserve" x="52" y="560.2" text-anchor="start" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="11" fill="#343a40">2. The model only sees a short note: &quot;Tool result too</text><text xml:space="preserve" x="52" y="576.2" text-anchor="start" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="11" fill="#343a40">   large ... saved in the filesystem at this path ...&quot;</text><text xml:space="preserve" x="52" y="592.1" text-anchor="start" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="11" fill="#343a40">3. It can read_file / grep the file later if it needs it</text><rect x="560" y="450" width="500" height="190" rx="9" fill="#ebfbee" stroke="#2f9e44" stroke-width="1.6"/><rect x="561.4" y="448.6" width="501.1" height="189.4" rx="10" fill="none" stroke="#2f9e44" stroke-width="1.1" stroke-opacity="0.45"/><text xml:space="preserve" x="572" y="514.3" text-anchor="start" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" font-weight="700" fill="#2b8a3e">What comes back in result</text><text xml:space="preserve" x="572" y="536.3" text-anchor="start" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="11" fill="#343a40">messages  the whole conversation, last one is the answer</text><text xml:space="preserve" x="572" y="552.2" text-anchor="start" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="11" fill="#343a40">files     the virtual files, path -&gt; content, timestamps</text><text xml:space="preserve" x="572" y="568.2" text-anchor="start" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="11" fill="#343a40">todos     only if the model chose to write a to-do list</text><text xml:space="preserve" x="572" y="584.1" text-anchor="start" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="11" fill="#343a40">(his run printed messages and files, no todos)</text><path d="M596.0,365.0 L596.0,425.0 L463.0,425.0 L463.0,450.0" fill="none" stroke="#0c8599" stroke-width="1.8" stroke-dasharray="7 5" stroke-linejoin="round" marker-end="url(#ah0c8599)"/><path d="M1025.0,180.0 L1040.0,180.0 L1040.0,450.0" fill="none" stroke="#2f9e44" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#ah2f9e44)"/><rect x="40" y="680" width="1020" height="80" rx="9" fill="#fff9db" stroke="#e8a300" stroke-width="1.6"/><rect x="38.9" y="678.9" width="1019.4" height="80.9" rx="10" fill="none" stroke="#e8a300" stroke-width="1.1" stroke-opacity="0.45"/><text xml:space="preserve" x="52" y="704.1" text-anchor="start" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="14" font-weight="700" fill="#b35c00">Why this matters</text><text xml:space="preserve" x="52" y="727.5" text-anchor="start" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" fill="#343a40">A deep agent keeps the conversation small by moving bulky material into files and reading it back on demand.</text><text xml:space="preserve" x="52" y="744.9" text-anchor="start" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" fill="#343a40">That is how it can run for a long time without the context window filling up.</text><rect x="791.3" y="307.0" width="69.4" height="18" rx="4" fill="#fffdf7" fill-opacity="0.95"/><text xml:space="preserve" x="826.0" y="320.0" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="11" font-weight="700" fill="#0c8599">tool call</text><rect x="642.2" y="248.5" width="115.6" height="18" rx="4" fill="#fffdf7" fill-opacity="0.95"/><text xml:space="preserve" x="700.0" y="261.5" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="11" font-weight="700" fill="#0c8599">result goes back</text><rect x="558.1" y="416.0" width="62.8" height="18" rx="4" fill="#fffdf7" fill-opacity="0.95"/><text xml:space="preserve" x="589.5" y="429.0" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="11" font-weight="700" fill="#0c8599">too big?</text><rect x="1015.2" y="302.0" width="49.6" height="18" rx="4" fill="#fffdf7" fill-opacity="0.95"/><text xml:space="preserve" x="1040.0" y="315.0" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="11" font-weight="700" fill="#2f9e44">answer</text></svg>

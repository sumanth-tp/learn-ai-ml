<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" width="1200" height="720" role="img" aria-label="Load balancing: one alias, several deployments, three strategies"><defs><marker id="ah0c8599" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0c8599"/></marker><marker id="ah0c8599s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0c8599"/></marker></defs><rect x="0" y="0" width="1200" height="720" rx="18" fill="#fffdf7"/><text xml:space="preserve" x="600.0" y="44" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="24" font-weight="700" fill="#1864ab">Load balancing: one alias, several deployments, three strategies</text><text xml:space="preserve" x="600.0" y="70" text-anchor="middle" font-family="'Inter','Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="14" fill="#868e96">model_name=&#x27;gpt-pool&#x27; (or &#x27;chat&#x27;) is shared by an OpenAI and a Groq deployment</text><rect x="30" y="280" width="230" height="130" rx="9" fill="#e3fafc" stroke="#0c8599" stroke-width="1.6"/><rect x="29.5" y="279.0" width="230.5" height="128.7" rx="10" fill="none" stroke="#0c8599" stroke-width="1.1" stroke-opacity="0.45"/><text xml:space="preserve" x="145.0" y="319.7" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="14" font-weight="700" fill="#0b7285">Alias with two</text><text xml:space="preserve" x="145.0" y="338.6" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="14" font-weight="700" fill="#0b7285">deployments</text><text xml:space="preserve" x="145.0" y="362.0" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" fill="#343a40">openai-gpt4o</text><text xml:space="preserve" x="145.0" y="379.4" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" fill="#343a40">groq-llama-70b</text><rect x="330" y="100" width="400" height="170" rx="14" fill="#e7f5ff" fill-opacity="0.35" stroke="#1c7ed6" stroke-width="2" stroke-dasharray="9 6"/><text xml:space="preserve" x="530.0" y="126" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="16" font-weight="700" fill="#1864ab">simple-shuffle</text><text xml:space="preserve" x="530" y="160.0" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" font-weight="400" fill="#343a40">picks a deployment at random</text><text xml:space="preserve" x="530" y="178.2" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" font-weight="400" fill="#343a40">(the default)</text><text xml:space="preserve" x="530" y="225.0" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" font-weight="400" fill="#868e96">6 requests: groq, openai, groq,</text><text xml:space="preserve" x="530" y="241.8" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" font-weight="400" fill="#868e96">groq, groq, openai</text><rect x="330" y="300" width="400" height="170" rx="14" fill="#fff4e6" fill-opacity="0.35" stroke="#e8590c" stroke-width="2" stroke-dasharray="9 6"/><text xml:space="preserve" x="530.0" y="326" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="16" font-weight="700" fill="#c2410c">least-busy</text><text xml:space="preserve" x="530" y="360.0" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" font-weight="400" fill="#343a40">picks the deployment with the fewest</text><text xml:space="preserve" x="530" y="378.2" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" font-weight="400" fill="#343a40">requests in flight right now</text><text xml:space="preserve" x="530" y="425.0" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" font-weight="400" fill="#868e96">his 8 sequential requests all went</text><text xml:space="preserve" x="530" y="441.8" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" font-weight="400" fill="#868e96">to OpenAI: nothing was ever in flight</text><rect x="330" y="500" width="400" height="170" rx="14" fill="#ebfbee" fill-opacity="0.35" stroke="#2f9e44" stroke-width="2" stroke-dasharray="9 6"/><text xml:space="preserve" x="530.0" y="526" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="16" font-weight="700" fill="#2b8a3e">latency-based-routing</text><text xml:space="preserve" x="530" y="560.0" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" font-weight="400" fill="#343a40">picks the deployment that has been</text><text xml:space="preserve" x="530" y="578.2" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" font-weight="400" fill="#343a40">fastest over recent calls</text><text xml:space="preserve" x="530" y="625.0" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" font-weight="400" fill="#868e96">Groq won most requests (about 200 to</text><text xml:space="preserve" x="530" y="641.8" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" font-weight="400" fill="#868e96">400 ms against 1.0 to 1.7 s for OpenAI)</text><path d="M260.0,345.0 L330.0,185.0" fill="none" stroke="#0c8599" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#ah0c8599)"/><path d="M260.0,345.0 L330.0,385.0" fill="none" stroke="#0c8599" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#ah0c8599)"/><path d="M260.0,345.0 L330.0,585.0" fill="none" stroke="#0c8599" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#ah0c8599)"/><rect x="800" y="130" width="360" height="150" rx="9" fill="#f8f9fa" stroke="#6c757d" stroke-width="1.6"/><rect x="800.1" y="129.6" width="358.7" height="150.0" rx="10" fill="none" stroke="#6c757d" stroke-width="1.1" stroke-opacity="0.45"/><text xml:space="preserve" x="812" y="180.4" text-anchor="start" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="14" font-weight="700" fill="#343a40">Also in LiteLLM</text><text xml:space="preserve" x="812" y="203.8" text-anchor="start" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" fill="#343a40">usage-based-routing (stay under</text><text xml:space="preserve" x="812" y="221.2" text-anchor="start" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" fill="#343a40">tokens/requests per minute)</text><text xml:space="preserve" x="812" y="238.7" text-anchor="start" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" fill="#343a40">cost-based-routing (cheapest first)</text><rect x="800" y="330" width="360" height="130" rx="9" fill="#fff9db" stroke="#e8a300" stroke-width="1.6"/><rect x="798.6" y="329.8" width="358.7" height="128.8" rx="10" fill="none" stroke="#e8a300" stroke-width="1.1" stroke-opacity="0.45"/><text xml:space="preserve" x="812" y="370.4" text-anchor="start" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="14" font-weight="700" fill="#b35c00">Needs concurrency</text><text xml:space="preserve" x="812" y="393.8" text-anchor="start" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" fill="#343a40">least-busy only shows its</text><text xml:space="preserve" x="812" y="411.2" text-anchor="start" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" fill="#343a40">effect when requests overlap</text><text xml:space="preserve" x="812" y="428.6" text-anchor="start" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" fill="#343a40">(threads, async, a proxy)</text><rect x="800" y="510" width="360" height="130" rx="9" fill="#f3f0ff" stroke="#7048e8" stroke-width="1.6"/><rect x="799.8" y="511.0" width="358.9" height="129.2" rx="10" fill="none" stroke="#7048e8" stroke-width="1.1" stroke-opacity="0.45"/><text xml:space="preserve" x="812" y="550.5" text-anchor="start" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="14" font-weight="700" fill="#5f3dc4">Read the result</text><text xml:space="preserve" x="812" y="573.9" text-anchor="start" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" fill="#343a40">r._hidden_params[&#x27;model_id&#x27;]</text><text xml:space="preserve" x="812" y="591.2" text-anchor="start" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" fill="#343a40">names the deployment that served</text><text xml:space="preserve" x="812" y="608.6" text-anchor="start" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" fill="#343a40">each request</text></svg>

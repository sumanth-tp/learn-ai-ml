">LLM</text><text xml:space="preserve" x="425.0" y="282.5" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" fill="#e9ecef">picks which tool,</text><text xml:space="preserve" x="425.0" y="299.9" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" fill="#e9ecef">reads the result</text><rect x="590" y="120" width="170" height="250" rx="9" fill="#e3fafc" stroke="#0c8599" stroke-width="1.6"/><rect x="589.8" y="121.0" width="168.9" height="249.2" rx="10" fill="none" stroke="#0c8599" stroke-width="1.1" stroke-opacity="0.45"/><text xml:space="preserve" x="675.0" y="203.1" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="14" font-weight="700" fill="#0b7285">Tools</text><text xml:space="preserve" x="675.0" y="226.5" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" fill="#343a40">Wikipedia</text><text xml:space="preserve" x="675.0" y="243.9" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" fill="#343a40">search API</text><text xml:space="preserve" x="675.0" y="261.2" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" fill="#343a40">Tavily</text><text xml:space="preserve" x="675.0" y="278.6" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" fill="#343a40">calculator</text><text xml:space="preserve" x="675.0" y="296.0" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" fill="#343a40">... any number</text><rect x="340" y="355" width="170" height="40" rx="9" fill="#fff9db" stroke="#e8a300" stroke-width="1.6"/><rect x="340.4" y="356.3" width="170.2" height="39.7" rx="10" fill="none" stroke="#e8a300" stroke-width="1.1" stroke-opacity="0.45"/><text xml:space="preserve" x="425.0" y="379.2" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" font-weight="700" fill="#b35c00">Output</text><path d="M260.0,158.0 L380.0,158.0 L391.0,220.0" fill="none" stroke="#7048e8" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#ah7048e8)"/><path d="M280.0,290.0 L340.0,275.0" fill="none" stroke="#343a40" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#ah343a40)"/><path d="M510.0,247.5 L590.0,207.5" fill="none" stroke="#2f9e44" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#ah2f9e44)"/><path d="M590.0,307.5 L510.0,302.5" fill="none" stroke="#2f9e44" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#ah2f9e44)"/><path d="M425.0,330.0 L425.0,355.0" fill="none" stroke="#343a40" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#ah343a40)"/><text xml:space="preserve" x="675" y="400.0" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" font-weight="700" fill="#2b8a3e">loop: as many times as needed</text><path d="M810,120 q12,0 12,12 V248.0 q0,12 12,12 q-12,0 -12,12 V388 q0,12 -12,12" fill="none" stroke="#e03131" stroke-width="2" stroke-linecap="round"/><rect x="860" y="120" width="210" height="280" rx="9" fill="#fff5f5" stroke="#e03131" stroke-width="1.6"/><rect x="861.4" y="118.6" width="211.1" height="279.4" rx="10" fill="none" stroke="#e03131" stroke-width="1.1" stroke-opacity="0.45"/><text xml:space="preserve" x="872" y="218.1" text-anchor="start" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="14" font-weight="700" fill="#c92a2a">Still a shallow agent</text><text xml:space="preserve" x="872" y="241.5" text-anchor="start" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" fill="#343a40">• No planning</text><text xml:space="preserve" x="872" y="258.9" text-anchor="start" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" fill="#343a40">• No structured plan</text><text xml:space="preserve" x="872" y="276.2" text-anchor="start" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" fill="#343a40">• No deep reasoning</text><text xml:space="preserve" x="872" y="293.6" text-anchor="start" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" fill="#343a40">• No state management</text><text xml:space="preserve" x="872" y="311.0" text-anchor="start" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" fill="#343a40">• No persistent memory</text><rect x="30" y="450" width="1040" height="150" rx="14" fill="#f8f9fa" fill-opacity="0.35" stroke="#6c757d" stroke-width="2" stroke-dasharray="9 6"/><text xml:space="preserve" x="550.0" y="476" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="16" font-weight="700" fill="#343a40">ReAct, in one line</text><text xml:space="preserve" x="550" y="505.0" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="15" font-weight="700" fill="#343a40">Reason about the situation, Act with a tool, Observe the result, repeat.</text><text xml:space="preserve" x="550" y="540.0" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" font-weight="400" fill="#868e96">Better than a single pass because the loop can repeat, but it is still just LLM + tools.</text><text xml:space="preserve" x="550" y="566.0" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" font-weight="400" fill="#868e96" font-style="italic">(Aloud, the instructor expands the name as &quot;act&quot; and &quot;read&quot;; the usual expansion is Reason + Act.)</text><rect x="535.1" y="204.5" width="29.8" height="18" rx="4" fill="#fffdf7" fill-opacity="0.95"/><text xml:space="preserve" x="550.0" y="217.5" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="11" font-weight="700" fill="#2f9e44">act</text><rect x="521.9" y="310.0" width="56.2" height="18" rx="4" fill="#fffdf7" fill-opacity="0.95"/><text xml:space="preserve" x="550.0" y="323.0" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="11" font-weight="700" fill="#2f9e44">observe</text><rect x="428.8" y="333.5" width="36.4" height="18" rx="4" fill="#fffdf7" fill-opacity="0.95"/><text xml:space="preserve" x="447.0" y="346.5" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="11" font-weight="700" fill="#343a40">done</text></svg>

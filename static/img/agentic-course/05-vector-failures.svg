<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 700" width="1160" height="700" role="img" aria-label="Why vector RAG slips on professional documents"><defs></defs><rect x="0" y="0" width="1160" height="700" rx="18" fill="#fffdf7"/><text xml:space="preserve" x="580.0" y="44" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="24" font-weight="700" fill="#1864ab">Why vector RAG slips on professional documents</text><text xml:space="preserve" x="580.0" y="70" text-anchor="middle" font-family="'Inter','Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="14" fill="#868e96">Explanatory board (not shown in the video): two worked failures, scores are illustrative</text><rect x="20" y="95" width="540" height="585" rx="14" fill="#fff5f5" fill-opacity="0.35" stroke="#e03131" stroke-width="2" stroke-dasharray="9 6"/><text xml:space="preserve" x="290.0" y="121" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="16" font-weight="700" fill="#c92a2a">1 · Chunking destroys context</text><text x="40" y="140" text-anchor="start" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" font-weight="700" fill="#343a40" xml:space="preserve">Section 3.2 of a contract, cut in two:</text><rect x="40" y="160" width="240" height="120" rx="9" fill="#e7f5ff" stroke="#1c7ed6" stroke-width="1.6"/><rect x="39.5" y="159.0" width="240.5" height="118.7" rx="10" fill="none" stroke="#1c7ed6" stroke-width="1.1" stroke-opacity="0.45"/><text xml:space="preserve" x="160.0" y="197.3" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" font-weight="700" fill="#1864ab">chunk 3</text><text xml:space="preserve" x="160.0" y="219.3" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="11" fill="#343a40">&quot;The supplier is liable</text><text xml:space="preserve" x="160.0" y="235.2" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="11" fill="#343a40">for delays, as defined</text><text xml:space="preserve" x="160.0" y="251.2" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="11" fill="#343a40">in Section 3.2 ...&quot;</text><rect x="300" y="160" width="240" height="120" rx="9" fill="#e7f5ff" stroke="#1c7ed6" stroke-width="1.6"/><rect x="300.1" y="159.6" width="238.7" height="120.0" rx="10" fill="none" stroke="#1c7ed6" stroke-width="1.1" stroke-opacity="0.45"/><text xml:space="preserve" x="420.0" y="197.3" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" font-weight="700" fill="#1864ab">chunk 4</text><text xml:space="preserve" x="420.0" y="219.3" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="11" fill="#343a40">&quot;... except where the</text><text xml:space="preserve" x="420.0" y="235.2" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="11" fill="#343a40">delay is caused by a</text><text xml:space="preserve" x="420.0" y="251.2" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="11" fill="#343a40">force majeure event.&quot;</text><rect x="40.0" y="300" width="77.4" height="21" rx="10.5" fill="#2f9e44" stroke="#2f9e44" stroke-width="1.2"/><text xml:space="preserve" x="78.7" y="314.5" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="11" font-weight="700" fill="#ffffff">retrieved</text><rect x="300.0" y="300" width="103.8" height="21" rx="10.5" fill="#e03131" stroke="#e03131" stroke-width="1.2"/><text xml:space="preserve" x="351.9" y="314.5" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="11" font-weight="700" fill="#ffffff">not retrieved</text><path d="M511.0,181.0 L529.0,199.0" fill="none" stroke="#e03131" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/><path d="M511.0,199.0 L529.0,181.0" fill="none" stroke="#e03131" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/><rect x="40" y="345" width="500" height="100" rx="9" fill="#fff5f5" stroke="#e03131" stroke-width="1.6" stroke-dasharray="6 5"/><text xml:space="preserve" x="290.0" y="379.1" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="14" font-weight="700" fill="#c92a2a">The model answers from half a rule</text><text xml:space="preserve" x="290.0" y="402.5" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" fill="#343a40">The exception sits in the chunk that scored lower,</text><text xml:space="preserve" x="290.0" y="419.9" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" fill="#343a40">so the answer says the supplier is always liable.</text><rect x="40" y="470" width="500" height="190" rx="9" fill="#ebfbee" stroke="#2f9e44" stroke-width="1.6"/><rect x="38.6" y="469.8" width="498.7" height="188.8" rx="10" fill="none" stroke="#2f9e44" stroke-width="1.1" stroke-opacity="0.45"/><text xml:space="preserve" x="290.0" y="531.8" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="14" font-weight="700" fill="#2b8a3e">PageIndex instead</text><text xml:space="preserve" x="290.0" y="555.1" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" fill="#343a40">Section 3.2 is one node. When the LLM picks it,</text><text xml:space="preserve" x="290.0" y="572.5" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" fill="#343a40">the rule and its exception arrive together, with</text><text xml:space="preserve" x="290.0" y="589.9" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" fill="#343a40">the section title and page number so the answer</text><text xml:space="preserve" x="290.0" y="607.3" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" fill="#343a40">can cite them.</text><rect x="600" y="95" width="540" height="585" rx="14" fill="#fff4e6" fill-opacity="0.35" stroke="#e8590c" stroke-width="2" stroke-dasharray="9 6"/><text xml:space="preserve" x="870.0" y="121" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="16" font-weight="700" fill="#c2410c">2 · Similarity is not relevance</text><text x="620" y="140" text-anchor="start" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" font-weight="700" fill="#343a40" xml:space="preserve">Query: &quot;What are the EBITDA risks?&quot;</text><text x="620" y="190" text-anchor="start" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" font-weight="700" fill="#343a40" xml:space="preserve">Market conditions overview</text><rect x="620" y="202" width="330" height="16" rx="8.0" fill="#e9ecef" stroke="#ced4da"/><rect x="620" y="202" width="283.8" height="16" rx="8.0" fill="#e03131"/><text xml:space="preserve" x="960" y="215.0" text-anchor="start" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="14" font-weight="700" fill="#c92a2a">0.86</text><text x="1010" y="216" text-anchor="start" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="11" font-weight="400" fill="#c92a2a" xml:space="preserve">shares many words</text><text x="620" y="268" text-anchor="start" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" font-weight="700" fill="#343a40" xml:space="preserve">Interest-rate commentary</text><rect x="620" y="280" width="330" height="16" rx="8.0" fill="#e9ecef" stroke="#ced4da"/><rect x="620" y="280" width="234.3" height="16" rx="8.0" fill="#e03131"/><text xml:space="preserve" x="960" y="293.0" text-anchor="start" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="14" font-weight="700" fill="#c92a2a">0.71</text><text x="620" y="346" text-anchor="start" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" font-weight="700" fill="#343a40" xml:space="preserve">MD&amp;A: EBITDA drivers and risks</text><rect x="620" y="358" width="330" height="16" rx="8.0" fill="#e9ecef" stroke="#ced4da"/><rect x="620" y="358" width="211.2" height="16" rx="8.0" fill="#2f9e44"/><text xml:space="preserve" x="960" y="371.0" text-anchor="start" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="14" font-weight="700" fill="#2b8a3e">0.64</text><text x="1010" y="372" text-anchor="start" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="11" font-weight="400" fill="#2b8a3e" xml:space="preserve">the real answer</text><text x="620" y="428" text-anchor="start" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" font-weight="700" fill="#c92a2a" xml:space="preserve">cosine score ranks the wrong section first</text><rect x="620" y="450" width="500" height="100" rx="9" fill="#fff4e6" stroke="#e8590c" stroke-width="1.6" stroke-dasharray="6 5"/><text xml:space="preserve" x="870.0" y="484.1" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="14" font-weight="700" fill="#c2410c">Why it happens</text><text xml:space="preserve" x="870.0" y="507.5" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" fill="#343a40">An embedding captures topical closeness, not</text><text xml:space="preserve" x="870.0" y="524.9" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" fill="#343a40">whether this passage answers this question.</text><rect x="620" y="570" width="500" height="90" rx="9" fill="#ebfbee" stroke="#2f9e44" stroke-width="1.6"/><rect x="619.8" y="571.0" width="498.9" height="89.2" rx="10" fill="none" stroke="#2f9e44" stroke-width="1.1" stroke-opacity="0.45"/><text xml:space="preserve" x="870.0" y="599.1" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="14" font-weight="700" fill="#2b8a3e">PageIndex instead</text><text xml:space="preserve" x="870.0" y="622.5" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" fill="#343a40">The LLM reads titles and summaries and reasons</text><text xml:space="preserve" x="870.0" y="639.9" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" fill="#343a40">&#x27;EBITDA lives in MD&amp;A&#x27;, then returns that node.</text></svg>

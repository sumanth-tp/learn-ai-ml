" stroke="#6c757d" stroke-width="1.6"/><rect x="369.8" y="506.8" width="399.0" height="80.0" rx="10" fill="none" stroke="#6c757d" stroke-width="1.1" stroke-opacity="0.45"/><text xml:space="preserve" x="570.0" y="549.3" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" fill="#343a40">the answer drifts away from the question</text><rect x="790" y="506" width="380" height="80" rx="9" fill="#f8f9fa" stroke="#6c757d" stroke-width="1.6"/><rect x="788.6" y="506.5" width="380.8" height="80.2" rx="10" fill="none" stroke="#6c757d" stroke-width="1.1" stroke-opacity="0.45"/><text xml:space="preserve" x="980.0" y="540.6" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" fill="#343a40">tighten the system prompt, keep answers on the</text><text xml:space="preserve" x="980.0" y="558.0" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" fill="#343a40">question asked</text><path d="M350.0,546.0 L370.0,546.0" fill="none" stroke="#1c7ed6" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#ah1c7ed6)"/><path d="M770.0,546.0 L790.0,546.0" fill="none" stroke="#1c7ed6" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#ah1c7ed6)"/><text xml:space="preserve" x="600" y="622.0" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" font-weight="400" fill="#868e96">A small dataset only suggests a cause: confirm it in the trace before changing anything</text></svg>

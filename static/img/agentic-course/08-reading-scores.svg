ono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" fill="#343a40">the search fetched the wrong chunks</text><rect x="790" y="122" width="380" height="80" rx="9" fill="#f8f9fa" stroke="#6c757d" stroke-width="1.6"/><rect x="788.6" y="121.8" width="378.7" height="78.8" rx="10" fill="none" stroke="#6c757d" stroke-width="1.1" stroke-opacity="0.45"/><text xml:space="preserve" x="980.0" y="156.6" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" fill="#343a40">chunk size, number of chunks, embedding model,</text><text xml:space="preserve" x="980.0" y="174.0" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" fill="#343a40">query rewriting</text><path d="M350.0,162.0 L370.0,162.0" fill="none" stroke="#e03131" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#ahe03131)"/><path d="M770.0,162.0 L790.0,162.0" fill="none" stroke="#e03131" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#ahe03131)"/><rect x="30" y="218" width="320" height="80" rx="9" fill="#fff4e6" stroke="#e8590c" stroke-width="1.6"/><rect x="29.8" y="219.0" width="318.9" height="79.2" rx="10" fill="none" stroke="#e8590c" stroke-width="1.1" stroke-opacity="0.45"/><text xml:space="preserve" x="190.0" y="262.2" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" font-weight="700" fill="#c2410c">groundedness False, retrieval True</text><rect x="370" y="218" width="400" height="80" rx="9" fill="#f8f9fa" stroke="#6c757d" stroke-width="1.6"/><rect x="370.4" y="219.3" width="400.2" height="79.7" rx="10" fill="none" stroke="#6c757d" stroke-width="1.1" stroke-opacity="0.45"/><text xml:space="preserve" x="570.0" y="261.3" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" fill="#343a40">the model added facts beyond its context</text><rect x="790" y="218" width="380" height="80" rx="9" fill="#f8f9fa" stroke="#6c757d" stroke-width="1.6"/><rect x="791.4" y="216.6" width="381.1" height="79.4" rx="10" fill="none" stroke="#6c757d" stroke-width="1.1" stroke-opacity="0.45"/><text xml:space="preserve" x="980.0" y="252.6" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" fill="#343a40">stricter prompt, &#x27;say you do not know&#x27;, lower</text><text xml:space="preserve" x="980.0" y="270.0" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" fill="#343a40">temperature</text><path d="M350.0,258.0 L370.0,258.0" fill="none" stroke="#e8590c" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#ahe8590c)"/><path d="M770.0,258.0 L790.0,258.0" fill="none" stroke="#e8590c" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#ahe8590c)"/><rect x="30" y="314" width="320" height="80" rx="9" fill="#fff9db" stroke="#e8a300" stroke-width="1.6"/><rect x="28.9" y="312.9" width="319.4" height="80.9" rx="10" fill="none" stroke="#e8a300" stroke-width="1.1" stroke-opacity="0.45"/><text xml:space="preserve" x="190.0" y="358.2" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" font-weight="700" fill="#b35c00">correct but not grounded</text><rect x="370" y="314" width="400" height="80" rx="9" fill="#f8f9fa" stroke="#6c757d" stroke-width="1.6"/><rect x="369.0" y="314.2" width="400.4" height="79.6" rx="10" fill="none" stroke="#6c757d" stroke-width="1.1" stroke-opacity="0.45"/><text xml:space="preserve" x="570.0" y="348.6" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" fill="#343a40">rig
hor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="16" font-weight="700" fill="#1864ab">messages = [ ... ]  (a list of message objects, in order)</text><rect x="40" y="140" width="220" height="190" rx="9" fill="#ebfbee" stroke="#2f9e44" stroke-width="1.6"/><rect x="39.5" y="139.0" width="220.5" height="188.7" rx="10" fill="none" stroke="#2f9e44" stroke-width="1.1" stroke-opacity="0.45"/><text xml:space="preserve" x="150.0" y="219.2" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="14" font-weight="700" fill="#2b8a3e">1. HumanMessage</text><text xml:space="preserve" x="150.0" y="242.6" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" fill="#343a40">&quot;What&#x27;s the weather</text><text xml:space="preserve" x="150.0" y="259.9" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" fill="#343a40">in San Francisco?&quot;</text><rect x="285" y="140" width="250" height="190" rx="9" fill="#f3f0ff" stroke="#7048e8" stroke-width="1.6"/><rect x="285.1" y="139.6" width="248.7" height="190.0" rx="10" fill="none" stroke="#7048e8" stroke-width="1.1" stroke-opacity="0.45"/><text xml:space="preserve" x="410.0" y="175.7" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="14" font-weight="700" fill="#5f3dc4">2. AIMessage</text><text xml:space="preserve" x="410.0" y="199.1" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" fill="#343a40">content=[]</text><text xml:space="preserve" x="410.0" y="216.5" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" fill="#343a40">tool_calls=[{</text><text xml:space="preserve" x="410.0" y="233.9" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" fill="#343a40">  name: get_weather</text><text xml:space="preserve" x="410.0" y="251.3" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" fill="#343a40">  args: {location:</text><text xml:space="preserve" x="410.0" y="268.7" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" fill="#343a40">     San Francisco}</text><text xml:space="preserve" x="410.0" y="286.1" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" fill="#343a40">  id: call_123</text><text xml:space="preserve" x="410.0" y="303.4" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" fill="#343a40">}]</text><rect x="560" y="140" width="210" height="190" rx="9" fill="#fff4e6" stroke="#e8590c" stroke-width="1.6"/><rect x="558.6" y="139.8" width="208.7" height="188.8" rx="10" fill="none" stroke="#e8590c" stroke-width="1.1" stroke-opacity="0.45"/><text xml:space="preserve" x="665.0" y="193.1" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="14" font-weight="700" fill="#c2410c">3. ToolMessage</text><text xml:space="preserve" x="665.0" y="216.5" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" fill="#343a40">content=</text><text xml:space="preserve" x="665.0" y="233.9" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" fill="#343a40">&quot;Sunny, 72F&quot;</text><text xml:space="preserve" x="665.0" y="251.3" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" fill="#343a40"></text><text xml:space="preserve" x="665.0" y="268.7" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" fill="#343a40">tool_call_id=</text><text xml:space="preserve" x="665.0" y="286.1" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" fill="#343a40">&quot;call_123&quot;</text><path d="M260.0,235.0 L285.0,235.0" fill="none" stroke="#6c757d" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#ah6c757d)"/><path d="M535.0,235.0 L560.0,235.0" fill="none" stroke="#6c757d" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#ah6c757d)"/><text xml:space="preserve" x="380" y="358.0" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" font-weight="700" fill="#5f3dc4">the model asked for the tool</text><text xml:space="preserve" x="665" y="365.0" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" font-weight="700" fill="#c2410c">your code ran it, then wrapped</text><text xml:space="preserve" x="665" y="383.0" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" font-weight="700" fill="#c2410c">the result in a ToolMessage</text><path d="M485.0,330.0 L485.0,425.0" fill="none" stroke="#e03131" stroke-width="1.8" stroke-dasharray="7 5" stroke-linejoin="round" stroke-linecap="round"/><path d="M485.0,425.0 L665.0,425.0" fill="none" stroke="#e03131" stroke-width="1.8" stroke-dasharray="7 5" stroke-linejoin="round" stroke-linecap="round"/><path d="M665.0,425.0 L665.0,330.0" fill="none" stroke="#e03131" stroke-width="1.8" stroke-dasharray="7 5" stroke-linejoin="round" marker-end="url(#ahe03131)"/><text xml:space="preserve" x="415" y="419.0" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" font-weight="700" fill="#c92a2a">ids must match</text><rect x="840" y="160" width="220" height="70" rx="9" fill="#1f2937" stroke="#1f2937" stroke-width="1.6"/><rect x="839.8" y="161.0" width="218.9" height="69.2" rx="10" fill="none" stroke="#1f2937" stroke-width="1.1" stroke-opacity="0.45"/><text xml:space="preserve" x="950.0" y="198.9" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" font-weight="700" fill="#ffffff">model.invoke(messages)</text><rect x="840" y="290" width="220" height="110" rx="9" fill="#f3f0ff" stroke="#7048e8" stroke-width="1.6"/><rect x="840.4" y="291.3" width="220.2" height="109.7" rx="10" fill="none" stroke="#7048e8" stroke-width="1.1" stroke-opacity="0.45"/><text xml:space="preserve" x="950.0" y="329.1" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="14" font-weight="700" fill="#5f3dc4">AIMessage</text><text xml:space="preserve" x="950.0" y="352.5" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" fill="#343a40">final answer, for example:</text><text xml:space="preserve" x="950.0" y="369.9" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" fill="#343a40">&quot;Sunny, 72F in SF&quot;</text><path d="M790.0,255.0 L815.0,255.0 L815.0,230.0 L884.0,230.0" fill="none" stroke="#6c757d" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#ah6c757d)"/><path d="M950.0,230.0 L950.0,290.0" fill="none" stroke="#7048e8" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#ah7048e8)"/><rect x="20" y="485" width="1060" height="90" rx="9" fill="#fff9db" stroke="#e8a300" stroke-width="1.6"/><rect x="21.4" y="483.6" width="1061.1" height="89.4" rx="10" fill="none" stroke="#e8a300" stroke-width="1.1" stroke-opacity="0.45"/><text xml:space="preserve" x="550.0" y="513.0" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="15" font-weight="700" fill="#b35c00">Why this matters</text><text xml:space="preserve" x="550.0" y="537.9" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" fill="#343a40">A model never runs tools. It writes a tool_call, your code (or create_agent) runs the tool,</text><text xml:space="preserve" x="550.0" y="556.7" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" fill="#343a40">and the result goes back as a ToolMessage so the model can phrase the final reply.</text><rect x="872.4" y="251.0" width="155.2" height="18" rx="4" fill="#fffdf7" fill-opacity="0.95"/><text xml:space="preserve" x="950.0" y="264.0" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="11" font-weight="700" fill="#7048e8">model reads the result</text></svg>

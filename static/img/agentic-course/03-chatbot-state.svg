<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 640" width="1120" height="640" role="img" aria-label="The basic chatbot: one node, and a messages list in the state"><defs><marker id="ah2f9e44" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2f9e44"/></marker><marker id="ah2f9e44s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2f9e44"/></marker><marker id="ahe8590c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e8590c"/></marker><marker id="ahe8590cs" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e8590c"/></marker></defs><rect x="0" y="0" width="1120" height="640" rx="18" fill="#fffdf7"/><text xml:space="preserve" x="560.0" y="44" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="24" font-weight="700" fill="#1864ab">The basic chatbot: one node, and a messages list in the state</text><text xml:space="preserve" x="560.0" y="70" text-anchor="middle" font-family="'Inter','Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="14" fill="#868e96">Redrawn from the instructor&#x27;s whiteboard (3:00:30 to 3:14:15). The reducer appends, it never replaces.</text><rect x="30" y="100" width="470" height="340" rx="14" fill="#fff4e6" fill-opacity="0.35" stroke="#e8590c" stroke-width="2" stroke-dasharray="9 6"/><text xml:space="preserve" x="265.0" y="126" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="16" font-weight="700" fill="#c2410c">State</text><text xml:space="preserve" x="265" y="160.0" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="17" font-weight="700" fill="#c2410c">{ messages = [ ... ] }</text><rect x="60" y="185" width="300" height="40" rx="9" fill="#fff9db" stroke="#e8a300" stroke-width="1.6"/><rect x="59.5" y="184.0" width="300.5" height="38.7" rx="10" fill="none" stroke="#e8a300" stroke-width="1.1" stroke-opacity="0.45"/><text xml:space="preserve" x="210.0" y="208.9" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" font-weight="700" fill="#b35c00">Hi, how are you?</text><rect x="372.0" y="191" width="51.0" height="21" rx="10.5" fill="#f8f9fa" stroke="#6c757d" stroke-width="1.2"/><text xml:space="preserve" x="397.5" y="205.5" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="11" font-weight="700" fill="#343a40">human</text><rect x="60" y="237" width="300" height="40" rx="9" fill="#ebfbee" stroke="#2f9e44" stroke-width="1.6"/><rect x="60.1" y="236.6" width="298.7" height="40.0" rx="10" fill="none" stroke="#2f9e44" stroke-width="1.1" stroke-opacity="0.45"/><text xml:space="preserve" x="210.0" y="260.9" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" font-weight="700" fill="#2b8a3e">I am good</text><rect x="372.0" y="243" width="31.2" height="21" rx="10.5" fill="#f8f9fa" stroke="#6c757d" stroke-width="1.2"/><text xml:space="preserve" x="387.6" y="257.5" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="11" font-weight="700" fill="#343a40">AI</text><rect x="60" y="289" width="300" height="40" rx="9" fill="#fff9db" stroke="#e8a300" stroke-width="1.6"/><rect x="58.6" y="288.8" width="298.7" height="38.8" rx="10" fill="none" stroke="#e8a300" stroke-width="1.1" stroke-opacity="0.45"/><text xml:space="preserve" x="210.0" y="312.9" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" font-weight="700" fill="#b35c00">What is your name?</text><rect x="372.0" y="295" width="51.0" height="21" rx="10.5" fill="#f8f9fa" stroke="#6c757d" stroke-width="1.2"/><text xml:space="preserve" x="397.5" y="309.5" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="11" font-weight="700" fill="#343a40">human</text><rect x="60" y="341" width="300" height="40" rx="9" fill="#ebfbee" stroke="#2f9e44" stroke-width="1.6"/><rect x="59.8" y="342.0" width="298.9" height="39.2" rx="10" fill="none" stroke="#2f9e44" stroke-width="1.1" stroke-opacity="0.45"/><text xml:space="preserve" x="210.0" y="364.9" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" font-weight="700" fill="#2b8a3e">I am a basic chatbot</text><rect x="372.0" y="347" width="31.2" height="21" rx="10.5" fill="#f8f9fa" stroke="#6c757d" stroke-width="1.2"/><text xml:space="preserve" x="387.6" y="361.5" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="11" font-weight="700" fill="#343a40">AI</text><text xml:space="preserve" x="265" y="410.0" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" font-weight="700" fill="#c2410c">each new message is appended</text><rect x="30" y="460" width="470" height="150" rx="9" fill="#f3f0ff" stroke="#7048e8" stroke-width="1.6"/><rect x="30.4" y="461.3" width="470.2" height="149.7" rx="10" fill="none" stroke="#7048e8" stroke-width="1.1" stroke-opacity="0.45"/><text xml:space="preserve" x="42" y="510.4" text-anchor="start" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="14" font-weight="700" fill="#5f3dc4">Reducer: add_messages</text><text xml:space="preserve" x="42" y="533.9" text-anchor="start" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" fill="#343a40">A reducer decides how a state key is updated.</text><text xml:space="preserve" x="42" y="551.2" text-anchor="start" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" fill="#343a40">Without one, a node&#x27;s return value replaces the key.</text><text xml:space="preserve" x="42" y="568.6" text-anchor="start" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" fill="#343a40">With add_messages the new messages are added to the list.</text><rect x="560" y="100" width="530" height="510" rx="14" fill="#e7f5ff" fill-opacity="0.35" stroke="#1c7ed6" stroke-width="2" stroke-dasharray="9 6"/><text xml:space="preserve" x="825.0" y="126" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="16" font-weight="700" fill="#1864ab">StateGraph</text><rect x="760.0" y="151.0" width="130" height="38" rx="19.0" fill="#f8f9fa" stroke="#868e96" stroke-width="1.8"/><text x="825" y="174.68" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" font-weight="700" fill="#343a40" xml:space="preserve">START</text><rect x="715" y="240" width="220" height="70" rx="9" fill="#e7f5ff" stroke="#1c7ed6" stroke-width="1.6"/><rect x="716.4" y="238.6" width="221.1" height="69.4" rx="10" fill="none" stroke="#1c7ed6" stroke-width="1.1" stroke-opacity="0.45"/><text xml:space="preserve" x="825.0" y="267.4" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="15" font-weight="700" fill="#1864ab">chatbot</text><text xml:space="preserve" x="825.0" y="292.3" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" fill="#343a40">a node</text><rect x="760.0" y="381.0" width="130" height="38" rx="19.0" fill="#e5dbff" stroke="#7048e8" stroke-width="1.8"/><text x="825" y="404.68" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" font-weight="700" fill="#5f3dc4" xml:space="preserve">END</text><path d="M825.0,189.0 L825.0,240.0" fill="none" stroke="#e8590c" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#ahe8590c)"/><path d="M825.0,310.0 L825.0,381.0" fill="none" stroke="#e8590c" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#ahe8590c)"/><rect x="960" y="240" width="120" height="70" rx="9" fill="#ebfbee" stroke="#2f9e44" stroke-width="1.6"/><rect x="958.9" y="238.9" width="119.4" height="70.9" rx="10" fill="none" stroke="#2f9e44" stroke-width="1.1" stroke-opacity="0.45"/><text xml:space="preserve" x="1020.0" y="260.3" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" font-weight="700" fill="#2b8a3e">LLM + prompt</text><text xml:space="preserve" x="1020.0" y="282.2" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="11" fill="#343a40">takes input,</text><text xml:space="preserve" x="1020.0" y="298.2" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="11" fill="#343a40">gives output</text><path d="M935.0,275.0 L960.0,275.0" fill="none" stroke="#2f9e44" stroke-width="1.8" stroke-dasharray="7 5" stroke-linejoin="round" marker-end="url(#ah2f9e44)"/><text xml:space="preserve" x="825" y="460.0" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" font-weight="400" fill="#343a40">input in, state[&#x27;messages&#x27;] goes to the LLM,</text><text xml:space="preserve" x="825" y="478.0" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" font-weight="400" fill="#343a40">the reply is appended to the list</text><rect x="600.0" y="530" width="97.2" height="22" rx="11.0" fill="#fff4e6" stroke="#e8590c" stroke-width="1.2"/><text xml:space="preserve" x="648.6" y="545.3" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" font-weight="700" fill="#c2410c">next: Tools</text><rect x="740.0" y="530" width="147.6" height="22" rx="11.0" fill="#f3f0ff" stroke="#7048e8" stroke-width="1.2"/><text xml:space="preserve" x="813.8" y="545.3" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" font-weight="700" fill="#5f3dc4">later: ReAct agent</text><rect x="920.0" y="530" width="75.6" height="22" rx="11.0" fill="#fff0f6" stroke="#d6336c" stroke-width="1.2"/><text xml:space="preserve" x="957.8" y="545.3" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" font-weight="700" fill="#c2255c">Reducers</text></svg>

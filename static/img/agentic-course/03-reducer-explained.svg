<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 560" width="1120" height="560" role="img" aria-label="Replace versus append: what a reducer changes"><defs><marker id="ah2f9e44" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2f9e44"/></marker><marker id="ah2f9e44s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2f9e44"/></marker><marker id="ahe03131" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e03131"/></marker><marker id="ahe03131s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e03131"/></marker></defs><rect x="0" y="0" width="1120" height="560" rx="18" fill="#fffdf7"/><text xml:space="preserve" x="560.0" y="44" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="24" font-weight="700" fill="#1864ab">Replace versus append: what a reducer changes</text><text xml:space="preserve" x="560.0" y="70" text-anchor="middle" font-family="'Inter','Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="14" fill="#868e96">Explanatory board (not shown in the video)</text><rect x="30" y="90" width="520" height="430" rx="14" fill="#fff5f5" fill-opacity="0.35" stroke="#e03131" stroke-width="2" stroke-dasharray="9 6"/><text xml:space="preserve" x="290.0" y="116" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="16" font-weight="700" fill="#c92a2a">No reducer: the key is overwritten</text><rect x="60" y="140" width="460" height="56" rx="9" fill="#f8f9fa" stroke="#6c757d" stroke-width="1.6"/><rect x="59.5" y="139.0" width="460.5" height="54.7" rx="10" fill="none" stroke="#6c757d" stroke-width="1.1" stroke-opacity="0.45"/><text xml:space="preserve" x="290.0" y="160.8" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="14" font-weight="700" fill="#343a40">after turn 1</text><text xml:space="preserve" x="290.0" y="184.2" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" fill="#343a40">messages = [human: Hi, AI: Hello]</text><path d="M290.0,196.0 L290.0,250.0" fill="none" stroke="#e03131" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#ahe03131)"/><rect x="60" y="250" width="460" height="56" rx="9" fill="#fff5f5" stroke="#e03131" stroke-width="1.6"/><rect x="60.1" y="249.6" width="458.7" height="56.0" rx="10" fill="none" stroke="#e03131" stroke-width="1.1" stroke-opacity="0.45"/><text xml:space="preserve" x="290.0" y="270.9" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="14" font-weight="700" fill="#c92a2a">after turn 2</text><text xml:space="preserve" x="290.0" y="294.2" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" fill="#343a40">messages = [AI: I am a bot]</text><text xml:space="preserve" x="290" y="345.0" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" font-weight="700" fill="#c92a2a">The earlier turns are gone, so the chatbot</text><text xml:space="preserve" x="290" y="365.0" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" font-weight="700" fill="#c92a2a">cannot see what was said before.</text><path d="M490.0,275.0 L510.0,295.0" fill="none" stroke="#e03131" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/><path d="M490.0,295.0 L510.0,275.0" fill="none" stroke="#e03131" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/><rect x="570" y="90" width="520" height="430" rx="14" fill="#ebfbee" fill-opacity="0.35" stroke="#2f9e44" stroke-width="2" stroke-dasharray="9 6"/><text xml:space="preserve" x="830.0" y="116" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="16" font-weight="700" fill="#2b8a3e">add_messages: the list grows</text><rect x="600" y="140" width="460" height="56" rx="9" fill="#f8f9fa" stroke="#6c757d" stroke-width="1.6"/><rect x="598.6" y="139.8" width="458.7" height="54.8" rx="10" fill="none" stroke="#6c757d" stroke-width="1.1" stroke-opacity="0.45"/><text xml:space="preserve" x="830.0" y="160.8" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="14" font-weight="700" fill="#343a40">after turn 1</text><text xml:space="preserve" x="830.0" y="184.2" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" fill="#343a40">messages = [human: Hi, AI: Hello]</text><path d="M830.0,196.0 L830.0,250.0" fill="none" stroke="#2f9e44" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#ah2f9e44)"/><rect x="600" y="250" width="460" height="80" rx="9" fill="#ebfbee" stroke="#2f9e44" stroke-width="1.6"/><rect x="599.8" y="251.0" width="458.9" height="79.2" rx="10" fill="none" stroke="#2f9e44" stroke-width="1.1" stroke-opacity="0.45"/><text xml:space="preserve" x="830.0" y="274.1" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="14" font-weight="700" fill="#2b8a3e">after turn 2</text><text xml:space="preserve" x="830.0" y="297.5" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" fill="#343a40">messages = [human: Hi, AI: Hello,</text><text xml:space="preserve" x="830.0" y="314.9" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" fill="#343a40">           AI: I am a bot]</text><text xml:space="preserve" x="830" y="372.0" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" font-weight="700" fill="#2b8a3e">Everything said so far stays in the list, so</text><text xml:space="preserve" x="830" y="392.0" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" font-weight="700" fill="#2b8a3e">the next LLM call sees the whole conversation.</text><text xml:space="preserve" x="830" y="450.0" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" font-weight="400" fill="#343a40">In code:  messages: Annotated[list, add_messages]</text><text xml:space="preserve" x="830" y="474.0" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" font-weight="400" fill="#868e96" font-style="italic">(a message that reuses an existing id replaces that one)</text><path d="M1030.0,290.0 L1036.7,298.0 L1050.0,282.0" fill="none" stroke="#2f9e44" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/><rect x="189.3" y="214.0" width="201.4" height="18" rx="4" fill="#fffdf7" fill-opacity="0.95"/><text xml:space="preserve" x="290.0" y="227.0" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="11" font-weight="700" fill="#e03131">node returns [AI: I am a bot]</text><rect x="729.3" y="214.0" width="201.4" height="18" rx="4" fill="#fffdf7" fill-opacity="0.95"/><text xml:space="preserve" x="830.0" y="227.0" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="11" font-weight="700" fill="#2f9e44">node returns [AI: I am a bot]</text></svg>

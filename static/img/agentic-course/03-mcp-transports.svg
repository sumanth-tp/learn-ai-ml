312" y="208.8" text-anchor="start" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" fill="#343a40">Runs on your machine.</text><text xml:space="preserve" x="312" y="226.2" text-anchor="start" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" fill="#343a40">No port, no URL.</text><text xml:space="preserve" x="312" y="243.7" text-anchor="start" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" fill="#343a40">Best for local testing.</text><rect x="60" y="450" width="470" height="130" rx="9" fill="#fff9db" stroke="#e8a300" stroke-width="1.6"/><rect x="59.8" y="451.0" width="468.9" height="129.2" rx="10" fill="none" stroke="#e8a300" stroke-width="1.1" stroke-opacity="0.45"/><text xml:space="preserve" x="72" y="490.4" text-anchor="start" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="14" font-weight="700" fill="#b35c00">In the client config</text><text xml:space="preserve" x="72" y="513.8" text-anchor="start" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" fill="#343a40">&quot;math&quot;: {&quot;command&quot;: &quot;python&quot;,</text><text xml:space="preserve" x="72" y="531.2" text-anchor="start" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" fill="#343a40">         &quot;args&quot;: [&quot;mathserver.py&quot;],</text><text xml:space="preserve" x="72" y="548.6" text-anchor="start" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" fill="#343a40">         &quot;transport&quot;: &quot;stdio&quot;}</text><rect x="570" y="90" width="520" height="520" rx="14" fill="#fff4e6" fill-opacity="0.35" stroke="#e8590c" stroke-width="2" stroke-dasharray="9 6"/><text xml:space="preserve" x="830.0" y="116" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="16" font-weight="700" fill="#c2410c">streamable HTTP  (weather.py)</text><rect x="600" y="150" width="200" height="80" rx="9" fill="#f3f0ff" stroke="#7048e8" stroke-width="1.6"/><rect x="600.4" y="151.3" width="200.2" height="79.7" rx="10" fill="none" stroke="#7048e8" stroke-width="1.1" stroke-opacity="0.45"/><text xml:space="preserve" x="700.0" y="182.8" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="14" font-weight="700" fill="#5f3dc4">client.py</text><text xml:space="preserve" x="700.0" y="206.2" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" fill="#343a40">MultiServerMCPClient</text><rect x="600" y="330" width="200" height="80" rx="9" fill="#fff4e6" stroke="#e8590c" stroke-width="1.6"/><rect x="601.4" y="328.6" width="201.1" height="79.4" rx="10" fill="none" stroke="#e8590c" stroke-width="1.1" stroke-opacity="0.45"/><text xml:space="preserve" x="700.0" y="354.1" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="14" font-weight="700" fill="#c2410c">web server</text><text xml:space="preserve" x="700.0" y="377.5" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" fill="#343a40">python weather.py</text><text xml:space="preserve" x="700.0" y="394.9" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" fill="#343a40">localhost:8000</text><path d="M700.0,230.0 L700.0,330.0" fill="none" stroke="#e8590c" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#ahe8590c)" marker-start="url(#ahe8590cs)"/><rect x="830" y="150" width="230" height="120" rx="9" fill="#ebfbee" stroke="#2f9e44" stroke-width="1.6"/><rect x="828.9" y="148.9" width="229.4" height="120.9" rx="10" fill="none" stroke="#2f9e44" stroke-width="1.1" stroke-opacity="0.45"/><text xml:space="preserve" x="842" y="185.4" text-anchor="start" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="14" font-weight="700" fill="#2b8a3e">Why use it</text><text xml:space="preserve" x="842" y="208.8" text-anchor="start" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" fill="#343a40">Runs as an API service.</text><text xml:space="preserve" x="842" y="226.2" text-anchor="start" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" fill="#343a40">Reachable by URL,</text><text xml:space="preserve" x="842" y="243.7" text-anchor="start" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" fill="#343a40">can live on another host.</text><rect x="600" y="450" width="470" height="130" rx="9" fill="#fff9db" stroke="#e8a300" stroke-width="1.6"/><rect x="599.0" y="450.2" width="470.4" height="129.6" rx="10" fill="none" stroke="#e8a300" stroke-width="1.1" stroke-opacity="0.45"/><text xml:space="preserve" x="612" y="499.1" text-anchor="start" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="14" font-weight="700" fill="#b35c00">In the client config</text><text xml:space="preserve" x="612" y="522.5" text-anchor="start" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" fill="#343a40">&quot;weather&quot;: {&quot;url&quot;: &quot;http://localhost:8000/mcp&quot;,</text><text xml:space="preserve" x="612" y="539.9" text-anchor="start" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" fill="#343a40">            &quot;transport&quot;: &quot;streamable_http&quot;}</text><rect x="81.3" y="271.0" width="69.4" height="18" rx="4" fill="#fffdf7" fill-opacity="0.95"/><text xml:space="preserve" x="116.0" y="284.0" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="11" font-weight="700" fill="#1c7ed6">spawns it</text><rect x="158.8" y="271.0" width="102.4" height="18" rx="4" fill="#fffdf7" fill-opacity="0.95"/><text xml:space="preserve" x="210.0" y="284.0" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="11" font-weight="700" fill="#1c7ed6">stdin / stdout</text><rect x="652.1" y="271.0" width="95.8" height="18" rx="4" fill="#fffdf7" fill-opacity="0.95"/><text xml:space="preserve" x="700.0" y="284.0" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="11" font-weight="700" fill="#e8590c">HTTP requests</text></svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 680" width="1160" height="680" role="img" aria-label="Vectorless RAG: the real picture"><defs></defs><rect x="0" y="0" width="1160" height="680" rx="18" fill="#fffdf7"/><text xml:space="preserve" x="580.0" y="44" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="24" font-weight="700" fill="#1864ab">Vectorless RAG: the real picture</text><text xml:space="preserve" x="580.0" y="70" text-anchor="middle" font-family="'Inter','Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="14" fill="#868e96">Different trade-offs: better for some workloads, worse for others (instructor&#x27;s slide at 7:48:15)</text><rect x="20" y="95" width="550" height="560" rx="14" fill="#ebfbee" fill-opacity="0.35" stroke="#2f9e44" stroke-width="2" stroke-dasharray="9 6"/><text xml:space="preserve" x="295.0" y="121" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="16" font-weight="700" fill="#2b8a3e">STRENGTHS</text><rect x="590" y="95" width="550" height="560" rx="14" fill="#fff5f5" fill-opacity="0.35" stroke="#e03131" stroke-width="2" stroke-dasharray="9 6"/><text xml:space="preserve" x="865.0" y="121" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="16" font-weight="700" fill="#c92a2a">WEAKNESSES</text><rect x="44" y="135" width="502" height="86" rx="9" fill="#ebfbee" stroke="#2f9e44" stroke-width="1.6"/><rect x="43.5" y="134.0" width="502.5" height="84.7" rx="10" fill="none" stroke="#2f9e44" stroke-width="1.1" stroke-opacity="0.45"/><text xml:space="preserve" x="56" y="171.2" text-anchor="start" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" font-weight="700" fill="#2b8a3e">Preserves document context</text><text xml:space="preserve" x="56" y="193.2" text-anchor="start" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="11" fill="#343a40">Sections stay whole, no broken references</text><path d="M512.0,159.0 L518.0,166.0 L529.0,151.0" fill="none" stroke="#2f9e44" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round"/><rect x="44" y="235" width="502" height="86" rx="9" fill="#ebfbee" stroke="#2f9e44" stroke-width="1.6"/><rect x="44.1" y="234.6" width="500.7" height="86.0" rx="10" fill="none" stroke="#2f9e44" stroke-width="1.1" stroke-opacity="0.45"/><text xml:space="preserve" x="56" y="271.2" text-anchor="start" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" font-weight="700" fill="#2b8a3e">Cross-section reasoning</text><text xml:space="preserve" x="56" y="293.2" text-anchor="start" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="11" fill="#343a40">The LLM can compare, contrast and synthesise</text><path d="M512.0,259.0 L518.0,266.0 L529.0,251.0" fill="none" stroke="#2f9e44" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round"/><rect x="44" y="335" width="502" height="86" rx="9" fill="#ebfbee" stroke="#2f9e44" stroke-width="1.6"/><rect x="42.6" y="334.8" width="500.7" height="84.8" rx="10" fill="none" stroke="#2f9e44" stroke-width="1.1" stroke-opacity="0.45"/><text xml:space="preserve" x="56" y="371.2" text-anchor="start" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" font-weight="700" fill="#2b8a3e">Explainable retrieval</text><text xml:space="preserve" x="56" y="393.2" text-anchor="start" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="11" fill="#343a40">Returns the navigation path, not a cosine score</text><path d="M512.0,359.0 L518.0,366.0 L529.0,351.0" fill="none" stroke="#2f9e44" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round"/><rect x="44" y="435" width="502" height="86" rx="9" fill="#ebfbee" stroke="#2f9e44" stroke-width="1.6"/><rect x="43.8" y="436.0" width="500.9" height="85.2" rx="10" fill="none" stroke="#2f9e44" stroke-width="1.1" stroke-opacity="0.45"/><text xml:space="preserve" x="56" y="471.2" text-anchor="start" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" font-weight="700" fill="#2b8a3e">No embedding pipeline</text><text xml:space="preserve" x="56" y="493.2" text-anchor="start" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="11" fill="#343a40">Skip the embed / index / refresh complexity</text><path d="M512.0,459.0 L518.0,466.0 L529.0,451.0" fill="none" stroke="#2f9e44" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round"/><rect x="44" y="535" width="502" height="86" rx="9" fill="#ebfbee" stroke="#2f9e44" stroke-width="1.6"/><rect x="44.4" y="536.3" width="502.2" height="85.7" rx="10" fill="none" stroke="#2f9e44" stroke-width="1.1" stroke-opacity="0.45"/><text xml:space="preserve" x="56" y="571.2" text-anchor="start" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" font-weight="700" fill="#2b8a3e">Plays well with structure</text><text xml:space="preserve" x="56" y="593.2" text-anchor="start" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="11" fill="#343a40">Reports, contracts, filings, textbooks shine</text><path d="M512.0,559.0 L518.0,566.0 L529.0,551.0" fill="none" stroke="#2f9e44" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round"/><rect x="614" y="135" width="502" height="86" rx="9" fill="#fff5f5" stroke="#e03131" stroke-width="1.6"/><rect x="615.4" y="133.6" width="503.1" height="85.4" rx="10" fill="none" stroke="#e03131" stroke-width="1.1" stroke-opacity="0.45"/><text xml:space="preserve" x="626" y="171.2" text-anchor="start" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" font-weight="700" fill="#c92a2a">Higher per-query cost</text><text xml:space="preserve" x="626" y="193.2" text-anchor="start" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="11" fill="#343a40">Multiple LLM calls to traverse the tree</text><path d="M1082.0,151.0 L1098.0,167.0" fill="none" stroke="#e03131" stroke-width="3.2" stroke-linejoin="round" stroke-linecap="round"/><path d="M1082.0,167.0 L1098.0,151.0" fill="none" stroke="#e03131" stroke-width="3.2" stroke-linejoin="round" stroke-linecap="round"/><rect x="614" y="235" width="502" height="86" rx="9" fill="#fff5f5" stroke="#e03131" stroke-width="1.6"/><rect x="612.9" y="233.9" width="501.4" height="86.9" rx="10" fill="none" stroke="#e03131" stroke-width="1.1" stroke-opacity="0.45"/><text xml:space="preserve" x="626" y="271.2" text-anchor="start" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" font-weight="700" fill="#c92a2a">Higher latency</text><text xml:space="preserve" x="626" y="293.2" text-anchor="start" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="11" fill="#343a40">Several hundred ms to several seconds per query</text><path d="M1082.0,251.0 L1098.0,267.0" fill="none" stroke="#e03131" stroke-width="3.2" stroke-linejoin="round" stroke-linecap="round"/><path d="M1082.0,267.0 L1098.0,251.0" fill="none" stroke="#e03131" stroke-width="3.2" stroke-linejoin="round" stroke-linecap="round"/><rect x="614" y="335" width="502" height="86" rx="9" fill="#fff5f5" stroke="#e03131" stroke-width="1.6"/><rect x="613.0" y="335.2" width="502.4" height="85.6" rx="10" fill="none" stroke="#e03131" stroke-width="1.1" stroke-opacity="0.45"/><text xml:space="preserve" x="626" y="371.2" text-anchor="start" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" font-weight="700" fill="#c92a2a">Does not scale to millions</text><text xml:space="preserve" x="626" y="393.2" text-anchor="start" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="11" fill="#343a40">Works for tens to thousands of docs, not internet scale</text><path d="M1082.0,351.0 L1098.0,367.0" fill="none" stroke="#e03131" stroke-width="3.2" stroke-linejoin="round" stroke-linecap="round"/><path d="M1082.0,367.0 L1098.0,351.0" fill="none" stroke="#e03131" stroke-width="3.2" stroke-linejoin="round" stroke-linecap="round"/><rect x="614" y="435" width="502" height="86" rx="9" fill="#fff5f5" stroke="#e03131" stroke-width="1.6"/><rect x="614.1" y="433.7" width="500.7" height="85.1" rx="10" fill="none" stroke="#e03131" stroke-width="1.1" stroke-opacity="0.45"/><text xml:space="preserve" x="626" y="471.2" text-anchor="start" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" font-weight="700" fill="#c92a2a">Needs structured docs</text><text xml:space="preserve" x="626" y="493.2" text-anchor="start" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="11" fill="#343a40">Random blog posts? The tree adds little value</text><path d="M1082.0,451.0 L1098.0,467.0" fill="none" stroke="#e03131" stroke-width="3.2" stroke-linejoin="round" stroke-linecap="round"/><path d="M1082.0,467.0 L1098.0,451.0" fill="none" stroke="#e03131" stroke-width="3.2" stroke-linejoin="round" stroke-linecap="round"/><rect x="614" y="535" width="502" height="86" rx="9" fill="#fff5f5" stroke="#e03131" stroke-width="1.6"/><rect x="614.5" y="534.8" width="501.4" height="86.3" rx="10" fill="none" stroke="#e03131" stroke-width="1.1" stroke-opacity="0.45"/><text xml:space="preserve" x="626" y="571.2" text-anchor="start" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" font-weight="700" fill="#c92a2a">Less mature tooling</text><text xml:space="preserve" x="626" y="593.2" text-anchor="start" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="11" fill="#343a40">PageIndex and a few others; the ecosystem is young</text><path d="M1082.0,551.0 L1098.0,567.0" fill="none" stroke="#e03131" stroke-width="3.2" stroke-linejoin="round" stroke-linecap="round"/><path d="M1082.0,567.0 L1098.0,551.0" fill="none" stroke="#e03131" stroke-width="3.2" stroke-linejoin="round" stroke-linecap="round"/></svg>

ation Mono',monospace" font-size="14" font-weight="700" fill="#c2410c">Secrets</text><text xml:space="preserve" x="1027.5" y="382.5" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" fill="#343a40">keys in env, logs,</text><text xml:space="preserve" x="1027.5" y="399.9" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" fill="#343a40">traces or prompts</text><rect x="865" y="430" width="325" height="85" rx="9" fill="#fff4e6" stroke="#e8590c" stroke-width="1.6"/><rect x="865.1" y="428.7" width="323.7" height="84.1" rx="10" fill="none" stroke="#e8590c" stroke-width="1.1" stroke-opacity="0.45"/><text xml:space="preserve" x="1027.5" y="456.6" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="14" font-weight="700" fill="#c2410c">Spend and capacity</text><text xml:space="preserve" x="1027.5" y="480.0" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" fill="#343a40">runaway loops, huge</text><text xml:space="preserve" x="1027.5" y="497.4" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" fill="#343a40">contexts, unbounded use</text><path d="M340.0,185.0 L450.0,260.0" fill="none" stroke="#e03131" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#ahe03131)"/><path d="M340.0,280.0 L450.0,306.0" fill="none" stroke="#e03131" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#ahe03131)"/><path d="M340.0,375.0 L450.0,352.0" fill="none" stroke="#e03131" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#ahe03131)"/><path d="M340.0,472.5 L450.0,398.0" fill="none" stroke="#e03131" stroke-width="1.8" stroke-linejoin="round" marker-end="url
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 860" width="900" height="860" role="img" aria-label="Retrieval process in vectorless RAG"><defs><marker id="ah343a40" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#343a40"/></marker><marker id="ah343a40s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#343a40"/></marker><marker id="ah7048e8" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7048e8"/></marker><marker id="ah7048e8s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7048e8"/></marker><marker id="ahe8590c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e8590c"/></marker><marker id="ahe8590cs" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e8590c"/></marker></defs><rect x="0" y="0" width="900" height="860" rx="18" fill="#fffdf7"/><text xml:space="preserve" x="450.0" y="44" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="24" font-weight="700" fill="#1864ab">Retrieval process in vectorless RAG</text><text xml:space="preserve" x="450.0" y="70" text-anchor="middle" font-family="'Inter','Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="14" fill="#868e96">Read the tree, reason, fetch, check, and loop back if the answer is not there yet</text><rect x="340" y="95" width="260" height="50" rx="9" fill="#f8f9fa" stroke="#6c757d" stroke-width="1.6"/><rect x="339.5" y="94.0" width="260.5" height="48.7" rx="10" fill="none" stroke="#6c757d" stroke-width="1.1" stroke-opacity="0.45"/><text xml:space="preserve" x="470.0" y="124.5" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="14" font-weight="700" fill="#343a40">User query</text><rect x="280" y="185" width="380" height="66" rx="9" fill="#f3f0ff" stroke="#7048e8" stroke-width="1.6"/><rect x="280.1" y="184.6" width="378.7" height="66.0" rx="10" fill="none" stroke="#7048e8" stroke-width="1.1" stroke-opacity="0.45"/><text xml:space="preserve" x="470.0" y="211.2" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" font-weight="700" fill="#5f3dc4">Step 1: read the tree index</text><text xml:space="preserve" x="470.0" y="233.2" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="11" fill="#343a40">LLM scans titles, pages, summaries in context</text><rect x="280" y="291" width="380" height="66" rx="9" fill="#f3f0ff" stroke="#7048e8" stroke-width="1.6"/><rect x="278.6" y="290.8" width="378.7" height="64.8" rx="10" fill="none" stroke="#7048e8" stroke-width="1.1" stroke-opacity="0.45"/><text xml:space="preserve" x="470.0" y="317.2" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" font-weight="700" fill="#5f3dc4">Step 2: reason and select node</text><text xml:space="preserve" x="470.0" y="339.2" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="11" fill="#343a40">Returns thinking + node_list JSON</text><rect x="280" y="397" width="380" height="66" rx="9" fill="#f3f0ff" stroke="#7048e8" stroke-width="1.6"/><rect x="279.8" y="398.0" width="378.9" height="65.2" rx="10" fill="none" stroke="#7048e8" stroke-width="1.1" stroke-opacity="0.45"/><text xml:space="preserve" x="470.0" y="423.2" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" font-weight="700" fill="#5f3dc4">Step 3: extract section content</text><text xml:space="preserve" x="470.0" y="445.2" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="11" fill="#343a40">Fetch raw pages for the selected node_ids</text><polygon points="470,492.0 635.0,548 470,604.0 305.0,548" fill="#fff9db" stroke="#e8a300" stroke-width="1.8"/><text xml:space="preserve" x="470" y="543.8" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" font-weight="700" fill="#b35c00">Sufficient to answer?</text><text xml:space="preserve" x="470" y="560.6" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" font-weight="700" fill="#b35c00">LLM evaluates completeness</text><rect x="620" y="655" width="330" height="66" rx="9" fill="#ebfbee" stroke="#2f9e44" stroke-width="1.6"/><rect x="620.4" y="656.3" width="330.2" height="65.7" rx="10" fill="none" stroke="#2f9e44" stroke-width="1.1" stroke-opacity="0.45"/><text xml:space="preserve" x="785.0" y="681.2" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" font-weight="700" fill="#2b8a3e">Step 4: generate answer</text><text xml:space="preserve" x="785.0" y="703.2" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="11" fill="#343a40">Cited by section title + page</text><rect x="60" y="655" width="330" height="70" rx="9" fill="#fff4e6" stroke="#e8590c" stroke-width="1.6" stroke-dasharray="6 5"/><text xml:space="preserve" x="225.0" y="675.3" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" font-weight="700" fill="#c2410c">Cross-reference follow</text><text xml:space="preserve" x="225.0" y="697.2" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="11" fill="#343a40">&#x27;See Appendix G&#x27; makes the LLM</text><text xml:space="preserve" x="225.0" y="713.2" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="11" fill="#343a40">navigate the tree to that node</text><path d="M470.0,145.0 L470.0,185.0" fill="none" stroke="#343a40" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#ah343a40)"/><path d="M470.0,251.0 L470.0,291.0" fill="none" stroke="#343a40" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#ah343a40)"/><path d="M470.0,357.0 L470.0,397.0" fill="none" stroke="#343a40" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#ah343a40)"/><path d="M470.0,463.0 L470.0,492.0" fill="none" stroke="#343a40" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#ah343a40)"/><path d="M635.0,548.0 L785.0,548.0 L785.0,655.0" fill="none" stroke="#343a40" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#ah343a40)"/><path d="M305.0,548.0 L110.0,548.0 L110.0,324.0 L280.0,324.0" fill="none" stroke="#7048e8" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#ah7048e8)"/><path d="M470.0,604.0 L470.0,625.0 L225.0,625.0 L225.0,655.0" fill="none" stroke="#e8590c" stroke-width="1.8" stroke-dasharray="7 5" stroke-linejoin="round" marker-end="url(#ahe8590c)"/><text xml:space="preserve" x="470" y="790.0" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" font-weight="700" fill="#2b8a3e">The answer carries its own path: which sections were read, and why.</text><text xml:space="preserve" x="470" y="815.0" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" font-weight="400" fill="#868e96">Retrieval is a loop of LLM calls, not a single nearest-neighbour lookup.</text><rect x="695.1" y="539.0" width="29.8" height="18" rx="4" fill="#fffdf7" fill-opacity="0.95"/><text xml:space="preserve" x="710.0" y="552.0" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="11" font-weight="700" fill="#343a40">yes</text><rect x="62.1" y="427.0" width="95.8" height="18" rx="4" fill="#fffdf7" fill-opacity="0.95"/><text xml:space="preserve" x="110.0" y="440.0" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="11" font-weight="700" fill="#7048e8">no: loop back</text><rect x="285.0" y="609.0" width="76.0" height="32" rx="4" fill="#fffdf7" fill-opacity="0.95"/><text xml:space="preserve" x="323.0" y="622.0" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="11" font-weight="700" fill="#e8590c">may follow</text><text xml:space="preserve" x="323.0" y="636.0" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="11" font-weight="700" fill="#e8590c">references</text></svg>

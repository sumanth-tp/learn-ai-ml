de','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" fill="#343a40">(multiply ...)</text><path d="M600.0,400.0 L480.0,400.0" fill="none" stroke="#e8590c" stroke-width="1.8" stroke-dasharray="7 5" stroke-linejoin="round" marker-end="url(#ahe8590c)"/><rect x="850" y="340" width="230" height="120" rx="9" fill="#fff9db" stroke="#e8a300" stroke-width="1.6"/><rect x="848.6" y="339.8" width="228.7" height="118.8" rx="10" fill="none" stroke="#e8a300" stroke-width="1.1" stroke-opacity="0.45"/><text xml:space="preserve" x="965.0" y="375.4" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="14" font-weight="700" fill="#b35c00">LLM  { doc string }</text><text xml:space="preserve" x="965.0" y="398.8" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" fill="#343a40">each tool carries a</text><text xml:space="preserve" x="965.0" y="416.2" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" fill="#343a40">doc string the LLM</text><text xml:space="preserve" x="965.0" y="433.6" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" fill="#343a40">reads</text><path d="M850.0,400.0 L830.0,400.0" fill="none" stroke="#e8a300" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#ahe8a300)"/><rect x="600" y="500" width="480" height="200" rx="9" fill="#ebfbee" stroke="#2f9e44" stroke-width="1.6"/><rect x="599.8" y="501.0" width="478.9" height="199.2" rx="10" fill="none" stroke="#2f9e44" stroke-width="1.1" stroke-opacity="0.45"/><text xml:space="preserve" x="612" y="558.0" text-anchor="start" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="14" font-weight="700" fill="#2b8a3e">Two ideas to keep apart</text><text xml:space="preserve" x="612" y="581.4" text-anchor="start" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" fill="#343a40">1  Binding: LLM + tools. The LLM learns which</text><text xml:space="preserve" x="612" y="598.8" text-anchor="start" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" fill="#343a40">   tools exist (like weapons it can reach for).</text><text xml:space="preserve" x="612" y="616.2" text-anchor="start" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" fill="#343a40">2  Tool node: when the LLM does call a tool,</text><text xml:space="preserve" x="612" y="633.6" text-anchor="start" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" fill="#343a40">   this node actually runs it and returns a</text><text xml:space="preserve" x="612" y="651.0" text-anchor="start" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" fill="#343a40">   ToolMessage.</text><rect x="308.5" y="181.0" width="43.0" height="18" rx="4" fill="#fffdf7" fill-opacity="0.95"/><text xml:space="preserve" x="330.0" y="194.0" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="11" font-weight="700" fill="#e8590c">input</text><rect x="371.8" y="316.0" width="69.4" height="18" rx="4" fill="#fffdf7" fill-opacity="0.95"/><text xml:space="preserve" x="406.5" y="329.0" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="11" font-weight="700" fill="#e8590c">tool call</text><rect x="95.4" y="396.0" width="89.2" height="18" rx="4" fill="#fffdf7" fill-opacity="0.95"/><text xml:space="preserve" x="140.0" y="409.0" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="11" font-weight="700" fill="#6c757d">no tool call</text><rect x="395.2" y="466.4" width="49.6" height="18" rx="4" fill="#fffdf7" fill-opacity="0.95"/><text xml:space="preserve" x="420.0" y="479.4" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="11" font-weight="700" fill="#e8590c">output</text></svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 540" width="1180" height="540" role="img" aria-label="ROC ignores prevalence; precision does not"><defs></defs><rect x="0" y="0" width="1180" height="540" rx="18" fill="#fffdf7"/><text xml:space="preserve" x="590.0" y="44" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="24" font-weight="700" fill="#1864ab">ROC ignores prevalence; precision does not</text><text xml:space="preserve" x="590.0" y="70" text-anchor="middle" font-family="'Inter','Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="14" fill="#868e96">Positives ~ N(1.5, 1), negatives ~ N(0, 1), threshold 1.0</text><rect x="40" y="100" width="330" height="150" rx="9" fill="#e7f5ff" stroke="#1c7ed6" stroke-width="1.6"/><rect x="39.5" y="99.0" width="330.5" height="148.7" rx="10" fill="none" stroke="#1c7ed6" stroke-width="1.1" stroke-opacity="0.45"/><text xml:space="preserve" x="205.0" y="146.8" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="16" font-weight="700" fill="#1864ab">Same ranking quality</text><text xml:space="preserve" x="205.0" y="173.0" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="14" fill="#343a40">ROC AUC = Phi(1.5 / sqrt 2)</text><text xml:space="preserve" x="205.0" y="193.3" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="14" fill="#343a40">= 0.856</text><text xml:space="preserve" x="205.0" y="213.7" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="14" fill="#343a40">at every prevalence</text><rect x="410" y="100" width="630" height="40" rx="6" fill="#1c7ed6"/><text xml:space="preserve" x="418" y="120.0" font-family="
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 580" width="1240" height="580" role="img" aria-label="Three ways to hold data back"><defs></defs><rect x="0" y="0" width="1240" height="580" rx="18" fill="#fffdf7"/><text xml:space="preserve" x="620.0" y="44" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="24" font-weight="700" fill="#1864ab">Three ways to hold data back</text><text xml:space="preserve" x="620.0" y="70" text-anchor="middle" font-family="'Inter','Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="14" fill="#868e96">Breast-cancer data, logistic regression; drift data for the time split</text><rect x="25" y="95" width="380" height="440" rx="14" fill="#fff5f5" fill-opacity="0.35" stroke="#e03131" stroke-width="2" stroke-dasharray="9 6"/><text xml:space="preserve" x="215.0" y="121" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="16" font-weight="700" fill="#c92a2a">One split</text><rect x="50" y="150" width="240" height="30" rx="4" fill="#74c0fc" stroke="#1c7ed6"/><rect x="290" y="150" width="90" height="30" rx="4" fill="#ffa94d" stroke="#e8590c"/><text xml:space="preserve" x="170" y="170.0" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" font-weight="700" fill="#1864ab">train 80%</text><text xml:space="preserve" x="335" y="170.0" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" font-weight="700" fill="#c2410c">test 20%</text><rect x="50" y="215" width="330" height="120" rx="9" fill="#fff5f5" stroke="#e03131" stroke-width="1.6"/><rect x="49.5" y="214.0" width="330.5" height="118.7" rx="10" fill="none" stroke="#e03131" stroke-width="1.1" stroke-opacity="0.45"/><text xml:space="preserve" x="215.0" y="248.6" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="15" font-weight="700" fill="#c92a2a">Luck of the draw</text><text xml:space="preserve" x="215.0" y="273.5" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" fill="#343a40">20 different random splits:</text><text xml:space="preserve" x="215.0" y="292.3" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" fill="#343a40">accuracy 0.947 to 0.991</text><text xml:space="preserve" x="215.0" y="311.2" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" fill="#343a40">std 0.011</text><rect x="50" y="360" width="330" height="150" rx="9" fill="#fff9db" stroke="#e8a300" stroke-width="1.6"/><rect x="50.1" y="359.6" width="328.7" height="150.0" rx="10" fill="none" stroke="#e8a300" stroke-width="1.1" stroke-opacity="0.45"/><text xml:space="preserve" x="215.0" y="408.6" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="15" font-weight="700" fill="#b35c00">Why it matters</text><text xml:space="preserve" x="215.0" y="433.5" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" fill="#343a40">One number from one split can</text><text xml:space="preserve" x="215.0" y="452.3" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" fill="#343a40">look better or worse than the</text><text xml:space="preserve" x="215.0" y="471.2" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" fill="#343a40">truth by several points.</text><rect x="425" y="95" width="390" height="440" rx="14" fill="#ebfbee" fill-opacity="0.35" stroke="#2f9e44" stroke-width="2" stroke-dasharray="9 6"/><text xml:space="preserve" x="620.0" y="121" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="16" font-weight="700" fill="#2b8a3e">5-fold cross-validation</text><rect x="450" y="150" width="64" height="30" rx="4" fill="#ffa94d" stroke="#e8590c"/><rect x="518" y="150" width="64" height="30" rx="4" fill="#74c0fc" stroke="#1c7ed6"/><rect x="586" y="150" width="64" height="30" rx="4" fill="#74c0fc" stroke="#1c7ed6"/><rect x="654" y="150" width="64" height="30" rx="4" fill="#74c0fc" stroke="#1c7ed6"/><rect x="722" y="150" width="64" height="30" rx="4" fill="#74c0fc" stroke="#1c7ed6"/><rect x="450" y="188" width="64" height="30" rx="4" fill="#74c0fc" stroke="#1c7ed6"/><rect x="518" y="188" width="64" height="30" rx="4" fill="#ffa94d" stroke="#e8590c"/><rect x="586" y="188" width="64" height="30" rx="4" fill="#74c0fc" stroke="#1c7ed6"/><rect x="654" y="188" width="64" height="30" rx="4" fill="#74c0fc" stroke="#1c7ed6"/><rect x="722" y="188" width="64" height="30" rx="4" fill="#74c0fc" stroke="#1c7ed6"/><rect x="450" y="226" width="64" height="30" rx="4" fill="#74c0fc" stroke="#1c7ed6"/><rect x="518" y="226" width="64" height="30" rx="4" fill="#74c0fc" stroke="#1c7ed6"/><rect x="586" y="226" width="64" height="30" rx="4" fill="#ffa94d" stroke="#e8590c"/><rect x="654" y="226" width="64" height="30" rx="4" fill="#74c0fc" stroke="#1c7ed6"/><rect x="722" y="226" width="64" height="30" rx="4" fill="#74c0fc" stroke="#1c7ed6"/><rect x="450" y="264" width="64" height="30" rx="4" fill="#74c0fc" stroke="#1c7ed6"/><rect x="518" y="264" width="64" height="30" rx="4" fill="#74c0fc" stroke="#1c7ed6"/><rect x="586" y="264" width="64" height="30" rx="4" fill="#74c0fc" stroke="#1c7ed6"/><rect x="654" y="264" width="64" height="30" rx="4" fill="#ffa94d" stroke="#e8590c"/><rect x="722" y="264" width="64" height="30" rx="4" fill="#74c0fc" stroke="#1c7ed6"/><rect x="450" y="302" width="64" height="30" rx="4" fill="#74c0fc" stroke="#1c7ed6"/><rect x="518" y="302" width="64" height="30" rx="4" fill="#74c0fc" stroke="#1c7ed6"/><rect x="586" y="302" width="64" height="30" rx="4" fill="#74c0fc" stroke="#1c7ed6"/><rect x="654" y="302" width="64" height="30" rx="4" fill="#74c0fc" stroke="#1c7ed6"/><rect x="722" y="302" width="64" height="30" rx="4" fill="#ffa94d" stroke="#e8590c"/><text xml:space="preserve" x="620" y="358.0" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" font-weight="400" fill="#343a40" font-style="italic">orange = held-out fold, rotated</text><rect x="450" y="385" width="340" height="125" rx="9" fill="#ebfbee" stroke="#2f9e44" stroke-width="1.6"/><rect x="448.6" y="384.8" width="338.7" height="123.8" rx="10" fill="none" stroke="#2f9e44" stroke-width="1.1" stroke-opacity="0.45"/><text xml:space="preserve" x="620.0" y="421.1" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="15" font-weight="700" fill="#2b8a3e">Every row tested once</text><text xml:space="preserve" x="620.0" y="446.0" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" fill="#343a40">fold scores 0.956 to 1.000</text><text xml:space="preserve" x="620.0" y="464.8" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" fill="#343a40">mean 0.979, std 0.014</text><text xml:space="preserve" x="620.0" y="483.7" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" fill="#343a40">stratified keeps class mix</text><rect x="835" y="95" width="380" height="440" rx="14" fill="#f3f0ff" fill-opacity="0.35" stroke="#7048e8" stroke-width="2" stroke-dasharray="9 6"/><text xml:space="preserve" x="1025.0" y="121" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="16" font-weight="700" fill="#5f3dc4">Time-ordered split</text><rect x="860" y="150" width="70" height="30" rx="4" fill="#74c0fc" stroke="#1c7ed6"/><rect x="936" y="150" width="58" height="30" rx="4" fill="#ffa94d" stroke="#e8590c"/><rect x="860" y="188" width="120" height="30" rx="4" fill="#74c0fc" stroke="#1c7ed6"/><rect x="986" y="188" width="58" height="30" rx="4" fill="#ffa94d" stroke="#e8590c"/><rect x="860" y="226" width="170" height="30" rx="4" fill="#74c0fc" stroke="#1c7ed6"/><rect x="1036" y="226" width="58" height="30" rx="4" fill="#ffa94d" stroke="#e8590c"/><text xml:space="preserve" x="1025" y="278.0" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" font-weight="400" fill="#343a40" font-style="italic">the test block is always later</text><rect x="860" y="300" width="330" height="90" rx="9" fill="#fff4e6" stroke="#e8590c" stroke-width="1.6"/><rect x="859.8" y="301.0" width="328.9" height="89.2" rx="10" fill="none" stroke="#e8590c" stroke-width="1.1" stroke-opacity="0.45"/><text xml:space="preserve" x="1025.0" y="328.0" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="15" font-weight="700" fill="#c2410c">Shuffled KFold</text><text xml:space="preserve" x="1025.0" y="352.9" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" fill="#343a40">mean accuracy 0.730</text><text xml:space="preserve" x="1025.0" y="371.7" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" fill="#343a40">(neighbours in time leak)</text><rect x="860" y="405" width="330" height="105" rx="9" fill="#f3f0ff" stroke="#7048e8" stroke-width="1.6"/><rect x="860.4" y="406.3" width="330.2" height="104.7" rx="10" fill="none" stroke="#7048e8" stroke-width="1.1" stroke-opacity="0.45"/><text xml:space="preserve" x="1025.0" y="431.1" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="15" font-weight="700" fill="#5f3dc4">TimeSeriesSplit</text><text xml:space="preserve" x="1025.0" y="456.0" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" fill="#343a40">mean accuracy 0.681</text><text xml:space="preserve" x="1025.0" y="474.8" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" fill="#343a40">the honest, lower number when</text><text xml:space="preserve" x="1025.0" y="493.7" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" fill="#343a40">the world drifts</text></svg>

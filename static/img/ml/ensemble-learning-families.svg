<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 660" width="1240" height="660" role="img" aria-label="Three ways to build an ensemble"><defs><marker id="ah343a40" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#343a40"/></marker><marker id="ah343a40s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#343a40"/></marker></defs><rect x="0" y="0" width="1240" height="660" rx="18" fill="#fffdf7"/><text xml:space="preserve" x="620.0" y="44" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="24" font-weight="700" fill="#1864ab">Three ways to build an ensemble</text><text xml:space="preserve" x="620.0" y="70" text-anchor="middle" font-family="'Inter','Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="14" fill="#868e96">Bagging cuts variance, boosting cuts bias, stacking learns the blend</text><rect x="20" y="95" width="385" height="430" rx="14" fill="#e7f5ff" fill-opacity="0.35" stroke="#1c7ed6" stroke-width="2" stroke-dasharray="9 6"/><text xml:space="preserve" x="212.5" y="121" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="16" font-weight="700" fill="#1864ab">Bagging (parallel)</text><rect x="45" y="140" width="335" height="70" rx="9" fill="#e7f5ff" stroke="#1c7ed6" stroke-width="1.6"/><rect x="44.5" y="139.0" width="335.5" height="68.7" rx="10" fill="none" stroke="#1c7ed6" stroke-width="1.1" stroke-opacity="0.45"/><text xml:space="preserve" x="212.5" y="159.2" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="14" font-weight="700" fill="#1864ab">bootstrap resamples</text><text xml:space="preserve" x="212.5" y="182.6" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" fill="#343a40">63.2% of rows distinct,</text><text xml:space="preserve" x="212.5" y="200.0" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" fill="#343a40">36.8% out-of-bag</text><rect x="45" y="240" width="335" height="56" rx="9" fill="#e7f5ff" stroke="#1c7ed6" stroke-width="1.6"/><rect x="45.1" y="239.6" width="333.7" height="56.0" rx="10" fill="none" stroke="#1c7ed6" stroke-width="1.1" stroke-opacity="0.45"/><text xml:space="preserve" x="212.5" y="272.6" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="14" font-weight="700" fill="#1864ab">trees train independently</text><rect x="45" y="326" width="335" height="56" rx="9" fill="#e7f5ff" stroke="#1c7ed6" stroke-width="1.6"/><rect x="43.6" y="325.8" width="333.7" height="54.8" rx="10" fill="none" stroke="#1c7ed6" stroke-width="1.1" stroke-opacity="0.45"/><text xml:space="preserve" x="212.5" y="358.6" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="14" font-weight="700" fill="#1864ab">vote or average</text><path d="M212.5,210.0 L212.5,240.0" fill="none" stroke="#343a40" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#ah343a40)"/><path d="M212.5,296.0 L212.5,326.0" fill="none" stroke="#343a40" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#ah343a40)"/><rect x="45" y="412" width="335" height="95" rx="9" fill="#ebfbee" stroke="#2f9e44" stroke-width="1.6"/><rect x="44.8" y="413.0" width="333.9" height="94.2" rx="10" fill="none" stroke="#2f9e44" stroke-width="1.1" stroke-opacity="0.45"/><text xml:space="preserve" x="212.5" y="434.9" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono
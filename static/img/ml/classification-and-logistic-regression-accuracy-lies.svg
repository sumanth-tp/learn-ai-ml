"468.9" width="559.4" height="97.7" rx="10" fill="none" stroke="#e8590c" stroke-width="1.1" stroke-opacity="0.45"/><text xml:space="preserve" x="646" y="496.0" text-anchor="start" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="14" font-weight="700" fill="#c2410c">Read the row, not the headline</text><text xml:space="preserve" x="646" y="517.9" text-anchor="start" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="11" fill="#343a40">• moving the threshold from 0.5 to 0.2 lowers accuracy yet nearly doubles recall</text><text xml:space="preserve" x="646" y="533.9" text-anchor="start" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="11" fill="#343a40">• class weights buy more recall again, at a steep price in precision</text><text xml:space="preserve" x="646" y="549.9" text-anchor="start" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="11" fill="#343a40">• pick the trade-off from the cost of each kind of mistake</text></svg>

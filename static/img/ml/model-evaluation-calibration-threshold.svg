xt-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" fill="#343a40">Isotonic needs plenty of cases; with few it</text><text xml:space="preserve" x="305.0" y="485.5" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" fill="#343a40">wobbles. Platt is steadier on small data.</text><rect x="615" y="95" width="560" height="440" rx="14" fill="#f3f0ff" fill-opacity="0.35" stroke="#7048e8" stroke-width="2" stroke-dasharray="9 6"/><text xml:space="preserve" x="895.0" y="121" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="16" font-weight="700" fill="#5f3dc4">Cost-based threshold</text><rect x="635" y="140" width="520" height="80" rx="9" fill="#f3f0ff" stroke="#7048e8" stroke-width="1.6"/><rect x="633.6" y="139.8" width="518.7" height="78.8" rx="10" fill="none" stroke="#7048e8" stroke-width="1.1" stroke-opacity="0.45"/><text xml:space="preserve" x="895.0" y="161.9" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="16" font-weight="700" fill="#5f3dc4">Costs</text><text xml:space="preserve" x="895.0" y="188.2" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="14" fill="#343a40">miss a positive 500, false alarm 20</text><text xml:space="preserve" x="895.0" y="208.5" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="14" fill="#343a40">optimum = 20 / (20 + 500) = 0.038</text><rect x="635" y="240" width="520" height="38" rx="6" fill="#7048e8"/><text xml:space="preserve" x="643" y="260.0" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" font-weight="700" fill="#ffffff">threshold</text><text xml:space="preserve" x="903" y="260.0" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" font-weight="700" fill="#ffffff">total cost</text><text xml:space="preserve" x="1033" y="260.0" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" font-weight="700" fill="#ffffff">F1</text><line x1="635" y1="278" x2="1155" y2="278" stroke="#dee2e6"/><text xml:space="preserve" x="643" y="298.0" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" font-weight="400" fill="#343a40">0.50 (the default)</text><text xml:space="preserve" x="903" y="298.0" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" font-weight="400" fill="#343a40">119,440</text><text xml:space="preserve" x="1033" y="298.0" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" font-weight="400" fill="#343a40">0.607</text><line x1="635" y1="316" x2="1155" y2="316" stroke="#dee2e6"/><rect x="635" y="316" width="520" height="38" fill="#f3f0ff"/><text xml:space="preserve" x="643" y="336.0" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" font-weight="400" fill="#343a40">0.038 (formula)</text><text xml:space="preserve" x="903" y="336.0" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" font-weight="400" fill="#343a40">68,740</text><text xml:space="preserve" x="1033" y="336.0" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" font-weight="400" fill="#343a40"></text><line x1="635" y1="354" x2="1155" y2="354" stroke="#dee2e6"/><text xml:space="preserve" x="643"
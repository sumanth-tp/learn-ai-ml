ont-size="11" font-weight="400" fill="#868e96">1.5</text><text xml:space="preserve" x="815.0" y="416.0" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" font-weight="700" fill="#343a40">theta</text><text xml:space="preserve" transform="translate(547,263.0) rotate(-90)" text-anchor="middle" font-family="monospace" font-size="12" font-weight="700" fill="#343a40">cost J</text><path d="M623.7,154.3 L627.5,161.1 L631.4,167.8 L635.3,174.3 L639.1,180.8 L643.0,187.1 L646.8,193.4 L650.7,199.5 L654.6,205.5 L658.4,211.4 L662.3,217.2 L666.2,222.9 L670.0,228.5 L673.9,234.0 L677.8,239.3 L681.6,244.6 L685.5,249.7 L689.4,254.8 L693.2,259.7 L697.1,264.6 L701.0,269.3 L704.8,273.9 L708.7,278.4 L712.6,282.8 L716.4,287.1 L720.3,291.3 L724.2,295.4 L728.0,299.3 L731.9,303.2 L735.8,306.9 L739.6,310.6 L743.5,314.1 L747.4,317.5 L751.2,320.9 L755.1,324.1 L758.9,327.2 L762.8,330.2 L766.7,333.1 L770.5,335.9 L774.4,338.5 L778.3,341.1 L782.1,343.6 L786.0,345.9 L789.9,348.2 L793.7,350.3 L797.6,352.3 L801.5,354.2 L805.3,356.1 L809.2,357.8 L813.1,359.4 L816.9,360.8 L820.8,362.2 L824.7,363.5 L828.5,364.7 L832.4,365.7 L836.3,366.7 L840.1,367.5 L844.0,368.2 L847.9,368.9 L851.7,369.4 L855.6,369.8 L859.5,370.1 L863.3,370.3 L867.2,370.4 L871.1,370.4 L874.9,370.2 L878.8,370.0 L882.6,369.7 L886.5,369.2 L890.4,368.7 L894.2,368.0 L898.1,367.2 L902.0,366.3 L905.8,365.3 L909.7,364.2 L913.6,363.0 L917.4,361.7 L921.3,360.3 L925.2,358.8 L929.0,357.1 L932.9,355.4 L936.8,353.5 L940.6,351.6 L944.5,349.5 L948.4,347.3 L952.2,345.0 L956.1,342.7 L960.0,340.2 L963.8,337.5 L967.7,334.8 L971.6,332.0 L975.4,329.1 L979.3,326.0 L983.2,322.9 L987.0,319.6 L990.9,316.3 L994.7,312.8 L998.6,309.2 L1002.5,305.5 L1006.3,301.7 L1010.2,297.8 L1014.1,293.8 L1017.9,289.7 L1021.8,285.5 L1025.7,281.2 L1029.5,276.7 L1033.4,272.2 L1037.3,267.5 L1041.1,262.8 L1045.0,257.9" fill="none" stroke="#1c7ed6" stroke-width="2.6" stroke-linejoin="round" stroke-lineca
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 600" width="1120" height="600" role="img" aria-label="Two routes to the best line"><defs></defs><rect x="0" y="0" width="1120" height="600" rx="18" fill="#fffdf7"/><text xml:space="preserve" x="560.0" y="44" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="24" font-weight="700" fill="#1864ab">Two routes to the best line</text><text xml:space="preserve" x="560.0" y="70" text-anchor="middle" font-family="'Inter','Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="14" fill="#868e96">Fit y-hat = theta * x to (1,1) (2,2) (3,2): solve it exactly, or walk downhill</text><rect x="28" y="92" width="470" height="480" rx="14" fill="#e7f5ff" fill-opacity="0.35" stroke="#1c7ed6" stroke-width="2" stroke-dasharray="9 6"/><text xml:space="preserve" x="263.0" y="118" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="16" font-weight="700" fill="#1864ab">Route 1: solve it exactly</text><rect x="55" y="138" width="416" height="70.35" rx="9" fill="#e7f5ff" stroke="#1c7ed6" stroke-width="1.6"/><rect x="54.5" y="137.0" width="416.5" height="69.1" rx="10" fill="none" stroke="#1c7ed6" stroke-width="1.1" stroke-opacity="0.45"/><text xml:space="preserve" x="263.0" y="167.0" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="17" font-weight="700" fill="#1864ab">theta = (X&#x27;X)^-1 X&#x27;y</text><text xml:space="preserve" x="263.0" y="190.4" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" fill="#343a40">the normal equation, one formula</text><rect x="55" y="232" width="416" height="118.5" rx="9" fill="#fff4e6" stroke="#e8590c" stroke-width="1.6"/><rect x="55.1" y="231.6" width="414.7" height="118.5" rx="10" fill="none" stroke="#e8590c" stroke-width="1.1" stroke-opacity="0.45"/><text xml:space="preserve" x="67" y="258.0" text-anchor="start" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="14" font-weight="700" fill="#c2410c">What you give up</text><text xml:space="preserve" x="67" y="281.4" text-anchor="start" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" fill="#343a40">• no learning rate and no iterations</text><text xml:space="preserve" x="67" y="298.8" text-anchor="start" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" fill="#343a40">• the inverse costs O(d^3) in the number of features</text><text xml:space="preserve" x="67" y="316.2" text-anchor="start" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" fill="#343a40">• wide data makes it slow; a duplicated column makes</text><text xml:space="preserve" x="67" y="333.6" text-anchor="start" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" fill="#343a40">  X&#x27;X singular</text><rect x="55" y="368" width="416" height="118.5" rx="9" fill="#e3fafc" stroke="#0c8599" stroke-width="1.6"/><rect x="53.6" y="367.8" width="414.7" height="117.3" rx="10" fill="none" stroke="#0c8599" stroke-width="1.1" stroke-opacity="0.45"/><text xml:space="preserve" x="67" y="394.0" text-anchor="start" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="14" font-weight="700" fill="#0b7285">Checked on 442 diabetes rows</text><text xml:space="preserve" x="67" y="417.4" text-anchor="start" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" fill="#343a40">• inverse, solve and lstsq all land within 1.5e-10 of</text><text xml:space="preserve" x="67" y="434.8" text-anchor="start" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" fill="#343a40">  scikit-learn&#x27;s coefficients</text><text xml:space="preserve" x="67" y="452.2" text-anchor="start" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" fill="#343a40">• with a duplicated column, solve raises &#x27;Singular</text><text xml:space="preserve" x="67" y="469.6" text-anchor="start" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" fill="#343a40">  matrix&#x27; but lstsq still answers</text><text xml:space="preserve" x="263" y="538.0" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" font-weight="400" fill="#1864ab" font-style="italic">scikit-learn&#x27;s LinearRegression uses an SVD-based</text><text xml:space="preserve" x="263" y="554.8" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" font-weight="400" fill="#1864ab" font-style="italic">least-squares solver, not the explicit inverse</text><rect x="530" y="92" width="562" height="480" rx="14" fill="#ebfbee" fill-opacity="0.35" stroke="#2f9e44" stroke-width="2" stroke-dasharray="9 6"/><text xml:space="preserve" x="811.0" y="118" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="16" font-weight="700" fill="#2b8a3e">Route 2: walk downhill</text><line x1="585.0" y1="378.0" x2="1045.0" y2="378.0" stroke="#495057" stroke-width="1.4"/><line x1="585.0" y1="148.0" x2="585.0" y2="378.0" stroke="#495057" stroke-width="1.4"/><line x1="642.5" y1="378.0" x2="642.5" y2="383.0" stroke="#495057" stroke-width="1.2"/><text xml:space="pre
th="300" height="20" rx="4" fill="#e9ecef"/><rect x="140" y="386" width="94.5" height="20" rx="4" fill="#e8590c"/><text xml:space="preserve" x="450" y="401.0" text-anchor="start" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" font-weight="700" fill="#343a40">0.032</text><text xml:space="preserve" x="290" y="456.0" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="11" font-weight="400" fill="#868e96" font-style="italic">bars use a log scale; at d = 10,000 the gap is 3%</text><text xml:space="preserve" x="290" y="496.0" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" font-weight="700" fill="#c2410c">&#x27;nearest&#x27; has stopped meaning anything</text><rect x="580" y="90" width="550" height="440" rx="14" fill="#fff5f5" fill-opacity="0.35" stroke="#e03131" stroke-width="2" stroke-dasharray="9 6"/><text xml:space="preserve" x="855.0" y="116" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="16" font-weight="700" fill="#c92a2a">Noise columns added to iris</text><text xml:space="preserve" x="855" y="140.0" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" font-weight="400" fill="#343a40">5-fold k-NN accuracy (standardised)</text><text xml:space="preserve" x="700" y="184.0" text-anchor="end" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" font-weight="700" fill="#c92a2a">+0</text><rect x="720" y="170" width="300" height="20" rx="4" fill="#e9ecef"/><rect x="720" y="170" width="288.0" height="20" rx="4" fill="#e03131"/><text xml:space="preserve" x="1030" y="185.0" text-anchor="start" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" font-weight="700" fill="#343a40">0.960</text><text xml:space="preserve" x="700" y="238.0" text-anchor="end" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" font-weight="700" fill="#c92a2a">+10</text><rect x="720" y="224" width="300" height="20" rx="4" fill="#e9ecef"/><rect x="720" y="224" width="224.1" height="20" rx="4" fill="#e03131"/><text xml:space="preserve" x="1030" y="239.0" text-anchor="start" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" font-weight="700" fill="#343a40">0.747</text><text xml:space="preserve" x="700" y="292.0" text-anchor="end" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" font-weight="700" fill="#c92a2a">+50</text><rect x="720" y="278" width="300" height="20" rx="4" fill="#e9ecef"/><rect x="720" y="278" width="216.0" height="20" rx="4" fill="#e03131"/><text xml:space="preserve" x="1030" y="293.0" text-anchor="start" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" font-weight="700" fill="#343a40">0.720</text><text xml:space="preserve" x="700" y="346.0" text-anchor="end" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" font-weight="700" fill="#c92a2a">+200</text><rect x="720" y="332" width="300" height="20" rx="4" fill="#e9ecef"/><rect x="720" y="332" width="158.1" height="20" rx="4" fill="#e03131"/><text xml:space="preserve" x="1030" y="347.0" text-anchor="start" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" font-weight="700" fill="#343a40">0.527</text><text xml:space="preserve" x="700" y="400.0" text-anchor="end" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" font-weight="700" fill="#c92a2a">+1,000</text><rect x="720" y="386" width="300" height="20" rx="4" fill="#e9ecef"/><rect x="720" y="386" width="120.0" height="20" rx="4" fill="#e03131"/><text xml:space="preserve" x="1030" y="401.0" text-anchor="start" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" font-weight="700" fill="#343a40">0.400</text><text xml:space="preserve" x="855" y="456.0" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="11" font-weight="400" fill="#868e96" font-style="italic">scaling matters for the same reason: on wine, k-NN 0.691 raw,</text><text xml:space="preserve" x="855" y="474.0" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="11" font-weight="400" fill="#868e96" font-style="italic">0.949 standardised; random forest 0.972 either way</text><text xml:space="preserve" x="855" y="504.0" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" font-weight="700" fill="#c92a2a">remedies: select features, reduce with PCA, regularise, add rows</text></svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 560" width="1160" height="560" role="img" aria-label="The curse of dimensionality"><defs></defs><rect x="0" y="0" width="1160" height="560" rx="18" fill="#fffdf7"/><text xml:space="preserve" x="580.0" y="44" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="24" font-weight="700" fill="#1864ab">The curse of dimensionality</text><text xml:space="preserve" x="580.0" y="70" text-anchor="middle" font-family="'Inter','Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="14" fill="#868e96">As columns pile up, distances stop discriminating and k-NN loses its footing</text><rect x="30" y="90" width="520" height="440" rx="14" fill="#fff4e6" fill-opacity="0.35" stroke="#e8590c" stroke-width="2" stroke-dasharray="9 6"/><text xml:space="preserve" x="290.0" y="116" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="16" font-weight="700" fill="#c2410c">Nearest and farthest points</text><text xml:space="preserve" x="290" y="140.0" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" font-weight="400" fill="#343a40">(farthest - nearest) / nearest distance, 500 random points</text><text xml:space="preserve" x="120" y="184.0" text-anchor="end" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" font-weight="700" fill="#c2410c">d = 2</text><rect x="140" y="170" width="300" height="20" rx="4" fill="#e9ecef"/><rect x="140" y="170" width="300.0" height="20" rx="4" fill="#e8590c"/><text xml:space="preserve" x="450" y="185.0" text-anchor="start" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" font-weight="700" fill="#343a40">66.130</text><text xml:space="preserv
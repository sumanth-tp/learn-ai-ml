adia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" fill="#343a40">• how well the scores rank, whatever threshold you later pick</text><rect x="560" y="280" width="570" height="32.2" rx="6" fill="#e8590c"/><text xml:space="preserve" x="568" y="300.0" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" font-weight="700" fill="#ffffff">threshold</text><text xml:space="preserve" x="698" y="300.0" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" font-weight="700" fill="#ffffff">TPR (recall)</text><text xml:space="preserve" x="858" y="300.0" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" font-weight="700" fill="#ffffff">FPR</text><text xml:space="preserve" x="988" y="300.0" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" font-weight="700" fill="#ffffff">precision</text><line x1="560" y1="312.2" x2="1130" y2="312.2" stroke="#dee2e6"/><text xml:space="preserve" x="568" y="332.2" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" font-weight="400" fill="#343a40">0.9</text><text xml:space="preserve" x="698" y="332.2" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" font-weight="400" fill="#343a40">0.500</text><text xml:space="preserve" x="858" y="332.2" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" font-weight="400" fill="#343a40">0.000</text><text xml:space="preserve" x="988" y="332.2" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" font-weight="400" fill="#343a40">1.000</text><line x1="560" y1="344.4" x2="113
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 620" width="1240" height="620" role="img" aria-label="Naive Bayes, MAP, and smoothing"><defs></defs><rect x="0" y="0" width="1240" height="620" rx="18" fill="#fffdf7"/><text xml:space="preserve" x="620.0" y="44" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="24" font-weight="700" fill="#1864ab">Naive Bayes, MAP, and smoothing</text><text xml:space="preserve" x="620.0" y="70" text-anchor="middle" font-family="'Inter','Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="14" fill="#868e96">Numbers from bayes_2.py, bayes_3.py and bayes_4.py</text><rect x="25" y="95" width="600" height="280" rx="14" fill="#ebfbee" fill-opacity="0.35" stroke="#2f9e44" stroke-width="2" stroke-dasharray="9 6"/><text xml:space="preserve" x="325.0" y="121" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="16" font-weight="700" fill="#2b8a3e">The spam filter: multiply the likelihoods</text><text xml:space="preserve" x="325" y="140.0" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" font-weight="700" fill="#2b8a3e">P(class | words) ∝ P(class) × P(word1 | class) × P(word2 | class)</text><rect x="50" y="165" width="265" height="150" rx="9" fill="#fff5f5" stroke="#e03131" stroke-width="1.6"/><rect x="49.5" y="164.0" width="265.5" height="148.7" rx="10" fill="none" stroke="#e03131" stroke-width="1.1" stroke-opacity="0.45"/><text xml:space="preserve" x="182.5" y="206.8" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="14" font-weight="700" fill="#c92a2a">spam</text><text xml:space="preserve" x="182.5" y="230.2" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" fill="#343a40">P(spam) = 0.4</text><text xml:space="preserve" x="182.5" y="247.6" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" fill="#343a40">P(free | spam) = 0.8</text><text xml:space="preserve" x="182.5" y="264.9" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" fill="#343a40">P(money | spam) = 0.6</text><text xml:space="preserve" x="182.5" y="282.3" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" fill="#343a40">0.4 × 0.8 × 0.6 = 0.192</text><rect x="335" y="165" width="265" height="150" rx="9" fill="#e7f5ff" stroke="#1c7ed6" stroke-width="1.6"/><rect x="335.1" y="164.6" width="263.7" height="150.0" rx="10" fill="none" stroke="#1c7ed6" stroke-width="1.1" stroke-opacity="0.45"/><text xml:space="preserve" x="467.5" y="206.8" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="14" font-weight="700" fill="#1864ab">ham</text><text xml:space="preserve" x="467.5" y="230.2" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" fill="#343a40">P(ham) = 0.6</text><text xml:space="preserve" x="467.5" y="247.6" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" fill="#343a40">P(free | ham) = 0.1</text><text xml:space="preserve" x="467.5" y="264.9" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" fill="#343a40">P(money | ham) = 0.2</text><text xml:space="preserve" x="467.5" y="282.3" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" fill="#343a40">0.6 × 0.1 × 0.2 = 0.012</text><rect x="50" y="325" width="550" height="38" rx="9" fill="#ebfbee" stroke="#2f9e44" stroke-width="1.6"/><rect x="48.6" y="324.8" width="548.7" height="36.8" rx="10" fill="none" stroke="#2f9e44" stroke-width="1.1" stroke-opacity="0.45"/><text xml:space="preserve" x="325.0" y="348.2" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" font-weight="700" fill="#2b8a3e">P(spam | free, money) = 0.192 / (0.192 + 0.012) = 0.941</text><rect x="650" y="95" width="565" height="280" rx="14" fill="#f3f0ff" fill-opacity="0.35" stroke="#7048e8" stroke-width="2" stroke-dasharray="9 6"/><text xml:space="preserve" x="932.5" y="121" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="16" font-weight="700" fill="#5f3dc4">MAP vs maximum likelihood</text><text xml:space="preserve" x="932" y="138.0" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" font-weight="400" fill="#343a40" font-style="italic">data: three heads in three flips</text><rect x="670" y="152" width="535" height="30.799999999999997" rx="6" fill="#7048e8"/><text xml:space="preserve" x="678" y="171.0" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" font-weight="700" fill="#ffffff"></text><text xml:space="preserve" x="828" y="171.0" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" font-weight="700" fill="#ffffff">fair coin</text><text xml:space="preserve" x="958" y="171.0" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" font-weight="700" fill="#ffffff">biased 0.8</text><text xml:space="preserve" x="1088" y="171.0" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" font-weight="700" fill="#ffffff">winner</text><line x1="670" y1="182.8" x2="1205" y2="182.8" stroke="#dee2e6"/><text xml:space="preserve" x="678" y="201.8" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" font-weight="400" fill="#343a40">likelihood</text><text xml:space="preserve" x="828" y="201.8" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" font-weight="400" fill="#343a40">0.125</text><text xml:space="preserve" x="958" y="201.8" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" font-weight="400" fill="#343a40">0.512</text><text xml:space="preserve" x="1088" y="201.8" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" font-weight="400" fill="#343a40">biased</text><line x1="670" y1="213.60000000000002" x2="1205" y2="213.60000000000002" stroke="#dee2e6"/><rect x="670" y="213.60000000000002" width="535" height="30.799999999999997" fill="#f3f0ff"/><text xml:space="preserve" x="678" y="232.6" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" font-weight="400" fill="#343a40">× prior</text><text xml:space="preserve" x="828" y="232.6" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" font-weight="400" fill="#343a40">0.95</text><text xml:space="preserve" x="958" y="232.6" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" font-weight="400" fill="#343a40">0.05</text><text xml:space="preserve" x="1088" y="232.6" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" font-weight="400" fill="#343a40"></text><line x1="670" y1="244.40000000000003" x2="1205" y2="244.40000000000003" stroke="#dee2e6"/><text xml:space="preserve" x="678" y="263.4" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" font-weight="400" fill="#343a40">MAP score</text><text xml:space="preserve" x="828" y="263.4" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" font-weight="400" fill="#343a40">0.1187</text><text xml:space="preserve" x="958" y="263.4" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" font-weight="400" fill="#343a40">0.0256</text><text xml:space="preserve" x="1088" y="263.4" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" font-weight="400" fill="#343a40">fair</text><line x1="670" y1="275.20000000000005" x2="1205" y2="275.20000000000005" stroke="#dee2e6"/><rect x="670" y="290" width="525" height="70" rx="9" fill="#f3f0ff" stroke="#7048e8" stroke-width="1.6"/><rect x="669.8" y="291.0" width="523.9" height="69.2" rx="10" fill="none" stroke="#7048e8" stroke-width="1.1" stroke-opacity="0.45"/><text xml:space="preserve" x="932.5" y="317.9" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="14" font-weight="700" fill="#5f3dc4">ML = MAP with a flat prior</text><text xml:space="preserve" x="932.5" y="341.2" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" fill="#343a40">Beta(1,1): 1.000   Beta(2,2): 0.800   Beta(10,10): 0.571</text><rect x="25" y="395" width="1190" height="205" rx="14" fill="#fff4e6" fill-opacity="0.35" stroke="#e8590c" stroke-width="2" stroke-dasharray="9 6"/><text xml:space="preserve" x="620.0" y="421" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="16" font-weight="700" fill="#c2410c">Laplace smoothing: no probability is exactly zero</text><rect x="45" y="440" width="330" height="140" rx="9" fill="#fff4e6" stroke="#e8590c" stroke-width="1.6"/><rect x="45.4" y="441.3" width="330.2" height="139.7" rx="10" fill="none" stroke="#e8590c" stroke-width="1.1" stroke-opacity="0.45"/><text xml:space="preserve" x="210.0" y="485.4" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="14" font-weight="700" fill="#c2410c">Message: free money meeting</text><text xml:space="preserve" x="210.0" y="508.8" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" fill="#343a40">&#x27;meeting&#x27; never seen in spam</text><text xml:space="preserve" x="210.0" y="526.2" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" fill="#343a40">&#x27;free&#x27; never seen in ham</text><text xml:space="preserve" x="210.0" y="543.6" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" fill="#343a40">so every product is 0</text><rect x="400" y="440" width="360" height="66" rx="9" fill="#fff5f5" stroke="#e03131" stroke-width="1.6"/><rect x="401.4" y="438.6" width="361.1" height="65.4" rx="10" fill="none" stroke="#e03131" stroke-width="1.1" stroke-opacity="0.45"/><text xml:space="preserve" x="580.0" y="465.9" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="14" font-weight="700" fill="#c92a2a">alpha = 0</text><text xml:space="preserve" x="580.0" y="489.2" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" fill="#343a40">spam 0, ham 0  -&gt;  0 / 0, no answer</text><rect x="400" y="516" width="360" height="66" rx="9" fill="#ebfbee" stroke="#2f9e44" stroke-width="1.6"/><rect x="398.9" y="514.9" width="359.4" height="66.9" rx="10" fill="none" stroke="#2f9e44" stroke-width="1.1" stroke-opacity="0.45"/><text xml:space="preserve" x="580.0" y="533.1" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="14" font-weight="700" fill="#2b8a3e">alpha = 1</text><text xml:space="preserve" x="580.0" y="556.5" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" fill="#343a40">spam 6.150e-05, ham 7.688e-06</text><text xml:space="preserve" x="580.0" y="573.9" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" fill="#343a40">P(spam) = 0.8889</text><rect x="785" y="440" width="410" height="140" rx="9" fill="#fff9db" stroke="#e8a300" stroke-width="1.6"/><rect x="784.0" y="440.2" width="410.4" height="139.6" rx="10" fill="none" stroke="#e8a300" stroke-width="1.1" stroke-opacity="0.45"/><text xml:space="preserve" x="990.0" y="476.8" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="14" font-weight="700" fill="#b35c00">Add alpha to every count</text><text xml:space="preserve" x="990.0" y="500.1" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" fill="#343a40">P(w | c) = (count + alpha) /</text><text xml:space="preserve" x="990.0" y="517.5" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" fill="#343a40">(total + alpha × vocabulary)</text><text xml:space="preserve" x="990.0" y="534.9" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" fill="#343a40">here 26 words per class,</text><text xml:space="preserve" x="990.0" y="552.3" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" fill="#343a40">vocabulary of 32</text></svg>

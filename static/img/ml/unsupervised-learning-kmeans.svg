 Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="11" font-weight="700" fill="#c2410c">12</text><polygon points="325.0,157.0 313.0,135.0 337.0,135.0" fill="#1c7ed6"/><text xml:space="preserve" x="325.0" y="127.0" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" font-weight="700" fill="#1864ab">centroid 3.5</text><polygon points="1000.0,157.0 988.0,135.0 1012.0,135.0" fill="#e8590c"/><text xml:space="preserve" x="1000.0" y="127.0" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" font-weight="700" fill="#c2410c">centroid 11</text><polygon points="190.0,271.0 181.0,289.0 199.0,289.0" fill="none" stroke="#1c7ed6" stroke-width="2"/><text xml:space="preserve" x="190.0" y="315.0" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="11" font-weight="400" fill="#1864ab">start 2</text><polygon points="910.0,271.0 901.0,289.0 919.0,289.0" fill="none" stroke="#e8590c" stroke-width="2"/><text xml:space="preserve" x="910.0" y="315.0" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="11" font-weight="400" fill="#c2410c">start 10</text><path d="M206.0,281.0 L311.0,281.0" fill="none" stroke="#1c7ed6" stroke-width="1.8" stroke-dasharray="7 5" stroke-linejoin="round" marker-end="url(#ah1c7ed6)"/><path d="M926.0,281.0 L986.0,281.0" fill="none" stroke="#e8590c" stroke-width="1.8" stroke-dasharray="7 5" stroke-linejoin="round" marker-end="url(#ahe8590c)"/><rect x="30" y="360" width="340" height="120" rx="9" fill="#e7f5ff" stroke="#1c7ed6" stroke-width="1.6"/><rect x="29.5" y="359.0" width="340.5" height="118.7" rx="10" fill="none" stroke="#1c7ed6" stroke-width="1.1" stroke-opacity="0.45"/><text xml:space="preserve" x="200.0" y="395.4" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="14" font-weight="700" fill="#1864ab">pass 1: assign</text><text xml:space="preserve" x="200.0" y="418.8" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" fill="#343a40">nearest centroid wins:</text><text xml:space="preserve" x="200.0" y="436.2" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" fill="#343a40">5 is 3 from centroid 2, 5 from 10</text><text xml:space="preserve" x="200.0" y="453.6" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" fill="#343a40">{2,3,4,5} and {10,11,12}</text><rect x="410" y="360" width="340" height="120" rx="9" fill="#fff4e6" stroke="#e8590c" stroke-width="1.6"/><rect x="410.1" y="359.6" width="338.7" height="120.0" rx="10" fill="none" stroke="#e8590c" stroke-width="1.1" stroke-opacity="0.45"/><text xml:space="preserve" x="580.0" y="395.4" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="14" font-weight="700" fill="#c2410c">pass 1: update</text><text xml:space="preserve" x="580.0" y="418.8" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" fill="#343a40">mean of {2,3,4,5} = 3.5</text><text xml:space="preserve" x="580.0" y="436.2" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" fill="#343a40">mean of {10,11,12} = 11</text><text xml:space="preserve" x="580.0" y="453.6" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" fill="#343a40">WCSS = 7</text><rect x="790" y="360" width="340" height="120" rx="9" fill="#ebfbee" stroke="#2f9e44" stroke-width="1.6"/><rect x="788.6" y="359.8" width="338.7" height="118.8" rx="10" fill="none" stroke="#2f9e44" stroke-width="1.1" stroke-opacity="0.45"/><text xml:space="preserve" x="960.0" y="395.4" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="14" font-weight="700" fill="#2b8a3e">pass 2</text><text xml:space="preserve" x="960.0" y="418.8" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" fill="#343a40">same assignment, nothing moves:</text><text xml:space="preserve" x="960.0" y="436.2" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" fill="#343a40">converged. scikit-learn gives</text><text xml:space="preserve" x="960.0" y="453.6" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" fill="#343a40">centers 3.5 and 11, inertia 7.0</text><path d="M370.0,420.0 L410.0,420.0" fill="none" stroke="#343a40" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#ah343a40)"/><path d="M750.0,420.0 L790.0,420.0" fill="none" stroke="#343a40" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#ah343a40)"/><rect x="30" y="510" width="1100" height="70" rx="9" fill="#f8f9fa" stroke="#6c757d" stroke-width="1.6"/><rect x="29.8" y="511.0" width="1098.9" height="69.2" rx="10" fill="none" stroke="#6c757d" stroke-width="1.1" stroke-opacity="0.45"/><text xml:space="preserve" x="580.0" y="537.5" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="15" font-weight="700" fill="#343a40">WCSS = (1.5² + 0.5² + 0.5² + 1.5²) + (1² + 0² + 1²) = 5 + 2 = 7</text><text xml
="#343a40">Gateway Explorer: experiments</text><text xml:space="preserve" x="650.0" y="545.0" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" fill="#343a40">Routing, observability, metadata, retries, timeouts, fallback, load balancing, cache, rate limits, streaming.</text><text xml:space="preserve" x="650.0" y="562.4" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" fill="#343a40">The app advertises $0 extra cost on its free tier; this is a session-time vendor claim, not a pricing guarantee.</text></svg>

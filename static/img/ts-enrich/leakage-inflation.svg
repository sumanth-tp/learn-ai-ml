F Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="15" font-weight="700" fill="#2b8a3e">What the random split claims</text><text xml:space="preserve" x="300.0" y="472.7" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="14" fill="#343a40">with t: 21% better than the baseline</text><text xml:space="preserve" x="300.0" y="493.0" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="14" fill="#343a40">(2.07 against 2.63)</text><text xml:space="preserve" x="300.0" y="513.3" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="14" fill="#343a40">it can borrow rows from the future</text><rect x="590" y="420" width="540" height="110" rx="9" fill="#fff5f5" stroke="#e03131" stroke-width="1.6"/><rect x="590.1" y="419.6" width="538.7" height="110.0" rx="10" fill="none" stroke="#e03131" stroke-width="1.1" stroke-opacity="0.45"/><text xml:space="preserve" x="860.0" y="446.4" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="15" font-weight="700" fill="#c92a2a">What deployment gets</text><text xml:space="preserve" x="860.0" y="472.7" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="14" fill="#343a40">with t: 43% worse than the baseline (3.76)</text><text xml:space="preserve" x="860.0" y="493.0" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="14" fill="#343a40">without t: 5% worse (2.76 against 2.63)</text><text xml:space="preserve" x="860.0" y="513.3" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="14" fill
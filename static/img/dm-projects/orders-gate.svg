<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" width="1200" height="720" role="img" aria-label="The daily run as a graph, and the gate before publication"><defs><marker id="ah343a40" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#343a40"/></marker><marker id="ah343a40s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#343a40"/></marker></defs><rect x="0" y="0" width="1200" height="720" rx="18" fill="#fffdf7"/><text xml:space="preserve" x="600.0" y="44" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="24" font-weight="700" fill="#1864ab">The daily run as a graph, and the gate before publication</text><text xml:space="preserve" x="600.0" y="70" text-anchor="middle" font-family="'Inter','Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="14" fill="#868e96">Seven tasks, one gate, one pointer. Any task can be re-run for the same date</text><rect x="30" y="110" width="150" height="60" rx="9" fill="#e7f5ff" stroke="#1c7ed6" stroke-width="1.6"/><rect x="29.5" y="109.0" width="150.5" height="58.7" rx="10" fill="none" stroke="#1c7ed6" stroke-width="1.1" stroke-opacity="0.45"/><text xml:space="preserve" x="105.0" y="144.6" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="14" font-weight="700" fill="#1864ab">ingest_orders</text><rect x="30" y="220" width="150" height="60" rx="9" fill="#e7f5ff" stroke="#1c7ed6" stroke-width="1.6"/><rect x="30.1" y="219.6" width="148.7" height="60.0" rx="10" fill="none" stroke="#1c7ed6" stroke-width="1.1" stroke-opacity="0.45"/><text xml:space="preserve" x="105.0" y="254.6" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="14" font-weight="700" fill="#1864ab">ingest_payments</text><rect x="290" y="165" width="150" height="60" rx="9" fill="#e7f5ff" stroke="#1c7ed6" stroke-width="1.6"/><rect x="288.6" y="164.8" width="148.7" height="58.8" rx="10" fill="none" stroke="#1c7ed6" stroke-width="1.1" stroke-opacity="0.45"/><text xml:space="preserve" x="365.0" y="199.6" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="14" font-weight="700" fill="#1864ab">stage</text><rect x="480" y="165" width="150" height="60" rx="9" fill="#e7f5ff" stroke="#1c7ed6" stroke-width="1.6"/><rect x="479.8" y="166.0" width="148.9" height="59.2" rx="10" fill="none" stroke="#1c7ed6" stroke-width="1.1" stroke-opacity="0.45"/><text xml:space="preserve" x="555.0" y="199.6" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="14" font-weight="700" fill="#1864ab">marts</text><rect x="670" y="165" width="150" height="60" rx="9" fill="#e3fafc" stroke="#0c8599" stroke-width="1.6"/><rect x="670.4" y="166.3" width="150.2" height="59.7" rx="10" fill="none" stroke="#0c8599" stroke-width="1.1" stroke-opacity="0.45"/><text xml:space="preserve" x="745.0" y="199.6" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="14" font-weight="700" fill="#0b7285">reconcile</text><rect x="860" y="165" width="130" height="60" rx="9" fill="#fff5f5" stroke="#e03131" stroke-width="1.6"/><rect x="861.4" y="163.6" width="131.1" height="59.4" rx="10" fill="none" stroke="#e03131" stroke-width="1.1" stroke-opacity="0.45"/><text xml:space="preserve" x="925.0" y="199.6" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="14" font-weight="700" fill="#c92a2a">publish</text><rect x="1030" y="165" width="130" height="60" rx="9" fill="#fff0f6" stroke="#d6336c" stroke-width="1.6"/><rect x="1028.9" y="163.9" width="129.4" height="60.9" rx="10" fill="none" stroke="#d6336c" stroke-width="1.1" stroke-opacity="0.45"/><text xml:space="preserve" x="1095.0" y="199.6" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="14" font-weight="700" fill="#c2255c">alerts</text><path d="M180.0,140.0 L290.0,183.0" fill="none" stroke="#343a40" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#ah343a40)"/><path d="M180.0,250.0 L290.0,207.0" fill="none" stroke="#343a40" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#ah343a40)"/><path d="M440.0,195.0 L480.0,195.0" fill="none" stroke="#343a40" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#ah343a40)"/><path d="M630.0,195.0 L670.0,195.0" fill="none" stroke="#343a40" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#ah343a40)"/><path d="M820.0,195.0 L860.0,195.0" fill="none" stroke="#343a40" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#ah343a40)"/><path d="M990.0,195.0 L1030.0,195.0" fill="none" stroke="#343a40" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#ah343a40)"/><text xml:space="preserve" x="105" y="100.0" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" font-weight="700" fill="#343a40">arrivals</text><text xml:space="preserve" x="1095" y="252.0" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="11" font-weight="700" fill="#c2255c">runs even if an</text><text xml:space="preserve" x="1095" y="268.0" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="11" font-weight="700" fill="#c2255c">upstream task failed</text><rect x="20" y="300" width="560" height="400" rx="14" fill="#fff5f5" fill-opacity="0.35" stroke="#e03131" stroke-width="2" stroke-dasharray="9 6"/><text xml:space="preserve" x="300.0" y="326" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="16" font-weight="700" fill="#c92a2a">The gate: publish only if none of these blocks</text><rect x="40" y="338" width="520" height="60" rx="9" fill="#fff5f5" stroke="#e03131" stroke-width="1.6"/><rect x="39.0" y="338.2" width="520.4" height="59.6" rx="10" fill="none" stroke="#e03131" stroke-width="1.1" stroke-opacity="0.45"/><text xml:space="preserve" x="52" y="361.2" text-anchor="start" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" font-weight="700" fill="#c92a2a">1  a rejected batch is waiting</text><text xml:space="preserve" x="52" y="383.2" text-anchor="start" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="11" fill="#343a40">orders:2026-06-09 blocked it for 2 days</text><rect x="40" y="408" width="520" height="60" rx="9" fill="#fff5f5" stroke="#e03131" stroke-width="1.6"/><rect x="40.1" y="406.7" width="518.7" height="59.1" rx="10" fill="none" stroke="#e03131" stroke-width="1.1" stroke-opacity="0.45"/><text xml:space="preserve" x="52" y="431.2" text-anchor="start" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" font-weight="700" fill="#c92a2a">2  a count does not balance</text><text xml:space="preserve" x="52" y="453.2" text-anchor="start" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="11" fill="#343a40">7 checks, e.g. staged = fact rows</text><rect x="40" y="478" width="520" height="60" rx="9" fill="#fff5f5" stroke="#e03131" stroke-width="1.6"/><rect x="40.5" y="477.8" width="519.4" height="60.3" rx="10" fill="none" stroke="#e03131" stroke-width="1.1" stroke-opacity="0.45"/><text xml:space="preserve" x="52" y="501.2" text-anchor="start" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" font-weight="700" fill="#c92a2a">3  closed days differ from the provider</text><text xml:space="preserve" x="52" y="523.2" text-anchor="start" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="11" fill="#343a40">unexplained money must be exactly zero</text><rect x="40" y="548" width="520" height="60" rx="9" fill="#fff5f5" stroke="#e03131" stroke-width="1.6"/><rect x="39.9" y="547.4" width="520.9" height="60.6" rx="10" fill="none" stroke="#e03131" stroke-width="1.1" stroke-opacity="0.45"/><text xml:space="preserve" x="52" y="571.2" text-anchor="start" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" font-weight="700" fill="#c92a2a">4  a batch has more than 2% rejected rows</text><text xml:space="preserve" x="52" y="593.2" text-anchor="start" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="11" fill="#343a40">limit set in the runner</text><rect x="40" y="618" width="520" height="60" rx="9" fill="#fff5f5" stroke="#e03131" stroke-width="1.6"/><rect x="39.2" y="618.2" width="520.1" height="61.1" rx="10" fill="none" stroke="#e03131" stroke-width="1.1" stroke-opacity="0.45"/><text xml:space="preserve" x="52" y="641.2" text-anchor="start" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" font-weight="700" fill="#c92a2a">5  a closed day would change unapproved</text><text xml:space="preserve" x="52" y="663.2" text-anchor="start" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="11" fill="#343a40">a restatement needs a named approver</text><rect x="610" y="300" width="570" height="400" rx="14" fill="#ebfbee" fill-opacity="0.35" stroke="#2f9e44" stroke-width="2" stroke-dasharray="9 6"/><text xml:space="preserve" x="895.0" y="326" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="16" font-weight="700" fill="#2b8a3e">What a pass and a block do</text><path d="M640,357 a70.0,12 0 0 0 140,0 v96 a70.0,12 0 0 1 -140,0 z" fill="#ebfbee" stroke="#2f9e44" stroke-width="1.6"/><ellipse cx="710.0" cy="357" rx="70.0" ry="12" fill="#ebfbee" stroke="#2f9e44" stroke-width="1.6"/><text xml:space="preserve" x="710.0" y="406.6" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" font-weight="700" fill="#2b8a3e">v29</text><text xml:space="preserve" x="710.0" y="424.0" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" fill="#343a40">table + pointer</text><rect x="820" y="345" width="340" height="120" rx="9" fill="#ebfbee" stroke="#2f9e44" stroke-width="1.6"/><rect x="820.7" y="344.4" width="341.4" height="118.9" rx="10" fill="none" stroke="#2f9e44" stroke-width="1.1" stroke-opacity="0.45"/><text xml:space="preserve" x="832" y="382.3" text-anchor="start" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" font-weight="700" fill="#2b8a3e">pass</text><text xml:space="preserve" x="832" y="404.2" text-anchor="start" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="11" fill="#343a40">copy the work table to version N+1</text><text xml:space="preserve" x="832" y="420.2" text-anchor="start" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="11" fill="#343a40">move the view to N+1</text><text xml:space="preserve" x="832" y="436.1" text-anchor="start" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="11" fill="#343a40">record fingerprint and date</text><rect x="640" y="495" width="520" height="90" rx="9" fill="#fff5f5" stroke="#e03131" stroke-width="1.6"/><rect x="639.8" y="495.8" width="519.0" height="90.0" rx="10" fill="none" stroke="#e03131" stroke-width="1.1" stroke-opacity="0.45"/><text xml:space="preserve" x="652" y="525.3" text-anchor="start" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" font-weight="700" fill="#c92a2a">block</text><text xml:space="preserve" x="652" y="547.2" text-anchor="start" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="11" fill="#343a40">consumers keep reading the last good version</text><text xml:space="preserve" x="652" y="563.2" text-anchor="start" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="11" fill="#343a40">the alert names the blocker and the owner</text><rect x="640" y="598" width="520" height="84" rx="9" fill="#fff9db" stroke="#e8a300" stroke-width="1.6"/><rect x="638.6" y="598.5" width="520.8" height="84.2" rx="10" fill="none" stroke="#e8a300" stroke-width="1.1" stroke-opacity="0.45"/><text xml:space="preserve" x="652" y="625.3" text-anchor="start" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" font-weight="700" fill="#b35c00">rollback</text><text xml:space="preserve" x="652" y="647.2" text-anchor="start" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="11" fill="#343a40">move the pointer back, freeze publishing, fix,</text><text xml:space="preserve" x="652" y="663.2" text-anchor="start" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="11" fill="#343a40">backfill, check, unfreeze</text></svg>

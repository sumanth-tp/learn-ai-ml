t-size="14" fill="#868e96">Event day D. The day stays open for 3 days, closes, and is reconciled on D+7</text><rect x="260" y="100" width="420" height="440" rx="14" fill="#ebfbee" fill-opacity="0.35" stroke="#2f9e44" stroke-width="2" stroke-dasharray="9 6"/><rect x="680" y="100" width="420" height="440" rx="14" fill="#fff5f5" fill-opacity="0.35" stroke="#e03131" stroke-width="2" stroke-dasharray="9 6"/><text xml:space="preserve" x="470" y="126.0" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" font-weight="700" fill="#2b8a3e">open: the day may be restated</text><text xml:space="preserve" x="890" y="126.0" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" font-weight="700" fill="#c92a2a">closed: a change needs an approver</text><text xml:space="preserve" x="300" y="170.0" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="14" font-weight="700" fill="#343a40">D</text><path d="M300.0,182.0 L300.0,520.0" fill="none" stroke="#6c757d" stroke-width="1" stroke-dasharray="7 5" stroke-linejoin="round" marker-end="url(#ah6c757d)"/><text xml:space="preserve" x="405" y="170.0" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="14" font-weight="700" fill="#343a40">D+1</text><path d="M405.0,182.0 L405.0,520.0" fill="none" stroke="#6c757d" stroke-width="1" stroke-dasharray="7 5" stroke-linejoin="round" marker-end="url(#ah6c757d)"/><text xml:space="preserve" x="510" y="170.0" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="14" font-weight="700" fill="#343a40">D+2</text><path d="M510.0,182.0 L510.0,520.0" fill="none" stroke="#6c757d" stroke-width="1" stroke-dasharray="7 5" stroke-linejoin="round" marker-end="url(#ah6c757d)"/><text xml:space="preserve" x="615" y="170.0" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="14" font-weight="700" fill="#343a40">D+3</text><path d="M615.0,182.0 L615.0,520.0" fill="none" stroke="#6c757d" stroke-width="1" stroke-dasharray="7 5" stroke-linejoin="round" marker-end="url(#ah6c757d)"/><text xml:space="preserve" x="720" y="170.0" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="14" font-weight="700" fill="#343a40">D+4</text><path d="M720.0,182.0 L720.0,520.0" fill="none" stroke="#6c757d" stroke-width="1" stroke-dasharray="7 5" stroke-linejoin="round" marker-end="url(#ah6c757d)"/><text xml:space="preserve" x="825" y="170.0" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="14" font-weight="700" fill="#343a40">D+5</text><path d="M825.0,182.0 L825.0,520.0" fill="none" stroke="#6c757d" stroke-width="1" stroke-dasharray="7 5" stroke-linejoin="round" marker-end="url(#ah6c757d)"/><text xml:space="preserve" x="930" y="170.0" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="14" font-weight="700" fill="#343a40">D+6</text><path d="M930.0,182.0 L930.0,520.0" fill="none" stroke="#6c757d" stroke-width="1" stroke-dasharray="7 5" stroke-linejoin="round" marker-end="url(#ah6c757d)"/><text xml:space="preserve" x="1035" y="170.0" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="14" font-weight="700" fill="#343a40">D+7</text><path d="M1035.0,182.0 L1035.0,520.0" fill="none" stroke="#6c757d" stroke-width="1" stroke-dasharray="7 5" stroke-linejoin="round" marker-end="url(#ah6c757d)"/><text xml:space="preserve" x="615" y="196.0" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="11" font-weight="700" fill="#c2410c">day closes</text><text xml:space="preserve" x="1035" y="196.0" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="11" font-weight="700" fill="#0b7285">reconciled</text><text xml:space="preserve" x="30" y="244.0" text-anchor="start" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" font-weight="700" fill="#2b8a3e">On time</text><text xml:space="preserve" x="30" y="264.0" text-anchor="start" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" font-weight="400" fill="#343a40">57,756 payments</text><rect x="272.0" y="238" width="51.0" height="21" rx="10.5" fill="#2f9e44" stroke="#2f9e44" stroke-width="1.2"/><text xml:space="preserve" x="297.5" y="252.5" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="11" font-weight="700" fill="#ffffff">event</text><text xml:space="preserve" x="350" y="254.0" text-anchor="start" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" font-weight="400" fill="#343a40">counted at once</text><text xml:space="preserve" x="30" y="324.0" text-anchor="start" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" font-weight="700" fill="#b35c00">1 to 3 days late</text><text xml:space="preserve" x="30" y="344.0" text-anchor="start" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" font-weight="400" fill="#343a40">2,147 payments</text><rect x="272.0" y="318" width="51.0" height="21" rx="10.5" fill="#e8a300" stroke="#e8a300" stroke-width="1.2"/><text xml:space="preserve" x="297.5" y="332.5" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="11" font-weight="700" fill="#ffffff">event</text><path d="M338.0,330.0 L474.0,330.0" fill="none" stroke="#e8a300" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#ahe8a300)"/><rect x="476.0" y="318" width="64.2" height="21" rx="10.5" fill="#fff9db" stroke="#e8a300" stroke-width="1.2"/><text xml:space="preserve" x="508.1" y="332.5" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="11" font-weight="700" fill="#b35c00">arrives</text><text xml:space="preserve" x="350" y="360.0" text-anchor="start" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" font-weight="400" fill="#343a40">counted; the published day is restated</text><text xml:space="preserve" x="30" y="404.0" text-anchor="start" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" font-weight="700" fill="#c92a2a">4 to 6 days late</text><text xml:space="preserve" x="30" y="424.0" text-anchor="start" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" font-weight="400" fill="#343a40">475 payments</text><rect x="272.0" y="398" width="51.0" height="21" rx="10.5" fill="#e03131" stroke="#e03131" stroke-width="1.2"/><text xml:space="preserve" x="297.5" y="412.5" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="11" font-weight="700" fill="#ffffff">event</text><path d="M338.0,410.0 L789.0,410.0" fill="none" stroke="#e03131" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#ahe03131)"/><rect x="791.0" y="398" width="64.2" height="21" rx="10.5" fill="#fff5f5" stroke="#e03131" stroke-width="1.2"/><text xml:space="preserve" x="823.1" y="412.5" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="11" font-weight="700" fill="#c92a2a">arrives</text><text xml:space="preserve" x="350" y="440.0" text-anchor="start" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" font-weight="400" fill="#343a40">held back: 2,695,995 minor units</text><text xml:space="preserve" x="30" y="484.0" text-anchor="start" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" font-weight="700" fill="#5f3dc4">Order never arrives</text><text xml:space="preserve" x="30" y="504.0" text-anchor="start" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" font-weight="400" fill="#343a40">20 payments</text><rect x="272.0" y="478" width="51.0" height="21" rx="10.5" fill="#7048e8" stroke="#7048e8" stroke-width="1.2"/><text xml:space="preserve" x="297.5" y="492.5" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="11" font-weight="700" fill="#ffffff">event</text><path d="M338.0,490.0 L1025.0,490.0" fill="none" stroke="#7048e8" stroke-width="1.8" stroke-dasharray="7 5" stroke-linejoin="round" marker-end="url(#ah7048e8)"/><rect x="595.0" y="454" width="130.2" height="21" rx="10.5" fill="#f3f0ff" stroke="#7048e8" stroke-width="1.2"/><text xml:space="preserve" x="660.1" y="468.5" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="11" font-weight="700" fill="#5f3dc4">no order to match</text><text xml:space="preserve" x="350" y="520.0" text-anchor="start" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" font-weight="400" fill="#343a40">orphan: 144,015 minor units</text><rect x="30" y="560" width="560" height="120" rx="9" fill="#fff9db" stroke="#e8a300" stroke-width="1.6"/><rect x="29.5" y="559.0" width="560.5" height="118.7" rx="10" fill="none" stroke="#e8a300" stroke-width="1.1" stroke-opacity="0.45"/><text xml:space="preserve" x="42" y="586.8" text-anchor="start" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="14" font-weight="700" fill="#b35c00">Why this policy</text><text xml:space="preserve" x="42" y="610.1" text-anchor="start" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" fill="#343a40">Finance needs a number that stops moving. Three days</text><text xml:space="preserve" x="42" y="627.5" text-anchor="start" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" fill="#343a40">covers 82% of the late payments here (2,147 of 2,622).</text><text xml:space="preserve" x="42" y="644.9" text-anchor="start" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" fill="#343a40">The rest wait for a person: a number that changes</text><text xml:space="preserve" x="42" y="662.3" text-anchor="start" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" fill="#343a40">silently cannot be audited.</text><rect x="620" y="560" width="550" height="120" rx="9" fill="#e3fafc" stroke="#0c8599" stroke-width="1.6"/><rect x="620.1" y="559.6" width="548.7" height="120.0" rx="10" fill="none" stroke="#0c8599" stroke-width="1.1" stroke-opacity="0.45"/><text xml:space="preserve" x="632" y="595.5" text-anchor="start" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="14" font-weight="700" fill="#0b7285">What the pipeline guarantees</text><text xml:space="preserve" x="632" y="618.9" text-anchor="start" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" fill="#343a40">Every payment lands in exactly one bucket: counted, held</text><text xml:space="preserve" x="632" y="636.2" text-anchor="start" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" fill="#343a40">back or orphan. The three buckets plus the quarantined</text><text xml:space="preserve" x="632" y="653.6" text-anchor="start" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" fill="#343a40">rows add up to the provider&#x27;s total, to the minor unit.</text></svg>

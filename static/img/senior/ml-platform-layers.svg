 Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="14" font-weight="700" fill="#2b8a3e">a project template</text><text xml:space="preserve" x="225.0" y="608.9" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" fill="#343a40">owner, cost centre, eval set and</text><text xml:space="preserve" x="225.0" y="626.2" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" fill="#343a40">registry name are required;</text><text xml:space="preserve" x="225.0" y="643.6" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" fill="#343a40">over 4 GPUs needs an approval</text><rect x="425" y="545" width="360" height="130" rx="9" fill="#ebfbee" stroke="#2f9e44" stroke-width="1.6"/><rect x="423.9" y="543.9" width="359.4" height="130.9" rx="10" fill="none" stroke="#2f9e44" stroke-width="1.1" stroke-opacity="0.45"/><text xml:space="preserve" x="605.0" y="576.8" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="14" font-weight="700" fill="#2b8a3e">gate on promotion</text><text xml:space="preserve" x="605.0" y="600.1" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" fill="#343a40">5 versions tried: 2 promoted,</text><text xml:space="preserve" x="605.0" y="617.5" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" fill="#343a40">3 blocked (incomplete lineage,</text><text xml:space="preserve" x="605.0" y="634.9" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" fill="#343a40">a slice regressi
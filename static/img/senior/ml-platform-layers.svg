enlo,Consolas,'Liberation Mono',monospace" font-size="12" fill="#343a40">rollback as one alias move</text><rect x="915" y="140" width="285" height="200" rx="9" fill="#ebfbee" stroke="#2f9e44" stroke-width="1.6"/><rect x="914.8" y="141.0" width="283.9" height="199.2" rx="10" fill="none" stroke="#2f9e44" stroke-width="1.1" stroke-opacity="0.45"/><text xml:space="preserve" x="1057.5" y="198.1" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="14" font-weight="700" fill="#2b8a3e">4. serving</text><text xml:space="preserve" x="1057.5" y="221.5" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" fill="#343a40">online endpoints and batch</text><text xml:space="preserve" x="1057.5" y="238.9" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" fill="#343a40">jobs from the same artefact,</text><text xml:space="preserve" x="1057.5" y="256.2" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" fill="#343a40">latency budget checked at</text><text xml:space="preserve" x="1057.5" y="273.6" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" fill="#343a40">promotion, shadow and</text><text xml:space="preserve" x="1057.5" y="291.0" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" fill="#343a40">canary release</text><path d="M315.0,240.0 L335.0,240.0" fill="none" stroke="#343a40" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#ah343a40)"/><path d="M605.0,240.0 L625.0,240.0" fill="none" stroke="#343a40" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#ah343a40)"/><p
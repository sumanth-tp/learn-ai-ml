00" fill="#343a40">0.203</text><text xml:space="preserve" x="830.0" y="320.0" text-anchor="start" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" font-weight="700" fill="#343a40">small self-hosted</text><rect x="830.0" y="330.0" width="26.0" height="24.0" rx="4" fill="#fff4e6" stroke="#e8590c" stroke-width="1.6" opacity="1.0"/><text xml:space="preserve" x="866.0" y="348.0" text-anchor="start" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" font-weight="700" fill="#343a40">0.075</text><text xml:space="preserve" x="995" y="405.0" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="11" font-weight="400" fill="#c2410c" font-style="italic">each weight scaled by 0.5 to 1.5 at random</text><rect x="20" y="450" width="380" height="190" rx="9" fill="#fff9db" stroke="#e8a300" stroke-width="1.6"/><rect x="19.5" y="449.0" width="380.5" height="188.7" rx="10" fill="none" stroke="#e8a300" stroke-width="1.1" stroke-opacity="0.45"/><text xml:space="preserve" x="210.0" y="520.5" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="14" font-weight="700" fill="#b35c00">A close call is a result</text><text xml:space="preserve" x="210.0" y="543.9" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" fill="#343a40">The leader wins 72% of draws. The other two</text><text xml:space="preserve" x="210.0" y="561.2" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" fill="#343a40">win 28% between them: say so in the doc and</text><text xml:space="preserve" x="210.0" y="578.6" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" fill="#343a40">pick on something the matrix leaves out.</text><rect x="410" y="450" width="380" height="190" rx="9" fill="#fff5f5" stroke="#e03131" stroke-width="1.6"/><rect x="410.1" y="449.6" width="378.7" height="190.0" rx="10" fill="none" stroke="#e03131" stroke-width="1.1" stroke-opacity="0.45"/><text xml:space="preserve" x="600.0" y="520.5" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="14" font-weight="700" fill="#c92a2a">A gate is not a weight</text><text xml:space="preserve" x="600.0" y="543.9" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" fill="#343a40">Privacy needs a score of 3 or more. That</text><text xml:space="preserve" x="600.0" y="561.2" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" fill="#343a40">removes both API options and leaves the</text><text xml:space="preserve" x="600.0" y="578.6" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" fill="#343a40">self-hosted model, the lowest average.</text><rect x="800" y="450" width="380" height="190" rx="9" fill="#ebfbee" stroke="#2f9e44" stroke-width="1.6"/><rect x="798.6" y="449.8" width="378.7" height="188.8" rx="10" fill="none" stroke="#2f9e44" stroke-width="1.1" stroke-opacity="0.45"/><text xml:space="preserve" x="990.0" y="520.5" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="14" font-weight="700" fill="#2b8a3e">Write the losers down</text><text xml:space="preserve" x="990.0" y="543.9" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" fill="#343a40">The alternatives section records why each</text><text xml:space="preserve" x="990.0" y="561.2" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" fill="#343a40">option lost, so the reviewer can disagree</text><text xml:space="preserve" x="990.0" y="578.6" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" fill="#343a40">with a reason instead of a hunch.</text></svg>

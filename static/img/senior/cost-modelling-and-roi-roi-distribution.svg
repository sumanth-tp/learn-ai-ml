#fff9db" stroke="#e8a300" stroke-width="1.6"/><rect x="20.5" y="479.8" width="589.4" height="160.3" rx="10" fill="none" stroke="#e8a300" stroke-width="1.1" stroke-opacity="0.45"/><text xml:space="preserve" x="315.0" y="526.8" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="14" font-weight="700" fill="#b35c00">Why the two answers differ</text><text xml:space="preserve" x="315.0" y="550.1" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" fill="#343a40">The base case multiplies the middle value of every input.</text><text xml:space="preserve" x="315.0" y="567.5" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" fill="#343a40">The inputs are skewed (a build overrun has no upside),</text><text xml:space="preserve" x="315.0" y="584.9" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" fill="#343a40">and the result is a product of them, so the typical</text><text xml:space="preserve" x="315.0" y="602.3" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" fill="#343a40">outcome sits far below the arithmetic one.</text><rect x="630" y="480" width="550" height="160" rx="9" fill="#ebfbee" stroke="#2f9e44" stroke-width="1.6"/><rect x="629.9" y="479.4" width="550.9" height="160.6" rx="10" fill="none" stroke="#2f9e44" stroke-width="1.1" stroke-opacity="0.45"/><text xml:space="preserve" x="905.0" y="535.5" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="14" font-weight="700" fill="#2b8a3e">Spend the next day on the top bars</text><text xml:space="preserve" x="905.0" y="558.9" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" fill="#343a40">Realisation and minutes saved swing the NPV by</text><text xml:space="preserve" x="905.0" y="576.2" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" fill="#343a40">352,586 each, build cost by 70,000. Measure</text><text xml:space="preserve" x="905.0" y="593.6" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" fill="#343a40">those two in a pilot before polishing the build plan.</text></svg>

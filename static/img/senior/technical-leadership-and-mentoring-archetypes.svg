" y="475.1" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" fill="#343a40">costly to undo: a data</text><text xml:space="preserve" x="432.5" y="492.5" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" fill="#343a40">contract, a vendor deal, a</text><text xml:space="preserve" x="432.5" y="509.9" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" fill="#343a40">schema. Slow down and</text><text xml:space="preserve" x="432.5" y="527.3" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" fill="#343a40">write it up.</text><text xml:space="preserve" x="300" y="585.0" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="11" font-weight="400" fill="#c2410c" font-style="italic">disagree and commit: say the gamble out loud, then back the call</text><rect x="600" y="380" width="580" height="245" rx="14" fill="#e3fafc" fill-opacity="0.35" stroke="#0c8599" stroke-width="2" stroke-dasharray="9 6"/><text xml:space="preserve" x="890.0" y="406" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="16" font-weight="700" fill="#0b7285">Feedback that can be acted on (SBI)</text><rect x="620" y="425" width="170" height="160" rx="9" fill="#e3fafc" stroke="#0c8599" stroke-width="1.6"/><rect x="619.0" y="425.2" width="170.4" height="159.6" rx="10" fill="none" stroke="#0c8599" stroke-width="1.1" stroke-opacity="0.45"/><text xml:space="preserve" x="705.0" y="490.3" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" fo
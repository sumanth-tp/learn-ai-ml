 y="268.0" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" font-weight="400" fill="#343a40">20,000</text><text xml:space="preserve" x="623" y="268.0" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" font-weight="400" fill="#343a40">300</text><text xml:space="preserve" x="813" y="268.0" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" font-weight="400" fill="#343a40">80.0</text><text xml:space="preserve" x="1013" y="268.0" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" font-weight="400" fill="#343a40">320,000</text><line x1="45" y1="284" x2="1175" y2="284" stroke="#dee2e6"/><rect x="45" y="295" width="380" height="85" rx="9" fill="#e3fafc" stroke="#0c8599" stroke-width="1.6"/><rect x="44.5" y="294.0" width="380.5" height="83.7" rx="10" fill="none" stroke="#0c8599" stroke-width="1.1" stroke-opacity="0.45"/><text xml:space="preserve" x="235.0" y="321.6" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="14" font-weight="700" fill="#0b7285">completion: tens of milliseconds matter</text><text xml:space="preserve" x="235.0" y="345.0" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" fill="#343a40">debounce, cancel stale requests,</text><text xml:space="preserve" x="235.0" y="362.4" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" fill="#343a40">small model, tiny context</text><rect x="445" y="295" width="380" height="85" rx="9" fill="#fff4e6" stroke="#e8590c" stroke-width="1.6"/><rect x="445.1" y="294.6" width="378.7" height="85.0" rx="10" fill="none" stroke="#
l tokens/s across the three tiers:</text><text xml:space="preserve" x="910.0" y="636.2" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" fill="#343a40">101 GPUs at 10,000 tokens/s each, 34 at 30,000, 11 at 100,000</text><text xml:space="preserve" x="910.0" y="653.6" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" fill="#343a40">(per-GPU rates are parameters, not measurements)</text></svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 520" width="1160" height="520" role="img" aria-label="Cost per crop against the threshold"><defs></defs><rect x="0" y="0" width="1160" height="520" rx="18" fill="#fffdf7"/><text xml:space="preserve" x="580.0" y="44" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="24" font-weight="700" fill="#1864ab">Cost per crop against the threshold</text><text xml:space="preserve" x="580.0" y="70" text-anchor="middle" font-family="'Inter','Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="14" fill="#868e96">Test set, 8,000 crops, miss 50 and false reject 1; lower is better</text><rect x="110" y="110" width="620" height="330" rx="8" fill="#f8f9fa" fill-opacity="0.0" stroke="#6c757d" stroke-width="1.4"/><line x1="110.0" y1="440.0" x2="730.0" y2="440.0" stroke="#dee2e6" stroke-width="1"/><text xml:space="preserve" x="100" y="444.0" text-anchor="end" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="11" font-weight="400" fill="#868e96">0.0</text><line x1="110.0" y1="357.5" x2="730.0" y2="357.5" stroke="#dee2e6" stroke-width="1"/><text xml:space="preserve" x="100" y="361.5" text-anchor="end" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="11" font-weight="400" fill="#868e96">0.4</text><line x1="110.0" y1="275.0" x2="730.0" y2="275.0" stroke="#dee2e6" stroke-width="1"/><text xml:space="preserve" x="100" y="279.0" text-anchor="end" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="11" font-weight="400" fill="#868e96">0.8</text><line x1="110.0" y1="192.5" x2="730.0" y2="192.5" stroke="#dee2e6" stroke-width="1"/><text xml:space="preserve" x="100" y="196.5" text-anchor="end" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',
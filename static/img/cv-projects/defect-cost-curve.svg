ily="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" font-weight="400" fill="#343a40">cost per crop</text><line x1="110.0" y1="246.5" x2="730.0" y2="246.5" stroke="#e03131" stroke-width="2" stroke-dasharray="7 5"/><text xml:space="preserve" x="726" y="238.5" text-anchor="end" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" font-weight="700" fill="#c92a2a">reject everything 0.938</text><polyline points="172.2,264.3 234.4,294.0 284.7,324.5 316.7,345.9 353.1,357.3 378.9,357.3 391.4,356.7 415.3,351.3 441.1,337.9 477.5,330.7 513.9,320.0 546.9,292.1 585.5,264.3 621.9,243.0 658.3,226.9 684.2,209.0 710.0,183.4 725.4,121.6" fill="none" stroke="#1c7ed6" stroke-width="3" stroke-linejoin="round"/><circle cx="667.8" cy="220.5" r="6" fill="#6c757d" stroke="#fffdf7" stroke-width="1.5"/><text xml:space="preserve" x="657.787134229444" y="206.5" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" font-weight="700" fill="#343a40">default 0.5</text><circle cx="609.1" cy="253.3" r="6" fill="#e8590c" stroke="#fffdf7" stroke-width="1.5"/><text xml:space="preserve" x="589.094491913969" y="279.3" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" font-weight="700" fill="#c2410c">best F1 0.26</text><circle cx="377.1" cy="356.3" r="6" fill="#7048e8" stroke="#fffdf7" stroke-width="1.5"/><text xml:space="preserve" x="373.0662547470051" y="392.3" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" font-weight="700" fill="#5f3dc4">Bayes 0.0196</text><circle cx="391.4" cy="356.5" r="6" fill="#2f9e44" stroke="#fffdf7" stroke-width="1.5"/><text xml:space="preserve" x="461.4237527769692" y="334.5" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" font-weight="700" fill="#2b8a3e">chosen 0.023</text><rect x="790" y="120" width="340" height="120" rx="9" fill="#fff9db" stroke="#e8a300" stroke-width="1.6"/><rect x="789.5" y="119.0" width="340.5" height="118.7" rx="10" fill="none" stroke="#e8a300" stroke-width="1.1" stroke-opacity="0.45"/><text xml:space="preserve" x="960.0" y="153.6" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="15" font-weight="700" fill="#b35c00">Why the minimum is so low</text><text xml:space="preserve" x="960.0" y="178.4" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" fill="#343a40">A miss costs 50 times a false reject.</text><text xml:space="preserve" x="960.0" y="197.3" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" fill="#343a40">So the system rejects whenever</text><text xml:space="preserve" x="960.0" y="216.1" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" fill="#343a40">the chance of a defect exceeds 1 / 51.</text><rect x="790" y="262" width="340" height="118" rx="9" fill="#ebfbee" stroke="#2f9e44" stroke-width="1.6"/><rect x="790.1" y="261.6" width="338.7" height="118.0" rx="10" fill="none" stroke="#2f9e44" stroke-width="1.1" stroke-opacity="0.45"/><text xml:space="preserve" x="960.0" y="294.6" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="15" font-weight="700" fill="#2b8a3e">What it buys</text><text xml:space="preserve" x="960.0" y="319.5" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" fill="#343a40">0.405 per crop, 95% CI [0.324, 0.485]</text><text xml:space="preserve" x="960.0" y="338.3" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" fill="#343a40">against 0.938 for rejecting everything</text><text xml:space="preserve" x="960.0" y="357.2" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" fill="#343a40">and 2.919 for accepting everything</text><rect x="790" y="400" width="340" height="90" rx="9" fill="#fff5f5" stroke="#e03131" stroke-width="1.6"/><rect x="788.6" y="399.8" width="338.7" height="88.8" rx="10" fill="none" stroke="#e03131" stroke-width="1.1" stroke-opacity="0.45"/><text xml:space="preserve" x="960.0" y="427.3" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="15" font-weight="700" fill="#c92a2a">The default 0.5 is worse than doing</text><text xml:space="preserve" x="960.0" y="447.6" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="15" font-weight="700" fill="#c92a2a">nothing clever</text><text xml:space="preserve" x="960.0" y="472.4" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" fill="#343a40">1.064 per crop: 36% of defects escape</text></svg>

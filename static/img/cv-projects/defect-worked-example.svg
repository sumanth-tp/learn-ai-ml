nsolas,'Liberation Mono',monospace" font-size="13" fill="#343a40">defect</text><text xml:space="preserve" x="675.0" y="201.7" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" fill="#343a40">p = 0.03</text><rect x="790" y="130" width="130" height="90" rx="9" fill="#ebfbee" stroke="#2f9e44" stroke-width="1.6"/><rect x="790.4" y="131.3" width="130.2" height="89.7" rx="10" fill="none" stroke="#2f9e44" stroke-width="1.1" stroke-opacity="0.45"/><text xml:space="preserve" x="855.0" y="158.0" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="15" font-weight="700" fill="#2b8a3e">crop C</text><text xml:space="preserve" x="855.0" y="182.9" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" fill="#343a40">good</text><text xml:space="preserve" x="855.0" y="201.7" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" fill="#343a40">p = 0.01</text><rect x="970" y="130" width="130" height="90" rx="9" fill="#ebfbee" stroke="#2f9e44" stroke-width="1.6"/><rect x="971.4" y="128.6" width="131.1" height="89.4" rx="10" fill="none" stroke="#2f9e44" stroke-width="1.1" stroke-opacity="0.45"/><text xml:space="preserve" x="1035.0" y="158.0" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="15" font-weight="700" fill="#2b8a3e">crop F</text><text xml:space="preserve" x="1035.0" y="182.9" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" fill="#343a40">good</text><text xml:space="preserve" x="1035.0" y="201.7" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" fill="#343a40">p = 0.002</text><line x1="60.0" y1="110.0" x2="60.0" y2="245.0" stroke="#6c757d" stroke-width="2.4" stroke-dasharray="6 4"/><text xml:space="preserve" x="60" y="102.0" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" font-weight="700" fill="#343a40">t = 0.5</text><line x1="225.0" y1="110.0" x2="225.0" y2="245.0" stroke="#e8590c" stroke-width="2.4" stroke-dasharray="6 4"/><text xml:space="preserve" x="225" y="102.0" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" font-weight="700" fill="#c2410c">t = 0.35</text><line x1="765.0" y1="110.0" x2="765.0" y2="245.0" stroke="#7048e8" stroke-width="2.4" stroke-dasharray="6 4"/><text xml:space="preserve" x="765" y="102.0" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" font-weight="700" fill="#5f3dc4">t = 0.0196</text><line x1="1125.0" y1="110.0" x2="1125.0" y2="245.0" stroke="#6c757d" stroke-width="2.4" stroke-dasharray="6 4"/><text xml:space="preserve" x="1125" y="102.0" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" font-weight="700" fill="#343a40">t = 0.001</text><rect x="30" y="290" width="340" height="190" rx="9" fill="#f8f9fa" stroke="#6c757d" stroke-width="1.6"/><rect x="28.9" y="288.9" width="339.4" height="190.9" rx="10" fill="none" stroke="#6c757d" stroke-width="1.1" stroke-opacity="0.45"/><text xml:space="preserve" x="200.0" y="346.6" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="16" font-weight="700" fill="#343a40">t = 0.5, the default</text><text xml:space="preserve" x="200.0" y="372.9" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="14" fill="#343a40">rejects nothing</text><text xml:space="preserve" x="200.0" y="393.2" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="14" fill="#343a40">A and D escape</text><text xml:space="preserve" x="200.0" y="413.5" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="14" fill="#343a40">2 x 50 = 100</text><text xml:space="preserve" x="200.0" y="433.8" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="14" fill="#343a40">16.67 per crop</text><rect x="420" y="290" width="340" height="190" rx="9" fill="#fff4e6" stroke="#e8590c" stroke-width="1.6"/><rect x="419.0" y="290.2" width="340.4" height="189.6" rx="10" fill="none" stroke="#e8590c" stroke-width="1.1" stroke-opacity="0.45"/><text xml:space="preserve" x="590.0" y="346.6" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="16" font-weight="700" fill="#c2410c">t = 0.35</text><text xml:space="preserve" x="590.0" y="372.9" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="14" fill="#343a40">rejects A only</text><text xml:space="preserve" x="590.0" y="393.2" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="14" fill="#343a40">D escapes: 50</text><text xml:space="preserve" x="590.0" y="413.5" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="14" fill="#343a40">no false rejects</text><text xml:space="preserve" x="590.0" y="433.8" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="14" fill="#343a40">8.33 per crop</text><rect x="810" y="290" width="340" height="190" rx="9" fill="#f3f0ff" stroke="#7048e8" stroke-width="1.6"/><rect x="810.1" y="288.7" width="338.7" height="189.1" rx="10" fill="none" stroke="#7048e8" stroke-width="1.1" stroke-opacity="0.45"/><text xml:space="preserve" x="980.0" y="346.6" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="16" font-weight="700" fill="#5f3dc4">t = 0.0196, the cost-based one</text><text xml:space="preserve" x="980.0" y="372.9" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="14" fill="#343a40">rejects A, B, E, D</text><text xml:space="preserve" x="980.0" y="393.2" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="14" fill="#343a40">B and E are false rejects: 2</text><text xml:space="preserve" x="980.0" y="413.5" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="14" fill="#343a40">nothing escapes</text><text xml:space="preserve" x="980.0" y="433.8" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="14" fill="#343a40">0.33 per crop</text></svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 520" width="1180" height="520" role="img" aria-label="One threshold, six crops, three costs"><defs></defs><rect x="0" y="0" width="1180" height="520" rx="18" fill="#fffdf7"/><text xml:space="preserve" x="590.0" y="44" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="24" font-weight="700" fill="#1864ab">One threshold, six crops, three costs</text><text xml:space="preserve" x="590.0" y="70" text-anchor="middle" font-family="'Inter','Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="14" fill="#868e96">Miss costs 50, a false reject costs 1, so reject when p &gt; 1 / 51 = 0.0196</text><rect x="70" y="130" width="130" height="90" rx="9" fill="#fff5f5" stroke="#e03131" stroke-width="1.6"/><rect x="69.5" y="129.0" width="130.5" height="88.7" rx="10" fill="none" stroke="#e03131" stroke-width="1.1" stroke-opacity="0.45"/><text xml:space="preserve" x="135.0" y="158.0" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="15" font-weight="700" fill="#c92a2a">crop A</text><text xml:space="preserve" x="135.0" y="182.9" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" fill="#343a40">defect</text><text xml:space="preserve" x="135.0" y="201.7" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" fill="#343a40">p = 0.40</text><rect x="250" y="130" width="130" height="90" rx="9" fill="#ebfbee" stroke="#2f9e44" stroke-width="1.6"/><rect x="250.1" y="129.6" width="128.7" height="90.0" rx="10" fill="none" stroke="#2f9e44" stroke-width="1.1" stroke-opacity="0.45"/><text xml:space="preserve" x="315.0" y="158.0" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,
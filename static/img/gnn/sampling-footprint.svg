<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 600" width="1160" height="600" role="img" aria-label="One batch of 64 nodes, and how much of the graph it drags in"><defs></defs><rect x="0" y="0" width="1160" height="600" rx="18" fill="#fffdf7"/><text xml:space="preserve" x="580.0" y="44" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="24" font-weight="700" fill="#1864ab">One batch of 64 nodes, and how much of the graph it drags in</text><text xml:space="preserve" x="580.0" y="70" text-anchor="middle" font-family="'Inter','Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="14" fill="#868e96">Barabasi-Albert graph, 100,000 nodes, 499,975 edges, mean degree 10, largest degree 1,141</text><rect x="20" y="90" width="1120" height="380" rx="14" fill="#fff4e6" fill-opacity="0.35" stroke="#e8590c" stroke-width="2" stroke-dasharray="9 6"/><text xml:space="preserve" x="580.0" y="116" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="16" font-weight="700" fill="#c2410c">Nodes loaded to embed 64 targets</text><text xml:space="preserve" x="300.0" y="157.0" text-anchor="end" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="14" font-weight="400" fill="#343a40">1 layer, all neighbours</text><rect x="320" y="140" width="560" height="24" rx="12.0" fill="#e9ecef" stroke="#ced4da"/><rect x="320" y="140" width="4.8" height="24" rx="12.0" fill="#e03131"/><text xml:space="preserve" x="900.0" y="158.0" text-anchor="start" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="14" font-weight="700" fill="#343a40">862  (0.9%)</text><text xml:space="preserve" x="300.0" y="221.0" text-anchor="end" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="14" font-weight="400" fill="#343a40">2 layers, all neighbours</text><rect x="320" y="204" width="560" height="24" rx="12.0" fill="#e9ecef" stroke="#ced4da"/><rect x="320" y="204" width="116.9" height="24" rx="12.0" fill="#e03131"/><text xml:space="preserve" x="900.0" y="222.0" text-anchor="start" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="14" font-weight="700" fill="#343a40">20,871  (20.9%)</text><text xml:space="preserve" x="300.0" y="285.0" text-anchor="end" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="14" font-weight="400" fill="#343a40">3 layers, all neighbours</text><rect x="320" y="268" width="560" height="24" rx="12.0" fill="#e9ecef" stroke="#ced4da"/><rect x="320" y="268" width="526.8" height="24" rx="12.0" fill="#e03131"/><text xml:space="preserve" x="900.0" y="286.0" text-anchor="start" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="14" font-weight="700" fill="#343a40">94,068  (94.1%)</text><text xml:space="preserve" x="300.0" y="349.0" text-anchor="end" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="14" font-weight="400" fill="#343a40">2 layers, sample 10 then 5</text><rect x="320" y="332" width="560" height="24" rx="12.0" fill="#e9ecef" stroke="#ced4da"/><rect x="320" y="332" width="14.2" height="24" rx="12.0" fill="#2f9e44"/><text xml:space="preserve" x="900.0" y="350.0" text-anchor="start" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="14" font-weight="700" fill="#343a40">2,530  (2.5%)</text><text xml:space="preserve" x="300.0" y="413.0" text-anchor="end" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="14" font-weight="400" fill="#343a40">3 layers, sample 10, 5, 5</text><rect x="320" y="396" width="560" height="24" rx="12.0" fill="#e9ecef" stroke="#ced4da"/><rect x="320" y="396" width="58.1" height="24" rx="12.0" fill="#2f9e44"/><text xml:space="preserve" x="900.0" y="414.0" text-anchor="start" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="14" font-weight="700" fill="#343a40">10,378  (10.4%)</text><rect x="20" y="490" width="540" height="90" rx="9" fill="#fff5f5" stroke="#e03131" stroke-width="1.6"/><rect x="19.5" y="489.0" width="540.5" height="88.7" rx="10" fill="none" stroke="#e03131" stroke-width="1.1" stroke-opacity="0.45"/><text xml:space="preserve" x="290.0" y="526.7" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="15" font-weight="700" fill="#c92a2a">Three layers touch almost everything</text><text xml:space="preserve" x="290.0" y="553.0" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="14" fill="#343a40">94.1% of the graph for just 64 targets</text><rect x="600" y="490" width="540" height="90" rx="9" fill="#ebfbee" stroke="#2f9e44" stroke-width="1.6"/><rect x="600.1" y="489.6" width="538.7" height="90.0" rx="10" fill="none" stroke="#2f9e44" stroke-width="1.1" stroke-opacity="0.45"/><text xml:space="preserve" x="870.0" y="526.7" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="15" font-weight="700" fill="#2b8a3e">Fan-out 10, 5, 5 keeps it to a tenth</text><text xml:space="preserve" x="870.0" y="553.0" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="14" fill="#343a40">10.4%, at the price of a noisier neighbour average</text></svg>

ill="#343a40">replicas stay identical</text><path d="M235.0,145.0 L260.0,145.0" fill="none" stroke="#343a40" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#ah343a40)"/><path d="M475.0,145.0 L500.0,145.0" fill="none" stroke="#343a40" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#ah343a40)"/><path d="M715.0,145.0 L740.0,145.0" fill="none" stroke="#343a40" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#ah343a40)"/><path d="M955.0,145.0 L980.0,145.0" fill="none" stroke="#343a40" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#ah343a40)"/><path d="M1087.5,190.0 L1100.0,225.0 L500.0,225.0 L607.5,190.0" fill="none" stroke="#e03131" stroke-width="1.8" stroke-dasharray="7 5" stroke-linejoin="round" marker-end="url(#ahe03131)"/><rect x="20" y="265" width="590" height="245" rx="14" fill="#e3fafc" fill-opacity="0.35" stroke="#0c8599" stroke-width="2" stroke-dasharray="9 6"/><text xml:space="preserve" x="315.0" y="291" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="16" font-weight="700" fill="#0b7285">Why averaging is exact (numpy, 8 shards of 32)</text><rect x="40" y="310" width="550" height="34" rx="6" fill="#0c8599"/><text xml:space="preserve" x="48" y="329.0" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" font-weight="700" fill="#ffffff">check</text><text xml:space="preserve" x="438" y="329.0" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" font-weight="700" fill="#ffffff">max error</text><line x1="40" y1="344" x2="590" y2="344" stroke="#dee2e6"/><text xml:space="preserve" x="48" y="363.0" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" font-weight="400" fill="#343a40">8 shard gradients averaged vs full batch of 256</text><text xml:space="pre
xt xml:space="preserve" x="560.0" y="230.6" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="18" fill="#343a40">= 0.700000</text><path d="M340.0,195.0 L400.0,195.0" fill="none" stroke="#343a40" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#ah343a40)"/><path d="M780.0,195.0 L720.0,195.0" fill="none" stroke="#343a40" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#ah343a40)"/><rect x="40" y="330" width="500" height="180" rx="9" fill="#f3f0ff" stroke="#7048e8" stroke-width="1.6"/><rect x="39.8" y="331.0" width="498.9" height="179.2" rx="10" fill="none" stroke="#7048e8" stroke-width="1.1" stroke-opacity="0.45"/><text xml:space="preserve" x="290.0" y="389.9" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="17" font-weight="700" fill="#5f3dc4">What stays local</text><text xml:space="preserve" x="290.0" y="417.6" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="15" fill="#343a40">Raw training records stay with each client.</text><text xml:space="preserve" x="290.0" y="439.4" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="15" fill="#343a40">Updates still contain information about data.</text><text xml:space="preserve" x="290.0" y="461.1" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="15" fill="#343a40">FedAvg alone is not a privacy guarantee.</text><rect x="580" y="330" width="500" height="180" rx="9" fill="#e3fafc" stroke="#0c8599" stroke-width="1.6"/><rect x="580.4" y="331.3" width="500.2" height="179.7" rx="10" fill="none" stroke="#0c8599" stroke-width="1.1" stroke-opacity="0.45"/><text xml:space="preserve" x="830.0" y="389.9" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="17" font-weight="700" fill="#0b7285">What protection must specify</text><text xml:space="preserve" x="830.0" y="417.6" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="15" fill="#343a40">Secure aggregation: hide individual inputs.</text><text xml:space="preserve" x="830.0" y="439.4" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="15" fill="#343a40">Differential privacy: bound information release.</text><text xml:space="preserve" x="830.0" y="461.1" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="15" fill="#343a40">Neither is established by averaging alone.</text></svg>

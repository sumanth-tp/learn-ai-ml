 fill="#343a40">2 + 12 = 14</text><text xml:space="preserve" x="560.0" y="244.6" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="16" fill="#343a40">divide by 4 examples = 3.5</text><path d="M325.0,210.0 L390.0,212.5" fill="none" stroke="#343a40" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#ah343a40)"/><path d="M795.0,210.0 L730.0,212.5" fill="none" stroke="#343a40" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#ah343a40)"/><rect x="35" y="360" width="500" height="150" rx="9" fill="#e3fafc" stroke="#0c8599" stroke-width="1.6"/><rect x="34.8" y="361.0" width="498.9" height="149.2" rx="10" fill="none" stroke="#0c8599" stroke-width="1.1" stroke-opacity="0.45"/><text xml:space="preserve" x="285.0" y="413.5" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="19" font-weight="700" fill="#0b7285">Update on both ranks</text><text xml:space="preserve" x="285.0" y="444.2" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="17" fill="#343a40">learning rate 0.1</text><text xml:space="preserve" x="285.0" y="468.8" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="17" fill="#343a40">1 - 0.1 × 3.5 = 0.650000</text><rect x="585" y="360" width="500" height="150" rx="9" fill="#fff5f5" stroke="#e03131" stroke-width="1.6"/><rect x="585.4" y="361.3" width="500.2" height="149.7" rx="10" fill="none" stroke="#e03131" stroke-width="1.1" stroke-opacity="0.45"/><text xml:space="preserve" x="835.0" y="414.6" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="18" font-weight="700" fill="#c92a2a">Wrong normalisation</text><text xml:space="preserve" x="835.0" y="443.8" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="16" fill="#343a40">mean of local means: (2 + 4)/2 = 3</text><text xml:space="preserve" x="835.0" y="467.0" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="16" fill="#343a40">wrong model = 0.700000</text><text xml:space="preserve" x="560" y="570.0" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="15" font-weight="400" fill="#343a40">Same reduced gradient and optimiser state are required for identical replica updates.</text></svg>

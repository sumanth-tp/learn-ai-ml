<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 580" width="1120" height="580" role="img" aria-label="A correct gradient can arrive too late"><defs></defs><rect x="0" y="0" width="1120" height="580" rx="18" fill="#fffdf7"/><text xml:space="preserve" x="560.0" y="44" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="24" font-weight="700" fill="#1864ab">A correct gradient can arrive too late</text><text xml:space="preserve" x="560.0" y="70" text-anchor="middle" font-family="'Inter','Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="14" fill="#868e96">Synthetic objective f(w) = 0.5 w²; initial w = 1; learning rate 0.4; 20 accepted updates</text><rect x="40" y="120" width="450" height="130" rx="9" fill="#e7f5ff" stroke="#1c7ed6" stroke-width="1.6"/><rect x="39.5" y="119.0" width="450.5" height="128.7" rx="10" fill="none" stroke="#1c7ed6" stroke-width="1.1" stroke-opacity="0.45"/><text xml:space="preserve" x="265.0" y="163.5" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="19" font-weight="700" fill="#1864ab">Fresh update</text><text xml:space="preserve" x="265.0" y="194.2" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="17" fill="#343a40">evaluate at current w</text><text xml:space="preserve" x="265.0" y="218.8" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="17" fill="#343a40">w(next) = w - 0.4 w</text><rect x="630" y="120" width="450" height="130" rx="9" fill="#fff4e6" stroke="#e8590c" stroke-width="1.6"/><rect x="630.1" y="119.6" width="448.7" height="130.0" rx="10" fill="none" stroke="#e8590c" stroke-width="1.1" stroke-opacity="0.45"/><text xml:space="preserve" x="855.0" y="163.5" text-anchor="middle" font-family="'Cascadi
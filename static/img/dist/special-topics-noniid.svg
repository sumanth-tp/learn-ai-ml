.0" y="469.4" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="15" fill="#343a40">Many local steps follow different curvatures.</text><text xml:space="preserve" x="290.0" y="491.1" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="15" fill="#343a40">Zero target gap starts exactly at the optimum.</text><rect x="580" y="370" width="500" height="160" rx="9" fill="#fff4e6" stroke="#e8590c" stroke-width="1.6"/><rect x="580.1" y="369.6" width="498.7" height="160.0" rx="10" fill="none" stroke="#e8590c" stroke-width="1.1" stroke-opacity="0.45"/><text xml:space="preserve" x="830.0" y="419.9" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="17" font-weight="700" fill="#c2410c">Illustrative decreasing schedule</text><text xml:space="preserve" x="830.0" y="447.6" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="15" fill="#343a40">4,4,4,2,2,2,1,1,1,1,1,1</text><text xml:space="preserve" x="830.0" y="469.4" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="15" fill="#343a40">24 steps, 12 communication rounds</text><text xml:space="preserve" x="830.0" y="491.1" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="15" fill="#343a40">excess loss 0.000285; modelled time 720 ms</text><text xml:space="preserve" x="560" y="580.0" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="16" font-weight="400" fill="#343a40">The schedule illustrates adaptation; it is not an implementation of AdaComm.</text></svg>

ace="preserve" x="210.0" y="274.1" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="14" font-weight="700" fill="#c92a2a">pairs through the shuffle</text><text xml:space="preserve" x="210.0" y="297.5" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" fill="#343a40">no combiner: 100,000</text><text xml:space="preserve" x="210.0" y="314.9" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" fill="#343a40">with a combiner: 3,979 (4.0%)</text><rect x="400" y="255" width="345" height="70" rx="9" fill="#fff9db" stroke="#e8a300" stroke-width="1.6"/><rect x="401.4" y="253.6" width="346.1" height="69.4" rx="10" fill="none" stroke="#e8a300" stroke-width="1.1" stroke-opacity="0.45"/><text xml:space="preserve" x="572.5" y="274.1" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="14" font-weight="700" fill="#b35c00">lecture example</text><text xml:space="preserve" x="572.5" y="297.5" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" fill="#343a40">1000 GB over 100 mappers:</text><text xml:space="preserve" x="572.5" y="314.9" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" fill="#343a40">10 GB each, in parallel</text><rect x="780" y="95" width="440" height="250" rx="14" fill="#fff4e6" fill-opacity="0.35" stroke="#e8590c" stroke-width="2" stroke-dasharray="9 6"/><text xml:space="preserve" x="1000.0" y="121" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="16" font-weight="700" fill="#c2410c">20 iterations of gradient descent</text><rect x="800" y="145" width="400" height="36" rx="6" fill="#e8590c"/><text xml:space="preserve" x="808" y="165.0" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" font-weight="700" fill="#ffffff"></text><text xml:space="preserve" x="1018" y="165.0" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" font-weight="700" fill="#ffffff">bytes read</text><line x1="800" y1="181" x2="1200" y2="181" stroke="#dee2e6"/><text xml:space="preserve" x="808" y="201.0" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" font-weight="400" fill="#343a40">re-read each time</text><text xml:space="preserve" x="1018" y="201.0" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" font-weight="400" fill="#343a40">14.16 MB</text><line x1="800" y1="217" x2="1200" y2="217" stroke="#dee2e6"/><rect x="800" y="217" width="400" height="36" fill="#fff4e6"/><text xml:space="preserve" x="808" y="237.0" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" font-weight="400" fill="#343a40">cached after first</text><text xml:space="preserve" x="1018" y="237.0" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" font-weight="400" fill="#343a40">0.71 MB</text><line x1="800" y1="253" x2="1200" y2="253" stroke="#dee2e6"/><text xml:space="preserve" x="1000" y="285.0" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" font-weight="400" fill="#c2410c" font-style="italic">ratio 20, same weights either way</text><text xml:space="preserve" x="1000" y="318.0" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="11" font-weight="400" fill="#c2410c" font-style="italic">named parameters: 10 GB per node at 200 MB/s</text><text xml:space="preserve" x="1000" y="333.4" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="11" font-weight="400" fill="#c2410c" font-style="italic">50 s per pass: 1000 s against 50 s</text><rect x="20" y="370" width="1200" height="290" rx="14" fill="#f3f0ff" fill-opacity="0.35" stroke="#7048e8" stroke-width="2" stroke-dasharray="9 6"/><text xml:space="preserve" x="620.0" y="396" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="16" font-weight="700" fill="#5f3dc4">Spark RDD lineage: a lost partition is rebuilt, not the whole dataset</text><rect x="50" y="430" width="200" height="70" rx="9" fill="#f8f9fa" stroke="#6c757d" stroke-width="1.6"/><rect x="48.9" y="428.9" width="199.4" height="70.9" rx="10" fill="none" stroke="#6c757d" stroke-width="1.1" stroke-opacity="0.45"/><text xml:space="preserve" x="150.0" y="457.9" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="14" font-weight="700" fill="#343a40">data</text><text xml:space="preserve" x="150.0" y="481.2" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" fill="#343a40">4 partitions</text><rect x="330" y="430" width="200" height="70" rx="9" fill="#f3f0ff" stroke="#7048e8" stroke-width="1.6"/><rect x="329.0" y="430.2" width="200.4" height="69.6" rx="10" fill="none" stroke="#7048e8" stroke-width="1.1" stroke-opacity="0.45"/><text xml:space="preserve" x="430.0" y="457.9" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="14" font-weight="700" fill="#5f3dc4">map: square</text><text xml:space="preserve" x="430.0" y="481.2" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" fill="#343a40">persisted in memory</text><rect x="610" y="430" width="200" height="70" rx="9" fill="#f3f0ff" stroke="#7048e8" stroke-width="1.6"/><rect x="610.1" y="428.7" width="198.7" height="69.1" rx="10" fill="none" stroke="#7048e8" stroke-width="1.1" stroke-opacity="0.45"/><text xml:space="preserve" x="710.0" y="457.9" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="14" font-weight="700" fill="#5f3dc4">filter: even</text><text xml:space="preserve" x="710.0" y="481.2" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" fill="#343a40">then reduce: sum</text><path d="M250.0,465.0 L330.0,465.0" fill="none" stroke="#343a40" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#ah343a40)"/><path d="M530.0,465.0 L610.0,465.0" fill="none" stroke="#343a40" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#ah343a40)"/><rect x="840" y="420" width="370" height="34" rx="6" fill="#7048e8"/><text xml:space="preserve" x="848" y="439.0" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" font-weight="700" fill="#ffffff">action</text><text xml:space="preserve" x="998" y="439.0" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" font-weight="700" fill="#ffffff">computations</text><line x1="840" y1="454" x2="1210" y2="454" stroke="#dee2e6"/><text xml:space="preserve" x="848" y="473.0" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" font-weight="400" fill="#343a40">first</text><text xml:space="preserve" x="998" y="473.0" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" font-weight="400" fill="#343a40">8 (4 map + 4 filter)</text><line x1="840" y1="488" x2="1210" y2="488" stroke="#dee2e6"/><rect x="840" y="488" width="370" height="34" fill="#f3f0ff"/><text xml:space="preserve" x="848" y="507.0" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" font-weight="400" fill="#343a40">second, cached</text><text xml:space="preserve" x="998" y="507.0" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" font-weight="400" fill="#343a40">4 (filters only)</text><line x1="840" y1="522" x2="1210" y2="522" stroke="#dee2e6"/><text xml:space="preserve" x="848" y="541.0" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" font-weight="400" fill="#343a40">one part lost</text><text xml:space="preserve" x="998" y="541.0" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" font-weight="400" fill="#343a40">5 (4 filters + 1 map)</text><line x1="840" y1="556" x2="1210" y2="556" stroke="#dee2e6"/><rect x="50" y="540" width="760" height="95" rx="9" fill="#ebfbee" stroke="#2f9e44" stroke-width="1.6"/><rect x="50.5" y="539.8" width="759.4" height="95.3" rx="10" fill="none" stroke="#2f9e44" stroke-width="1.1" stroke-opacity="0.45"/><text xml:space="preserve" x="430.0" y="571.6" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="14" font-weight="700" fill="#2b8a3e">why iterative ML prefers it</text><text xml:space="preserve" x="430.0" y="595.0" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" fill="#343a40">MapReduce writes results to disk between jobs, so every iteration pays for reading again.</text><text xml:space="preserve" x="430.0" y="612.4" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" fill="#343a40">RDDs keep the working set in memory and remember how to recompute it.</text><rect x="261.9" y="456.0" width="56.2" height="18" rx="4" fill="#fffdf7" fill-opacity="0.95"/><text xml:space="preserve" x="290.0" y="469.0" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="11" font-weight="700" fill="#343a40">lineage</text></svg>

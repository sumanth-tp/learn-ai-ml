<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="1200" height="700" role="img" aria-label="Drift, guards and locking"><defs></defs><rect x="0" y="0" width="1200" height="700" rx="18" fill="#fffdf7"/><text xml:space="preserve" x="600.0" y="44" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="24" font-weight="700" fill="#1864ab">Drift, guards and locking</text><text xml:space="preserve" x="600.0" y="70" text-anchor="middle" font-family="'Inter','Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="14" fill="#868e96">A console edit, the lifecycle rules that answer it, and two writers sharing one state</text><rect x="20" y="95" width="740" height="330" rx="14" fill="#fff4e6" fill-opacity="0.35" stroke="#e8590c" stroke-width="2" stroke-dasharray="9 6"/><text xml:space="preserve" x="390.0" y="121" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="16" font-weight="700" fill="#c2410c">Someone sets node_count to 4 in the console</text><rect x="40" y="140" width="340" height="70" rx="9" fill="#fff9db" stroke="#e8a300" stroke-width="1.6"/><rect x="39.5" y="139.0" width="340.5" height="68.7" rx="10" fill="none" stroke="#e8a300" stroke-width="1.1" stroke-opacity="0.45"/><text xml:space="preserve" x="210.0" y="167.8" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="14" font-weight="700" fill="#b35c00">refresh-only report</text><text xml:space="preserve" x="210.0" y="191.2" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" fill="#343a40">cluster.gpu  node_count: 2 -&gt; 4</text><rect x="400" y="140" width="340" height="70" rx="9" fill="#fff4e6" stroke="#e8590c" stroke-width="1.6"/><rect x="400.1" y="139.6" width="338.7" height="70.0" rx="10" fill="none" stroke="#e8590c" stroke-width="1.1" stroke-opacity="0.45"/><text xml:space="preserve" x="570.0" y="159.2" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="14" font-weight="700" fill="#c2410c">normal plan, code says 2</text><text xml:space="preserve" x="570.0" y="182.6" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" fill="#343a40">~ cluster.gpu  node_count: 4 -&gt; 2</text><text xml:space="preserve" x="570.0" y="200.0" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" fill="#343a40">Plan: 0 to add, 1 to change, 0 to destroy.</text><rect x="40" y="235" width="340" height="80" rx="9" fill="#ebfbee" stroke="#2f9e44" stroke-width="1.6"/><rect x="38.6" y="234.8" width="338.7" height="78.8" rx="10" fill="none" stroke="#2f9e44" stroke-width="1.1" stroke-opacity="0.45"/><text xml:space="preserve" x="210.0" y="259.1" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="14" font-weight="700" fill="#2b8a3e">accept the drift</text><text xml:space="preserve" x="210.0" y="282.5" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" fill="#343a40">apply the refresh-only plan,</text><text xml:space="preserve" x="210.0" y="299.9" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" fill="#343a40">then change the code to 4</text><rect x="400" y="235" width="340" height="80" rx="9" fill="#e7f5ff" stroke="#1c7ed6" stroke-width="1.6"/><rect x="399.8" y="236.0" width="338.9" height="79.2" rx="10" fill="none" stroke="#1c7ed6" stroke-width="1.1" stroke-opacity="0.45"/><text xml:space="preserve" x="570.0" y="259.1" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="14" font-weight="700" fill="#1864ab">overwrite it</text><text xml:space="preserve" x="570.0" y="282.5" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" fill="#343a40">apply: back to 2</text><text xml:space="preserve" x="570.0" y="299.9" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" fill="#343a40">right for a temporary fix</text><rect x="40" y="335" width="700" height="70" rx="9" fill="#f3f0ff" stroke="#7048e8" stroke-width="1.6"/><rect x="40.4" y="336.3" width="700.2" height="69.7" rx="10" fill="none" stroke="#7048e8" stroke-width="1.1" stroke-opacity="0.45"/><text xml:space="preserve" x="390.0" y="362.9" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="14" font-weight="700" fill="#5f3dc4">ignore_changes = [node_count]</text><text xml:space="preserve" x="390.0" y="386.2" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" fill="#343a40">an autoscaler owns the value: the plan says No changes.</text><rect x="780" y="95" width="400" height="330" rx="14" fill="#fff5f5" fill-opacity="0.35" stroke="#e03131" stroke-width="2" stroke-dasharray="9 6"/><text xml:space="preserve" x="980.0" y="121" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="16" font-weight="700" fill="#c92a2a">prevent_destroy</text><rect x="800" y="140" width="360" height="140" rx="9" fill="#fff5f5" stroke="#e03131" stroke-width="1.6"/><rect x="801.4" y="138.6" width="361.1" height="139.4" rx="10" fill="none" stroke="#e03131" stroke-width="1.1" stroke-opacity="0.45"/><text xml:space="preserve" x="980.0" y="185.4" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="14" font-weight="700" fill="#c92a2a">bucket renamed again</text><text xml:space="preserve" x="980.0" y="208.8" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" fill="#343a40">plan fails before any apply:</text><text xml:space="preserve" x="980.0" y="226.2" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" fill="#343a40">prevent_destroy blocks the</text><text xml:space="preserve" x="980.0" y="243.7" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" fill="#343a40">replacement forced by name</text><rect x="800" y="295" width="360" height="110" rx="9" fill="#f8f9fa" stroke="#6c757d" stroke-width="1.6"/><rect x="798.9" y="293.9" width="359.4" height="110.9" rx="10" fill="none" stroke="#6c757d" stroke-width="1.1" stroke-opacity="0.45"/><text xml:space="preserve" x="980.0" y="334.1" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="14" font-weight="700" fill="#343a40">what it does not do</text><text xml:space="preserve" x="980.0" y="357.5" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" fill="#343a40">it cannot stop you deleting</text><text xml:space="preserve" x="980.0" y="374.9" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" fill="#343a40">the resource block entirely</text><rect x="20" y="445" width="1160" height="235" rx="14" fill="#e3fafc" fill-opacity="0.35" stroke="#0c8599" stroke-width="2" stroke-dasharray="9 6"/><text xml:space="preserve" x="600.0" y="471" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="16" font-weight="700" fill="#0b7285">Two engineers apply from the same starting state (block 2)</text><rect x="45" y="490" width="540" height="110" rx="9" fill="#fff5f5" stroke="#e03131" stroke-width="1.6"/><rect x="44.0" y="490.2" width="540.4" height="109.6" rx="10" fill="none" stroke="#e03131" stroke-width="1.1" stroke-opacity="0.45"/><text xml:space="preserve" x="315.0" y="520.5" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="14" font-weight="700" fill="#c92a2a">no lock</text><text xml:space="preserve" x="315.0" y="543.9" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" fill="#343a40">A writes cluster.gpu, then B writes endpoint.ranker</text><text xml:space="preserve" x="315.0" y="561.2" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" fill="#343a40">resources recorded: endpoint.ranker only, serial 1</text><text xml:space="preserve" x="315.0" y="578.6" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" fill="#343a40">the next plan wants to create cluster.gpu again</text><rect x="615" y="490" width="540" height="110" rx="9" fill="#ebfbee" stroke="#2f9e44" stroke-width="1.6"/><rect x="615.1" y="488.7" width="538.7" height="109.1" rx="10" fill="none" stroke="#2f9e44" stroke-width="1.1" stroke-opacity="0.45"/><text xml:space="preserve" x="885.0" y="520.5" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="14" font-weight="700" fill="#2b8a3e">with a lock file</text><text xml:space="preserve" x="885.0" y="543.9" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" fill="#343a40">A acquires: True. B while A holds it: False</text><text xml:space="preserve" x="885.0" y="561.2" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" fill="#343a40">B waits, reads A&#x27;s state, then writes</text><text xml:space="preserve" x="885.0" y="578.6" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" fill="#343a40">resources recorded: both, serial 2</text><text xml:space="preserve" x="600" y="650.0" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" font-weight="400" fill="#0b7285" font-style="italic">a remote backend with locking gives the whole team this guarantee</text></svg>

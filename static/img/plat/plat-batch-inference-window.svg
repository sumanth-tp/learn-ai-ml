 height="36" fill="#e7f5ff"/><text xml:space="preserve" x="48" y="304.0" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" font-weight="400" fill="#343a40">row by row</text><text xml:space="preserve" x="218" y="304.0" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" font-weight="400" fill="#343a40">100,000</text><text xml:space="preserve" x="388" y="304.0" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" font-weight="400" fill="#343a40">-</text><line x1="40" y1="320" x2="570" y2="320" stroke="#dee2e6"/><rect x="600" y="95" width="580" height="240" rx="14" fill="#ebfbee" fill-opacity="0.35" stroke="#2f9e44" stroke-width="2" stroke-dasharray="9 6"/><text xml:space="preserve" x="890.0" y="121" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="16" font-weight="700" fill="#2b8a3e">Padding waste, 20,000 sequences, batches of 32</text><rect x="620.0" y="158.0" width="136.6" height="36.0" rx="6" fill="#e7f5ff" stroke="#1c7ed6" stroke-width="2"/><rect x="620.0" y="158.0" width="540.0" height="36.0" rx="4" fill="none" stroke="#343a40" stroke-width="1.2"/><text xml:space="preserve" x="620.0" y="150.0" text-anchor="start" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" font-weight="700" fill="#1864ab">arrival order: 25.3% useful</text><rect x="620.0" y="230.0" width="537.3" height="36.0" rx="6" fill="#ebfbee" stroke="#2f9e44" stroke-width="2"/><rect x="620.0" y="230.0" width="540.0" height="36.0" rx="4" fill="none" stroke="#343a40" stroke-width="1.2"/><text xml:space="preserve" x="620.0" y="222.0" text-anchor="start" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" font-weight="700" fill="#2b8a3e">sorted by length: 99.5% useful</text><text xml:space="preserve" x="890.0" y="296.0" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" font-weight="400" fill="#343a40">5,861,600 vs 1,488,128 padded tokens: 74.6% of the compute saved</text><text xml:space="preserve" x="890.0" y="315.0" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="11" font-weight="400" fill="#868e96">keep the row id, sort, score, then restore the order</text><rect x="20" y="355" width="1160" height="215" rx="14" fill="#fff4e6" fill-opacity="0.35" stroke="#e8590c" stroke-width="2" stroke-dasharray="9 6"/><text xml:space="preserve" x="600.0" y="381" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="16" font-weight="700" fill="#c2410c">50 million rows, 2,000 rows/s per worker, 2 hour window, one partition holds 30%</text><rect x="40" y="400" width="820" height="36" rx="6" fill="#e8590c"/><text xml:space="preserve" x="48" y="420.0" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" font-weight="700" fill="#ffffff">workers</text><text xml:space="preserve" x="188" y="420.0" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" font-weight="700" fill="#ffffff">as partitioned</text><text xml:space="preserve" x="408" y="420.0" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" font-weight="700" fill="#ffffff">fits</text><text xml:space="preserve" x="508" y="420.0" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" font-weight="700" fill="#ffffff">chunked at 5M rows</text><text xml:space="preserve" x="768" y="420.0" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" font-weight="700" fill="#ffffff">fits</text><line x1="40" y1="436" x2="860" y2="436" stroke="#dee2e6"/><text xml:space="preserve" x="48" y="456.0" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" font-weight="400" fill="#343a40">2</text><text xml:space="preserve" x="188" y="456.0" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" font-weight="400" fill="#343a40">3.47 h</text><text xml:space="preserve" x="408" y="456.0" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" font-weight="400" fill="#343a40">no</text><text xml:space="preserve" x="508" y="456.0" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" font-weight="400" fill="#343a40">3.47 h</text><text xml:space="preserve" x="768" y="456.0" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" font-weight="400" fill="#343a40">no</text><line x1="40" y1="472" x2="860" y2="472" stroke="#dee2e6"/><rect x="40" y="472" width="820" height="36" fill="#fff4e6"/><text xml:space="preserve" x="48" y="492.0" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" font-weight="400" fill="#343a40">4</text><text xml:space="preserve" x="188" y="492.0" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" font-weight="400" fill="#343a40">2.08 h</text><text xml:space="preserve" x="408" y="492.0" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" font-weight="400" fill="#343a40">no</text><text xml:space="preserve" x="508" y="492.0" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" font-weight="400" fill="#343a40">1.74 h</text><text xml:space="preserve" x="768" y="492.0" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" font-weight="400" fill="#343a40">yes</text><line x1="40" y1="508" x2="860" y2="508" stroke="#dee2e6"/><text xml:space="preserve" x="48" y="528.0" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" font-weight="400" fill="#343a40">8</text><text xml:space="preserve" x="188" y="528.0" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" font-weight="400" fill="#343a40">2.08 h</text><text xml:space="preserve" x="408" y="528.0" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" font-weight="400" fill="#343a40">no</text><text xml:space="preserve" x="508" y="528.0" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" font-weight="400" fill="#343a40">0.87 h</text><text xml:space="preserve" x="768" y="528.0" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" font-weight="400" fill="#343a40">yes</text><line x1="40" y1="544" x2="860" y2="544" stroke="#dee2e6"/><rect x="900" y="400" width="260" height="144" rx="9" fill="#fff5f5" stroke="#e03131" stroke-width="1.6"/><rect x="899.5" y="399.0" width="260.5" height="142.7" rx="10" fill="none" stroke="#e03131" stroke-width="1.1" stroke-opacity="0.45"/><text xml:space="preserve" x="1030.0" y="446.7" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="14" font-weight="700" fill="#c92a2a">more workers cannot beat the</text><text xml:space="preserve" x="1030.0" y="465.6" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="14" font-weight="700" fill="#c92a2a">biggest partition</text><text xml:space="preserve" x="1030.0" y="489.0" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" fill="#343a40">8 workers still take 2.08 h</text><text xml:space="preserve" x="1030.0" y="506.4" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" fill="#343a40">chunking fixes it</text><rect x="20" y="590" width="1160" height="90" rx="9" fill="#fff9db" stroke="#e8a300" stroke-width="1.6"/><rect x="20.1" y="589.6" width="1158.7" height="90.0" rx="10" fill="none" stroke="#e8a300" stroke-width="1.1" stroke-opacity="0.45"/><text xml:space="preserve" x="600.0" y="627.9" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="14" font-weight="700" fill="#b35c00">longest-first simulation on 4 workers</text><text xml:space="preserve" x="600.0" y="651.2" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" fill="#343a40">25 partitions, one with 30%: 2.08 h (83% utilisation); cut into 27 tasks of at most 5M rows: 1.82 h; perfect split 1.74 h</text></svg>

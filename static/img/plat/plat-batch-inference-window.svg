<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="1200" height="700" role="img" aria-label="Making the nightly batch fit"><defs></defs><rect x="0" y="0" width="1200" height="700" rx="18" fill="#fffdf7"/><text xml:space="preserve" x="600.0" y="44" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="24" font-weight="700" fill="#1864ab">Making the nightly batch fit</text><text xml:space="preserve" x="600.0" y="70" text-anchor="middle" font-family="'Inter','Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="14" fill="#868e96">Block 1 shows what batching and sorting save; block 3 shows what skew costs</text><rect x="20" y="95" width="560" height="240" rx="14" fill="#e7f5ff" fill-opacity="0.35" stroke="#1c7ed6" stroke-width="2" stroke-dasharray="9 6"/><text xml:space="preserve" x="300.0" y="121" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="16" font-weight="700" fill="#1864ab">Batch size changes calls, not answers (100,000 rows)</text><rect x="40" y="140" width="530" height="36" rx="6" fill="#1c7ed6"/><text xml:space="preserve" x="48" y="160.0" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" font-weight="700" fill="#ffffff">batch size</text><text xml:space="preserve" x="218" y="160.0" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" font-weight="700" fill="#ffffff">model calls</text><text xml:space="preserve" x="388" y="160.0" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" font-weight="700" fill="#ffffff">identical scores</text><line x1="40" y1="176" x2="570" y2="176" stroke="#dee2e6"/><text xml:space="preserve" x="48" y="196.0" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Men
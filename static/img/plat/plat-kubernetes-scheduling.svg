eserve" x="900.0" y="620.0" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" fill="#343a40">taint GPU nodes, tolerate in GPU pods</text><text xml:space="preserve" x="900.0" y="637.4" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" fill="#343a40">then size the CPU pool for everything else</text></svg>

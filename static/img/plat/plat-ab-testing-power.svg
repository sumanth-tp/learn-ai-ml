<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 640" width="1180" height="640" role="img" aria-label="How many users, and how much CUPED saves"><defs></defs><rect x="0" y="0" width="1180" height="640" rx="18" fill="#fffdf7"/><text xml:space="preserve" x="590.0" y="44" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="24" font-weight="700" fill="#1864ab">How many users, and how much CUPED saves</text><text xml:space="preserve" x="590.0" y="70" text-anchor="middle" font-family="'Inter','Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="14" fill="#868e96">10% baseline, alpha 0.05, power 0.80, two-sided z-test</text><rect x="20" y="95" width="560" height="330" rx="14" fill="#e7f5ff" fill-opacity="0.35" stroke="#1c7ed6" stroke-width="2" stroke-dasharray="9 6"/><text xml:space="preserve" x="300.0" y="121" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="16" font-weight="700" fill="#1864ab">Users per arm for each effect you want to see</text><text xml:space="preserve" x="40.0" y="172.0" text-anchor="start" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" font-weight="700" fill="#343a40">MDE 0.020</text><rect x="160.0" y="150.0" width="21.9" height="34.0" rx="6" fill="#e7f5ff" stroke="#1c7ed6" stroke-width="2"/><text xml:space="preserve" x="191.9" y="172.0" text-anchor="start" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="14" font-weight="700" fill="#1864ab">3,841</text><text xml:space="preserve" x="40.0" y="242.0" text-anchor="start" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" font-weight="700" fill="#343a40">MDE 0.010</text><rect x="160.0" y="220.0" width="84.3" height="34.0" rx="6" fill="#e7f5ff" stroke="#1c7ed6" stroke-width="2"/><text xml:space="preserve" x="254.3" y="242.0" text-anchor="start" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="14" font-weight="700" fill="#1864ab">14,751</text><text xml:space="preserve" x="40.0" y="312.0" text-anchor="start" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" font-weight="700" fill="#343a40">MDE 0.005</text><rect x="160.0" y="290.0" width="330.0" height="34.0" rx="6" fill="#e7f5ff" stroke="#1c7ed6" stroke-width="2"/><text xml:space="preserve" x="500.0" y="312.0" text-anchor="start" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="14" font-weight="700" fill="#1864ab">57,763</text><rect x="40" y="355" width="520" height="56" rx="9" fill="#fff4e6" stroke="#e8590c" stroke-width="1.6"/><rect x="39.5" y="354.0" width="520.5" height="54.7" rx="10" fill="none" stroke="#e8590c" stroke-width="1.1" stroke-opacity="0.45"/><text xml:space="preserve" x="300.0" y="375.9" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="14" font-weight="700" fill="#c2410c">halve the effect, quadruple the users</text><text xml:space="preserve" x="300.0" y="399.2" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" fill="#343a40">3,841 -&gt; 14,751 -&gt; 57,763 (about x4 each step)</text><rect x="600" y="95" width="560" height="330" rx="14" fill="#ebfbee" fill-opacity="0.35" stroke="#2f9e44" stroke-width="2" stroke-dasharray="9 6"/><text xml:space="preserve" x="880.0" y="121" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="16" font-weight="700" fill="#2b8a3e">Does the formula keep its promise? 4,000 simulated tests</text><rect x="620" y="145" width="520" height="44" rx="6" fill="#2f9e44"/><text xml:space="preserve" x="628" y="165.0" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" font-weight="700" fill="#ffffff">check</text><text xml:space="preserve" x="948" y="165.0" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" font-weight="700" fill="#ffffff">result</text><line x1="620" y1="189" x2="1140" y2="189" stroke="#dee2e6"/><text xml:space="preserve" x="628" y="209.0" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" font-weight="400" fill="#343a40">n = 14,751 per arm, true lift +0.01</text><text xml:space="preserve" x="948" y="209.0" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" font-weight="400" fill="#343a40">power 0.800</text><line x1="620" y1="233" x2="1140" y2="233" stroke="#dee2e6"/><rect x="620" y="233" width="520" height="44" fill="#ebfbee"/><text xml:space="preserve" x="628" y="253.0" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" font-weight="400" fill="#343a40">n = 14,751 per arm, no lift</text><text xml:space="preserve" x="948" y="253.0" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" font-weight="400" fill="#343a40">false positives 0.051</text><line x1="620" y1="277" x2="1140" y2="277" stroke="#dee2e6"/><text xml:space="preserve" x="628" y="297.0" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" font-weight="400" fill="#343a40">half the traffic, 7,375 per arm</text><text xml:space="preserve" x="948" y="297.0" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" font-weight="400" fill="#343a40">power 0.495</text><line x1="620" y1="321" x2="1140" y2="321" stroke="#dee2e6"/><rect x="620" y="335" width="520" height="75" rx="9" fill="#fff5f5" stroke="#e03131" stroke-width="1.6"/><rect x="620.1" y="334.6" width="518.7" height="75.0" rx="10" fill="none" stroke="#e03131" stroke-width="1.1" stroke-opacity="0.45"/><text xml:space="preserve" x="880.0" y="365.4" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="14" font-weight="700" fill="#c92a2a">a coin flip is not a test</text><text xml:space="preserve" x="880.0" y="388.8" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" fill="#343a40">underpowered tests miss real wins and still look like evidence</text><rect x="20" y="445" width="1140" height="175" rx="14" fill="#f3f0ff" fill-opacity="0.35" stroke="#7048e8" stroke-width="2" stroke-dasharray="9 6"/><text xml:space="preserve" x="590.0" y="471" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="16" font-weight="700" fill="#5f3dc4">CUPED keeps (1 - rho squared) of the variance</text><rect x="40" y="490" width="190" height="90" rx="9" fill="#f3f0ff" stroke="#7048e8" stroke-width="1.6"/><rect x="38.6" y="489.8" width="188.7" height="88.8" rx="10" fill="none" stroke="#7048e8" stroke-width="1.1" stroke-opacity="0.45"/><text xml:space="preserve" x="135.0" y="519.1" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="14" font-weight="700" fill="#5f3dc4">rho 0.3</text><text xml:space="preserve" x="135.0" y="542.5" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" fill="#343a40">0.91 of variance</text><text xml:space="preserve" x="135.0" y="559.9" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" fill="#343a40">9% fewer users</text><rect x="245" y="490" width="190" height="90" rx="9" fill="#f3f0ff" stroke="#7048e8" stroke-width="1.6"/><rect x="244.8" y="491.0" width="188.9" height="89.2" rx="10" fill="none" stroke="#7048e8" stroke-width="1.1" stroke-opacity="0.45"/><text xml:space="preserve" x="340.0" y="519.1" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="14" font-weight="700" fill="#5f3dc4">rho 0.5</text><text xml:space="preserve" x="340.0" y="542.5" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" fill="#343a40">0.75 of variance</text><text xml:space="preserve" x="340.0" y="559.9" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" fill="#343a40">25% fewer users</text><rect x="450" y="490" width="190" height="90" rx="9" fill="#f3f0ff" stroke="#7048e8" stroke-width="1.6"/><rect x="450.4" y="491.3" width="190.2" height="89.7" rx="10" fill="none" stroke="#7048e8" stroke-width="1.1" stroke-opacity="0.45"/><text xml:space="preserve" x="545.0" y="519.1" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="14" font-weight="700" fill="#5f3dc4">rho 0.7</text><text xml:space="preserve" x="545.0" y="542.5" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" fill="#343a40">0.51 of variance</text><text xml:space="preserve" x="545.0" y="559.9" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" fill="#343a40">49% fewer users</text><rect x="655" y="490" width="190" height="90" rx="9" fill="#f3f0ff" stroke="#7048e8" stroke-width="1.6"/><rect x="656.4" y="488.6" width="191.1" height="89.4" rx="10" fill="none" stroke="#7048e8" stroke-width="1.1" stroke-opacity="0.45"/><text xml:space="preserve" x="750.0" y="519.1" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="14" font-weight="700" fill="#5f3dc4">rho 0.9</text><text xml:space="preserve" x="750.0" y="542.5" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" fill="#343a40">0.19 of variance</text><text xml:space="preserve" x="750.0" y="559.9" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" fill="#343a40">81% fewer users</text><rect x="870" y="490" width="270" height="90" rx="9" fill="#ebfbee" stroke="#2f9e44" stroke-width="1.6"/><rect x="868.9" y="488.9" width="269.4" height="90.9" rx="10" fill="none" stroke="#2f9e44" stroke-width="1.1" stroke-opacity="0.45"/><text xml:space="preserve" x="1005.0" y="519.1" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="14" font-weight="700" fill="#2b8a3e">measured at rho 0.7</text><text xml:space="preserve" x="1005.0" y="542.5" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" fill="#343a40">ratio 0.516, theory 0.510</text><text xml:space="preserve" x="1005.0" y="559.9" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" fill="#343a40">power 0.383 -&gt; 0.643</text></svg>

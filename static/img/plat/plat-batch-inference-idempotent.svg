<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="1200" height="700" role="img" aria-label="A batch job you can run twice"><defs></defs><rect x="0" y="0" width="1200" height="700" rx="18" fill="#fffdf7"/><text xml:space="preserve" x="600.0" y="44" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="24" font-weight="700" fill="#1864ab">A batch job you can run twice</text><text xml:space="preserve" x="600.0" y="70" text-anchor="middle" font-family="'Inter','Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="14" fill="#868e96">Seven daily partitions of 2,000 rows each, scored with DuckDB; every number is printed by block 2</text><rect x="20" y="95" width="560" height="215" rx="14" fill="#fff5f5" fill-opacity="0.35" stroke="#e03131" stroke-width="2" stroke-dasharray="9 6"/><text xml:space="preserve" x="300.0" y="121" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="16" font-weight="700" fill="#c92a2a">Append versus overwrite, run twice</text><rect x="40" y="140" width="255" height="150" rx="9" fill="#fff5f5" stroke="#e03131" stroke-width="1.6"/><rect x="39.5" y="139.0" width="255.5" height="148.7" rx="10" fill="none" stroke="#e03131" stroke-width="1.1" stroke-opacity="0.45"/><text xml:space="preserve" x="167.5" y="190.4" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="14" font-weight="700" fill="#c92a2a">append a new file</text><text xml:space="preserve" x="167.5" y="213.8" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" fill="#343a40">28,000 rows written</text><text xml:space="preserve" x="167.5" y="231.2" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" fill="#343a40">14,000 distinct ids</text><text xml:space="preserve" x="167.5" y="248.7" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" fill="#343a40">14,000 duplicates</text><rect x="305" y="140" width="255" height="150" rx="9" fill="#ebfbee" stroke="#2f9e44" stroke-width="1.6"/><rect x="305.1" y="139.6" width="253.7" height="150.0" rx="10" fill="none" stroke="#2f9e44" stroke-width="1.1" stroke-opacity="0.45"/><text xml:space="preserve" x="432.5" y="190.4" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="14" font-weight="700" fill="#2b8a3e">overwrite the partition</text><text xml:space="preserve" x="432.5" y="213.8" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" fill="#343a40">14,000 rows</text><text xml:space="preserve" x="432.5" y="231.2" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" fill="#343a40">14,000 distinct ids</text><text xml:space="preserve" x="432.5" y="248.7" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" fill="#343a40">same checksum both runs</text><rect x="600" y="95" width="580" height="215" rx="14" fill="#fff4e6" fill-opacity="0.35" stroke="#e8590c" stroke-width="2" stroke-dasharray="9 6"/><text xml:space="preserve" x="890.0" y="121" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="16" font-weight="700" fill="#c2410c">Backfill with a ledger, a worker dies on 09-04</text><rect x="620" y="140" width="540" height="36" rx="6" fill="#e8590c"/><text xml:space="preserve" x="628" y="160.0" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" font-weight="700" fill="#ffffff">run</text><text xml:space="preserve" x="738" y="160.0" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" font-weight="700" fill="#ffffff">ran</text><text xml:space="preserve" x="828" y="160.0" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" font-weight="700" fill="#ffffff">skipped</text><text xml:space="preserve" x="948" y="160.0" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" font-weight="700" fill="#ffffff">failed</text><line x1="620" y1="176" x2="1160" y2="176" stroke="#dee2e6"/><text xml:space="preserve" x="628" y="196.0" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" font-weight="400" fill="#343a40">first</text><text xml:space="preserve" x="738" y="196.0" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" font-weight="400" fill="#343a40">6</text><text xml:space="preserve" x="828" y="196.0" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" font-weight="400" fill="#343a40">0</text><text xml:space="preserve" x="948" y="196.0" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" font-weight="400" fill="#343a40">2026-09-04</text><line x1="620" y1="212" x2="1160" y2="212" stroke="#dee2e6"/><rect x="620" y="212" width="540" height="36" fill="#fff4e6"/><text xml:space="preserve" x="628" y="232.0" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" font-weight="400" fill="#343a40">second</text><text xml:space="preserve" x="738" y="232.0" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" font-weight="400" fill="#343a40">1</text><text xml:space="preserve" x="828" y="232.0" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" font-weight="400" fill="#343a40">6</text><text xml:space="preserve" x="948" y="232.0" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" font-weight="400" fill="#343a40">none</text><line x1="620" y1="248" x2="1160" y2="248" stroke="#dee2e6"/><text xml:space="preserve" x="628" y="268.0" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" font-weight="400" fill="#343a40">third</text><text xml:space="preserve" x="738" y="268.0" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" font-weight="400" fill="#343a40">0</text><text xml:space="preserve" x="828" y="268.0" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" font-weight="400" fill="#343a40">7</text><text xml:space="preserve" x="948" y="268.0" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" font-weight="400" fill="#343a40">none</text><line x1="620" y1="284" x2="1160" y2="284" stroke="#dee2e6"/><text xml:space="preserve" x="890" y="300.0" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="11" font-weight="400" fill="#c2410c" font-style="italic">a day is skipped when its input fingerprint matches the ledger</text><rect x="20" y="330" width="560" height="190" rx="14" fill="#f3f0ff" fill-opacity="0.35" stroke="#7048e8" stroke-width="2" stroke-dasharray="9 6"/><text xml:space="preserve" x="300.0" y="356" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="16" font-weight="700" fill="#5f3dc4">Late data: 300 rows arrive for 09-02</text><rect x="40" y="375" width="520" height="125" rx="9" fill="#f3f0ff" stroke="#7048e8" stroke-width="1.6"/><rect x="38.6" y="374.8" width="518.7" height="123.8" rx="10" fill="none" stroke="#7048e8" stroke-width="1.1" stroke-opacity="0.45"/><text xml:space="preserve" x="300.0" y="412.9" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="14" font-weight="700" fill="#5f3dc4">only 2026-09-02 reruns</text><text xml:space="preserve" x="300.0" y="436.3" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" fill="#343a40">ran 1 day, skipped 6</text><text xml:space="preserve" x="300.0" y="453.7" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" fill="#343a40">table: 14,300 rows, 14,300 distinct ids</text><text xml:space="preserve" x="300.0" y="471.1" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" fill="#343a40">the other six partitions are untouched</text><rect x="600" y="330" width="580" height="190" rx="14" fill="#e3fafc" fill-opacity="0.35" stroke="#0c8599" stroke-width="2" stroke-dasharray="9 6"/><text xml:space="preserve" x="890.0" y="356" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="16" font-weight="700" fill="#0b7285">A crash halfway through writing</text><rect x="620" y="375" width="265" height="125" rx="9" fill="#ebfbee" stroke="#2f9e44" stroke-width="1.6"/><rect x="619.8" y="376.0" width="263.9" height="124.2" rx="10" fill="none" stroke="#2f9e44" stroke-width="1.1" stroke-opacity="0.45"/><text xml:space="preserve" x="752.5" y="421.6" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="14" font-weight="700" fill="#2b8a3e">temp file, then rename</text><text xml:space="preserve" x="752.5" y="445.0" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" fill="#343a40">old file stays whole:</text><text xml:space="preserve" x="752.5" y="462.4" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" fill="#343a40">2,000 good rows</text><rect x="905" y="375" width="255" height="125" rx="9" fill="#fff5f5" stroke="#e03131" stroke-width="1.6"/><rect x="905.4" y="376.3" width="255.2" height="124.7" rx="10" fill="none" stroke="#e03131" stroke-width="1.1" stroke-opacity="0.45"/><text xml:space="preserve" x="1032.5" y="421.6" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="14" font-weight="700" fill="#c92a2a">write in place</text><text xml:space="preserve" x="1032.5" y="445.0" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" fill="#343a40">half a file is left:</text><text xml:space="preserve" x="1032.5" y="462.4" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" fill="#343a40">unreadable</text><rect x="20" y="545" width="1160" height="120" rx="9" fill="#fff9db" stroke="#e8a300" stroke-width="1.6"/><rect x="21.4" y="543.6" width="1161.1" height="119.4" rx="10" fill="none" stroke="#e8a300" stroke-width="1.1" stroke-opacity="0.45"/><text xml:space="preserve" x="600.0" y="578.6" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="15" font-weight="700" fill="#b35c00">the rule that makes all of this work</text><text xml:space="preserve" x="600.0" y="603.5" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" fill="#343a40">the output path is a function of the input partition, never of the clock or a random name;</text><text xml:space="preserve" x="600.0" y="622.3" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" fill="#343a40">write somewhere private and publish by renaming; record done only after the rename;</text><text xml:space="preserve" x="600.0" y="641.2" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" fill="#343a40">then retries, restarts and backfills are the same operation</text></svg>

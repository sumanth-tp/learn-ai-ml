xt><text xml:space="preserve" x="620.0" y="641.2" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" fill="#343a40">read the feature&#x27;s page for the limits that matter to you,</text><text xml:space="preserve" x="620.0" y="658.6" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" fill="#343a40">and check whether the product is being renamed or retired</text></svg>

enlo,Consolas,'Liberation Mono',monospace" font-size="16" font-weight="700" fill="#0b7285">Step 3: rename the bucket, resize the endpoint, add an alarm</text><rect x="40" y="295" width="660" height="40" rx="6" fill="#0c8599"/><text xml:space="preserve" x="48" y="314.0" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" font-weight="700" fill="#ffffff">symbol</text><text xml:space="preserve" x="128" y="314.0" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" font-weight="700" fill="#ffffff">address</text><text xml:space="preserve" x="298" y="314.0" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" font-weight="700" fill="#ffffff">change</text><line x1="40" y1="335" x2="700" y2="335" stroke="#dee2e6"/><text xml:space="preserve" x="48" y="354.0" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" font-weight="400" fill="#343a40">-/+</text><text xml:space="preserve" x="128" y="354.0" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" font-weight="400" fill="#343a40">bucket.artifacts</text><text xml:space="preserve" x="298" y="354.0" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" font-weight="400" fill="#343a40">name ml-artifacts-prod -&gt; ml-artifacts-prod-eu</text><line x1="40" y1="375" x2="700" y2="375" stroke="#dee2e6"/><rect x="40" y="375" width="660" height="40" fill="#e3fafc"/><text xml:space="preserve" x="48" y="394.0" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" font-weight="400" fill="#343a40">~</text><text xml:space="preserve" x="128" y="394.0" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" font-weight="400" fill="#343a40">endpoint.ranker</text><text xml:space="preserve" x="298" y="394.0" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" font-weight="400" fill="#343a40">also bucket_name; replicas 3 -&gt; 5; image 1.0 -&gt; 1.1</text><line x1="40" y1="415" x2="700" y2="415" stroke="#dee2e6"/><text xml:space="preserve" x="48" y="434.0" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" font-weight="400" fill="#343a40">+</text><text xml:space="preserve" x="128" y="434.0" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" font-weight="400" fill="#343a40">alarm.latency</text><text xml:space="preserve" x="298" y="434.0" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" font-weight="400" fill="#343a40">new</text><line x1="40" y1="455" x2="700" y2="455" stroke="#dee2e6"/><rect x="40" y="470" width="660" height="70" rx="9" fill="#fff9db" stroke="#e8a300" stroke-width="1.6"/><rect x="39.8" y="471.0" width="658.9" height="69.2" rx="10" fill="none" stroke="#e8a300" stroke-width="1.1" stroke-opacity="0.45"/><text xml:space="preserve" x="370.0" y="498.2" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="15" font-weight="700" fill="#b35c00">Plan: 2 to add, 1 to change, 1 to destroy.</text><text xml:space="preserve" x="370.0" y="521.6" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" fill="#343a40">a replacement counts once as an add and once as a destroy</text><rect x="740" y="255" width="440" height="300" rx="14" fill="#fff4e6" fill-opacity="0.35" stroke="#e8590c" stroke-width="2" stroke-dasharray="9 6"/><text xml:space="preserve" x="960.0" y="281" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="16" font-weight="700" fill="#c2410c">Order and idempotence</text><rect x="760" y="300" width="400" height="54" rx="9" fill="#fff4e6" stroke="#e8590c" stroke-width="1.6"/><rect x="760.4" y="301.3" width="400.2" height="53.7" rx="10" fill="none" stroke="#e8590c" stroke-width="1.1" stroke-opacity="0.45"/><text xml:space="preserve" x="960.0" y="331.6" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="14" font-weight="700" fill="#c2410c">wave 1: bucket.artifacts, network.main</text><rect x="760" y="364" width="400" height="54" rx="9" fill="#fff4e6" stroke="#e8590c" stroke-width="1.6"/><rect x="761.4" y="362.6" width="401.1" height="53.4" rx="10" fill="none" stroke="#e8590c" stroke-width="1.1" stroke-opacity="0.45"/><text xml:space="preserve" x="960.0" y="395.6" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="14" font-weight="700" fill="#c2410c">wave 2: cluster.gpu</text><rect x="760" y="428" width="400" height="54" rx="9" fill="#fff4e6" stroke="#e8590c" stroke-width="1.6"/><rect x="758.9" y="426.9" width="399.4" height="54.9" rx="10" fill="none" stroke="#e8590c" stroke-width="1.1" stroke-opacity="0.45"/><text xml:space="preserve" x="960.0" y="459.6" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="14" font-weight="700" fill="#c2410c">wave 3: endpoint.ranker</text><rect x="760" y="492" width="400" height="46" rx="9" fill="#ebfbee" stroke="#2f9e44" stroke-width="1.6"/><rect x="759.0" y="492.2" width="400.4" height="45.6" rx="10" fill="none" stroke="#2f9e44" stroke-width="1.1" stroke-opacity="0.45"/><text xml:space="preserve" x="960.0" y="519.5" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="14" font-weight="700" fill="#2b8a3e">second plan, nothing changed: No changes.</text><rect x="20" y="575" width="1160" height="90" rx="9" fill="#fff5f5" stroke="#e03131" stroke-width="1.6"/><rect x="20.1" y="573.7" width="1158.7" height="89.1" rx="10" fill="none" stroke="#e03131" stroke-width="1.1" stroke-opacity="0.45"/><text xml:space="preserve" x="600.0" y="612.9" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="14" font-weight="700" fill="#c92a2a">read every -/+ as a deletion</text><text xml:space="preserve" x="600.0" y="636.2" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" fill="#343a40">a bucket name cannot change in place, so the old bucket and its contents are destroyed; prevent_destroy makes the plan fail instead</text><rect x="342.1" y="127.0" width="95.8" height="18" rx="4" fill="#fffdf7" fill-opacity="0.95"/><text xml:space="preserve" x="390.0" y="140.0" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="11" font-weight="700" fill="#343a40">plan compares</text><rect x="762.1" y="127.0" width="95.8" height="18" rx="4" fill="#fffdf7" fill-opacity="0.95"/><text xml:space="preserve" x="810.0" y="140.0" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="11" font-weight="700" fill="#343a40">refresh reads</text></svg>

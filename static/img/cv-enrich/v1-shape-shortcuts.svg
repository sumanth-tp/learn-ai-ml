arned nothing.</text><rect x="850" y="150" width="230" height="290" rx="9" fill="#fff9db" stroke="#e8a300" stroke-width="1.6"/><rect x="849.5" y="149.0" width="230.5" height="288.7" rx="10" fill="none" stroke="#e8a300" stroke-width="1.1" stroke-opacity="0.45"/><text xml:space="preserve" x="965.0" y="235.7" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="14" font-weight="700" fill="#b35c00">Read it as</text><text xml:space="preserve" x="965.0" y="259.1" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" fill="#343a40">colour cue: dies when</text><text xml:space="preserve" x="965.0" y="276.4" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" fill="#343a40">colours are swapped</text><text xml:space="preserve" x="965.0" y="293.8" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" fill="#343a40">HOG: needs upright shapes</text><text xml:space="preserve" x="965.0" y="311.2" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" fill="#343a40">CNN: took the colour</text><text xml:space="preserve" x="965.0" y="328.6" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" fill="#343a40">shortcut, 0.013 swapped</text><text xml:space="preserve" x="965.0" y="346.0" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" fill="#343a40">ResNet: perfect until</text><text xml:space="preserve" x="965.0" y="363.4" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberat
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 560" width="1160" height="560" role="img" aria-label="Suppression matters; its threshold barely does"><defs></defs><rect x="0" y="0" width="1160" height="560" rx="18" fill="#fffdf7"/><text xml:space="preserve" x="580.0" y="44" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="24" font-weight="700" fill="#1864ab">Suppression matters; its threshold barely does</text><text xml:space="preserve" x="580.0" y="70" text-anchor="middle" font-family="'Inter','Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="14" fill="#868e96">SSDlite320 MobileNetV3, COCO weights, 60 Penn-Fudan images, 129 pedestrians, AP at IoU 0.5</text><rect x="30" y="96" width="540" height="40" rx="9" fill="#e7f5ff" stroke="#1c7ed6" stroke-width="1.6"/><rect x="29.5" y="95.0" width="540.5" height="38.7" rx="10" fill="none" stroke="#1c7ed6" stroke-width="1.1" stroke-opacity="0.45"/><text xml:space="preserve" x="300.0" y="121.2" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="16" font-weight="700" fill="#1864ab">Average precision (envelope rule) by NMS setting</text><text xml:space="preserve" x="40" y="169.0" text-anchor="start" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="14" font-weight="400" fill="#343a40">no suppression</text><rect x="230" y="156" width="250" height="16" rx="8.0" fill="#e9ecef" stroke="#ced4da"/><rect x="230" y="156" width="107.0" height="16" rx="8.0" fill="#e03131"/><text xml:space="preserve" x="490" y="169.0" text-anchor="start" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="14" font-weight="700" fill="#c92a2a">0.428</text><text xml:space="preserve" x="40" y="207.0" text-anchor="start" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="14" font-weight="400" fill="#343a40">NMS 0.3</text><rect x="230" y="194" width="250" height="16" rx="8.0" fill="#e9ecef" stroke="#ced4da"/><rect x="230" y="194" width="230.0" height="16" rx="8.0" fill="#2f9e44"/><text xml:space="preserve" x="490" y="207.0" text-anchor="start" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="14" font-weight="700" fill="#2b8a3e">0.920</text><text xml:space="preserve" x="40" y="245.0" text-anchor="start" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="14" font-weight="400" fill="#343a40">NMS 0.5</text><rect x="230" y="232" width="250" height="16" rx="8.0" fill="#e9ecef" stroke="#ced4da"/><rect x="230" y="232" width="229.8" height="16" rx="8.0" fill="#2f9e44"/><text xml:space="preserve" x="490" y="245.0" text-anchor="start" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="14" font-weight="700" fill="#2b8a3e">0.919</text><text xml:space="preserve" x="40" y="283.0" text-anchor="start" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="14" font-weight="400" fill="#343a40">NMS 0.7</text><rect x="230" y="270" width="250" height="16" rx="8.0" fill="#e9ecef" stroke="#ced4da"/><rect x="230" y="270" width="228.8" height="16" rx="8.0" fill="#2f9e44"/><text xml:space="preserve" x="490" y="283.0" text-anchor="start" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="14" font-weight="700" fill="#2b8a3e">0.915</text><rect x="30" y="330" width="540" height="200" rx="9" fill="#fff9db" stroke="#e8a300" stroke-width="1.6"/><rect x="30.1" y="329.6" width="538.7" height="200.0" rx="10" fill="none" stroke="#e8a300" stroke-width="1.1" stroke-opacity="0.45"/><text xml:space="preserve" x="300.0" y="394.2" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="15" font-weight="700" fill="#b35c00">False positives change far more than AP</text><text xml:space="preserve" x="300.0" y="419.0" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" fill="#343a40">no suppression: 7,338</text><text xml:space="preserve" x="300.0" y="437.9" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" fill="#343a40">NMS 0.7: 3,203   NMS 0.5: 1,803   NMS 0.3: 946</text><text xml:space="preserve" x="300.0" y="456.7" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" fill="#343a40">extra false positives rank low, so the area barely moves</text><text xml:space="preserve" x="300.0" y="475.6" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" fill="#343a40">missed pedestrians: 4 at 0.3, 2 at 0.7</text><rect x="610" y="96" width="520" height="170" rx="9" fill="#fff4e6" stroke="#e8590c" stroke-width="1.6"/><rect x="608.6" y="95.8" width="518.7" height="168.8" rx="10" fill="none" stroke="#e8590c" stroke-width="1.1" stroke-opacity="0.45"/><text xml:space="preserve" x="870.0" y="164.0" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="15" font-weight="700" fill="#c2410c">Tighter matching costs about 0.06 AP</text><text xml:space="preserve" x="870.0" y="188.9" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" fill="#343a40">NMS 0.5: AP 0.919 at IoU 0.5, 0.857 at IoU 0.75</text><text xml:space="preserve" x="870.0" y="207.7" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" fill="#343a40">boxes find people but are not tight enough</text><rect x="610" y="296" width="520" height="234" rx="9" fill="#f3f0ff" stroke="#7048e8" stroke-width="1.6"/><rect x="609.8" y="297.0" width="518.9" height="233.2" rx="10" fill="none" stroke="#7048e8" stroke-width="1.1" stroke-opacity="0.45"/><text xml:space="preserve" x="870.0" y="377.2" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="15" font-weight="700" fill="#5f3dc4">Two AP rules, two numbers</text><text xml:space="preserve" x="870.0" y="402.0" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" fill="#343a40">envelope (scratch) against step (scikit-learn)</text><text xml:space="preserve" x="870.0" y="420.9" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" fill="#343a40">NMS 0.3, IoU 0.75: 0.859 against 0.870</text><text xml:space="preserve" x="870.0" y="439.7" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" fill="#343a40">no suppression: 0.428 against 0.424</text><text xml:space="preserve" x="870.0" y="458.6" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" fill="#343a40">my IoU and NMS match torchvision exactly on 400 random boxes</text></svg>

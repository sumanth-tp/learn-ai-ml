" height="150" rx="9" fill="#fff5f5" stroke="#e03131" stroke-width="1.6"/><rect x="608.6" y="95.8" width="518.7" height="148.8" rx="10" fill="none" stroke="#e03131" stroke-width="1.1" stroke-opacity="0.45"/><text xml:space="preserve" x="870.0" y="144.6" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="15" font-weight="700" fill="#c92a2a">Feature scale decides what similar means</text><text xml:space="preserve" x="870.0" y="169.4" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" fill="#343a40">k-means with position weight 0.5</text><text xml:space="preserve" x="870.0" y="188.3" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" fill="#343a40">IoU 0.129 on even light, 0.143 dimmed</text><text xml:space="preserve" x="870.0" y="207.1" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" fill="#343a40">clusters follow image halves, not tablets</text><rect x="610" y="276" width="520" height="254" rx="9" fill="#fff9db" stroke="#e8a300" stroke-width="1.6"/><rect x="609.8" y="277.0" width="518.9" height="253.2" rx="10" fill="none" stroke="#e8a300" stroke-width="1.1" stroke-opacity="0.45"/><text xml:space="preserve" x="870.0" y="367.2" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="15" font-weight="700" fill="#b35c00">Watershed does not rescue a rough mask</text><text xml:space="preserve" x="870.0" y="392.0" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" fill="#343a40">true tablets: 14 (two touching pairs)</text><text xml:space="preserve" x="870.0" y="410.9" text-anchor="mi
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 560" width="1160" height="560" role="img" aria-label="Which classical method survives a dimming belt?"><defs></defs><rect x="0" y="0" width="1160" height="560" rx="18" fill="#fffdf7"/><text xml:space="preserve" x="580.0" y="44" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="24" font-weight="700" fill="#1864ab">Which classical method survives a dimming belt?</text><text xml:space="preserve" x="580.0" y="70" text-anchor="middle" font-family="'Inter','Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="14" fill="#868e96">Synthetic belt, 14 tablets, noise 10, five scenes per condition, IoU against the true mask</text><rect x="30" y="96" width="540" height="40" rx="9" fill="#e7f5ff" stroke="#1c7ed6" stroke-width="1.6"/><rect x="29.5" y="95.0" width="540.5" height="38.7" rx="10" fill="none" stroke="#1c7ed6" stroke-width="1.1" stroke-opacity="0.45"/><text xml:space="preserve" x="300.0" y="121.2" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="16" font-weight="700" fill="#1864ab">IoU when the light fades to 45% across the belt</text><text xml:space="preserve" x="40" y="169.0" text-anchor="start" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="14" font-weight="400" fill="#343a40">fixed T=128</text><rect x="230" y="156" width="250" height="16" rx="8.0" fill="#e9ecef" stroke="#ced4da"/><rect x="230" y="156" width="79.2" height="16" rx="8.0" fill="#e03131"/><text xml:space="preserve" x="490" y="169.0" text-anchor="start" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="14" font-weight="700" fill="#c92a2a">0.317</text><text xml:space="preserve" x="40" y="207.0" text-anchor="start" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="14" font-weight="400" fill="#343a40">Otsu</text><rect x="230" y="194" width="250" height="16" rx="8.0" fill="#e9ecef" stroke="#ced4da"/><rect x="230" y="194" width="235.2" height="16" rx="8.0" fill="#2f9e44"/><text xml:space="preserve" x="490" y="207.0" text-anchor="start" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="14" font-weight="700" fill="#2b8a3e">0.941</text><text xml:space="preserve" x="40" y="245.0" text-anchor="start" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="14" font-weight="400" fill="#343a40">adaptive 51</text><rect x="230" y="232" width="250" height="16" rx="8.0" fill="#e9ecef" stroke="#ced4da"/><rect x="230" y="232" width="244.2" height="16" rx="8.0" fill="#2f9e44"/><text xml:space="preserve" x="490" y="245.0" text-anchor="start" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="14" font-weight="700" fill="#2b8a3e">0.977</text><text xml:space="preserve" x="40" y="283.0" text-anchor="start" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="14" font-weight="400" fill="#343a40">k-means gray</text><rect x="230" y="270" width="250" height="16" rx="8.0" fill="#e9ecef" stroke="#ced4da"/><rect x="230" y="270" width="233.2" height="16" rx="8.0" fill="#2f9e44"/><text xml:space="preserve" x="490" y="283.0" text-anchor="start" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="14" font-weight="700" fill="#2b8a3e">0.933</text><text xml:space="preserve" x="40" y="321.0" text-anchor="start" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="14" font-weight="400" fill="#343a40">k-means gray+xy</text><rect x="230" y="308" width="250" hei
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 520" width="1120" height="520" role="img" aria-label="Averaging before sampling is what prevents aliasing"><defs></defs><rect x="0" y="0" width="1120" height="520" rx="18" fill="#fffdf7"/><text xml:space="preserve" x="560.0" y="44" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="24" font-weight="700" fill="#1864ab">Averaging before sampling is what prevents aliasing</text><text xml:space="preserve" x="560.0" y="70" text-anchor="middle" font-family="'Inter','Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="14" fill="#868e96">512 by 512 images reduced to 128 by 128; reference is an ideal low-pass at the new Nyquist limit</text><text xml:space="preserve" x="40.0" y="112.0" text-anchor="start" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" font-weight="700" fill="#868e96">photograph: PSNR against the reference (dB, higher is better)</text><text xml:space="preserve" x="40.0" y="145.0" text-anchor="start" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" font-weight="400" fill="#343a40">point sample</text><rect x="250" y="130" width="260" height="20" rx="5" fill="#e9ecef"/><rect x="250" y="130" width="173.0" height="20" rx="5" fill="#0c8599"/><text xml:space="preserve" x="520.0" y="145.0" text-anchor="start" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" font-weight="700" fill="#0b7285">26.62</text><text xml:space="preserve" x="40.0" y="187.0" text-anchor="start" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" font-weight="400" fill="#343a40">bilinear</text><rect x="250" y="172" width="260" height="20" rx="5" fill="#e9ecef"/><rect x="250" y="172" width="193.0" height="20" rx="5" fill="#0c8599"/><text xml:space="preserve" x="520.0" y="187.0" text-anchor="start" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" font-weight="700" fill="#0b7285">29.69</text><text xml:space="preserve" x="40.0" y="229.0" text-anchor="start" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" font-weight="400" fill="#343a40">bicubic</text><rect x="250" y="214" width="260" height="20" rx="5" fill="#e9ecef"/><rect x="250" y="214" width="178.3" height="20" rx="5" fill="#0c8599"/><text xml:space="preserve" x="520.0" y="229.0" text-anchor="start" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" font-weight="700" fill="#0b7285">27.43</text><text xml:space="preserve" x="40.0" y="271.0" text-anchor="start" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" font-weight="400" fill="#343a40">area</text><rect x="250" y="256" width="260" height="20" rx="5" fill="#e9ecef"/><rect x="250" y="256" width="223.4" height="20" rx="5" fill="#2f9e44"/><text xml:space="preserve" x="520.0" y="271.0" text-anchor="start" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" font-weight="700" fill="#2b8a3e">34.37</text><text xml:space="preserve" x="40.0" y="313.0" text-anchor="start" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" font-weight="400" fill="#343a40">gauss 1.0, then point</text><rect x="250" y="298" width="260" height="20" rx="5" fill="#e9ecef"/><rect x="250" y="298" width="213.5" height="20" rx="5" fill="#2f9e44"/><text xml:space="preserve" x="520.0" y="313.0" text-anchor="start" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" font-weight="700" fill="#2b8a3e">32.85</text><text xml:space="preserve" x="40.0" y="355.0" text-anchor="start" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" font-weight="400" fill="#343a40">gauss 2.0, then point</text><rect x="250" y="340" width="260" height="20" rx="5" fill="#e9ecef"/><rect x="250" y="340" width="197.2" height="20" rx="5" fill="#0c8599"/><text xml:space="preserve" x="520.0" y="355.0" text-anchor="start" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" font-weight="700" fill="#0b7285">30.34</text><text xml:space="preserve" x="640.0" y="112.0" text-anchor="start" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" font-weight="700" fill="#868e96">stripes past the limit: leftover std (lower is better)</text><rect x="640" y="130" width="200" height="20" rx="5" fill="#e9ecef"/><rect x="640" y="130" width="188.2" height="20" rx="5" fill="#e03131"/><text xml:space="preserve" x="850.0" y="145.0" text-anchor="start" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" font-weight="700" fill="#c92a2a">70.57</text><rect x="640" y="172" width="200" height="20" rx="5" fill="#e9ecef"/><rect x="640" y="172" width="58.6" height="20" rx="5" fill="#e03131"/><text xml:space="preserve" x="850.0" y="187.0" text-anchor="start" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" font-weight="700" fill="#c92a2a">21.96</text><rect x="640" y="214" width="200" height="20" rx="5" fill="#e9ecef"/><rect x="640" y="214" width="98.3" height="20" rx="5" fill="#e03131"/><text xml:space="preserve" x="850.0" y="229.0" text-anchor="start" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" font-weight="700" fill="#c92a2a">36.86</text><rect x="640" y="256" width="200" height="20" rx="5" fill="#e9ecef"/><rect x="640" y="256" width="47.4" height="20" rx="5" fill="#e03131"/><text xml:space="preserve" x="850.0" y="271.0" text-anchor="start" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" font-weight="700" fill="#c92a2a">17.77</text><rect x="640" y="298" width="200" height="20" rx="5" fill="#e9ecef"/><rect x="640" y="298" width="9.3" height="20" rx="5" fill="#2f9e44"/><text xml:space="preserve" x="850.0" y="313.0" text-anchor="start" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" font-weight="700" fill="#2b8a3e">3.48</text><rect x="640" y="340" width="200" height="20" rx="5" fill="#e9ecef"/><rect x="640" y="340" width="1.7" height="20" rx="5" fill="#2f9e44"/><text xml:space="preserve" x="850.0" y="355.0" text-anchor="start" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" font-weight="700" fill="#2b8a3e">0.63</text><rect x="40" y="400" width="1040" height="90" rx="9" fill="#fff9db" stroke="#e8a300" stroke-width="1.6"/><rect x="39.5" y="399.0" width="1040.5" height="88.7" rx="10" fill="none" stroke="#e8a300" stroke-width="1.1" stroke-opacity="0.45"/><text xml:space="preserve" x="560.0" y="429.1" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="14" font-weight="700" fill="#b35c00">Surprise</text><text xml:space="preserve" x="560.0" y="452.5" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" fill="#343a40">area, the method OpenCV recommends for shrinking, still leaves a stripe pattern of std 17.77</text><text xml:space="preserve" x="560.0" y="469.9" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" fill="#343a40">because a box average has side lobes; a Gaussian of sigma 2.0 removes it (0.63) but blurs photographs (30.34)</text></svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 600" width="1240" height="600" role="img" aria-label="Expert parallelism: send each token to the GPU that holds its expert"><defs></defs><rect x="0" y="0" width="1240" height="600" rx="18" fill="#fffdf7"/><text xml:space="preserve" x="620.0" y="44" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="24" font-weight="700" fill="#1864ab">Expert parallelism: send each token to the GPU that holds its expert</text><text xml:space="preserve" x="620.0" y="70" text-anchor="middle" font-family="'Inter','Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="14" fill="#868e96">Two ranks, four experts, top 2, 16 tokens per rank. Counts are printed by block 5 for a router that favours expert 0</text><rect x="60" y="95" width="480" height="150" rx="14" fill="#e7f5ff" fill-opacity="0.35" stroke="#1c7ed6" stroke-width="2" stroke-dasharray="9 6"/><text xml:space="preserve" x="300.0" y="121" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="16" font-weight="700" fill="#1864ab">rank 0: holds experts 0 and 1</text><rect x="80" y="140" width="440" height="85" rx="9" fill="#e7f5ff" stroke="#1c7ed6" stroke-width="1.6"/><rect x="79.5" y="139.0" width="440.5" height="83.7" rx="10" fill="none" stroke="#1c7ed6" stroke-width="1.1" stroke-opacity="0.45"/><text xml:space="preserve" x="300.0" y="166.7" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="14" font-weight="700" fill="#1864ab">its 16 tokens</text><text xml:space="preserve" x="300.0" y="190.1" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" fill="#343a40">each is sent to the rank of each of its 2 experts</text><text xml:space="preserve" x="300.0" y="207.5" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" fill="#343a40">(32 assignments per rank)</text><rect x="700" y="95" width="480" height="150" rx="14" fill="#f3f0ff" fill-opacity="0.35" stroke="#7048e8" stroke-width="2" stroke-dasharray="9 6"/><text xml:space="preserve" x="940.0" y="121" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="16" font-weight="700" fill="#5f3dc4">rank 1: holds experts 2 and 3</text><rect x="720" y="140" width="440" height="85" rx="9" fill="#f3f0ff" stroke="#7048e8" stroke-width="1.6"/><rect x="720.1" y="139.6" width="438.7" height="85.0" rx="10" fill="none" stroke="#7048e8" stroke-width="1.1" stroke-opacity="0.45"/><text xml:space="preserve" x="940.0" y="166.7" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="14" font-weight="700" fill="#5f3dc4">its 16 tokens</text><text xml:space="preserve" x="940.0" y="190.1" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" fill="#343a40">each is sent to the rank of each of its 2 experts</text><text xml:space="preserve" x="940.0" y="207.5" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" fill="#343a40">(32 assignments per rank)</text><rect x="60" y="270" width="1120" height="150" rx="14" fill="#fff4e6" fill-opacity="0.35" stroke="#e8590c" stroke-width="2" stroke-dasharray="9 6"/><text xml:space="preserve" x="620.0" y="296" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="16" font-weight="700" fill="#c2410c">1. Dispatch: all-to-all</text><rect x="90" y="315" width="500" height="80" rx="9" fill="#fff4e6" stroke="#e8590c" stroke-width="1.6"/><rect x="88.6" y="314.8" width="498.7" height="78.8" rx="10" fill="none" stroke="#e8590c" stroke-width="1.1" stroke-opacity="0.45"/><text xml:space="preserve" x="340.0" y="347.9" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="14" font-weight="700" fill="#c2410c">rank 0 sends 21 assignments to itself and 11 to rank 1</text><text xml:space="preserve" x="340.0" y="371.2" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" fill="#343a40">rank 1 sends 19 to rank 0 and 13 to itself</text><rect x="640" y="315" width="510" height="80" rx="9" fill="#fff5f5" stroke="#e03131" stroke-width="1.6"/><rect x="639.8" y="316.0" width="508.9" height="79.2" rx="10" fill="none" stroke="#e03131" stroke-width="1.1" stroke-opacity="0.45"/><text xml:space="preserve" x="895.0" y="339.1" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="14" font-weight="700" fill="#c92a2a">experts compute where their weights live</text><text xml:space="preserve" x="895.0" y="362.5" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" fill="#343a40">rank 0 receives 40, rank 1 receives 24</text><text xml:space="preserve" x="895.0" y="379.9" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" fill="#343a40">the busy rank sets the speed of the step</text><rect x="60" y="435" width="1120" height="150" rx="14" fill="#ebfbee" fill-opacity="0.35" stroke="#2f9e44" stroke-width="2" stroke-dasharray="9 6"/><text xml:space="preserve" x="620.0" y="461" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="16" font-weight="700" fill="#2b8a3e">2. Combine: all-to-all back, then weight and add</text><rect x="90" y="480" width="500" height="80" rx="9" fill="#ebfbee" stroke="#2f9e44" stroke-width="1.6"/><rect x="90.4" y="481.3" width="500.2" height="79.7" rx="10" fill="none" stroke="#2f9e44" stroke-width="1.1" stroke-opacity="0.45"/><text xml:space="preserve" x="340.0" y="512.9" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="14" font-weight="700" fill="#2b8a3e">outputs travel back along the same routes</text><text xml:space="preserve" x="340.0" y="536.2" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" fill="#343a40">counts are swapped: what was sent is now received</text><rect x="640" y="480" width="510" height="80" rx="9" fill="#fff9db" stroke="#e8a300" stroke-width="1.6"/><rect x="641.4" y="478.6" width="511.1" height="79.4" rx="10" fill="none" stroke="#e8a300" stroke-width="1.1" stroke-opacity="0.45"/><text xml:space="preserve" x="895.0" y="504.1" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="14" font-weight="700" fill="#b35c00">result equals one process running every expert</text><text xml:space="preserve" x="895.0" y="527.5" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" fill="#343a40">maximum error 0.00e+00 in this run</text><text xml:space="preserve" x="895.0" y="544.9" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" fill="#343a40">with an even router: 27 and 37 received</text></svg>

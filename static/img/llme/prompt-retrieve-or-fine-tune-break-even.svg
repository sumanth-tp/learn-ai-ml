ono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" font-weight="400" fill="#868e96">fixed per month: 0, 0, 600, 1,210</text><text xml:space="preserve" x="380" y="374.0" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" font-weight="400" fill="#868e96">(1,210 = 3,000 / 12 training + 8 hours x 120)</text><rect x="740" y="95" width="480" height="300" rx="14" fill="#fff4e6" fill-opacity="0.35" stroke="#e8590c" stroke-width="2" stroke-dasharray="9 6"/><text xml:space="preserve" x="980.0" y="121" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="16" font-weight="700" fill="#c2410c">Break-even, requests per month</text><rect x="760" y="140" width="440" height="56" rx="9" fill="#fff4e6" stroke="#e8590c" stroke-width="1.6"/><rect x="759.5" y="139.0" width="440.5" height="54.7" rx="10" fill="none" stroke="#e8590c" stroke-width="1.1" stroke-opacity="0.45"/><text xml:space="preserve" x="980.0" y="162.2" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="18" font-weight="700" fill="#c2410c">130,783</text><text xml:space="preserve" x="980.0" y="185.6" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" fill="#343a40">long prompt vs tuned small</text><rect x="760" y="204" width="440" height="56" rx="9" fill="#fff4e6" stroke="#e8590c" stroke-width="1.6"/><rect x="760.1" y="203.6" width="438.7" height="56.0" rx="10" fill="none" stroke="#e8590c" stroke-width="1.1" stroke-opacity="0.45"/><text xml:space="preserve" x="980.0" y="226.2" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="18" font-weight="700" fill="#c2410c">616,718</text><text xml:space="preserve" x="98
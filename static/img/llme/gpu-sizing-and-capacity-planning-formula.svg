<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 700" width="1240" height="700" role="img" aria-label="From a model and a traffic target to a GPU count"><defs><marker id="ah343a40" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#343a40"/></marker><marker id="ah343a40s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#343a40"/></marker></defs><rect x="0" y="0" width="1240" height="700" rx="18" fill="#fffdf7"/><text xml:space="preserve" x="620.0" y="44" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="24" font-weight="700" fill="#1864ab">From a model and a traffic target to a GPU count</text><text xml:space="preserve" x="620.0" y="70" text-anchor="middle" font-family="'Inter','Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="14" fill="#868e96">Llama 3.1 8B in 16-bit on one H100 SXM 80 GB: 20 requests/s, 1,000 + 300 tokens, 40 ms TPOT target</text><rect x="30" y="120" width="370" height="150" rx="9" fill="#e7f5ff" stroke="#1c7ed6" stroke-width="1.6"/><rect x="29.5" y="119.0" width="370.5" height="148.7" rx="10" fill="none" stroke="#1c7ed6" stroke-width="1.1" stroke-opacity="0.45"/><text xml:space="preserve" x="215.0" y="168.6" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="15" font-weight="700" fill="#1864ab">1. memory pool</text><text xml:space="preserve" x="215.0" y="193.4" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" fill="#343a40">0.90 x 80 GB - 2 GB reserve</text><text xml:space="preserve" x="215.0" y="212.3" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" fill="#343a40">= 70 GB</text><text xml:space="preserve" x="215.0" y="231.1" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" fill="#343a40">assumptions: 90% use, 2 GB</text><rect x="435" y="120" width="370" height="150" rx="9" fill="#f3f0ff" stroke="#7048e8" stroke-width="1.6"/><rect x="435.1" y="119.6" width="368.7" height="150.0" rx="10" fill="none" stroke="#7048e8" stroke-width="1.1" stroke-opacity="0.45"/><text xml:space="preserve" x="620.0" y="168.6" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="15" font-weight="700" fill="#5f3dc4">2. KV budget</text><text xml:space="preserve" x="620.0" y="193.4" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" fill="#343a40">70 GB - 16.1 GB of weights</text><text xml:space="preserve" x="620.0" y="212.3" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" fill="#343a40">= 53.9 GB</text><text xml:space="preserve" x="620.0" y="231.1" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" fill="#343a40">131.1 kB per token</text><rect x="840" y="120" width="370" height="150" rx="9" fill="#ebfbee" stroke="#2f9e44" stroke-width="1.6"/><rect x="838.6" y="119.8" width="368.7" height="148.8" rx="10" fill="none" stroke="#2f9e44" stroke-width="1.1" stroke-opacity="0.45"/><text xml:space="preserve" x="1025.0" y="168.6" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="15" font-weight="700" fill="#2b8a3e">3. sequences</text><text xml:space="preserve" x="1025.0" y="193.4" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" fill="#343a40">53.9 GB / (131.1 kB x 1,300)</text><text xml:space="preserve" x="1025.0" y="212.3" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" fill="#343a40">= 316 by memory</text><text xml:space="preserve" x="1025.0" y="231.1" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" fill="#343a40">316 within the 40 ms target</text><rect x="30" y="310" width="370" height="150" rx="9" fill="#fff4e6" stroke="#e8590c" stroke-width="1.6"/><rect x="29.8" y="311.0" width="368.9" height="149.2" rx="10" fill="none" stroke="#e8590c" stroke-width="1.1" stroke-opacity="0.45"/><text xml:space="preserve" x="215.0" y="358.6" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="15" font-weight="700" fill="#c2410c">4. decode step</text><text xml:space="preserve" x="215.0" y="383.5" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" fill="#343a40">(weights + batch x context x KV)</text><text xml:space="preserve" x="215.0" y="402.3" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" fill="#343a40">/ (3.35 TB/s x 0.6)</text><text xml:space="preserve" x="215.0" y="421.2" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" fill="#343a40">= 31.7 ms at batch 316</text><rect x="435" y="310" width="370" height="150" rx="9" fill="#e3fafc" stroke="#0c8599" stroke-width="1.6"/><rect x="435.4" y="311.3" width="370.2" height="149.7" rx="10" fill="none" stroke="#0c8599" stroke-width="1.1" stroke-opacity="0.45"/><text xml:space="preserve" x="620.0" y="358.6" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="15" font-weight="700" fill="#0b7285">5. Little&#x27;s law</text><text xml:space="preserve" x="620.0" y="383.5" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" fill="#343a40">L = lambda x W</text><text xml:space="preserve" x="620.0" y="402.3" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" fill="#343a40">20 x 9.55 s = 190.9 in flight</text><text xml:space="preserve" x="620.0" y="421.2" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" fill="#343a40">1 decode replica</text><rect x="840" y="310" width="370" height="150" rx="9" fill="#fff5f5" stroke="#e03131" stroke-width="1.6"/><rect x="841.4" y="308.6" width="371.1" height="149.4" rx="10" fill="none" stroke="#e03131" stroke-width="1.1" stroke-opacity="0.45"/><text xml:space="preserve" x="1025.0" y="358.6" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="15" font-weight="700" fill="#c92a2a">6. prefill</text><text xml:space="preserve" x="1025.0" y="383.5" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" fill="#343a40">20 x 1,000 tokens/s needs</text><text xml:space="preserve" x="1025.0" y="402.3" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" fill="#343a40">3 replicas at MFU 0.4,</text><text xml:space="preserve" x="1025.0" y="421.2" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" fill="#343a40">30% of time on prefill</text><path d="M400.0,195.0 L435.0,195.0" fill="none" stroke="#343a40" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#ah343a40)"/><path d="M805.0,195.0 L840.0,195.0" fill="none" stroke="#343a40" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#ah343a40)"/><path d="M400.0,385.0 L435.0,385.0" fill="none" stroke="#343a40" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#ah343a40)"/><path d="M805.0,385.0 L840.0,385.0" fill="none" stroke="#343a40" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#ah343a40)"/><path d="M1025.0,270.0 L1025.0,300.0 L215.0,300.0 L215.0,310.0" fill="none" stroke="#343a40" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#ah343a40)"/><rect x="30" y="500" width="560" height="170" rx="9" fill="#ebfbee" stroke="#2f9e44" stroke-width="1.6"/><rect x="28.9" y="498.9" width="559.4" height="170.9" rx="10" fill="none" stroke="#2f9e44" stroke-width="1.1" stroke-opacity="0.45"/><text xml:space="preserve" x="42" y="549.2" text-anchor="start" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="15" font-weight="700" fill="#2b8a3e">The answer</text><text xml:space="preserve" x="42" y="574.0" text-anchor="start" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" fill="#343a40">replicas = max(decode 1, prefill 3) = 3</text><text xml:space="preserve" x="42" y="592.9" text-anchor="start" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" fill="#343a40">GPUs = 3 x tensor parallel 1 = 3</text><text xml:space="preserve" x="42" y="611.7" text-anchor="start" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" fill="#343a40">GPU-hours per million output tokens:</text><text xml:space="preserve" x="42" y="630.6" text-anchor="start" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" fill="#343a40">3 / (20 x 300 x 3600) x 1,000,000 = 0.139</text><rect x="620" y="500" width="590" height="170" rx="9" fill="#fff9db" stroke="#e8a300" stroke-width="1.6"/><rect x="619.0" y="500.2" width="590.4" height="169.6" rx="10" fill="none" stroke="#e8a300" stroke-width="1.1" stroke-opacity="0.45"/><text xml:space="preserve" x="632" y="549.2" text-anchor="start" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="15" font-weight="700" fill="#b35c00">Assumptions to replace by measuring</text><text xml:space="preserve" x="632" y="574.0" text-anchor="start" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" fill="#343a40">bandwidth efficiency 0.6, prefill MFU 0.4,</text><text xml:space="preserve" x="632" y="592.9" text-anchor="start" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" fill="#343a40">prefill share 0.3, reserve 2 GB per GPU</text><text xml:space="preserve" x="632" y="611.7" text-anchor="start" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" fill="#343a40">dense TFLOPS: 989.5, derived from the</text><text xml:space="preserve" x="632" y="630.6" text-anchor="start" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" fill="#343a40">datasheet&#x27;s with-sparsity figure 1,979</text></svg>

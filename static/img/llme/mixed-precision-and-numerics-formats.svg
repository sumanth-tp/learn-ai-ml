<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 640" width="1240" height="640" role="img" aria-label="Five number formats: where the bits go"><defs></defs><rect x="0" y="0" width="1240" height="640" rx="18" fill="#fffdf7"/><text xml:space="preserve" x="620.0" y="44" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="24" font-weight="700" fill="#1864ab">Five number formats: where the bits go</text><text xml:space="preserve" x="620.0" y="70" text-anchor="middle" font-family="'Inter','Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="14" fill="#868e96">Red sign, orange exponent (how big), blue mantissa (how many digits). All figures are printed by block 1</text><rect x="20" y="95" width="1200" height="330" rx="14" fill="#e7f5ff" fill-opacity="0.35" stroke="#1c7ed6" stroke-width="2" stroke-dasharray="9 6"/><text xml:space="preserve" x="620.0" y="121" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="16" font-weight="700" fill="#1864ab">Bit layout and the numbers that follow from it</text><text xml:space="preserve" x="760.0" y="150.0" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" font-weight="700" fill="#343a40">largest</text><text xml:space="preserve" x="870.0" y="150.0" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" font-weight="700" fill="#343a40">smallest normal</text><text xml:space="preserve" x="1000.0" y="150.0" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" font-weight="700" fill="#343a40">smallest subnormal</text><text xml:space="preserve" x="1130.0" y="150.0" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" font-weight="700" fill="#343a40">gap above 1</text><text xml:space="preserve" x="150.0" y="193.0" text-anchor="end" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="14" font-weight="700" fill="#343a40">fp32</text><rect x="165.0" y="175.0" width="13.0" height="26.0" rx="3" fill="#fff5f5" fill-opacity="1.0" stroke="#e03131" stroke-width="1.5"/><rect x="180.0" y="175.0" width="118.0" height="26.0" rx="3" fill="#fff4e6" fill-opacity="1.0" stroke="#e8590c" stroke-width="1.5"/><rect x="300.0" y="175.0" width="343.0" height="26.0" rx="3" fill="#e7f5ff" fill-opacity="1.0" stroke="#1c7ed6" stroke-width="1.5"/><text xml:space="preserve" x="760.0" y="193.0" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" font-weight="400" fill="#343a40">3.40e38</text><text xml:space="preserve" x="870.0" y="193.0" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" font-weight="400" fill="#343a40">1.18e-38</text><text xml:space="preserve" x="1000.0" y="193.0" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" font-weight="400" fill="#343a40">1.40e-45</text><text xml:space="preserve" x="1130.0" y="193.0" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" font-weight="400" fill="#343a40">1.19e-7</text><text xml:space="preserve" x="150.0" y="243.0" text-anchor="end" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="14" font-weight="700" fill="#343a40">bf16</text><rect x="165.0" y="225.0" width="13.0" height="26.0" rx="3" fill="#fff5f5" fill-opacity="1.0" stroke="#e03131" stroke-width="1.5"/><rect x="180.0" y="225.0" width="118.0" height="26.0" rx="3" fill="#fff4e6" fill-opacity="1.0" stroke="#e8590c" stroke-width="1.5"/><rect x="300.0" y="225.0" width="103.0" height="26.0" rx="3" fill="#e7f5ff" fill-opacity="1.0" stroke="#1c7ed6" stroke-width="1.5"/><text xml:space="preserve" x="760.0" y="243.0" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" font-weight="400" fill="#343a40">3.39e38</text><text xml:space="preserve" x="870.0" y="243.0" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" font-weight="400" fill="#343a40">1.18e-38</text><text xml:space="preserve" x="1000.0" y="243.0" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" font-weight="400" fill="#343a40">9.18e-41</text><text xml:space="preserve" x="1130.0" y="243.0" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" font-weight="400" fill="#343a40">0.0078</text><text xml:space="preserve" x="150.0" y="293.0" text-anchor="end" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="14" font-weight="700" fill="#343a40">fp16</text><rect x="165.0" y="275.0" width="13.0" height="26.0" rx="3" fill="#fff5f5" fill-opacity="1.0" stroke="#e03131" stroke-width="1.5"/><rect x="180.0" y="275.0" width="73.0" height="26.0" rx="3" fill="#fff4e6" fill-opacity="1.0" stroke="#e8590c" stroke-width="1.5"/><rect x="255.0" y="275.0" width="148.0" height="26.0" rx="3" fill="#e7f5ff" fill-opacity="1.0" stroke="#1c7ed6" stroke-width="1.5"/><text xml:space="preserve" x="760.0" y="293.0" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" font-weight="400" fill="#343a40">65,504</text><text xml:space="preserve" x="870.0" y="293.0" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" font-weight="400" fill="#343a40">6.10e-5</text><text xml:space="preserve" x="1000.0" y="293.0" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" font-weight="400" fill="#343a40">5.96e-8</text><text xml:space="preserve" x="1130.0" y="293.0" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" font-weight="400" fill="#343a40">0.00098</text><text xml:space="preserve" x="150.0" y="343.0" text-anchor="end" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="14" font-weight="700" fill="#343a40">fp8 e4m3</text><rect x="165.0" y="325.0" width="13.0" height="26.0" rx="3" fill="#fff5f5" fill-opacity="1.0" stroke="#e03131" stroke-width="1.5"/><rect x="180.0" y="325.0" width="58.0" height="26.0" rx="3" fill="#fff4e6" fill-opacity="1.0" stroke="#e8590c" stroke-width="1.5"/><rect x="240.0" y="325.0" width="43.0" height="26.0" rx="3" fill="#e7f5ff" fill-opacity="1.0" stroke="#1c7ed6" stroke-width="1.5"/><text xml:space="preserve" x="760.0" y="343.0" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" font-weight="400" fill="#343a40">448</text><text xml:space="preserve" x="870.0" y="343.0" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" font-weight="400" fill="#343a40">0.0156</text><text xml:space="preserve" x="1000.0" y="343.0" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" font-weight="400" fill="#343a40">0.00195</text><text xml:space="preserve" x="1130.0" y="343.0" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" font-weight="400" fill="#343a40">0.125</text><text xml:space="preserve" x="150.0" y="393.0" text-anchor="end" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="14" font-weight="700" fill="#343a40">fp8 e5m2</text><rect x="165.0" y="375.0" width="13.0" height="26.0" rx="3" fill="#fff5f5" fill-opacity="1.0" stroke="#e03131" stroke-width="1.5"/><rect x="180.0" y="375.0" width="73.0" height="26.0" rx="3" fill="#fff4e6" fill-opacity="1.0" stroke="#e8590c" stroke-width="1.5"/><rect x="255.0" y="375.0" width="28.0" height="26.0" rx="3" fill="#e7f5ff" fill-opacity="1.0" stroke="#1c7ed6" stroke-width="1.5"/><text xml:space="preserve" x="760.0" y="393.0" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" font-weight="400" fill="#343a40">57,344</text><text xml:space="preserve" x="870.0" y="393.0" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" font-weight="400" fill="#343a40">6.10e-5</text><text xml:space="preserve" x="1000.0" y="393.0" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" font-weight="400" fill="#343a40">1.53e-5</text><text xml:space="preserve" x="1130.0" y="393.0" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" font-weight="400" fill="#343a40">0.25</text><rect x="20" y="445" width="390" height="170" rx="9" fill="#e7f5ff" stroke="#1c7ed6" stroke-width="1.6"/><rect x="19.5" y="444.0" width="390.5" height="168.7" rx="10" fill="none" stroke="#1c7ed6" stroke-width="1.1" stroke-opacity="0.45"/><text xml:space="preserve" x="215.0" y="496.8" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="14" font-weight="700" fill="#1864ab">bf16: fp32&#x27;s range, fewer digits</text><text xml:space="preserve" x="215.0" y="520.1" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" fill="#343a40">same 8 exponent bits as fp32, so the same</text><text xml:space="preserve" x="215.0" y="537.5" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" fill="#343a40">largest and smallest numbers.</text><text xml:space="preserve" x="215.0" y="554.9" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" fill="#343a40">Only 7 mantissa bits: gap 0.0078 near 1.</text><text xml:space="preserve" x="215.0" y="572.3" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" fill="#343a40">No loss scaling needed.</text><rect x="425" y="445" width="390" height="170" rx="9" fill="#fff4e6" stroke="#e8590c" stroke-width="1.6"/><rect x="425.1" y="444.6" width="388.7" height="170.0" rx="10" fill="none" stroke="#e8590c" stroke-width="1.1" stroke-opacity="0.45"/><text xml:space="preserve" x="620.0" y="505.4" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="14" font-weight="700" fill="#c2410c">fp16: more digits, small range</text><text xml:space="preserve" x="620.0" y="528.9" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" fill="#343a40">10 mantissa bits, but the largest number is</text><text xml:space="preserve" x="620.0" y="546.2" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" fill="#343a40">65,504 and numbers below 6.1e-5 lose digits.</text><text xml:space="preserve" x="620.0" y="563.6" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" fill="#343a40">Small gradients vanish: use a loss scale.</text><rect x="830" y="445" width="390" height="170" rx="9" fill="#f3f0ff" stroke="#7048e8" stroke-width="1.6"/><rect x="828.6" y="444.8" width="388.7" height="168.8" rx="10" fill="none" stroke="#7048e8" stroke-width="1.1" stroke-opacity="0.45"/><text xml:space="preserve" x="1025.0" y="496.8" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="14" font-weight="700" fill="#5f3dc4">fp8: a scale per block</text><text xml:space="preserve" x="1025.0" y="520.1" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" fill="#343a40">3 or 2 mantissa bits, so 2% to 4% typical error.</text><text xml:space="preserve" x="1025.0" y="537.5" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" fill="#343a40">e4m3 for values, e5m2 for gradients.</text><text xml:space="preserve" x="1025.0" y="554.9" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" fill="#343a40">One scale per tensor is not enough;</text><text xml:space="preserve" x="1025.0" y="572.3" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" fill="#343a40">use one per small block.</text></svg>

olas,'Liberation Mono',monospace" font-size="16" font-weight="700" fill="#0b7285">KiB per token, one sequence</text><text xml:space="preserve" x="690.0" y="152.0" text-anchor="end" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" font-weight="400" fill="#343a40">gpt2</text><rect x="700.0" y="138.0" width="37.1" height="22.0" rx="4" fill="#fff5f5" stroke="#e03131" stroke-width="2" fill-opacity="1.0"/><text xml:space="preserve" x="745.1" y="154.0" text-anchor="start" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" font-weight="700" fill="#c92a2a">36  MHA</text><text xml:space="preserve" x="690.0" y="184.0" text-anchor="end" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" font-weight="400" fill="#343a40">falcon-7b</text><rect x="700.0" y="170.0" width="8.2" height="22.0" rx="4" fill="#ebfbee" stroke="#2f9e44" stroke-width="2" fill-opacity="1.0"/><text xml:space="preserve" x="716.2" y="186.0" text-anchor="start" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" font-weight="700" fill="#2b8a3e">8  MQA</text><text xml:space="preserve" x="690.0" y="216.0" text-anchor="end" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" font-weight="400" fill="#343a40">Mistral-7B</text><rect x="700.0" y="202.0" width="132.0" height="22.0" rx="4" fill="#e7f5ff" stroke="#1c7ed6" stroke-width="2" fill-opacity="1.0"/><text xml:space="preserve" x="840.0" y="218.0" text-anchor="start" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" font-weight="700" fill="#1864ab">128  GQA</text><text xml:space="preserve" x="690.0" y="248.0" text-anchor="end" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,
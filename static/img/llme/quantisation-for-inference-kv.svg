2e6"/><text xml:space="preserve" x="48" y="293.0" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="14" font-weight="400" fill="#343a40">3</text><text xml:space="preserve" x="138" y="293.0" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="14" font-weight="400" fill="#343a40">75.70</text><text xml:space="preserve" x="328" y="293.0" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="14" font-weight="400" fill="#343a40">25.57</text><text xml:space="preserve" x="518" y="293.0" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="14" font-weight="400" fill="#343a40">75.05</text><line x1="40" y1="316" x2="700" y2="316" stroke="#dee2e6"/><rect x="40" y="316" width="660" height="44" fill="#e7f5ff"/><text xml:space="preserve" x="48" y="337.0" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="14" font-weight="400" fill="#343a40">2</text><text xml:space="preserve" x="138" y="337.0" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="14" font-weight="400" fill="#343a40">1381.39</text><text xml:space="preserve" x="328" y="337.0" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="14" font-weight="400" fill="#343a40">1062.27</text><text xml:space="preserve" x="518" y="337.0" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="14" font-weight="400" fill="#343a40">3421.69</text><line x1="40" y1="360" x2="700" y2="360" stroke="#dee2e6"/><text xml:space="preserve" x="370" y="366.0" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="10" font-weight="400" fill="#868e96" font-style="italic">column 1: keys and values per token; column 2: keys per channel, values per token;</text><text xml:space="preserve" x="370" y="380.0" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="10" font-weight="400" fill="#868e96" font-style="italic">column 3: keys per token, values per channel</text><rect x="740" y="95" width="440" height="300" rx="14" fill="#ebfbee" fill-opacity="0.35" stroke="#2f9e44" stroke-width="2" stroke-dasharray="9 6"/><text xml:space="preserve" x="960.0" y="121" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="16" font-weight="700" fill="#2b8a3e">What this shows</text><rect x="760" y="140" width="400" height="110" rx="9" fill="#ebfbee" stroke="#2f9e44" stroke-width="1.6"/><rect x="759.5" y="139.0" width="400.5" height="108.7" rx="10" fill="none" stroke="#2f9e44" stroke-width="1.1" stroke-opacity="0.45"/><text xml:space="preserve" x="960.0" y="170.4" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="14" font-weight="700" fill="#2b8a3e">keys have channel structure</text><text xml:space="preserve" x="960.0" y="193.8" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" fill="#343a40">per-channel keys at 3 bits: 25.57,</text><text xml:space="preserve" x="960.0" y="211.2" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" fill="#343a40">per-token keys at 3 bits: 75.70.</text><text xml:space="preserve" x="960.0" y="228.7" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" fill="#343a40">KIVI&#x27;s finding reproduced on a small model</text><rect x="760" y="265" width="400" height="110" rx="9" fill="#fff4e6" stroke="#e8590c" stroke-width="1.6"/><rect x="760.1" y="264.6" width="398.7" height="110.0" rx="10" fill="none" stroke="#e8590c" stroke-width="1.1" stroke-opacity="0.45"/><text xml:space="preserve" x="960.0" y="295.4" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="14" font-weight="700" fill="#c2410c">values do not</text><text xml:space="preserve" x="960.0" y="318.8" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" fill="#343a40">per-channel values at 4 bits: 23.46,</text><text xml:space="preserve" x="960.0" y="336.2" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" fill="#343a40">per-token values: 23.07.</text><text xml:space="preserve" x="960.0" y="353.6" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" fill="#343a40">KIVI uses per-token for values</text><rect x="20" y="415" width="1160" height="120" rx="9" fill="#f8f9fa" stroke="#6c757d" stroke-width="1.6"/><rect x="18.6" y="414.8" width="1158.7" height="118.8" rx="10" fill="none" stroke="#6c757d" stroke-width="1.1" stroke-opacity="0.45"/><text xml:space="preserve" x="600.0" y="459.1" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="14" font-weight="700" fill="#343a40">At 2 bits this simple scheme collapses</text><text xml:space="preserve" x="600.0" y="482.5" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" fill="#343a40">a simplified simulation: whole sequences fake-quantised in every layer,</text><text xml:space="preserve" x="600.0" y="499.9" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" fill="#343a40">none of the extra engineering of the KIVI paper, so these rows are not a measurement of KIVI itself</text></svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 720" width="1240" height="720" role="img" aria-label="Four ways to learn from preferences"><defs></defs><rect x="0" y="0" width="1240" height="720" rx="18" fill="#fffdf7"/><text xml:space="preserve" x="620.0" y="44" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="24" font-weight="700" fill="#1864ab">Four ways to learn from preferences</text><text xml:space="preserve" x="620.0" y="70" text-anchor="middle" font-family="'Inter','Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="14" fill="#868e96">The same toy pair: chosen 8 tokens, rejected 10 tokens; beta, gamma and lambda are illustrative</text><rect x="30" y="110" width="1150" height="48" rx="6" fill="#1c7ed6"/><text xml:space="preserve" x="38" y="131.0" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="14" font-weight="700" fill="#ffffff">method</text><text xml:space="preserve" x="198" y="131.0" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="14" font-weight="700" fill="#ffffff">reference model</text><text xml:space="preserve" x="418" y="131.0" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="14" font-weight="700" fill="#ffffff">data it needs</text><text xml:space="preserve" x="748" y="131.0" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="14" font-weight="700" fill="#ffffff">loss on the toy pair</text><line x1="30" y1="158" x2="1180" y2="158" stroke="#dee2e6"/><text xml:space="preserve" x="38" y="179.0" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="14" font-weight="400" fill="#343a40">DPO</text><text xml:space="preserve" x="198" y="179.0" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="14" font-weight="400" fill="#343a40">yes</text><text xml:space="preserve" x="418" y="179.0" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="14" font-weight="400" fill="#343a40">chosen and rejected</text><text xml:space="preserve" x="748" y="179.0" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="14" font-weight="400" fill="#343a40">0.5334</text><line x1="30" y1="206" x2="1180" y2="206" stroke="#dee2e6"/><rect x="30" y="206" width="1150" height="48" fill="#e7f5ff"/><text xml:space="preserve" x="38" y="227.0" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="14" font-weight="400" fill="#343a40">SimPO</text><text xml:space="preserve" x="198" y="227.0" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="14" font-weight="400" fill="#343a40">no</text><text xml:space="preserve" x="418" y="227.0" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="14" font-weight="400" fill="#343a40">chosen and rejected</text><text xml:space="preserve" x="748" y="227.0" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="14" font-weight="400" fill="#343a40">0.4375</text><line x1="30" y1="254" x2="1180" y2="254" stroke="#dee2e6"/><text xml:space="preserve" x="38" y="275.0" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="14" font-weight="400" fill="#343a40">ORPO</text><text xml:space="preserve" x="198" y="275.0" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="14" font-weight="400" fill="#343a40">no</text><text xml:space="preserve" x="418" y="275.0" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="14" font-weight="400" fill="#343a40">chosen and rejected</text><text xml:space="preserve" x="748" y="275.0" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="14" font-weight="400" fill="#343a40">1.5415</text><line x1="30" y1="302" x2="1180" y2="302" stroke="#dee2e6"/><rect x="30" y="302" width="1150" height="48" fill="#e7f5ff"/><text xml:space="preserve" x="38" y="323.0" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="14" font-weight="400" fill="#343a40">KTO</text><text xml:space="preserve" x="198" y="323.0" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="14" font-weight="400" fill="#343a40">yes</text><text xml:space="preserve" x="418" y="323.0" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="14" font-weight="400" fill="#343a40">one label per answer</text><text xml:space="preserve" x="748" y="323.0" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="14" font-weight="400" fill="#343a40">0.4502 and 0.4626</text><line x1="30" y1="350" x2="1180" y2="350" stroke="#dee2e6"/><rect x="20" y="400" width="600" height="290" rx="14" fill="#f3f0ff" fill-opacity="0.35" stroke="#7048e8" stroke-width="2" stroke-dasharray="9 6"/><text xml:space="preserve" x="320.0" y="426" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="16" font-weight="700" fill="#5f3dc4">Reading the losses</text><rect x="40" y="445" width="560" height="110" rx="9" fill="#f3f0ff" stroke="#7048e8" stroke-width="1.6"/><rect x="39.5" y="444.0" width="560.5" height="108.7" rx="10" fill="none" stroke="#7048e8" stroke-width="1.1" stroke-opacity="0.45"/><text xml:space="preserve" x="320.0" y="484.1" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="14" font-weight="700" fill="#5f3dc4">DPO and KTO use the reference</text><text xml:space="preserve" x="320.0" y="507.5" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" fill="#343a40">both measure movement away from it;</text><text xml:space="preserve" x="320.0" y="524.9" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" fill="#343a40">KTO needs a KL estimate, here set to 0</text><rect x="40" y="570" width="560" height="100" rx="9" fill="#fff4e6" stroke="#e8590c" stroke-width="1.6"/><rect x="40.1" y="569.6" width="558.7" height="100.0" rx="10" fill="none" stroke="#e8590c" stroke-width="1.1" stroke-opacity="0.45"/><text xml:space="preserve" x="320.0" y="604.1" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="14" font-weight="700" fill="#c2410c">ORPO is SFT plus a penalty</text><text xml:space="preserve" x="320.0" y="627.5" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" fill="#343a40">1.5000 SFT term + 0.1 x 0.4150 odds-ratio term</text><text xml:space="preserve" x="320.0" y="644.9" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" fill="#343a40">so its scale is not comparable with the others</text><rect x="640" y="400" width="580" height="290" rx="14" fill="#ebfbee" fill-opacity="0.35" stroke="#2f9e44" stroke-width="2" stroke-dasharray="9 6"/><text xml:space="preserve" x="930.0" y="426" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="16" font-weight="700" fill="#2b8a3e">Choosing</text><rect x="660" y="445" width="540" height="110" rx="9" fill="#ebfbee" stroke="#2f9e44" stroke-width="1.6"/><rect x="658.6" y="444.8" width="538.7" height="108.8" rx="10" fill="none" stroke="#2f9e44" stroke-width="1.1" stroke-opacity="0.45"/><text xml:space="preserve" x="930.0" y="492.9" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="14" font-weight="700" fill="#2b8a3e">have pairs and a decent SFT model</text><text xml:space="preserve" x="930.0" y="516.2" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" fill="#343a40">start with DPO: the most documented path</text><rect x="660" y="570" width="540" height="100" rx="9" fill="#fff9db" stroke="#e8a300" stroke-width="1.6"/><rect x="659.8" y="571.0" width="538.9" height="99.2" rx="10" fill="none" stroke="#e8a300" stroke-width="1.1" stroke-opacity="0.45"/><text xml:space="preserve" x="930.0" y="612.9" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="14" font-weight="700" fill="#b35c00">have thumbs up or down only</text><text xml:space="preserve" x="930.0" y="636.2" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" fill="#343a40">KTO takes one label per answer, no pairs</text></svg>

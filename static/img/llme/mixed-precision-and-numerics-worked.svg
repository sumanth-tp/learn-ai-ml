<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 600" width="1240" height="600" role="img" aria-label="Three things that go wrong with few bits, by hand"><defs></defs><rect x="0" y="0" width="1240" height="600" rx="18" fill="#fffdf7"/><text xml:space="preserve" x="620.0" y="44" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="24" font-weight="700" fill="#1864ab">Three things that go wrong with few bits, by hand</text><text xml:space="preserve" x="620.0" y="70" text-anchor="middle" font-family="'Inter','Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="14" fill="#868e96">Every number is printed by block 2</text><rect x="20" y="95" width="390" height="480" rx="14" fill="#e7f5ff" fill-opacity="0.35" stroke="#1c7ed6" stroke-width="2" stroke-dasharray="9 6"/><text xml:space="preserve" x="215.0" y="121" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="16" font-weight="700" fill="#1864ab">1. Storing 0.1</text><rect x="40" y="140" width="350" height="105" rx="9" fill="#e7f5ff" stroke="#1c7ed6" stroke-width="1.6"/><rect x="39.5" y="139.0" width="350.5" height="103.7" rx="10" fill="none" stroke="#1c7ed6" stroke-width="1.1" stroke-opacity="0.45"/><text xml:space="preserve" x="215.0" y="175.5" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="15" font-weight="700" fill="#1864ab">fp32</text><text xml:space="preserve" x="215.0" y="200.4" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" fill="#343a40">0.1 -&gt; 0.10000000149</text><text xml:space="preserve" x="215.0" y="219.2" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" fill="#343a40">error 1.5e-9</text><rect x="40" y="258" width="350" height="105" rx="9" fill="#fff4e6" stroke="#e8590c" stroke-width="1.6"/><rect x="40.1" y="257.6" width="348.7" height="105.0" rx="10" fill="none" stroke="#e8590c" stroke-width="1.1" stroke-opacity="0.45"/><text xml:space="preserve" x="215.0" y="293.5" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="15" font-weight="700" fill="#c2410c">fp16</text><text xml:space="preserve" x="215.0" y="318.4" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" fill="#343a40">0.1 -&gt; 0.0999755859375</text><text xml:space="preserve" x="215.0" y="337.2" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" fill="#343a40">error 2.4e-5</text><rect x="40" y="376" width="350" height="105" rx="9" fill="#f3f0ff" stroke="#7048e8" stroke-width="1.6"/><rect x="38.6" y="375.8" width="348.7" height="103.8" rx="10" fill="none" stroke="#7048e8" stroke-width="1.1" stroke-opacity="0.45"/><text xml:space="preserve" x="215.0" y="411.5" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="15" font-weight="700" fill="#5f3dc4">bf16</text><text xml:space="preserve" x="215.0" y="436.4" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" fill="#343a40">0.1 -&gt; 0.10009765625</text><text xml:space="preserve" x="215.0" y="455.2" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" fill="#343a40">error 9.8e-5, four times fp16&#x27;s</text><text xml:space="preserve" x="215.0" y="520.0" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" font-weight="700" fill="#343a40">fewer mantissa bits = a bigger step</text><text xml:space="preserve" x="215.0" y="545.0" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" font-weight="700" fill="#343a40">between neighbouring numbers</text><rect x="425" y="95" width="390" height="480" rx="14" fill="#fff4e6" fill-opacity="0.35" stroke="#e8590c" stroke-width="2" stroke-dasharray="9 6"/><text xml:space="preserve" x="620.0" y="121" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="16" font-weight="700" fill="#c2410c">2. Adding 0.01 to 32.0</text><rect x="445" y="140" width="350" height="105" rx="9" fill="#fff4e6" stroke="#e8590c" stroke-width="1.6"/><rect x="444.8" y="141.0" width="348.9" height="104.2" rx="10" fill="none" stroke="#e8590c" stroke-width="1.1" stroke-opacity="0.45"/><text xml:space="preserve" x="620.0" y="176.7" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="14" font-weight="700" fill="#c2410c">fp16: gap near 32 is 0.03125</text><text xml:space="preserve" x="620.0" y="200.1" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" fill="#343a40">half a gap is 0.0156, bigger than 0.01</text><text xml:space="preserve" x="620.0" y="217.5" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" fill="#343a40">so 32 + 0.01 = 32</text><rect x="445" y="258" width="350" height="105" rx="9" fill="#fff5f5" stroke="#e03131" stroke-width="1.6"/><rect x="445.4" y="259.3" width="350.2" height="104.7" rx="10" fill="none" stroke="#e03131" stroke-width="1.1" stroke-opacity="0.45"/><text xml:space="preserve" x="620.0" y="285.9" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="14" font-weight="700" fill="#c92a2a">ten thousand additions</text><text xml:space="preserve" x="620.0" y="309.3" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" fill="#343a40">exact answer 100</text><text xml:space="preserve" x="620.0" y="326.7" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" fill="#343a40">fp16 stops at 32.0 (after 2,798)</text><text xml:space="preserve" x="620.0" y="344.1" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" fill="#343a40">bf16 stops at 4.0 (after 350)</text><rect x="445" y="376" width="350" height="105" rx="9" fill="#ebfbee" stroke="#2f9e44" stroke-width="1.6"/><rect x="446.4" y="374.6" width="351.1" height="104.4" rx="10" fill="none" stroke="#2f9e44" stroke-width="1.1" stroke-opacity="0.45"/><text xml:space="preserve" x="620.0" y="412.6" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="14" font-weight="700" fill="#2b8a3e">the cure</text><text xml:space="preserve" x="620.0" y="436.0" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" fill="#343a40">add in fp32: 100.0030</text><text xml:space="preserve" x="620.0" y="453.4" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" fill="#343a40">(100.0977 if the inputs are bf16)</text><text xml:space="preserve" x="620.0" y="520.0" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" font-weight="700" fill="#343a40">small numbers added to big totals</text><text xml:space="preserve" x="620.0" y="545.0" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" font-weight="700" fill="#343a40">disappear: accumulate in fp32</text><rect x="830" y="95" width="390" height="480" rx="14" fill="#f3f0ff" fill-opacity="0.35" stroke="#7048e8" stroke-width="2" stroke-dasharray="9 6"/><text xml:space="preserve" x="1025.0" y="121" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="16" font-weight="700" fill="#5f3dc4">3. A gradient of 2e-8 in fp16</text><rect x="850" y="140" width="350" height="105" rx="9" fill="#fff5f5" stroke="#e03131" stroke-width="1.6"/><rect x="848.9" y="138.9" width="349.4" height="105.9" rx="10" fill="none" stroke="#e03131" stroke-width="1.1" stroke-opacity="0.45"/><text xml:space="preserve" x="1025.0" y="176.7" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="14" font-weight="700" fill="#c92a2a">smallest fp16 number is 5.96e-8</text><text xml:space="preserve" x="1025.0" y="200.1" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" fill="#343a40">2e-8 is under half of that</text><text xml:space="preserve" x="1025.0" y="217.5" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" fill="#343a40">stored as 0: the gradient is lost</text><rect x="850" y="258" width="350" height="105" rx="9" fill="#fff9db" stroke="#e8a300" stroke-width="1.6"/><rect x="849.0" y="258.2" width="350.4" height="104.6" rx="10" fill="none" stroke="#e8a300" stroke-width="1.1" stroke-opacity="0.45"/><text xml:space="preserve" x="1025.0" y="294.6" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="14" font-weight="700" fill="#b35c00">multiply the loss by 1,024 first</text><text xml:space="preserve" x="1025.0" y="318.0" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" fill="#343a40">gradient becomes 2.05e-5</text><text xml:space="preserve" x="1025.0" y="335.4" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" fill="#343a40">stored as 2.0504e-5</text><rect x="850" y="376" width="350" height="105" rx="9" fill="#ebfbee" stroke="#2f9e44" stroke-width="1.6"/><rect x="850.1" y="374.7" width="348.7" height="104.1" rx="10" fill="none" stroke="#2f9e44" stroke-width="1.1" stroke-opacity="0.45"/><text xml:space="preserve" x="1025.0" y="412.6" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="14" font-weight="700" fill="#2b8a3e">divide by 1,024 before the update</text><text xml:space="preserve" x="1025.0" y="436.0" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" fill="#343a40">2.0023e-8, within 0.12% of 2e-8</text><text xml:space="preserve" x="1025.0" y="453.4" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" fill="#343a40">that is loss scaling</text><text xml:space="preserve" x="1025.0" y="520.0" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" font-weight="700" fill="#343a40">the scale moves small gradients into</text><text xml:space="preserve" x="1025.0" y="545.0" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" font-weight="700" fill="#343a40">the range fp16 can hold</text></svg>

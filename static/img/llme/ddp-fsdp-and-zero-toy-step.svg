verage, and hand each GPU only its own half</text><rect x="150.0" y="280.0" width="58.0" height="34.0" rx="3" fill="#fff4e6" fill-opacity="1.0" stroke="#e8590c" stroke-width="1.5"/><text xml:space="preserve" x="179.0" y="302.0" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="14" font-weight="700" fill="#c2410c">2</text><rect x="212.0" y="280.0" width="58.0" height="34.0" rx="3" fill="#fff4e6" fill-opacity="1.0" stroke="#e8590c" stroke-width="1.5"/><text xml:space="preserve" x="241.0" y="302.0" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="14" font-weight="700" fill="#c2410c">2</text><rect x="274.0" y="280.0" width="58.0" height="34.0" rx="3" fill="#fff4e6" fill-opacity="1.0" stroke="#e8590c" stroke-width="1.5"/><text xml:space="preserve" x="303.0" y="302.0" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="14" font-weight="700" fill="#c2410c">2</text><rect x="336.0" y="280.0" width="58.0" height="34.0" rx="3" fill="#fff4e6" fill-opacity="1.0" stroke="#e8590c" stroke-width="1.5"/><text xml:space="preserve" x="365.0" y="302.0" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="14" font-weight="700" fill="#c2410c">2</text><text xml:space="preserve" x="138.0" y="302.0" text-anchor="end" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" font-weight="700" fill="#343a40">GPU 0</text><rect x="150.0" y="325.0" width="58.0" height="34.0" rx="3" fill="#fff4e6" fill-opacity="1.0" stroke="#e8590c" stroke-width="1.5"/><text xml:space="preserve" x="179.0" y="347.0" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-s
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 700" width="1240" height="700" role="img" aria-label="What the zeros bought"><defs></defs><rect x="0" y="0" width="1240" height="700" rx="18" fill="#fffdf7"/><text xml:space="preserve" x="620.0" y="44" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="24" font-weight="700" fill="#1864ab">What the zeros bought</text><text xml:space="preserve" x="620.0" y="70" text-anchor="middle" font-family="'Inter','Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="14" fill="#868e96">Digits MLP 64-512-512-10, 540 test images, dense accuracy 0.9759; one image is 0.0019</text><rect x="20" y="95" width="640" height="330" rx="14" fill="#e7f5ff" fill-opacity="0.35" stroke="#1c7ed6" stroke-width="2" stroke-dasharray="9 6"/><text xml:space="preserve" x="340.0" y="121" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="16" font-weight="700" fill="#1864ab">Global magnitude pruning, accuracy</text><rect x="40" y="140" width="610" height="40" rx="6" fill="#1c7ed6"/><text xml:space="preserve" x="48" y="159.0" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" font-weight="700" fill="#ffffff">sparsity</text><text xml:space="preserve" x="148" y="159.0" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" font-weight="700" fill="#ffffff">no fine-tune</text><text xml:space="preserve" x="298" y="159.0" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" font-weight="700" fill="#ffffff">after 8 epochs</text><text xml:space="preserve" x="458" y="159.0" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" font-weight="700" fill="#ffffff">zeros per layer</text><line x1="40" y1="180" x2="650" y2="180" stroke="#dee2e6"/><text xml:space="preserve" x="48" y="199.0" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" font-weight="400" fill="#343a40">0.50</text><text xml:space="preserve" x="148" y="199.0" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" font-weight="400" fill="#343a40">0.9759</text><text xml:space="preserve" x="298" y="199.0" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" font-weight="400" fill="#343a40">0.9778</text><text xml:space="preserve" x="458" y="199.0" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" font-weight="400" fill="#343a40">0.23 / 0.54 / 0.44</text><line x1="40" y1="220" x2="650" y2="220" stroke="#dee2e6"/><rect x="40" y="220" width="610" height="40" fill="#e7f5ff"/><text xml:space="preserve" x="48" y="239.0" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" font-weight="400" fill="#343a40">0.80</text><text xml:space="preserve" x="148" y="239.0" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" font-weight="400" fill="#343a40">0.9648</text><text xml:space="preserve" x="298" y="239.0" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" font-weight="400" fill="#343a40">0.9815</text><text xml:space="preserve" x="458" y="239.0" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" font-weight="400" fill="#343a40">0.45 / 0.85 / 0.72</text><line x1="40" y1="260" x2="650" y2="260" stroke="#dee2e6"/><text xml:space="preserve" x="48" y="279.0" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" font-weight="400" fill="#343a40">0.90</text><text xml:space="preserve" x="148" y="279.0" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" font-weight="400" fill="#343a40">0.7685</text><text xml:space="preserve" x="298" y="279.0" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" font-weight="400" fill="#343a40">0.9759</text><text xml:space="preserve" x="458" y="279.0" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" font-weight="400" fill="#343a40">0.61 / 0.94 / 0.87</text><line x1="40" y1="300" x2="650" y2="300" stroke="#dee2e6"/><rect x="40" y="300" width="610" height="40" fill="#e7f5ff"/><text xml:space="preserve" x="48" y="319.0" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" font-weight="400" fill="#343a40">0.95</text><text xml:space="preserve" x="148" y="319.0" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" font-weight="400" fill="#343a40">0.3778</text><text xml:space="preserve" x="298" y="319.0" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" font-weight="400" fill="#343a40">0.9481</text><text xml:space="preserve" x="458" y="319.0" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" font-weight="400" fill="#343a40">0.74 / 0.98 / 0.95</text><line x1="40" y1="340" x2="650" y2="340" stroke="#dee2e6"/><text xml:space="preserve" x="48" y="359.0" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" font-weight="400" fill="#343a40">0.98</text><text xml:space="preserve" x="148" y="359.0" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" font-weight="400" fill="#343a40">0.3148</text><text xml:space="preserve" x="298" y="359.0" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" font-weight="400" fill="#343a40">0.2889</text><text xml:space="preserve" x="458" y="359.0" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" font-weight="400" fill="#343a40">0.88 / 0.99 / 0.99</text><line x1="40" y1="380" x2="650" y2="380" stroke="#dee2e6"/><rect x="40" y="385" width="600" height="30" rx="9" fill="#fff5f5" stroke="#e03131" stroke-width="1.6"/><rect x="39.5" y="384.0" width="600.5" height="28.7" rx="10" fill="none" stroke="#e03131" stroke-width="1.1" stroke-opacity="0.45"/><text xml:space="preserve" x="340.0" y="403.0" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="11" fill="#343a40">98% broke it: the middle and last layers lost 99% of their weights</text><rect x="680" y="95" width="540" height="330" rx="14" fill="#f3f0ff" fill-opacity="0.35" stroke="#7048e8" stroke-width="2" stroke-dasharray="9 6"/><text xml:space="preserve" x="950.0" y="121" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="16" font-weight="700" fill="#5f3dc4">Other ways to cut</text><rect x="700" y="140" width="500" height="65" rx="9" fill="#f3f0ff" stroke="#7048e8" stroke-width="1.6"/><rect x="700.1" y="139.6" width="498.7" height="65.0" rx="10" fill="none" stroke="#7048e8" stroke-width="1.1" stroke-opacity="0.45"/><text xml:space="preserve" x="950.0" y="156.7" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="14" font-weight="700" fill="#5f3dc4">2:4 pattern, no fine-tuning</text><text xml:space="preserve" x="950.0" y="180.1" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" fill="#343a40">accuracy 0.9778, exactly half the weights zero</text><text xml:space="preserve" x="950.0" y="197.5" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" fill="#343a40">its speedup needs Ampere-class sparse tensor cores (not run here)</text><rect x="700" y="220" width="500" height="65" rx="9" fill="#ebfbee" stroke="#2f9e44" stroke-width="1.6"/><rect x="698.6" y="219.8" width="498.7" height="63.8" rx="10" fill="none" stroke="#2f9e44" stroke-width="1.1" stroke-opacity="0.45"/><text xml:space="preserve" x="950.0" y="236.7" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="14" font-weight="700" fill="#2b8a3e">structured: half the first-layer units</text><text xml:space="preserve" x="950.0" y="260.1" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" fill="#343a40">0.9407 before fine-tuning, 0.9796 after,</text><text xml:space="preserve" x="950.0" y="277.4" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" fill="#343a40">and the layer is physically smaller</text><rect x="700" y="300" width="500" height="55" rx="9" fill="#e3fafc" stroke="#0c8599" stroke-width="1.6"/><rect x="699.8" y="301.0" width="498.9" height="54.2" rx="10" fill="none" stroke="#0c8599" stroke-width="1.1" stroke-opacity="0.45"/><text xml:space="preserve" x="950.0" y="320.4" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="14" font-weight="700" fill="#0b7285">simulated int8 / int4 weights</text><text xml:space="preserve" x="950.0" y="343.8" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" fill="#343a40">0.9759 and 0.9778, within one image of dense</text><rect x="700" y="370" width="500" height="45" rx="9" fill="#fff4e6" stroke="#e8590c" stroke-width="1.6"/><rect x="700.4" y="371.3" width="500.2" height="44.7" rx="10" fill="none" stroke="#e8590c" stroke-width="1.1" stroke-opacity="0.45"/><text xml:space="preserve" x="950.0" y="385.8" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" font-weight="700" fill="#c2410c">low-rank, middle layer</text><text xml:space="preserve" x="950.0" y="407.7" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="11" fill="#343a40">rank 16 keeps 0.9759 with 16,384 of 262,144 parameters</text><rect x="20" y="445" width="1200" height="235" rx="14" fill="#fff9db" fill-opacity="0.35" stroke="#e8a300" stroke-width="2" stroke-dasharray="9 6"/><text xml:space="preserve" x="620.0" y="471" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="16" font-weight="700" fill="#b35c00">32 x 2048 by 2048 x 2048 matmul, one run, six runs gave these ratios</text><text xml:space="preserve" x="360.0" y="514.0" text-anchor="end" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" font-weight="700" fill="#343a40">dense</text><rect x="380.0" y="500.0" width="158.9" height="20.0" rx="4" fill="#ebfbee" stroke="#2f9e44" stroke-width="1.6" fill-opacity="1.0"/><text xml:space="preserve" x="548.9" y="515.0" text-anchor="start" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" font-weight="700" fill="#2b8a3e">0.39 ms  (baseline)</text><text xml:space="preserve" x="360.0" y="556.0" text-anchor="end" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" font-weight="700" fill="#343a40">90% zeros in a dense tensor</text><rect x="380.0" y="542.0" width="173.4" height="20.0" rx="4" fill="#e7f5ff" stroke="#1c7ed6" stroke-width="1.6" fill-opacity="1.0"/><text xml:space="preserve" x="563.4" y="557.0" text-anchor="start" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" font-weight="700" fill="#1864ab">0.47 ms  (0.94 to 1.2 times dense)</text><text xml:space="preserve" x="360.0" y="598.0" text-anchor="end" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" font-weight="700" fill="#343a40">90% zeros as CSR</text><rect x="380.0" y="584.0" width="440.0" height="20.0" rx="4" fill="#fff5f5" stroke="#e03131" stroke-width="1.6" fill-opacity="1.0"/><text xml:space="preserve" x="830.0" y="599.0" text-anchor="start" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" font-weight="700" fill="#c92a2a">14.75 ms  (about 20 to 45 times slower)</text><text xml:space="preserve" x="360.0" y="640.0" text-anchor="end" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" font-weight="700" fill="#343a40">half the rows removed</text><rect x="380.0" y="626.0" width="103.3" height="20.0" rx="4" fill="#ebfbee" stroke="#2f9e44" stroke-width="1.6" fill-opacity="1.0"/><text xml:space="preserve" x="493.3" y="641.0" text-anchor="start" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" font-weight="700" fill="#2b8a3e">0.19 ms  (about 0.4 to 0.6 times dense)</text><text xml:space="preserve" x="620" y="668.0" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="11" font-weight="400" fill="#868e96" font-style="italic">zeros in a dense tensor still get multiplied; only a smaller matrix or a real sparse kernel is faster. Bars are log-scaled.</text></svg>

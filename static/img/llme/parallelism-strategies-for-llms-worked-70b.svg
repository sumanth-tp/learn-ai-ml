-opacity="1.0" stroke="#1c7ed6" stroke-width="1.6"/><text xml:space="preserve" x="677.3" y="285.0" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" font-weight="700" fill="#1864ab">8.82</text><rect x="704.7" y="260.0" width="54.7" height="40.0" rx="3" fill="#fff4e6" fill-opacity="1.0" stroke="#e8590c" stroke-width="1.6"/><text xml:space="preserve" x="732.0" y="285.0" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" font-weight="700" fill="#c2410c">8.82</text><rect x="759.4" y="260.0" width="82.0" height="40.0" rx="3" fill="#f3f0ff" fill-opacity="1.0" stroke="#7048e8" stroke-width="1.6"/><text xml:space="preserve" x="800.4" y="285.0" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" font-weight="700" fill="#5f3dc4">13.23</text><text xml:space="preserve" x="849.4" y="286.0" text-anchor="start" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="14" font-weight="700" fill="#343a40">30.87</text><text xml:space="preserve" x="640.0" y="376.0" text-anchor="end" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" font-weight="700" fill="#343a40">stage 2</text><rect x="650.0" y="350.0" width="54.7" height="40.0" rx="3" fill="#e7f5ff" fill-opacity="1.0" stroke="#1c7ed6" stroke-width="1.6"/><text xml:space="preserve" x="677.3" y="375.0" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" font-weight="700" fill="#1864ab">8.82</text><rect x="704.7" y="350.0" width="13.6" height="40.0" rx="3" fill="#fff4e6" fill-opacity="1.0" stroke="#e8590c" stroke-width="1.6"/><rect x="718.3" y="350.0" width="82.0" height="40.0" rx="3" f
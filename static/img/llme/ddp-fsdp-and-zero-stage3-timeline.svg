<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 580" width="1240" height="580" role="img" aria-label="Stage 3 (FSDP): gather a layer, use it, drop it"><defs></defs><rect x="0" y="0" width="1240" height="580" rx="18" fill="#fffdf7"/><text xml:space="preserve" x="620.0" y="44" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="24" font-weight="700" fill="#1864ab">Stage 3 (FSDP): gather a layer, use it, drop it</text><text xml:space="preserve" x="620.0" y="70" text-anchor="middle" font-family="'Inter','Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="14" fill="#868e96">One GPU, three layers. The next layer&#x27;s gather runs while the current layer computes, so the wait is hidden</text><rect x="20" y="95" width="1200" height="320" rx="14" fill="#e3fafc" fill-opacity="0.35" stroke="#0c8599" stroke-width="2" stroke-dasharray="9 6"/><text xml:space="preserve" x="620.0" y="121" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="16" font-weight="700" fill="#0b7285">Time runs left to right</text><text xml:space="preserve" x="145.0" y="174.0" text-anchor="end" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" font-weight="700" fill="#343a40">all-gather</text><text xml:space="preserve" x="145.0" y="239.0" text-anchor="end" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" font-weight="700" fill="#343a40">compute</text><text xml:space="preserve" x="145.0" y="304.0" text-anchor="end" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" font-weight="700" fill="#343a40">reduce-scatter</text><rect x="160.0" y="150.0" width="66.0" height="38.0" rx="4" fill="#e7f5ff" fill-opacity="1.0" stroke="#1c7ed6" stroke-width="1.6"/><text xml:space="preserve" x="193.0" y="174.0" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="11" font-weight="700" fill="#1864ab">layer 1</text><rect x="232.0" y="150.0" width="66.0" height="38.0" rx="4" fill="#e7f5ff" fill-opacity="1.0" stroke="#1c7ed6" stroke-width="1.6"/><text xml:space="preserve" x="265.0" y="174.0" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="11" font-weight="700" fill="#1864ab">layer 2</text><rect x="304.0" y="150.0" width="66.0" height="38.0" rx="4" fill="#e7f5ff" fill-opacity="1.0" stroke="#1c7ed6" stroke-width="1.6"/><text xml:space="preserve" x="337.0" y="174.0" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="11" font-weight="700" fill="#1864ab">layer 3</text><rect x="592.0" y="150.0" width="66.0" height="38.0" rx="4" fill="#e7f5ff" fill-opacity="1.0" stroke="#1c7ed6" stroke-width="1.6"/><text xml:space="preserve" x="625.0" y="174.0" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="11" font-weight="700" fill="#1864ab">layer 3</text><rect x="664.0" y="150.0" width="66.0" height="38.0" rx="4" fill="#e7f5ff" fill-opacity="1.0" stroke="#1c7ed6" stroke-width="1.6"/><text xml:space="preserve" x="697.0" y="174.0" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="11" font-weight="700" fill="#1864ab">layer 2</text><rect x="736.0" y="150.0" width="66.0" height="38.0" rx="4" fill="#e7f5ff" fill-opacity="1.0" stroke="#1c7ed6" stroke-width="1.6"/><text xml:space="preserve" x="769.0" y="174.0" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="11" font-weight="700" fill="#1864ab">layer 1</text><rect x="232.0" y="215.0" width="66.0" height="38.0" rx="4" fill="#ebfbee" fill-opacity="1.0" stroke="#2f9e44" stroke-width="1.6"/><text xml:space="preserve" x="265.0" y="239.0" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="11" font-weight="700" fill="#2b8a3e">fwd 1</text><rect x="304.0" y="215.0" width="66.0" height="38.0" rx="4" fill="#ebfbee" fill-opacity="1.0" stroke="#2f9e44" stroke-width="1.6"/><text xml:space="preserve" x="337.0" y="239.0" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="11" font-weight="700" fill="#2b8a3e">fwd 2</text><rect x="376.0" y="215.0" width="66.0" height="38.0" rx="4" fill="#ebfbee" fill-opacity="1.0" stroke="#2f9e44" stroke-width="1.6"/><text xml:space="preserve" x="409.0" y="239.0" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="11" font-weight="700" fill="#2b8a3e">fwd 3</text><rect x="664.0" y="215.0" width="66.0" height="38.0" rx="4" fill="#fff5f5" fill-opacity="1.0" stroke="#e03131" stroke-width="1.6"/><text xml:space="preserve" x="697.0" y="239.0" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="11" font-weight="700" fill="#c92a2a">bwd 3</text><rect x="736.0" y="215.0" width="66.0" height="38.0" rx="4" fill="#fff5f5" fill-opacity="1.0" stroke="#e03131" stroke-width="1.6"/><text xml:space="preserve" x="769.0" y="239.0" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="11" font-weight="700" fill="#c92a2a">bwd 2</text><rect x="808.0" y="215.0" width="66.0" height="38.0" rx="4" fill="#fff5f5" fill-opacity="1.0" stroke="#e03131" stroke-width="1.6"/><text xml:space="preserve" x="841.0" y="239.0" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="11" font-weight="700" fill="#c92a2a">bwd 1</text><rect x="736.0" y="280.0" width="66.0" height="38.0" rx="4" fill="#fff4e6" fill-opacity="1.0" stroke="#e8590c" stroke-width="1.6"/><text xml:space="preserve" x="769.0" y="304.0" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="11" font-weight="700" fill="#c2410c">grad 3</text><rect x="808.0" y="280.0" width="66.0" height="38.0" rx="4" fill="#fff4e6" fill-opacity="1.0" stroke="#e8590c" stroke-width="1.6"/><text xml:space="preserve" x="841.0" y="304.0" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="11" font-weight="700" fill="#c2410c">grad 2</text><rect x="880.0" y="280.0" width="66.0" height="38.0" rx="4" fill="#fff4e6" fill-opacity="1.0" stroke="#e8590c" stroke-width="1.6"/><text xml:space="preserve" x="913.0" y="304.0" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="11" font-weight="700" fill="#c2410c">grad 1</text><text xml:space="preserve" x="517.0" y="238.0" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" font-weight="700" fill="#868e96">loss</text><text xml:space="preserve" x="337.0" y="345.0" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" font-weight="700" fill="#2b8a3e">forward: gather each layer once</text><text xml:space="preserve" x="769.0" y="345.0" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" font-weight="700" fill="#c92a2a">backward: gather again, then scatter the gradient</text><text xml:space="preserve" x="620.0" y="388.0" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" font-weight="400" fill="#343a40">each layer is freed after use, so only about two full layers are resident at once</text><rect x="20" y="435" width="380" height="125" rx="9" fill="#e3fafc" stroke="#0c8599" stroke-width="1.6"/><rect x="19.5" y="434.0" width="380.5" height="123.7" rx="10" fill="none" stroke="#0c8599" stroke-width="1.1" stroke-opacity="0.45"/><text xml:space="preserve" x="210.0" y="481.6" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="14" font-weight="700" fill="#0b7285">why it works</text><text xml:space="preserve" x="210.0" y="505.0" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" fill="#343a40">each GPU stores only 1/N of every layer;</text><text xml:space="preserve" x="210.0" y="522.4" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" fill="#343a40">the rest is fetched when needed</text><rect x="430" y="435" width="380" height="125" rx="9" fill="#fff9db" stroke="#e8a300" stroke-width="1.6"/><rect x="430.1" y="434.6" width="378.7" height="125.0" rx="10" fill="none" stroke="#e8a300" stroke-width="1.1" stroke-opacity="0.45"/><text xml:space="preserve" x="620.0" y="472.9" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="14" font-weight="700" fill="#b35c00">what it costs</text><text xml:space="preserve" x="620.0" y="496.3" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" fill="#343a40">weights cross the wire twice (forward and</text><text xml:space="preserve" x="620.0" y="513.8" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" fill="#343a40">backward) plus the gradient scatter:</text><text xml:space="preserve" x="620.0" y="531.1" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" fill="#343a40">3 units against DDP&#x27;s 2</text><rect x="840" y="435" width="380" height="125" rx="9" fill="#f3f0ff" stroke="#7048e8" stroke-width="1.6"/><rect x="838.6" y="434.8" width="378.7" height="123.8" rx="10" fill="none" stroke="#7048e8" stroke-width="1.1" stroke-opacity="0.45"/><text xml:space="preserve" x="1030.0" y="472.9" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="14" font-weight="700" fill="#5f3dc4">the Llama 3 variant</text><text xml:space="preserve" x="1030.0" y="496.3" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" fill="#343a40">keep the weights gathered after forward:</text><text xml:space="preserve" x="1030.0" y="513.8" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" fill="#343a40">no second gather, but the full weights</text><text xml:space="preserve" x="1030.0" y="531.1" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" fill="#343a40">stay in memory until backward is done</text></svg>

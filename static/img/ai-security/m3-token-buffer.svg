="#d6336c" stroke-width="1.1" stroke-opacity="0.45"/><text xml:space="preserve" x="1205.0" y="183.2" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" font-weight="700" fill="#c2255c">LLM</text><text xml:space="preserve" x="1205.0" y="205.2" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="11" fill="#343a40">reply appended</text><path d="M180.0,190.0 L220.0,190.0" fill="none" stroke="#343a40" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#ah343a40)"/><path d="M420.0,190.0 L460.0,190.0" fill="none" stroke="#343a40" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#ah343a40)"/><path d="M660.0,190.0 L705.0,190.0" fill="none" stroke="#343a40" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#ah343a40)"/><path d="M800.0,245.0 L800.0,300.0" fill="none" stroke="#e03131" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#ahe03131)"/><path d="M700.0,330.0 L560.0,330.0 L560.0,230.0" fill="none" stroke="#e03131" stroke-width="1.8" stroke-dasharray="7 5" stroke-linejoin="round" marker-end="url(#ahe03131)"/><path d="M895.0,190.0 L960.0,190.0" fill="none" stroke="#2f9e44" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#ah2f9e44)"/><path d="M1110.0,190.0 L1140.0,190.0" fill="none" stroke="#343a40" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#ah343a40)"/><rect x="30" y="390" width="600" height="90" rx="9" fill="#ebfbee" stroke="#2f9e44" stroke-width="1.6"/><rect x="28.9" y="388.9" width="599.4" height="90.9" rx="10" fill="none" stroke="#2f9e44" stroke-width="1.1" stroke-opacity="0.45"/><text xml:space="preserve" x="330.0" y="420.3" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" font-weight="700" fill="#2b8a3e">input tokens = system + min(history, max buffer)</text><text xml:space="preserve" x="330.0" y="442.2" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="11" fill="#343a40">exact budget · no summariser calls · no latency spikes</text><text xml:space="preserve" x="330.0" y="458.2" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="11" fill="#343a40">LangChain: ConversationTokenBufferMemory</text><rect x="660" y="390" width="610" height="90" rx="9" fill="#fff4e6" stroke="#e8590c" stroke-width="1.6"/><rect x="659.0" y="390.2" width="610.4" height="89.6" rx="10" fill="none" stroke="#e8590c" stroke-width="1.1" stroke-opacity="0.45"/><text xml:space="preserve" x="965.0" y="420.3" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" font-weight="700" fill="#c2410c">vs sliding window: tokens, not turns</text><text xml:space="preserve" x="965.0" y="442.2" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="11" fill="#343a40">evicts one message at a time, so a user/assistant</text><text xml:space="preserve" x="965.0" y="458.2" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="11" fill="#343a40">pair can be split; the budget is exact, not approximate</text><rect x="785.1" y="263.5" width="29.8" height="18" rx="4" fill="#fffdf7" fill-opacity="0.95"/><text xml:space="preserve" x="800.0" y="276.5" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="11" font-weight="700" fill="#e03131">yes</text><rect x="598.6" y="321.0" width="62.8" height="18" rx="4" fill="#fffdf7" fill-opacity="0.95"/><text xml:space="preserve" x="630.0" y="334.0" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="11" font-weight="700" fill="#e03131">re-count</text><rect x="915.9" y="181.0" width="23.2" height="18" rx="4" fill="#fffdf7" fill-opacity="0.95"/><text xml:space="preserve" x="927.5" y="194.0" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="11" font-weight="700" fill="#2f9e44">no</text></svg>

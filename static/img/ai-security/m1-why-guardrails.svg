<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 430" width="1000" height="430" role="img" aria-label="LLM Guardrails"><defs><marker id="ahe03131" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e03131"/></marker><marker id="ahe03131s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e03131"/></marker></defs><rect x="0" y="0" width="1000" height="430" rx="18" fill="#fffdf7"/><text xml:space="preserve" x="500.0" y="44" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="24" font-weight="700" fill="#1864ab">LLM Guardrails</text><text xml:space="preserve" x="500.0" y="70" text-anchor="middle" font-family="'Inter','Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="14" fill="#868e96">Why an LLM application needs a security layer (0:03 to 0:06)</text><rect x="380" y="100" width="240" height="56" rx="9" fill="#fff5f5" stroke="#e03131" stroke-width="1.6"/><rect x="379.5" y="99.0" width="240.5" height="54.7" rx="10" fill="none" stroke="#e03131" stroke-width="1.1" stroke-opacity="0.45"/><text xml:space="preserve" x="500.0" y="133.8" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="18" font-weight="700" fill="#c92a2a">LLM security</text><rect x="60" y="230" width="280" height="150" rx="9" fill="#fff9db" stroke="#e8a300" stroke-width="1.6"/><rect x="60.1" y="229.6" width="278.7" height="150.0" rx="10" fill="none" stroke="#e8a300" stroke-width="1.1" stroke-opacity="0.45"/><text xml:space="preserve" x="200.0" y="280.8" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="15" font-weight="700" fill="#b35c00">Prompt injection</text><text xml:space="preserve" x="200.0" y="304.2" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" fill="#343a40">The successor to SQL injection:</text><text xml:space="preserve" x="200.0" y="321.6" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" fill="#343a40">instructions smuggled into</text><text xml:space="preserve" x="200.0" y="339.0" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" fill="#343a40">the model&#x27;s input</text><path d="M500.0,156.0 L200.0,230.0" fill="none" stroke="#e03131" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#ahe03131)"/><rect x="360" y="230" width="280" height="150" rx="9" fill="#fff9db" stroke="#e8a300" stroke-width="1.6"/><rect x="358.6" y="229.8" width="278.7" height="148.8" rx="10" fill="none" stroke="#e8a300" stroke-width="1.1" stroke-opacity="0.45"/><text xml:space="preserve" x="500.0" y="280.8" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="15" font-weight="700" fill="#b35c00">Jailbreak</text><text xml:space="preserve" x="500.0" y="304.2" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" fill="#343a40">Talking the model out of</text><text xml:space="preserve" x="500.0" y="321.6" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" fill="#343a40">its rules, like unlocking</text><text xml:space="preserve" x="500.0" y="339.0" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" fill="#343a40">unlimited shots in a game</text><path d="M500.0,156.0 L500.0,230.0" fill="none" stroke="#e03131" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#ahe03131)"/><rect x="660" y="230" width="280" height="150" rx="9" fill="#ebfbee" stroke="#2f9e44" stroke-width="1.6"/><rect x="659.8" y="231.0" width="278.9" height="149.2" rx="10" fill="none" stroke="#2f9e44" stroke-width="1.1" stroke-opacity="0.45"/><text xml:space="preserve" x="800.0" y="280.8" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="15" font-weight="700" fill="#2b8a3e">Cost saving</text><text xml:space="preserve" x="800.0" y="304.2" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" fill="#343a40">Every off-topic answer burns</text><text xml:space="preserve" x="800.0" y="321.6" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" fill="#343a40">tokens; refusing early</text><text xml:space="preserve" x="800.0" y="339.0" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" fill="#343a40">saves money</text><path d="M500.0,156.0 L800.0,230.0" fill="none" stroke="#e03131" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#ahe03131)"/><text xml:space="preserve" x="500" y="410.0" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" font-weight="400" fill="#343a40" font-style="italic">threats the guardrail layer exists to stop</text></svg>

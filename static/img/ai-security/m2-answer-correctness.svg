"'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="11" font-weight="700" fill="#ffffff">FN</text><rect x="30" y="525" width="640" height="90" rx="9" fill="#ebfbee" stroke="#2f9e44" stroke-width="1.6"/><rect x="30.5" y="524.8" width="639.4" height="90.3" rx="10" fill="none" stroke="#2f9e44" stroke-width="1.1" stroke-opacity="0.45"/><text xml:space="preserve" x="350.0" y="563.2" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" font-weight="700" fill="#2b8a3e">F1 = TP ÷ (TP + ½ (FP + FN)) = 2 ÷ 4 = 0.50</text><text xml:space="preserve" x="350.0" y="585.2" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="11" fill="#343a40">catches wrong values and hallucinations</text><rect x="700" y="185" width="570" height="170" rx="14" fill="#e7f5ff" fill-opacity="0.35" stroke="#1c7ed6" stroke-width="2" stroke-dasharray="9 6"/><text xml:space="preserve" x="985.0" y="211" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="16" font-weight="700" fill="#1864ab">Component 2 · semantic similarity</text><rect x="720" y="225" width="530" height="50" rx="9" fill="#e7f5ff" stroke="#1c7ed6" stroke-width="1.6"/><rect x="719.9" y="224.4" width="530.9" height="50.6" rx="10" fill="none" stroke="#1c7ed6" stroke-width="1.1" stroke-opacity="0.45"/><text xml:space="preserve" x="985.0" y="253.9" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" font-weight="700" fill="#1864ab">embedding cosine(response, reference)</text><rect x="720" y="300" width="420" height="16" rx="8.0" fill="#e9ecef" stroke="#ced4da"/><rect x="720" y="300" width="302.4" height="16" rx="8.0" fill="#1c7ed6"/><text xml:space="preserve" x="1150" y="313.0" text-anchor="start" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="14" font-weight="700" fill="#1864ab">0.72</text><rect x="700" y="370" width="570" height="110" rx="9" fill="#f3f0ff" stroke="#7048e8" stroke-width="1.6"/><rect x="699.2" y="370.2" width="570.1" height="111.1" rx="10" fill="none" stroke="#7048e8" stroke-width="1.1" stroke-opacity="0.45"/><text xml:space="preserve" x="985.0" y="402.3" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" font-weight="700" fill="#5f3dc4">Blend</text><text xml:space="preserve" x="985.0" y="424.2" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="11" fill="#343a40">0.75 × 0.50 + 0.25 × 0.72 = 0.555 ≈ 0.55</text><text xml:space="preserve" x="985.0" y="440.2" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="11" fill="#343a40">weights w₁ = 0.75, w₂ = 0.25 (defaults)</text><text xml:space="preserve" x="985.0" y="456.1" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="11" fill="#343a40">move weight to the factual side when facts matter</text><rect x="700" y="495" width="570" height="120" rx="9" fill="#fff9db" stroke="#e8a300" stroke-width="1.6"/><rect x="700.7" y="494.4" width="571.4" height="118.9" rx="10" fill="none" stroke="#e8a300" stroke-width="1.1" stroke-opacity="0.45"/><text xml:space="preserve" x="985.0" y="532.3" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" font-weight="700" fill="#b35c00">Requires embeddings</text><text xml:space="preserve" x="985.0" y="554.2" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="11" fill="#343a40">unlike the other Ragas metrics, this one</text><text xml:space="preserve" x="985.0" y="570.2" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="11" fill="#343a40">needs an embedding model; similar-domain</text><text xml:space="preserve" x="985.0" y="586.1" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="11" fill="#343a40">texts score high even when the facts are wrong</text></svg>

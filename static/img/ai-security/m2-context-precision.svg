rve" x="800" y="462.0" text-anchor="start" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="14" font-weight="700" fill="#2b8a3e">P@5 = 0.80</text><rect x="30" y="505" width="640" height="75" rx="9" fill="#fff4e6" stroke="#e8590c" stroke-width="1.6"/><rect x="28.9" y="503.9" width="639.4" height="75.9" rx="10" fill="none" stroke="#e8590c" stroke-width="1.1" stroke-opacity="0.45"/><text xml:space="preserve" x="350.0" y="527.8" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" font-weight="700" fill="#c2410c">Position penalty</text><text xml:space="preserve" x="350.0" y="549.7" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="11" fill="#343a40">Noise at rank k penalises every relevant chunk after it.</text><text xml:space="preserve" x="350.0" y="565.7" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="11" fill="#343a40">The earlier the noise, the bigger the hit.</text><rect x="700" y="480" width="520" height="100" rx="9" fill="#ebfbee" stroke="#2f9e44" stroke-width="1.6"/><rect x="699.0" y="480.2" width="520.4" height="99.6" rx="10" fill="none" stroke="#2f9e44" stroke-width="1.1" stroke-opacity="0.45"/><text xml:space="preserve" x="960.0" y="514.1" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="14" font-weight="700" fill="#2b8a3e">Precision = (1 + 1 + 0.75 + 0.80) ÷ 4 = 0.89</text><text xml:space="preserve" x="960.0" y="537.5" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" fill="#343a40">mean of P@k at the relevant ranks only</text><text xml:space="preserve" x="960.0" y="554.9" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" fill="#343a40">threshold ≥ 0.7: pass</text></svg>

enlo,Consolas,'Liberation Mono',monospace" font-size="14" font-weight="700" fill="#5f3dc4">Cost is constant, not compounding · but context is lost</text><text xml:space="preserve" x="650.0" y="556.2" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" fill="#343a40">Production: almost always present, almost never alone. Pair it with a long-term layer (vector store, graph) that catches what slides out.</text></svg>

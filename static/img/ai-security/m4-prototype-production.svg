<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="1200" height="420" role="img" aria-label="Your agent works on localhost. Now what?"><defs><marker id="ah343a40" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#343a40"/></marker><marker id="ah343a40s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#343a40"/></marker></defs><rect x="0" y="0" width="1200" height="420" rx="18" fill="#fffdf7"/><text xml:space="preserve" x="600.0" y="44" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="24" font-weight="700" fill="#1864ab">Your agent works on localhost. Now what?</text><text xml:space="preserve" x="600.0" y="70" text-anchor="middle" font-family="'Inter','Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="14" fill="#868e96">The opening slide of the AgentOps module (5:53)</text><rect x="30" y="100" width="540" height="200" rx="9" fill="#e7f5ff" stroke="#1c7ed6" stroke-width="1.6"/><rect x="29.5" y="99.0" width="540.5" height="198.7" rx="10" fill="none" stroke="#1c7ed6" stroke-width="1.1" stroke-opacity="0.45"/><text xml:space="preserve" x="42" y="164.2" text-anchor="start" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="15" font-weight="700" fill="#1864ab">🔬 Prototype reality</text><text xml:space="preserve" x="42" y="189.0" text-anchor="start" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" fill="#343a40">• Jupyter notebook, hardcoded API keys</text><text xml:space="preserve" x="42" y="207.9" text-anchor="start" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" fill="#343a40">• One test query, one happy path</text><text xml:space="preserve" x="42" y="226.7" text-anchor="start" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" fill="#343a40">• &quot;It works on my machine&quot;</text><text xml:space="preserve" x="42" y="245.6" text-anchor="start" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" fill="#343a40">• No concurrency, no failure modes</text><rect x="630" y="100" width="540" height="200" rx="9" fill="#fff5f5" stroke="#e03131" stroke-width="1.6"/><rect x="630.1" y="99.6" width="538.7" height="200.0" rx="10" fill="none" stroke="#e03131" stroke-width="1.1" stroke-opacity="0.45"/><text xml:space="preserve" x="642" y="164.2" text-anchor="start" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="15" font-weight="700" fill="#c92a2a">🏭 Production reality</text><text xml:space="preserve" x="642" y="189.0" text-anchor="start" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" fill="#343a40">• 10,000 concurrent users</text><text xml:space="preserve" x="642" y="207.9" text-anchor="start" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" fill="#343a40">• Non-deterministic outputs at scale</text><text xml:space="preserve" x="642" y="226.7" text-anchor="start" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" fill="#343a40">• Cascading agent failures</text><text xml:space="preserve" x="642" y="245.6" text-anchor="start" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" fill="#343a40">• No rollback plan</text><path d="M570.0,200.0 L630.0,200.0" fill="none" stroke="#343a40" stroke-width="3" stroke-linejoin="round" marker-end="url(#ah343a40)"/><rect x="30" y="320" width="1140" height="70" rx="9" fill="#fff9db" stroke="#e8a300" stroke-width="1.6"/><rect x="28.6" y="319.8" width="1138.7" height="68.8" rx="10" fill="none" stroke="#e8a300" stroke-width="1.1" stroke-opacity="0.45"/><text xml:space="preserve" x="600.0" y="359.6" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="14" font-weight="700" fill="#b35c00">⚠ Traditional MLOps was designed for models that predict. Agents act. That changes everything.</text></svg>

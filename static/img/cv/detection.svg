<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 505" width="1160" height="505" role="img" aria-label="Detect objects and remove duplicate boxes"><defs></defs><rect x="0" y="0" width="1160" height="505" rx="18" fill="#fffdf7"/><text xml:space="preserve" x="580.0" y="44" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="24" font-weight="700" fill="#1864ab">Detect objects and remove duplicate boxes</text><text xml:space="preserve" x="580.0" y="70" text-anchor="middle" font-family="'Inter','Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="14" fill="#868e96">Boxes provide location, class and score for a variable number of objects</text><rect x="30" y="130" width="340" height="155" rx="9" fill="#e7f5ff" stroke="#1c7ed6" stroke-width="1.6"/><rect x="29.5" y="129.0" width="340.5" height="153.7" rx="10" fill="none" stroke="#1c7ed6" stroke-width="1.1" stroke-opacity="0.45"/><text xml:space="preserve" x="200.0" y="149.1" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="19" font-weight="700" fill="#1864ab">Predict candidates</text><text xml:space="preserve" x="200.0" y="179.7" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="17" fill="#343a40">two-stage proposal families</text><text xml:space="preserve" x="200.0" y="204.4" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="17" fill="#343a40">one-stage or anchor-free</text><text xml:space="preserve" x="200.0" y="229.0" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="17" fill="#343a40">families</text><text xml:space="preserve" x="200.0" y="253.7" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="17" fill="#343a40">preprocessing remains part of</text><text xml:space="preserve" x="200.0" y="278.3" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="17" fill="#343a40">model</text><rect x="410" y="130" width="340" height="155" rx="9" fill="#f3f0ff" stroke="#7048e8" stroke-width="1.6"/><rect x="410.1" y="129.6" width="338.7" height="155.0" rx="10" fill="none" stroke="#7048e8" stroke-width="1.1" stroke-opacity="0.45"/><text xml:space="preserve" x="580.0" y="173.7" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="19" font-weight="700" fill="#5f3dc4">Worked overlap</text><text xml:space="preserve" x="580.0" y="204.3" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="17" fill="#343a40">A: x 0–10; B: x 5–15</text><text xml:space="preserve" x="580.0" y="229.0" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="17" fill="#343a40">intersection 50 · union 150</text><text xml:space="preserve" x="580.0" y="253.7" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="17" fill="#343a40">IoU 0.333</text><rect x="790" y="130" width="340" height="155" rx="9" fill="#ebfbee" stroke="#2f9e44" stroke-width="1.6"/><rect x="788.6" y="129.8" width="338.7" height="153.8" rx="10" fill="none" stroke="#2f9e44" stroke-width="1.1" stroke-opacity="0.45"/><text xml:space="preserve" x="960.0" y="173.7" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="19" font-weight="700" fill="#2b8a3e">NMS and evaluation</text><text xml:space="preserve" x="960.0" y="204.3" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="17" fill="#343a40">at threshold 0.5 keep both</text><text xml:space="preserve" x="960.0" y="229.0" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="17" fill="#343a40">AP from precision-recall</text><text xml:space="preserve" x="960.0" y="253.7" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="17" fill="#343a40">state IoU and class policy</text><rect x="210" y="360" width="740" height="90" rx="9" fill="#fff9db" stroke="#e8a300" stroke-width="1.6"/><rect x="209.8" y="361.0" width="738.9" height="89.2" rx="10" fill="none" stroke="#e8a300" stroke-width="1.1" stroke-opacity="0.45"/><text xml:space="preserve" x="580.0" y="395.9" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="19" font-weight="700" fill="#b35c00">Real-time is a measured system target</text><text xml:space="preserve" x="580.0" y="426.5" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="17" fill="#343a40">device, image size, batch and postprocessing determine latency</text></svg>

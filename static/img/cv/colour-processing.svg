<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 505" width="1160" height="505" role="img" aria-label="Remap pixels, then protect structure"><defs></defs><rect x="0" y="0" width="1160" height="505" rx="18" fill="#fffdf7"/><text xml:space="preserve" x="580.0" y="44" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="24" font-weight="700" fill="#1864ab">Remap pixels, then protect structure</text><text xml:space="preserve" x="580.0" y="70" text-anchor="middle" font-family="'Inter','Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="14" fill="#868e96">A histogram describes intensities; a filter changes local neighbourhoods</text><rect x="30" y="130" width="340" height="155" rx="9" fill="#e7f5ff" stroke="#1c7ed6" stroke-width="1.6"/><rect x="29.5" y="129.0" width="340.5" height="153.7" rx="10" fill="none" stroke="#1c7ed6" stroke-width="1.1" stroke-opacity="0.45"/><text xml:space="preserve" x="200.0" y="173.7" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="19" font-weight="700" fill="#1864ab">Global or point mapping</text><text xml:space="preserve" x="200.0" y="204.3" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="17" fill="#343a40">8 levels; CDF at 3 = 0.45</text><text xml:space="preserve" x="200.0" y="229.0" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="17" fill="#343a40">round(7 × 0.45) = 3</text><text xml:space="preserve" x="200.0" y="253.7" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="17" fill="#343a40">gamma 0.5 maps 0.25 → 0.5</text><rect x="410" y="130" width="340" height="155" rx="9" fill="#f3f0ff" stroke="#7048e8" stroke-width="1.6"/><rect x="410.1" y="129.6" width="338.7" height="155.0" rx="10" fill="none" stroke="#7048e8" stroke-width="1.1" stroke-opacity="0.45"/><text xml:space="preserve" x="580.0" y="173.7" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="19" font-weight="700" fill="#5f3dc4">Neighbourhood smoothing</text><text xml:space="preserve" x="580.0" y="204.3" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="17" fill="#343a40">mean: equal pixel weights</text><text xml:space="preserve" x="580.0" y="229.0" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="17" fill="#343a40">Gaussian: favour near pixels</text><text xml:space="preserve" x="580.0" y="253.7" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="17" fill="#343a40">median: reject isolated spikes</text><rect x="790" y="130" width="340" height="155" rx="9" fill="#ebfbee" stroke="#2f9e44" stroke-width="1.6"/><rect x="788.6" y="129.8" width="338.7" height="153.8" rx="10" fill="none" stroke="#2f9e44" stroke-width="1.1" stroke-opacity="0.45"/><text xml:space="preserve" x="960.0" y="173.7" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="19" font-weight="700" fill="#2b8a3e">Colour representation</text><text xml:space="preserve" x="960.0" y="204.3" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="17" fill="#343a40">RGB: direct channel values</text><text xml:space="preserve" x="960.0" y="229.0" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="17" fill="#343a40">HSV: hue, saturation, value</text><text xml:space="preserve" x="960.0" y="253.7" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="17" fill="#343a40">lighting still changes colour</text><rect x="215" y="360" width="730" height="90" rx="9" fill="#fff9db" stroke="#e8a300" stroke-width="1.6"/><rect x="214.8" y="361.0" width="728.9" height="89.2" rx="10" fill="none" stroke="#e8a300" stroke-width="1.1" stroke-opacity="0.45"/><text xml:space="preserve" x="580.0" y="395.9" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="19" font-weight="700" fill="#b35c00">Check the task, not just visual appeal</text><text xml:space="preserve" x="580.0" y="426.5" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="17" fill="#343a40">contrast, noise, colour and edge preservation need separate tests</text></svg>

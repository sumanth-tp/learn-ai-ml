<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 640" width="1240" height="640" role="img" aria-label="Worked example: why a bare chunk cannot be found"><defs></defs><rect x="0" y="0" width="1240" height="640" rx="18" fill="#fffdf7"/><text xml:space="preserve" x="620.0" y="44" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="24" font-weight="700" fill="#1864ab">Worked example: why a bare chunk cannot be found</text><text xml:space="preserve" x="620.0" y="70" text-anchor="middle" font-family="'Inter','Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="14" fill="#868e96">Counting query words that appear in each chunk; the chapter code measures the same effect on 120 chunks</text><rect x="20" y="90" width="1200" height="130" rx="14" fill="#e7f5ff" fill-opacity="0.35" stroke="#1c7ed6" stroke-width="2" stroke-dasharray="9 6"/><text xml:space="preserve" x="620.0" y="116" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="16" font-weight="700" fill="#1864ab">Query</text><rect x="60" y="130" width="1120" height="60" rx="9" fill="#e7f5ff" stroke="#1c7ed6" stroke-width="1.6"/><rect x="59.5" y="129.0" width="1120.5" height="58.7" rx="10" fill="none" stroke="#1c7ed6" stroke-width="1.1" stroke-opacity="0.45"/><text xml:space="preserve" x="620.0" y="164.9" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="15" font-weight="700" fill="#1864ab">How fast did revenue grow at Brightwell Energy in Q3 2025?</text><rect x="20" y="245" width="590" height="370" rx="14" fill="#f8f9fa" fill-opacity="0.35" stroke="#6c757d" stroke-width="2" stroke-dasharray="9 6"/><text xml:space="preserve" x="315.0" y="271" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="16" font-weight="700" fill="#343a40">Plain chunks: 24 chunks that all say much the same</text><rect x="45" y="295" width="550" height="34" rx="6" fill="#6c757d"/><text xml:space="preserve" x="53" y="314.0" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" font-weight="700" fill="#ffffff">chunk text</text><text xml:space="preserve" x="383" y="314.0" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" font-weight="700" fill="#ffffff">shared words</text><line x1="45" y1="329" x2="595" y2="329" stroke="#dee2e6"/><text xml:space="preserve" x="53" y="348.0" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" font-weight="400" fill="#343a40">Revenue grew by 12% ...</text><text xml:space="preserve" x="383" y="348.0" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" font-weight="400" fill="#343a40">1 (revenue)</text><line x1="45" y1="363" x2="595" y2="363" stroke="#dee2e6"/><rect x="45" y="363" width="550" height="34" fill="#f8f9fa"/><text xml:space="preserve" x="53" y="382.0" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" font-weight="400" fill="#343a40">Revenue grew by 31% ...</text><text xml:space="preserve" x="383" y="382.0" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" font-weight="400" fill="#343a40">1 (revenue)</text><line x1="45" y1="397" x2="595" y2="397" stroke="#dee2e6"/><text xml:space="preserve" x="53" y="416.0" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" font-weight="400" fill="#343a40">Revenue grew by 7% ...</text><text xml:space="preserve" x="383" y="416.0" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" font-weight="400" fill="#343a40">1 (revenue)</text><line x1="45" y1="431" x2="595" y2="431" stroke="#dee2e6"/><rect x="45" y="431" width="550" height="34" fill="#f8f9fa"/><text xml:space="preserve" x="53" y="450.0" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" font-weight="400" fill="#343a40">... 21 more, same pattern</text><text xml:space="preserve" x="383" y="450.0" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" font-weight="400" fill="#343a40">1 each</text><line x1="45" y1="465" x2="595" y2="465" stroke="#dee2e6"/><text xml:space="preserve" x="315.0" y="520.0" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" font-weight="700" fill="#343a40">24 chunks tie, so the right one is a coin toss</text><text xml:space="preserve" x="315.0" y="548.0" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" font-weight="700" fill="#c92a2a">hit@1 = 1 in 24 = 0.042</text><rect x="630" y="245" width="590" height="370" rx="14" fill="#ebfbee" fill-opacity="0.35" stroke="#2f9e44" stroke-width="2" stroke-dasharray="9 6"/><text xml:space="preserve" x="925.0" y="271" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="16" font-weight="700" fill="#2b8a3e">Chunks with context prefixed</text><rect x="655" y="295" width="560" height="34" rx="6" fill="#2f9e44"/><text xml:space="preserve" x="663" y="314.0" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" font-weight="700" fill="#ffffff">chunk text</text><text xml:space="preserve" x="1043" y="314.0" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" font-weight="700" fill="#ffffff">shared words</text><line x1="655" y1="329" x2="1215" y2="329" stroke="#dee2e6"/><text xml:space="preserve" x="663" y="348.0" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" font-weight="400" fill="#343a40">Brightwell Energy, Q3 2025. Revenue ...</text><text xml:space="preserve" x="1043" y="348.0" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" font-weight="400" fill="#343a40">5  (right one)</text><line x1="655" y1="363" x2="1215" y2="363" stroke="#dee2e6"/><rect x="655" y="363" width="560" height="34" fill="#ebfbee"/><text xml:space="preserve" x="663" y="382.0" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" font-weight="400" fill="#343a40">Brightwell Energy, Q2 2025. Revenue ...</text><text xml:space="preserve" x="1043" y="382.0" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" font-weight="400" fill="#343a40">4</text><line x1="655" y1="397" x2="1215" y2="397" stroke="#dee2e6"/><text xml:space="preserve" x="663" y="416.0" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" font-weight="400" fill="#343a40">Eskarn Telecom, Q3 2025. Revenue ...</text><text xml:space="preserve" x="1043" y="416.0" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" font-weight="400" fill="#343a40">3</text><line x1="655" y1="431" x2="1215" y2="431" stroke="#dee2e6"/><rect x="655" y="431" width="560" height="34" fill="#ebfbee"/><text xml:space="preserve" x="663" y="450.0" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" font-weight="400" fill="#343a40">Aldermoor Foods, Q1 2025. Revenue ...</text><text xml:space="preserve" x="1043" y="450.0" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" font-weight="400" fill="#343a40">2</text><line x1="655" y1="465" x2="1215" y2="465" stroke="#dee2e6"/><text xml:space="preserve" x="925.0" y="520.0" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" font-weight="700" fill="#2b8a3e">the right chunk wins with no ties</text><text xml:space="preserve" x="925.0" y="548.0" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" font-weight="700" fill="#2b8a3e">BM25 hit@1 = 1.000 (block 1)</text></svg>

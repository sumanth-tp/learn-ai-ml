 y="188.8" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" fill="#343a40">Brightwell Energy, Q3 2025</text><text xml:space="preserve" x="1025.0" y="206.2" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" fill="#343a40">report. Revenue grew by 12%</text><text xml:space="preserve" x="1025.0" y="223.7" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" fill="#343a40">over the previous quarter.</text><path d="M370.0,190.0 L450.0,190.0" fill="none" stroke="#343a40" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#ah343a40)"/><path d="M780.0,190.0 L860.0,190.0" fill="none" stroke="#343a40" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#ah343a40)"/><text xml:space="preserve" x="620.0" y="285.0" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" font-weight="400" fill="#868e96">plain chunks: hit@1 0.042 (BM25), 0.050 (dense)</text><text xml:space="preserve" x="620.0" y="310.0" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" font-weight="700" fill="#2b8a3e">with context: hit@1 1.000 (BM25), 0.742 (dense)</text><rect x="20" y="370" width="1200" height="310" rx="14" fill="#f3f0ff" fill-opacity="0.35" stroke="#7048e8" stroke-width="2" stroke-dasharray="9 6"/><text xml:space="preserve" x="620.0" y="396" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="16" font-weight="700" fill="#5f3dc4">Repair 2, at query time: a slower, sharper model rescores a short list</text><rect x="40" y="420" width="210" height="100" rx="9" fill="#e7f5ff" stroke="#1c7ed6" st
e','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" font-weight="400" fill="#343a40">config.py, models.py, offline.py, text_utils.py</text><text xml:space="preserve" x="458" y="527.0" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" font-weight="400" fill="#343a40">settings, model factory, offline stand-ins, helpers</text><line x1="30" y1="542" x2="1150" y2="542" stroke="#dee2e6"/><text xml:space="preserve" x="38" y="561.0" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" font-weight="400" fill="#343a40">all</text><text xml:space="preserve" x="98" y="561.0" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" font-weight="400" fill="#343a40">tests/</text><text xml:space="preserve" x="458" y="561.0" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" font-weight="400" fill="#343a40">75 offline tests, one file per concern</text><line x1="30" y1="576" x2="1150" y2="576" stroke="#dee2e6"/><rect x="30" y="600" width="1130" height="120" rx="9" fill="#fff9db" stroke="#e8a300" stroke-width="1.6"/><rect x="29.5" y="599.0" width="1130.5" height="118.7" rx="10" fill="none" stroke="#e8a300" stroke-width="1.1" stroke-opacity="0.45"/><text xml:space="preserve" x="42" y="635.5" text-anchor="start" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="14" font-weight="700" fill="#b35c00">How to read this</text><text xml:space="preserve" x="42" y="658.9" text-anchor="start" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" fill="#343a40">Build the files in the order of the milestone column. Each milestone ends with a test you can run:</text><text xml:space="preserve" x="42" y="676.2" text-anchor="start" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" fill="#343a40">pytest -q tests/test_chunking.py after M1, test_retrieval.py after M5, and so on.</text><text xml:space="preserve" x="42" y="693.6" text-anchor="start" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" fill="#343a40">Milestone 0 is shared plumbing that you write once at the start; tests/ grows with every milestone.</text></svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 600" width="1160" height="600" role="img" aria-label="Worked example: 1,000 users, one confounder"><defs></defs><rect x="0" y="0" width="1160" height="600" rx="18" fill="#fffdf7"/><text xml:space="preserve" x="580.0" y="44" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="24" font-weight="700" fill="#1864ab">Worked example: 1,000 users, one confounder</text><text xml:space="preserve" x="580.0" y="70" text-anchor="middle" font-family="'Inter','Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="14" fill="#868e96">Averages are exact by construction, so every step can be checked by hand</text><rect x="20" y="90" width="540" height="300" rx="14" fill="#e7f5ff" fill-opacity="0.35" stroke="#1c7ed6" stroke-width="2" stroke-dasharray="9 6"/><text xml:space="preserve" x="290.0" y="116" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="16" font-weight="700" fill="#1864ab">Step 1: who gets notified</text><rect x="40" y="130" width="240" height="110" rx="9" fill="#ebfbee" stroke="#2f9e44" stroke-width="1.6"/><rect x="39.5" y="129.0" width="240.5" height="108.7" rx="10" fill="none" stroke="#2f9e44" stroke-width="1.1" stroke-opacity="0.45"/><text xml:space="preserve" x="160.0" y="165.4" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="16" font-weight="700" fill="#2b8a3e">Engaged (500)</text><text xml:space="preserve" x="160.0" y="193.2" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="15" fill="#343a40">notified 400</text><text xml:space="preserve" x="160.0" y="214.9" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="15" fill="#343a40">not notified 100</text><rect x="300" y="130" width="240" height="110" rx="9" fill="#f8f9fa" stroke="#6c757d" stroke-width="1.6"/><rect x="300.1" y="129.6" width="238.7" height="110.0" rx="10" fill="none" stroke="#6c757d" stroke-width="1.1" stroke-opacity="0.45"/><text xml:space="preserve" x="420.0" y="165.4" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="16" font-weight="700" fill="#343a40">Others (500)</text><text xml:space="preserve" x="420.0" y="193.2" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="15" fill="#343a40">notified 100</text><text xml:space="preserve" x="420.0" y="214.9" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="15" fill="#343a40">not notified 400</text><text xml:space="preserve" x="290.0" y="285.0" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" font-weight="400" fill="#343a40">Engaged users are four times more likely to be notified.</text><text xml:space="preserve" x="290.0" y="310.0" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" font-weight="400" fill="#343a40">Notified group: 400 engaged + 100 others.</text><text xml:space="preserve" x="290.0" y="335.0" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" font-weight="400" fill="#343a40">Not notified: 100 engaged + 400 others.</text><rect x="580" y="90" width="560" height="300" rx="14" fill="#fff4e6" fill-opacity="0.35" stroke="#e8590c" stroke-width="2" stroke-dasharray="9 6"/><text xml:space="preserve" x="860.0" y="116" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="16" font-weight="700" fill="#c2410c">Step 2: average spend in each cell</text><rect x="600" y="135" width="530" height="46" rx="6" fill="#e8590c"/><text xml:space="preserve" x="608" y="157.0" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="15" font-weight="700" fill="#ffffff"></text><text xml:space="preserve" x="798" y="157.0" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="15" font-weight="700" fill="#ffffff">notified</text><text xml:space="preserve" x="968" y="157.0" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="15" font-weight="700" fill="#ffffff">not notified</text><line x1="600" y1="181" x2="1130" y2="181" stroke="#dee2e6"/><text xml:space="preserve" x="608" y="203.0" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="15" font-weight="400" fill="#343a40">engaged</text><text xml:space="preserve" x="798" y="203.0" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="15" font-weight="400" fill="#343a40">16</text><text xml:space="preserve" x="968" y="203.0" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="15" font-weight="400" fill="#343a40">14</text><line x1="600" y1="227" x2="1130" y2="227" stroke="#dee2e6"/><rect x="600" y="227" width="530" height="46" fill="#fff4e6"/><text xml:space="preserve" x="608" y="249.0" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="15" font-weight="400" fill="#343a40">others</text><text xml:space="preserve" x="798" y="249.0" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="15" font-weight="400" fill="#343a40">12</text><text xml:space="preserve" x="968" y="249.0" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="15" font-weight="400" fill="#343a40">10</text><line x1="600" y1="273" x2="1130" y2="273" stroke="#dee2e6"/><text xml:space="preserve" x="860.0" y="320.0" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="14" font-weight="700" fill="#c2410c">Inside each row the gap is 2.</text><text xml:space="preserve" x="860.0" y="345.0" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="14" font-weight="700" fill="#c2410c">That is the true effect.</text><rect x="20" y="410" width="1120" height="170" rx="14" fill="#f3f0ff" fill-opacity="0.35" stroke="#7048e8" stroke-width="2" stroke-dasharray="9 6"/><text xml:space="preserve" x="580.0" y="436" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="16" font-weight="700" fill="#5f3dc4">Step 3: the two ways to compare</text><rect x="40" y="450" width="540" height="110" rx="9" fill="#fff5f5" stroke="#e03131" stroke-width="1.6"/><rect x="38.6" y="449.8" width="538.7" height="108.8" rx="10" fill="none" stroke="#e03131" stroke-width="1.1" stroke-opacity="0.45"/><text xml:space="preserve" x="52" y="476.4" text-anchor="start" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="15" font-weight="700" fill="#c92a2a">Naive: notified minus not notified</text><text xml:space="preserve" x="52" y="502.7" text-anchor="start" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="14" fill="#343a40">notified: (400 x 16 + 100 x 12) / 500 = 15.2</text><text xml:space="preserve" x="52" y="523.0" text-anchor="start" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="14" fill="#343a40">not notified: (100 x 14 + 400 x 10) / 500 = 10.8</text><text xml:space="preserve" x="52" y="543.3" text-anchor="start" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="14" fill="#343a40">gap = 4.4</text><rect x="600" y="450" width="520" height="110" rx="9" fill="#ebfbee" stroke="#2f9e44" stroke-width="1.6"/><rect x="599.8" y="451.0" width="518.9" height="109.2" rx="10" fill="none" stroke="#2f9e44" stroke-width="1.1" stroke-opacity="0.45"/><text xml:space="preserve" x="612" y="476.4" text-anchor="start" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="15" font-weight="700" fill="#2b8a3e">Adjusted: compare inside each row, then average</text><text xml:space="preserve" x="612" y="502.7" text-anchor="start" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="14" fill="#343a40">engaged: 16 - 14 = 2</text><text xml:space="preserve" x="612" y="523.0" text-anchor="start" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="14" fill="#343a40">others: 12 - 10 = 2</text><text xml:space="preserve" x="612" y="543.3" text-anchor="start" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="14" fill="#343a40">average of 2 and 2 = 2.0</text></svg>

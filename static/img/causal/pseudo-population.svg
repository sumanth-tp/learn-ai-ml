<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 600" width="1160" height="600" role="img" aria-label="Inverse-probability weights build a randomised-looking crowd"><defs></defs><rect x="0" y="0" width="1160" height="600" rx="18" fill="#fffdf7"/><text xml:space="preserve" x="580.0" y="44" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="24" font-weight="700" fill="#1864ab">Inverse-probability weights build a randomised-looking crowd</text><text xml:space="preserve" x="580.0" y="70" text-anchor="middle" font-family="'Inter','Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="14" fill="#868e96">Same 1,000 users as the worked example: each user counts for 1 divided by the chance of the treatment they got</text><rect x="20" y="90" width="760" height="400" rx="14" fill="#e7f5ff" fill-opacity="0.35" stroke="#1c7ed6" stroke-width="2" stroke-dasharray="9 6"/><text xml:space="preserve" x="400.0" y="116" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="16" font-weight="700" fill="#1864ab">Counts, weights and weighted counts</text><rect x="40" y="140" width="350" height="140" rx="9" fill="#ebfbee" stroke="#2f9e44" stroke-width="1.6"/><rect x="39.5" y="139.0" width="350.5" height="138.7" rx="10" fill="none" stroke="#2f9e44" stroke-width="1.1" stroke-opacity="0.45"/><text xml:space="preserve" x="215.0" y="179.6" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="16" font-weight="700" fill="#2b8a3e">Engaged, notified</text><text xml:space="preserve" x="215.0" y="207.3" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="15" fill="#343a40">400 users x weight 1.25</text><text xml:space="preserve" x="215.0" y="229.1" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="15" fill="#343a40">= 500 weighted</text><text xml:space="preserve" x="215.0" y="250.8" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="15" fill="#343a40">mean spend 16</text><rect x="410" y="140" width="350" height="140" rx="9" fill="#e3fafc" stroke="#0c8599" stroke-width="1.6"/><rect x="410.1" y="139.6" width="348.7" height="140.0" rx="10" fill="none" stroke="#0c8599" stroke-width="1.1" stroke-opacity="0.45"/><text xml:space="preserve" x="585.0" y="179.6" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="16" font-weight="700" fill="#0b7285">Engaged, not notified</text><text xml:space="preserve" x="585.0" y="207.3" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="15" fill="#343a40">100 users x weight 5</text><text xml:space="preserve" x="585.0" y="229.1" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="15" fill="#343a40">= 500 weighted</text><text xml:space="preserve" x="585.0" y="250.8" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="15" fill="#343a40">mean spend 14</text><rect x="40" y="310" width="350" height="140" rx="9" fill="#fff4e6" stroke="#e8590c" stroke-width="1.6"/><rect x="38.6" y="309.8" width="348.7" height="138.8" rx="10" fill="none" stroke="#e8590c" stroke-width="1.1" stroke-opacity="0.45"/><text xml:space="preserve" x="215.0" y="349.6" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="16" font-weight="700" fill="#c2410c">Others, notified</text><text xml:space="preserve" x="215.0" y="377.3" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="15" fill="#343a40">100 users x weight 5</text><text xml:space="preserve" x="215.0" y="399.1" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="15" fill="#343a40">= 500 weighted</text><text xml:space="preserve" x="215.0" y="420.8" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="15" fill="#343a40">mean spend 12</text><rect x="410" y="310" width="350" height="140" rx="9" fill="#fff9db" stroke="#e8a300" stroke-width="1.6"/><rect x="409.8" y="311.0" width="348.9" height="139.2" rx="10" fill="none" stroke="#e8a300" stroke-width="1.1" stroke-opacity="0.45"/><text xml:space="preserve" x="585.0" y="349.6" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="16" font-weight="700" fill="#b35c00">Others, not notified</text><text xml:space="preserve" x="585.0" y="377.3" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="15" fill="#343a40">400 users x weight 1.25</text><text xml:space="preserve" x="585.0" y="399.1" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="15" fill="#343a40">= 500 weighted</text><text xml:space="preserve" x="585.0" y="420.8" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="15" fill="#343a40">mean spend 10</text><text xml:space="preserve" x="400.0" y="470.0" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" font-weight="400" fill="#868e96">weight = 1 / P(the treatment the user actually got)</text><rect x="810" y="90" width="330" height="400" rx="14" fill="#f3f0ff" fill-opacity="0.35" stroke="#7048e8" stroke-width="2" stroke-dasharray="9 6"/><text xml:space="preserve" x="975.0" y="116" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="16" font-weight="700" fill="#5f3dc4">What the weights achieve</text><rect x="830" y="140" width="290" height="100" rx="9" fill="#e7f5ff" stroke="#1c7ed6" stroke-width="1.6"/><rect x="830.4" y="141.3" width="290.2" height="99.7" rx="10" fill="none" stroke="#1c7ed6" stroke-width="1.1" stroke-opacity="0.45"/><text xml:space="preserve" x="975.0" y="171.6" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="15" font-weight="700" fill="#1864ab">Weighted notified</text><text xml:space="preserve" x="975.0" y="197.9" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="14" fill="#343a40">(500 x 16 + 500 x 12) / 1000</text><text xml:space="preserve" x="975.0" y="218.2" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="14" fill="#343a40">= 14.0</text><rect x="830" y="260" width="290" height="100" rx="9" fill="#e7f5ff" stroke="#1c7ed6" stroke-width="1.6"/><rect x="831.4" y="258.6" width="291.1" height="99.4" rx="10" fill="none" stroke="#1c7ed6" stroke-width="1.1" stroke-opacity="0.45"/><text xml:space="preserve" x="975.0" y="291.6" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="15" font-weight="700" fill="#1864ab">Weighted not notified</text><text xml:space="preserve" x="975.0" y="317.9" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="14" fill="#343a40">(500 x 14 + 500 x 10) / 1000</text><text xml:space="preserve" x="975.0" y="338.2" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="14" fill="#343a40">= 12.0</text><rect x="830" y="380" width="290" height="90" rx="9" fill="#ebfbee" stroke="#2f9e44" stroke-width="1.6"/><rect x="828.9" y="378.9" width="289.4" height="90.9" rx="10" fill="none" stroke="#2f9e44" stroke-width="1.1" stroke-opacity="0.45"/><text xml:space="preserve" x="975.0" y="405.4" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="16" font-weight="700" fill="#2b8a3e">Weighted effect</text><text xml:space="preserve" x="975.0" y="433.2" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="15" fill="#343a40">14.0 - 12.0 = 2.0</text><text xml:space="preserve" x="975.0" y="454.9" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="15" fill="#343a40">the truth</text><rect x="20" y="510" width="1120" height="70" rx="9" fill="#fff9db" stroke="#e8a300" stroke-width="1.6"/><rect x="19.0" y="510.2" width="1120.4" height="69.6" rx="10" fill="none" stroke="#e8a300" stroke-width="1.1" stroke-opacity="0.45"/><text xml:space="preserve" x="580.0" y="536.7" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="15" font-weight="700" fill="#b35c00">Why it works</text><text xml:space="preserve" x="580.0" y="563.0" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="14" fill="#343a40">each row of the crowd now has 500 notified and 500 not notified, so engagement no longer predicts treatment</text></svg>

 fill="#b35c00">The warning sign</text><text xml:space="preserve" x="920.0" y="337.3" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="15" fill="#343a40">pre-period trend gap 0.426 per period</text><text xml:space="preserve" x="920.0" y="359.1" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="15" fill="#343a40">p = 0.0001</text><text xml:space="preserve" x="920.0" y="380.8" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="15" fill="#343a40">visible before the rollout</text><rect x="720" y="430" width="400" height="120" rx="9" fill="#f3f0ff" stroke="#7048e8" stroke-width="1.6"/><rect x="719.8" y="431.0" width="398.9" height="119.2" rx="10" fill="none" stroke="#7048e8" stroke-width="1.1" stroke-opacity="0.45"/><text xml:space="preserve" x="920.0" y="451.3" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="15" font-weight="700" fill="#5f3dc4">The rule</text><text xml:space="preserve" x="920.0" y="477.6" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="14" fill="#343a40">estimate = true effect + extra trend gained</text><text xml:space="preserve" x="920.0" y="497.9" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="14" fill="#343a40">over the gap between before and after</text><text xml:space="preserve" x="920.0" y="518.2" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="14" fill="#343a40">0.4 x 4 periods = 1.6, so 4.6 expected,</text><text xml:space="preserve" x="920.0" y="538.5" text-anchor="middle" 
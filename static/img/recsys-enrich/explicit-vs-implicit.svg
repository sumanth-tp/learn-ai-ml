ext-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="15" font-weight="700" fill="#b35c00">The rating model is more accurate and worse at ranking</text><text xml:space="preserve" x="310.0" y="423.5" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" fill="#343a40">RMSE: explicit ALS 0.999, item-mean 1.074</text><text xml:space="preserve" x="310.0" y="442.3" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" fill="#343a40">precision@10: explicit ALS 0.049 vs popularity 0.079</text><text xml:space="preserve" x="310.0" y="461.2" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" fill="#343a40">implicit ALS covers 0.432 of the catalogue</text><rect x="630" y="100" width="500" height="175" rx="9" fill="#f3f0ff" stroke="#7048e8" stroke-width="1.6"/><rect x="628.6" y="99.8" width="498.7" height="173.8" rx="10" fill="none" stroke="#7048e8" stroke-width="1.1" stroke-opacity="0.45"/><text xml:space="preserve" x="880.0" y="151.7" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="15" font-weight="700" fill="#5f3dc4">Position bias in a simulated log</text><text xml:space="preserve" x="880.0" y="176.5" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" fill="#343a40">200 items, 10 slots, examination 1 / position</text><text xml:space="preserve" x="880.0" y="195.4" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" fill="#343a40">naive click rate vs true appeal: 0.787</text><text xml:space="preserve" x="880.0" y="214.2" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" fill="#343a40">divided by exposure: 0.931</text><text xml:space="preserve" x="880.0" y="233.1" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" fill="#343a40">true top 20 found: 12 naive, 15 corrected</text><rect x="630" y="305" width="500" height="185" rx="9" fill="#fff5f5" stroke="#e03131" stroke-width="1.6"/><rect x="629.8" y="306.0" width="498.9" height="184.2" rx="10" fill="none" stroke="#e03131" stroke-width="1.1" stroke-opacity="0.45"/><text xml:space="preserve" x="880.0" y="371.1" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="15" font-weight="700" fill="#c92a2a">Exposure also hides items</text><text xml:space="preserve" x="880.0" y="396.0" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" fill="#343a40">100 of 200 items were never shown</text><text xml:space="preserve" x="880.0" y="414.8" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" fill="#343a40">3 of the true top 20 among them</text><text xml:space="preserve" x="880.0" y="433.7" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" fill="#343a40">no correction can score an item with zero impressions</text></svg>

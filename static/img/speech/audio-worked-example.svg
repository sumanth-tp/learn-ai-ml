<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 600" width="1240" height="600" role="img" aria-label="Worked example: three tiny calculations"><defs></defs><rect x="0" y="0" width="1240" height="600" rx="18" fill="#fffdf7"/><text xml:space="preserve" x="620.0" y="44" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="24" font-weight="700" fill="#1864ab">Worked example: three tiny calculations</text><text xml:space="preserve" x="620.0" y="70" text-anchor="middle" font-family="'Inter','Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="14" fill="#868e96">Every number below is reproduced by the first and third code blocks</text><rect x="20" y="90" width="400" height="490" rx="14" fill="#e7f5ff" fill-opacity="0.35" stroke="#1c7ed6" stroke-width="2" stroke-dasharray="9 6"/><text xml:space="preserve" x="220.0" y="116" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="16" font-weight="700" fill="#1864ab">Eight samples, by hand</text><rect x="40" y="135" width="340" height="30" rx="6" fill="#1c7ed6"/><text xml:space="preserve" x="48" y="155.0" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" font-weight="700" fill="#ffffff">n</text><text xml:space="preserve" x="138" y="155.0" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" font-weight="700" fill="#ffffff">x[n]</text><text xml:space="preserve" x="218" y="155.0" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" font-weight="700" fill="#ffffff">n</text><text xml:space="preserve" x="298" y="155.0" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" font-weight="700" fill="#ffffff">x[n]</text><line x1="40" y1="165" x2="380" y2="165" stroke="#dee2e6"/><text xml:space="preserve" x="48" y="185.0" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" font-weight="400" fill="#343a40">0</text><text xml:space="preserve" x="138" y="185.0" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" font-weight="400" fill="#343a40">0</text><text xml:space="preserve" x="218" y="185.0" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" font-weight="400" fill="#343a40">4</text><text xml:space="preserve" x="298" y="185.0" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" font-weight="400" fill="#343a40">0</text><line x1="40" y1="195" x2="380" y2="195" stroke="#dee2e6"/><rect x="40" y="195" width="340" height="30" fill="#e7f5ff"/><text xml:space="preserve" x="48" y="215.0" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" font-weight="400" fill="#343a40">1</text><text xml:space="preserve" x="138" y="215.0" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" font-weight="400" fill="#343a40">1</text><text xml:space="preserve" x="218" y="215.0" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" font-weight="400" fill="#343a40">5</text><text xml:space="preserve" x="298" y="215.0" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" font-weight="400" fill="#343a40">1</text><line x1="40" y1="225" x2="380" y2="225" stroke="#dee2e6"/><text xml:space="preserve" x="48" y="245.0" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" font-weight="400" fill="#343a40">2</text><text xml:space="preserve" x="138" y="245.0" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" font-weight="400" fill="#343a40">0</text><text xml:space="preserve" x="218" y="245.0" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" font-weight="400" fill="#343a40">6</text><text xml:space="preserve" x="298" y="245.0" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" font-weight="400" fill="#343a40">0</text><line x1="40" y1="255" x2="380" y2="255" stroke="#dee2e6"/><rect x="40" y="255" width="340" height="30" fill="#e7f5ff"/><text xml:space="preserve" x="48" y="275.0" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" font-weight="400" fill="#343a40">3</text><text xml:space="preserve" x="138" y="275.0" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" font-weight="400" fill="#343a40">-1</text><text xml:space="preserve" x="218" y="275.0" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" font-weight="400" fill="#343a40">7</text><text xml:space="preserve" x="298" y="275.0" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" font-weight="400" fill="#343a40">-1</text><line x1="40" y1="285" x2="380" y2="285" stroke="#dee2e6"/><text xml:space="preserve" x="220.0" y="320.0" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" font-weight="400" fill="#343a40">Pattern repeats every 4 samples,</text><text xml:space="preserve" x="220.0" y="340.0" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" font-weight="400" fill="#343a40">so it fits 2 cycles in 8 samples.</text><text xml:space="preserve" x="220.0" y="375.0" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" font-weight="400" fill="#343a40">Bin k = 2 multiplies by a 2-cycle wave:</text><text xml:space="preserve" x="220.0" y="400.0" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="18" font-weight="700" fill="#1864ab">|X[2]| = 4</text><text xml:space="preserve" x="220.0" y="435.0" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" font-weight="400" fill="#343a40">All other bins add to zero.</text><text xml:space="preserve" x="220.0" y="460.0" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" font-weight="700" fill="#2b8a3e">numpy agrees: [0, 0, 4, 0, 0]</text><rect x="40" y="495" width="360" height="70" rx="9" fill="#fff9db" stroke="#e8a300" stroke-width="1.6"/><rect x="39.5" y="494.0" width="360.5" height="68.7" rx="10" fill="none" stroke="#e8a300" stroke-width="1.1" stroke-opacity="0.45"/><text xml:space="preserve" x="220.0" y="514.1" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="14" font-weight="700" fill="#b35c00">Idea</text><text xml:space="preserve" x="220.0" y="537.5" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" fill="#343a40">a bin measures how well the</text><text xml:space="preserve" x="220.0" y="554.9" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" fill="#343a40">signal matches one cycle count</text><rect x="440" y="90" width="380" height="490" rx="14" fill="#fff5f5" fill-opacity="0.35" stroke="#e03131" stroke-width="2" stroke-dasharray="9 6"/><text xml:space="preserve" x="630.0" y="116" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="16" font-weight="700" fill="#c92a2a">Aliasing: a 700 Hz tone</text><rect x="460" y="135" width="340" height="32" rx="6" fill="#e03131"/><text xml:space="preserve" x="468" y="155.0" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" font-weight="700" fill="#ffffff">rate</text><text xml:space="preserve" x="568" y="155.0" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" font-weight="700" fill="#ffffff">Nyquist</text><text xml:space="preserve" x="668" y="155.0" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" font-weight="700" fill="#ffffff">seen at</text><line x1="460" y1="167" x2="800" y2="167" stroke="#dee2e6"/><text xml:space="preserve" x="468" y="187.0" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" font-weight="400" fill="#343a40">16000</text><text xml:space="preserve" x="568" y="187.0" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" font-weight="400" fill="#343a40">8000</text><text xml:space="preserve" x="668" y="187.0" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" font-weight="400" fill="#343a40">700 Hz</text><line x1="460" y1="199" x2="800" y2="199" stroke="#dee2e6"/><rect x="460" y="199" width="340" height="32" fill="#fff5f5"/><text xml:space="preserve" x="468" y="219.0" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" font-weight="400" fill="#343a40">4000</text><text xml:space="preserve" x="568" y="219.0" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" font-weight="400" fill="#343a40">2000</text><text xml:space="preserve" x="668" y="219.0" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" font-weight="400" fill="#343a40">700 Hz</text><line x1="460" y1="231" x2="800" y2="231" stroke="#dee2e6"/><text xml:space="preserve" x="468" y="251.0" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" font-weight="400" fill="#343a40">1000</text><text xml:space="preserve" x="568" y="251.0" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" font-weight="400" fill="#343a40">500</text><text xml:space="preserve" x="668" y="251.0" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" font-weight="400" fill="#343a40">300 Hz</text><line x1="460" y1="263" x2="800" y2="263" stroke="#dee2e6"/><rect x="460" y="263" width="340" height="32" fill="#fff5f5"/><text xml:space="preserve" x="468" y="283.0" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" font-weight="400" fill="#343a40">800</text><text xml:space="preserve" x="568" y="283.0" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" font-weight="400" fill="#343a40">400</text><text xml:space="preserve" x="668" y="283.0" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" font-weight="400" fill="#343a40">100 Hz</text><line x1="460" y1="295" x2="800" y2="295" stroke="#dee2e6"/><text xml:space="preserve" x="630.0" y="340.0" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" font-weight="400" fill="#343a40">Above Nyquist the tone folds back:</text><text xml:space="preserve" x="630.0" y="365.0" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="15" font-weight="700" fill="#c92a2a">1000 - 700 = 300</text><text xml:space="preserve" x="630.0" y="392.0" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="15" font-weight="700" fill="#c92a2a">800 - 700 = 100</text><text xml:space="preserve" x="630.0" y="430.0" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" font-weight="400" fill="#343a40">A 7000 Hz tone at 8000 Hz</text><text xml:space="preserve" x="630.0" y="450.0" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" font-weight="400" fill="#343a40">lands at 8000 - 7000 = 1000 Hz.</text><rect x="460" y="495" width="340" height="70" rx="9" fill="#fff9db" stroke="#e8a300" stroke-width="1.6"/><rect x="460.1" y="494.6" width="338.7" height="70.0" rx="10" fill="none" stroke="#e8a300" stroke-width="1.1" stroke-opacity="0.45"/><text xml:space="preserve" x="630.0" y="514.1" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="14" font-weight="700" fill="#b35c00">Rule</text><text xml:space="preserve" x="630.0" y="537.5" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" fill="#343a40">keep the rate above twice the</text><text xml:space="preserve" x="630.0" y="554.9" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" fill="#343a40">highest frequency you care about</text><rect x="840" y="90" width="380" height="490" rx="14" fill="#fff4e6" fill-opacity="0.35" stroke="#e8590c" stroke-width="2" stroke-dasharray="9 6"/><text xml:space="preserve" x="1030.0" y="116" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="16" font-weight="700" fill="#c2410c">Mel: where the filters sit</text><rect x="860" y="135" width="340" height="34" rx="6" fill="#e8590c"/><text xml:space="preserve" x="868" y="155.0" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" font-weight="700" fill="#ffffff">Hz</text><text xml:space="preserve" x="988" y="155.0" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" font-weight="700" fill="#ffffff">mel</text><text xml:space="preserve" x="1098" y="155.0" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" font-weight="700" fill="#ffffff">share</text><line x1="860" y1="169" x2="1200" y2="169" stroke="#dee2e6"/><text xml:space="preserve" x="868" y="189.0" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" font-weight="400" fill="#343a40">0 to 1000</text><text xml:space="preserve" x="988" y="189.0" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" font-weight="400" fill="#343a40">0 to 15</text><text xml:space="preserve" x="1098" y="189.0" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" font-weight="400" fill="#343a40">33%</text><line x1="860" y1="203" x2="1200" y2="203" stroke="#dee2e6"/><rect x="860" y="203" width="340" height="34" fill="#fff4e6"/><text xml:space="preserve" x="868" y="223.0" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" font-weight="400" fill="#343a40">1000 to 4000</text><text xml:space="preserve" x="988" y="223.0" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" font-weight="400" fill="#343a40">15 to 35.2</text><text xml:space="preserve" x="1098" y="223.0" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" font-weight="400" fill="#343a40">45%</text><line x1="860" y1="237" x2="1200" y2="237" stroke="#dee2e6"/><text xml:space="preserve" x="868" y="257.0" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" font-weight="400" fill="#343a40">4000 to 8000</text><text xml:space="preserve" x="988" y="257.0" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" font-weight="400" fill="#343a40">35.2 to 45.2</text><text xml:space="preserve" x="1098" y="257.0" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" font-weight="400" fill="#343a40">22%</text><line x1="860" y1="271" x2="1200" y2="271" stroke="#dee2e6"/><text xml:space="preserve" x="1030.0" y="320.0" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" font-weight="400" fill="#343a40">below 1000 Hz: mel = Hz / 66.7</text><text xml:space="preserve" x="1030.0" y="340.0" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" font-weight="400" fill="#343a40">above: 15 + ln(Hz / 1000) / 0.0688</text><text xml:space="preserve" x="1030.0" y="385.0" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" font-weight="400" fill="#343a40">One third of the scale sits</text><text xml:space="preserve" x="1030.0" y="405.0" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" font-weight="400" fill="#343a40">under 1 kHz, so 26 of the</text><text xml:space="preserve" x="1030.0" y="425.0" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" font-weight="400" fill="#343a40">80 filters are packed there.</text><text xml:space="preserve" x="1030.0" y="460.0" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" font-weight="700" fill="#c2410c">(15 / 45.24) x 80 = 26.5</text><rect x="860" y="495" width="340" height="70" rx="9" fill="#fff9db" stroke="#e8a300" stroke-width="1.6"/><rect x="858.6" y="494.8" width="338.7" height="68.8" rx="10" fill="none" stroke="#e8a300" stroke-width="1.1" stroke-opacity="0.45"/><text xml:space="preserve" x="1030.0" y="514.1" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="14" font-weight="700" fill="#b35c00">Idea</text><text xml:space="preserve" x="1030.0" y="537.5" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" fill="#343a40">ears resolve low pitch finely</text><text xml:space="preserve" x="1030.0" y="554.9" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" fill="#343a40">and high pitch coarsely</text></svg>

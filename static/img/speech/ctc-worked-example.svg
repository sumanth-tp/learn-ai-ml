<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 600" width="1240" height="600" role="img" aria-label="Worked example: how CTC scores the word ab"><defs></defs><rect x="0" y="0" width="1240" height="600" rx="18" fill="#fffdf7"/><text xml:space="preserve" x="620.0" y="44" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="24" font-weight="700" fill="#1864ab">Worked example: how CTC scores the word ab</text><text xml:space="preserve" x="620.0" y="70" text-anchor="middle" font-family="'Inter','Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="14" fill="#868e96">Three frames, three symbols (blank, a, b). The code prints the same 0.4680</text><rect x="20" y="90" width="380" height="300" rx="14" fill="#e7f5ff" fill-opacity="0.35" stroke="#1c7ed6" stroke-width="2" stroke-dasharray="9 6"/><text xml:space="preserve" x="210.0" y="116" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="16" font-weight="700" fill="#1864ab">Step 1: what the network says</text><rect x="40" y="135" width="340" height="36" rx="6" fill="#1c7ed6"/><text xml:space="preserve" x="48" y="156.0" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="14" font-weight="700" fill="#ffffff">frame</text><text xml:space="preserve" x="148" y="156.0" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="14" font-weight="700" fill="#ffffff">_</text><text xml:space="preserve" x="228" y="156.0" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="14" font-weight="700" fill="#ffffff">a</text><text xml:space="preserve" x="308" y="156.0" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="14" font-weight="700" fill="#ffffff">b</text><line x1="40" y1="171" x2="380" y2="171" stroke="#dee2e6"/><text xml:space="preserve" x="48" y="192.0" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="14" font-weight="400" fill="#343a40">1</text><text xml:space="preserve" x="148" y="192.0" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="14" font-weight="400" fill="#343a40">0.1</text><text xml:space="preserve" x="228" y="192.0" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="14" font-weight="400" fill="#343a40">0.6</text><text xml:space="preserve" x="308" y="192.0" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="14" font-weight="400" fill="#343a40">0.3</text><line x1="40" y1="207" x2="380" y2="207" stroke="#dee2e6"/><rect x="40" y="207" width="340" height="36" fill="#e7f5ff"/><text xml:space="preserve" x="48" y="228.0" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="14" font-weight="400" fill="#343a40">2</text><text xml:space="preserve" x="148" y="228.0" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="14" font-weight="400" fill="#343a40">0.2</text><text xml:space="preserve" x="228" y="228.0" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="14" font-weight="400" fill="#343a40">0.3</text><text xml:space="preserve" x="308" y="228.0" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="14" font-weight="400" fill="#343a40">0.5</text><line x1="40" y1="243" x2="380" y2="243" stroke="#dee2e6"/><text xml:space="preserve" x="48" y="264.0" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="14" font-weight="400" fill="#343a40">3</text><text xml:space="preserve" x="148" y="264.0" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="14" font-weight="400" fill="#343a40">0.3</text><text xml:space="preserve" x="228" y="264.0" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="14" font-weight="400" fill="#343a40">0.1</text><text xml:space="preserve" x="308" y="264.0" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="14" font-weight="400" fill="#343a40">0.6</text><line x1="40" y1="279" x2="380" y2="279" stroke="#dee2e6"/><text xml:space="preserve" x="210.0" y="305.0" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" font-weight="400" fill="#343a40">Each row sums to 1.</text><text xml:space="preserve" x="210.0" y="328.0" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" font-weight="400" fill="#343a40">Greedy: pick the best per frame.</text><rect x="420" y="90" width="400" height="300" rx="14" fill="#fff4e6" fill-opacity="0.35" stroke="#e8590c" stroke-width="2" stroke-dasharray="9 6"/><text xml:space="preserve" x="620.0" y="116" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="16" font-weight="700" fill="#c2410c">Step 2: paths that collapse to ab</text><rect x="440" y="135" width="360" height="34" rx="6" fill="#e8590c"/><text xml:space="preserve" x="448" y="155.0" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" font-weight="700" fill="#ffffff">path</text><text xml:space="preserve" x="548" y="155.0" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" font-weight="700" fill="#ffffff">product</text><text xml:space="preserve" x="698" y="155.0" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" font-weight="700" fill="#ffffff">probability</text><line x1="440" y1="169" x2="800" y2="169" stroke="#dee2e6"/><text xml:space="preserve" x="448" y="189.0" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" font-weight="400" fill="#343a40">a a b</text><text xml:space="preserve" x="548" y="189.0" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" font-weight="400" fill="#343a40">0.6 x 0.3 x 0.6</text><text xml:space="preserve" x="698" y="189.0" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" font-weight="400" fill="#343a40">0.1080</text><line x1="440" y1="203" x2="800" y2="203" stroke="#dee2e6"/><rect x="440" y="203" width="360" height="34" fill="#fff4e6"/><text xml:space="preserve" x="448" y="223.0" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" font-weight="400" fill="#343a40">a b b</text><text xml:space="preserve" x="548" y="223.0" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" font-weight="400" fill="#343a40">0.6 x 0.5 x 0.6</text><text xml:space="preserve" x="698" y="223.0" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" font-weight="400" fill="#343a40">0.1800</text><line x1="440" y1="237" x2="800" y2="237" stroke="#dee2e6"/><text xml:space="preserve" x="448" y="257.0" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" font-weight="400" fill="#343a40">a b _</text><text xml:space="preserve" x="548" y="257.0" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" font-weight="400" fill="#343a40">0.6 x 0.5 x 0.3</text><text xml:space="preserve" x="698" y="257.0" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" font-weight="400" fill="#343a40">0.0900</text><line x1="440" y1="271" x2="800" y2="271" stroke="#dee2e6"/><rect x="440" y="271" width="360" height="34" fill="#fff4e6"/><text xml:space="preserve" x="448" y="291.0" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" font-weight="400" fill="#343a40">a _ b</text><text xml:space="preserve" x="548" y="291.0" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" font-weight="400" fill="#343a40">0.6 x 0.2 x 0.6</text><text xml:space="preserve" x="698" y="291.0" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" font-weight="400" fill="#343a40">0.0720</text><line x1="440" y1="305" x2="800" y2="305" stroke="#dee2e6"/><text xml:space="preserve" x="448" y="325.0" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" font-weight="400" fill="#343a40">_ a b</text><text xml:space="preserve" x="548" y="325.0" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" font-weight="400" fill="#343a40">0.1 x 0.3 x 0.6</text><text xml:space="preserve" x="698" y="325.0" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" font-weight="400" fill="#343a40">0.0180</text><line x1="440" y1="339" x2="800" y2="339" stroke="#dee2e6"/><text xml:space="preserve" x="620.0" y="365.0" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" font-weight="400" fill="#343a40">Repeats merge, then blanks go.</text><rect x="840" y="90" width="380" height="300" rx="14" fill="#ebfbee" fill-opacity="0.35" stroke="#2f9e44" stroke-width="2" stroke-dasharray="9 6"/><text xml:space="preserve" x="1030.0" y="116" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="16" font-weight="700" fill="#2b8a3e">Step 3: add them up</text><text xml:space="preserve" x="1030.0" y="150.0" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="14" font-weight="400" fill="#343a40">0.1080 + 0.1800 + 0.0900</text><text xml:space="preserve" x="1030.0" y="175.0" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="14" font-weight="400" fill="#343a40">+ 0.0720 + 0.0180</text><text xml:space="preserve" x="1030.0" y="215.0" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="20" font-weight="700" fill="#2b8a3e">P(ab) = 0.4680</text><text xml:space="preserve" x="1030.0" y="260.0" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="15" font-weight="700" fill="#343a40">loss = -ln 0.4680 = 0.7593</text><text xml:space="preserve" x="1030.0" y="300.0" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="14" font-weight="700" fill="#1864ab">torch ctc_loss: 0.7593</text><text xml:space="preserve" x="1030.0" y="325.0" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="14" font-weight="700" fill="#1864ab">forward algorithm: 0.4680</text><rect x="20" y="420" width="590" height="160" rx="9" fill="#fff9db" stroke="#e8a300" stroke-width="1.6"/><rect x="19.5" y="419.0" width="590.5" height="158.7" rx="10" fill="none" stroke="#e8a300" stroke-width="1.1" stroke-opacity="0.45"/><text xml:space="preserve" x="32" y="464.2" text-anchor="start" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="15" font-weight="700" fill="#b35c00">Why it works</text><text xml:space="preserve" x="32" y="489.0" text-anchor="start" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" fill="#343a40">Training does not need to know which frame holds which letter.</text><text xml:space="preserve" x="32" y="507.9" text-anchor="start" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" fill="#343a40">It adds up every alignment that spells the right answer</text><text xml:space="preserve" x="32" y="526.7" text-anchor="start" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" fill="#343a40">and pushes that total up. The forward algorithm does the</text><text xml:space="preserve" x="32" y="545.6" text-anchor="start" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" fill="#343a40">sum with a small table instead of listing 3 x 3 x 3 paths.</text><rect x="630" y="420" width="590" height="160" rx="9" fill="#f3f0ff" stroke="#7048e8" stroke-width="1.6"/><rect x="630.1" y="419.6" width="588.7" height="160.0" rx="10" fill="none" stroke="#7048e8" stroke-width="1.1" stroke-opacity="0.45"/><text xml:space="preserve" x="642" y="464.2" text-anchor="start" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="15" font-weight="700" fill="#5f3dc4">Greedy decoding</text><text xml:space="preserve" x="642" y="489.0" text-anchor="start" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" fill="#343a40">Best symbol per frame: a, b, b.</text><text xml:space="preserve" x="642" y="507.9" text-anchor="start" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" fill="#343a40">Collapse: ab. Correct here, and its path probability</text><text xml:space="preserve" x="642" y="526.7" text-anchor="start" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" fill="#343a40">0.1800 is only 38 per cent of the total 0.4680.</text><text xml:space="preserve" x="642" y="545.6" text-anchor="start" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" fill="#343a40">The best path is not always the best word.</text></svg>

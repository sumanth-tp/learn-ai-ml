<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 620" width="1240" height="620" role="img" aria-label="Text to speech in two stages"><defs><marker id="ah343a40" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#343a40"/></marker><marker id="ah343a40s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#343a40"/></marker></defs><rect x="0" y="0" width="1240" height="620" rx="18" fill="#fffdf7"/><text xml:space="preserve" x="620.0" y="44" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="24" font-weight="700" fill="#1864ab">Text to speech in two stages</text><text xml:space="preserve" x="620.0" y="70" text-anchor="middle" font-family="'Inter','Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="14" fill="#868e96">SpeechT5 writes a mel spectrogram, HiFi-GAN turns it into a waveform; figures are from the first test sentence</text><rect x="20" y="120" width="210" height="120" rx="9" fill="#e7f5ff" stroke="#1c7ed6" stroke-width="1.6"/><rect x="19.5" y="119.0" width="210.5" height="118.7" rx="10" fill="none" stroke="#1c7ed6" stroke-width="1.1" stroke-opacity="0.45"/><text xml:space="preserve" x="125.0" y="155.4" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="14" font-weight="700" fill="#1864ab">1. text</text><text xml:space="preserve" x="125.0" y="178.8" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" fill="#343a40">The quick brown fox</text><text xml:space="preserve" x="125.0" y="196.2" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" fill="#343a40">jumps over the lazy dog.</text><text xml:space="preserve" x="125.0" y="213.7" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" fill="#343a40">turned into token ids</text><rect x="270" y="120" width="250" height="120" rx="9" fill="#fff4e6" stroke="#e8590c" stroke-width="1.6"/><rect x="270.1" y="119.6" width="248.7" height="120.0" rx="10" fill="none" stroke="#e8590c" stroke-width="1.1" stroke-opacity="0.45"/><text xml:space="preserve" x="395.0" y="146.8" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="14" font-weight="700" fill="#c2410c">2. acoustic model</text><text xml:space="preserve" x="395.0" y="170.2" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" fill="#343a40">SpeechT5, 144.4 M parameters</text><text xml:space="preserve" x="395.0" y="187.6" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" fill="#343a40">writes 184 frames x 80 mel</text><text xml:space="preserve" x="395.0" y="205.0" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" fill="#343a40">plus a speaker vector (512)</text><text xml:space="preserve" x="395.0" y="222.4" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" fill="#343a40">0.52 to 0.58 s</text><rect x="560" y="120" width="250" height="120" rx="9" fill="#f3f0ff" stroke="#7048e8" stroke-width="1.6"/><rect x="558.6" y="119.8" width="248.7" height="118.8" rx="10" fill="none" stroke="#7048e8" stroke-width="1.1" stroke-opacity="0.45"/><text xml:space="preserve" x="685.0" y="146.8" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="14" font-weight="700" fill="#5f3dc4">3. vocoder</text><text xml:space="preserve" x="685.0" y="170.2" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" fill="#343a40">HiFi-GAN, 12.7 M parameters</text><text xml:space="preserve" x="685.0" y="187.6" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" fill="#343a40">256 samples per frame</text><text xml:space="preserve" x="685.0" y="205.0" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" fill="#343a40">184 x 256 = 47,104 samples</text><text xml:space="preserve" x="685.0" y="222.4" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" fill="#343a40">0.19 to 0.27 s</text><rect x="850" y="120" width="370" height="120" rx="9" fill="#ebfbee" stroke="#2f9e44" stroke-width="1.6"/><rect x="849.8" y="121.0" width="368.9" height="119.2" rx="10" fill="none" stroke="#2f9e44" stroke-width="1.1" stroke-opacity="0.45"/><text xml:space="preserve" x="1035.0" y="155.4" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="14" font-weight="700" fill="#2b8a3e">4. waveform</text><text xml:space="preserve" x="1035.0" y="178.8" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" fill="#343a40">2.94 s of 16 kHz audio</text><text xml:space="preserve" x="1035.0" y="196.2" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" fill="#343a40">real-time factor 0.24 to 0.29</text><text xml:space="preserve" x="1035.0" y="213.7" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" fill="#343a40">(about 0.7 s of work for 2.94 s)</text><path d="M230.0,180.0 L270.0,180.0" fill="none" stroke="#343a40" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#ah343a40)"/><path d="M520.0,180.0 L560.0,180.0" fill="none" stroke="#343a40" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#ah343a40)"/><path d="M810.0,180.0 L850.0,180.0" fill="none" stroke="#343a40" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#ah343a40)"/><rect x="20" y="290" width="590" height="320" rx="14" fill="#e3fafc" fill-opacity="0.35" stroke="#0c8599" stroke-width="2" stroke-dasharray="9 6"/><text xml:space="preserve" x="315.0" y="316" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="16" font-weight="700" fill="#0b7285">Round trip: speak it, then listen to it</text><rect x="40" y="335" width="570" height="42" rx="6" fill="#0c8599"/><text xml:space="preserve" x="48" y="353.0" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="11" font-weight="700" fill="#ffffff">WER</text><text xml:space="preserve" x="118" y="353.0" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="11" font-weight="700" fill="#ffffff">typed</text><text xml:space="preserve" x="388" y="353.0" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="11" font-weight="700" fill="#ffffff">Whisper base.en heard</text><line x1="40" y1="377" x2="610" y2="377" stroke="#dee2e6"/><text xml:space="preserve" x="48" y="395.0" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="11" font-weight="400" fill="#343a40">0.000</text><text xml:space="preserve" x="118" y="395.0" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="11" font-weight="400" fill="#343a40">The quick brown fox...</text><text xml:space="preserve" x="388" y="395.0" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="11" font-weight="400" fill="#343a40">same words</text><line x1="40" y1="419" x2="610" y2="419" stroke="#dee2e6"/><rect x="40" y="419" width="570" height="42" fill="#e3fafc"/><text xml:space="preserve" x="48" y="437.0" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="11" font-weight="400" fill="#343a40">0.000</text><text xml:space="preserve" x="118" y="437.0" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="11" font-weight="400" fill="#343a40">...two hundred and fifty pounds</text><text xml:space="preserve" x="388" y="437.0" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="11" font-weight="400" fill="#343a40">...250 pounds</text><line x1="40" y1="461" x2="610" y2="461" stroke="#dee2e6"/><text xml:space="preserve" x="48" y="479.0" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="11" font-weight="400" fill="#343a40">0.333</text><text xml:space="preserve" x="118" y="479.0" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="11" font-weight="400" fill="#343a40">at 3 PM on 21 June</text><text xml:space="preserve" x="388" y="479.0" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="11" font-weight="400" fill="#343a40">at come on June</text><line x1="40" y1="503" x2="610" y2="503" stroke="#dee2e6"/><rect x="40" y="503" width="570" height="42" fill="#e3fafc"/><text xml:space="preserve" x="48" y="521.0" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="11" font-weight="400" fill="#343a40">0.000</text><text xml:space="preserve" x="118" y="521.0" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="11" font-weight="400" fill="#343a40">at three in the afternoon on the</text><text xml:space="preserve" x="118" y="536.4" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="11" font-weight="400" fill="#343a40">twenty first of June</text><text xml:space="preserve" x="388" y="521.0" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="11" font-weight="400" fill="#343a40">at 3 in the afternoon on the</text><text xml:space="preserve" x="388" y="536.4" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="11" font-weight="400" fill="#343a40">21st of June</text><line x1="40" y1="545" x2="610" y2="545" stroke="#dee2e6"/><text xml:space="preserve" x="315.0" y="580.0" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" font-weight="400" fill="#343a40">Whisper&#x27;s normaliser maps number words to digits,</text><text xml:space="preserve" x="315.0" y="598.0" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" font-weight="400" fill="#343a40">so rows 2 and 4 count as matches.</text><rect x="630" y="290" width="590" height="135" rx="9" fill="#fff5f5" stroke="#e03131" stroke-width="1.6"/><rect x="630.4" y="291.3" width="590.2" height="134.7" rx="10" fill="none" stroke="#e03131" stroke-width="1.1" stroke-opacity="0.45"/><text xml:space="preserve" x="642" y="321.7" text-anchor="start" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="15" font-weight="700" fill="#c92a2a">Where it breaks</text><text xml:space="preserve" x="642" y="346.5" text-anchor="start" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" fill="#343a40">Digits and abbreviations. Whisper heard</text><text xml:space="preserve" x="642" y="365.4" text-anchor="start" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" fill="#343a40">&#x27;3 PM on 21&#x27; as &#x27;come on&#x27; and lost the 21.</text><text xml:space="preserve" x="642" y="384.2" text-anchor="start" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" fill="#343a40">Spelling the same date out in words scored</text><text xml:space="preserve" x="642" y="403.1" text-anchor="start" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" fill="#343a40">0.000. Audio was not listened to by ear.</text><rect x="630" y="450" width="590" height="140" rx="9" fill="#fff9db" stroke="#e8a300" stroke-width="1.6"/><rect x="631.4" y="448.6" width="591.1" height="139.4" rx="10" fill="none" stroke="#e8a300" stroke-width="1.1" stroke-opacity="0.45"/><text xml:space="preserve" x="642" y="484.2" text-anchor="start" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="15" font-weight="700" fill="#b35c00">Why two stages</text><text xml:space="preserve" x="642" y="509.0" text-anchor="start" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" fill="#343a40">The mel table has 256 times fewer steps than</text><text xml:space="preserve" x="642" y="527.9" text-anchor="start" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" fill="#343a40">the waveform, so the first stage stays small.</text><text xml:space="preserve" x="642" y="546.7" text-anchor="start" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" fill="#343a40">A separate vocoder fills in the fine detail,</text><text xml:space="preserve" x="642" y="565.6" text-anchor="start" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" fill="#343a40">and either part can be swapped alone.</text><rect x="525.1" y="171.0" width="29.8" height="18" rx="4" fill="#fffdf7" fill-opacity="0.95"/><text xml:space="preserve" x="540.0" y="184.0" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="11" font-weight="700" fill="#343a40">mel</text></svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 600" width="1240" height="600" role="img" aria-label="Two ways to turn a mel spectrogram back into sound"><defs></defs><rect x="0" y="0" width="1240" height="600" rx="18" fill="#fffdf7"/><text xml:space="preserve" x="620.0" y="44" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="24" font-weight="700" fill="#1864ab">Two ways to turn a mel spectrogram back into sound</text><text xml:space="preserve" x="620.0" y="70" text-anchor="middle" font-family="'Inter','Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="14" fill="#868e96">Same 4.82 s clip, same 80 x 301 mel input; mel error is the relative gap when the output is turned back into mel</text><rect x="20" y="95" width="600" height="290" rx="14" fill="#fff4e6" fill-opacity="0.35" stroke="#e8590c" stroke-width="2" stroke-dasharray="9 6"/><text xml:space="preserve" x="320.0" y="121" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="16" font-weight="700" fill="#c2410c">Griffin-Lim against HiFi-GAN</text><rect x="40" y="140" width="560" height="36" rx="6" fill="#e8590c"/><text xml:space="preserve" x="48" y="160.0" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" font-weight="700" fill="#ffffff">method</text><text xml:space="preserve" x="278" y="160.0" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" font-weight="700" fill="#ffffff">seconds</text><text xml:space="preserve" x="388" y="160.0" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" font-weight="700" fill="#ffffff">relative mel error</text><line x1="40" y1="176" x2="600" y2="176" stroke="#dee2e6"/><text xml:space="preserve" x="48" y="196.0" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" font-weight="400" fill="#343a40">Griffin-Lim, 1 pass</text><text xml:space="preserve" x="278" y="196.0" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" font-weight="400" fill="#343a40">0.01</text><text xml:space="preserve" x="388" y="196.0" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" font-weight="400" fill="#343a40">0.2541</text><line x1="40" y1="212" x2="600" y2="212" stroke="#dee2e6"/><rect x="40" y="212" width="560" height="36" fill="#fff4e6"/><text xml:space="preserve" x="48" y="232.0" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" font-weight="400" fill="#343a40">Griffin-Lim, 8 passes</text><text xml:space="preserve" x="278" y="232.0" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" font-weight="400" fill="#343a40">0.07</text><text xml:space="preserve" x="388" y="232.0" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" font-weight="400" fill="#343a40">0.1609</text><line x1="40" y1="248" x2="600" y2="248" stroke="#dee2e6"/><text xml:space="preserve" x="48" y="268.0" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" font-weight="400" fill="#343a40">Griffin-Lim, 32 passes</text><text xml:space="preserve" x="278" y="268.0" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" font-weight="400" fill="#343a40">0.32</text><text xml:space="preserve" x="388" y="268.0" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" font-weight="400" fill="#343a40">0.1168</text><line x1="40" y1="284" x2="600" y2="284" stroke="#dee2e6"/><rect x="40" y="284" width="560" height="36" fill="#fff4e6"/><text xml:space="preserve" x="48" y="304.0" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" font-weight="400" fill="#343a40">Griffin-Lim, 128 passes</text><text xml:space="preserve" x="278" y="304.0" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" font-weight="400" fill="#343a40">1.07</text><text xml:space="preserve" x="388" y="304.0" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" font-weight="400" fill="#343a40">0.0929</text><line x1="40" y1="320" x2="600" y2="320" stroke="#dee2e6"/><text xml:space="preserve" x="48" y="340.0" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" font-weight="400" fill="#343a40">HiFi-GAN, 12.7 M</text><text xml:space="preserve" x="278" y="340.0" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" font-weight="400" fill="#343a40">0.26</text><text xml:space="preserve" x="388" y="340.0" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" font-weight="400" fill="#343a40">0.1214</text><line x1="40" y1="356" x2="600" y2="356" stroke="#dee2e6"/><text xml:space="preserve" x="320.0" y="365.0" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" font-weight="400" fill="#343a40">Lower mel error is closer to the input spectrogram.</text><rect x="640" y="95" width="580" height="290" rx="14" fill="#e7f5ff" fill-opacity="0.35" stroke="#1c7ed6" stroke-width="2" stroke-dasharray="9 6"/><text xml:space="preserve" x="930.0" y="121" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="16" font-weight="700" fill="#1864ab">What a recogniser makes of each (12 clips, 186 words)</text><rect x="660" y="140" width="540" height="40" rx="6" fill="#1c7ed6"/><text xml:space="preserve" x="668" y="160.0" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" font-weight="700" fill="#ffffff">audio</text><text xml:space="preserve" x="878" y="160.0" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" font-weight="700" fill="#ffffff">WER</text><text xml:space="preserve" x="1028" y="160.0" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" font-weight="700" fill="#ffffff">S / D / I</text><line x1="660" y1="180" x2="1200" y2="180" stroke="#dee2e6"/><text xml:space="preserve" x="668" y="200.0" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" font-weight="400" fill="#343a40">original</text><text xml:space="preserve" x="878" y="200.0" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" font-weight="400" fill="#343a40">0.0699</text><text xml:space="preserve" x="1028" y="200.0" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" font-weight="400" fill="#343a40">9 / 4 / 0</text><line x1="660" y1="220" x2="1200" y2="220" stroke="#dee2e6"/><rect x="660" y="220" width="540" height="40" fill="#e7f5ff"/><text xml:space="preserve" x="668" y="240.0" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" font-weight="400" fill="#343a40">HiFi-GAN</text><text xml:space="preserve" x="878" y="240.0" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" font-weight="400" fill="#343a40">0.0591</text><text xml:space="preserve" x="1028" y="240.0" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" font-weight="400" fill="#343a40">7 / 4 / 0</text><line x1="660" y1="260" x2="1200" y2="260" stroke="#dee2e6"/><text xml:space="preserve" x="668" y="280.0" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" font-weight="400" fill="#343a40">Griffin-Lim, 32 passes</text><text xml:space="preserve" x="878" y="280.0" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" font-weight="400" fill="#343a40">0.0699</text><text xml:space="preserve" x="1028" y="280.0" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" font-weight="400" fill="#343a40">9 / 4 / 0</text><line x1="660" y1="300" x2="1200" y2="300" stroke="#dee2e6"/><text xml:space="preserve" x="930.0" y="340.0" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" font-weight="400" fill="#343a40">Differences of two words in 186 are noise.</text><text xml:space="preserve" x="930.0" y="360.0" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" font-weight="400" fill="#343a40">The recogniser cannot tell the three apart.</text><rect x="20" y="415" width="600" height="160" rx="9" fill="#fff9db" stroke="#e8a300" stroke-width="1.6"/><rect x="19.5" y="414.0" width="600.5" height="158.7" rx="10" fill="none" stroke="#e8a300" stroke-width="1.1" stroke-opacity="0.45"/><text xml:space="preserve" x="32" y="459.2" text-anchor="start" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="15" font-weight="700" fill="#b35c00">Surprise 1</text><text xml:space="preserve" x="32" y="484.0" text-anchor="start" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" fill="#343a40">Griffin-Lim with 128 passes matches the</text><text xml:space="preserve" x="32" y="502.9" text-anchor="start" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" fill="#343a40">spectrogram better (0.0929) than the neural</text><text xml:space="preserve" x="32" y="521.7" text-anchor="start" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" fill="#343a40">vocoder (0.1214). Matching the spectrogram</text><text xml:space="preserve" x="32" y="540.6" text-anchor="start" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" fill="#343a40">is not the same as sounding natural.</text><rect x="640" y="415" width="580" height="160" rx="9" fill="#fff5f5" stroke="#e03131" stroke-width="1.6"/><rect x="640.1" y="414.6" width="578.7" height="160.0" rx="10" fill="none" stroke="#e03131" stroke-width="1.1" stroke-opacity="0.45"/><text xml:space="preserve" x="652" y="459.2" text-anchor="start" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="15" font-weight="700" fill="#c92a2a">Surprise 2, and a limit</text><text xml:space="preserve" x="652" y="484.0" text-anchor="start" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" fill="#343a40">Whisper reads all three equally well. WER does</text><text xml:space="preserve" x="652" y="502.9" text-anchor="start" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" fill="#343a40">not measure naturalness. That needs listening</text><text xml:space="preserve" x="652" y="521.7" text-anchor="start" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" fill="#343a40">tests, which this chapter did not run, so no</text><text xml:space="preserve" x="652" y="540.6" text-anchor="start" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" fill="#343a40">claim about how any of them sounds is made.</text></svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1150 500" width="1150" height="500" role="img" aria-label="Data quality has six different questions"><defs></defs><rect x="0" y="0" width="1150" height="500" rx="18" fill="#fffdf7"/><text xml:space="preserve" x="575.0" y="44" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="24" font-weight="700" fill="#1864ab">Data quality has six different questions</text><text xml:space="preserve" x="575.0" y="70" text-anchor="middle" font-family="'Inter','Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="14" fill="#868e96">The same row can pass one check and fail another</text><rect x="30" y="120" width="340" height="105" rx="9" fill="#e7f5ff" stroke="#1c7ed6" stroke-width="1.6"/><rect x="29.5" y="119.0" width="340.5" height="103.7" rx="10" fill="none" stroke="#1c7ed6" stroke-width="1.1" stroke-opacity="0.45"/><text xml:space="preserve" x="200.0" y="163.3" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="19" font-weight="700" fill="#1864ab">Accuracy</text><text xml:space="preserve" x="200.0" y="194.0" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="17" fill="#343a40">Does it match reality?</text><rect x="405" y="120" width="340" height="105" rx="9" fill="#e3fafc" stroke="#0c8599" stroke-width="1.6"/><rect x="405.1" y="119.6" width="338.7" height="105.0" rx="10" fill="none" stroke="#0c8599" stroke-width="1.1" stroke-opacity="0.45"/><text xml:space="preserve" x="575.0" y="163.3" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="19" font-weight="700" fill="#0b7285">Completeness</text><text xml:space="preserve" x="575.0" y="194.0" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="17" fill="#343a40">Are required values present?</text><rect x="780" y="120" width="340" height="105" rx="9" fill="#f3f0ff" stroke="#7048e8" stroke-width="1.6"/><rect x="778.6" y="119.8" width="338.7" height="103.8" rx="10" fill="none" stroke="#7048e8" stroke-width="1.1" stroke-opacity="0.45"/><text xml:space="preserve" x="950.0" y="163.3" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="19" font-weight="700" fill="#5f3dc4">Consistency</text><text xml:space="preserve" x="950.0" y="194.0" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="17" fill="#343a40">Do sources agree?</text><rect x="30" y="265" width="340" height="105" rx="9" fill="#fff4e6" stroke="#e8590c" stroke-width="1.6"/><rect x="29.8" y="266.0" width="338.9" height="104.2" rx="10" fill="none" stroke="#e8590c" stroke-width="1.1" stroke-opacity="0.45"/><text xml:space="preserve" x="200.0" y="308.4" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="19" font-weight="700" fill="#c2410c">Timeliness</text><text xml:space="preserve" x="200.0" y="339.0" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="17" fill="#343a40">Is it fresh enough?</text><rect x="405" y="265" width="340" height="105" rx="9" fill="#ebfbee" stroke="#2f9e44" stroke-width="1.6"/><rect x="405.4" y="266.3" width="340.2" height="104.7" rx="10" fill="none" stroke="#2f9e44" stroke-width="1.1" stroke-opacity="0.45"/><text xml:space="preserve" x="575.0" y="308.4" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="19" font-weight="700" fill="#2b8a3e">Validity</text><text xml:space="preserve" x="575.0" y="339.0" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="17" fill="#343a40">Does it obey the rules?</text><rect x="780" y="265" width="340" height="105" rx="9" fill="#fff9db" stroke="#e8a300" stroke-width="1.6"/><rect x="781.4" y="263.6" width="341.1" height="104.4" rx="10" fill="none" stroke="#e8a300" stroke-width="1.1" stroke-opacity="0.45"/><text xml:space="preserve" x="950.0" y="308.4" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="19" font-weight="700" fill="#b35c00">Uniqueness</text><text xml:space="preserve" x="950.0" y="339.0" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="17" fill="#343a40">Should this key repeat?</text><rect x="180" y="415" width="790" height="70" rx="9" fill="#e7f5ff" stroke="#1c7ed6" stroke-width="1.6"/><rect x="178.9" y="413.9" width="789.4" height="70.9" rx="10" fill="none" stroke="#1c7ed6" stroke-width="1.1" stroke-opacity="0.45"/><text xml:space="preserve" x="575.0" y="455.2" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="16" font-weight="700" fill="#1864ab">950 of 1,000 values present = 95% completeness; a 99% rule fails</text></svg>

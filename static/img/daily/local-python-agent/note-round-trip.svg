<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 600" width="1100" height="600" role="img" aria-label="Save a note, then read it back"><defs><marker id="ah343a40" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#343a40"/></marker><marker id="ah343a40s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#343a40"/></marker></defs><rect x="0" y="0" width="1100" height="600" rx="18" fill="#fffdf7"/><text xml:space="preserve" x="550.0" y="44" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="24" font-weight="700" fill="#1864ab">Save a note, then read it back</text><text xml:space="preserve" x="550.0" y="70" text-anchor="middle" font-family="'Inter','Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="14" fill="#868e96">A confirmed tool return connects the model&#x27;s answer to a real file change</text><rect x="25" y="115" width="240" height="125" rx="9" fill="#e7f5ff" stroke="#1c7ed6" stroke-width="1.6"/><rect x="24.5" y="114.0" width="240.5" height="123.7" rx="10" fill="none" stroke="#1c7ed6" stroke-width="1.1" stroke-opacity="0.45"/><text xml:space="preserve" x="145.0" y="160.5" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="15" font-weight="700" fill="#1864ab">1. User request</text><text xml:space="preserve" x="145.0" y="185.4" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" fill="#343a40">Save a note that says</text><text xml:space="preserve" x="145.0" y="204.2" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" fill="#343a40">hello world, Tim</text><rect x="300" y="115" width="240" height="125" rx="9" fill="#fff4e6" stroke="#e8590c" stroke-width="1.6"/><rect x="300.1" y="114.6" width="238.7" height="125.0" rx="10" fill="none" stroke="#e8590c" stroke-width="1.1" stroke-opacity="0.45"/><text xml:space="preserve" x="420.0" y="160.5" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="15" font-weight="700" fill="#c2410c">2. Model tool call</text><text xml:space="preserve" x="420.0" y="185.4" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" fill="#343a40">save_note</text><text xml:space="preserve" x="420.0" y="204.2" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" fill="#343a40">note = hello world, Tim</text><rect x="575" y="115" width="240" height="125" rx="9" fill="#ebfbee" stroke="#2f9e44" stroke-width="1.6"/><rect x="573.6" y="114.8" width="238.7" height="123.8" rx="10" fill="none" stroke="#2f9e44" stroke-width="1.1" stroke-opacity="0.45"/><text xml:space="preserve" x="695.0" y="160.5" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="15" font-weight="700" fill="#2b8a3e">3. Python executes</text><text xml:space="preserve" x="695.0" y="185.4" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" fill="#343a40">append UTF-8 text</text><text xml:space="preserve" x="695.0" y="204.2" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" fill="#343a40">to notes.txt</text><rect x="850" y="115" width="240" height="125" rx="9" fill="#e3fafc" stroke="#0c8599" stroke-width="1.6"/><rect x="849.8" y="116.0" width="238.9" height="124.2" rx="10" fill="none" stroke="#0c8599" stroke-width="1.1" stroke-opacity="0.45"/><text xml:space="preserve" x="970.0" y="160.5" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="15" font-weight="700" fill="#0b7285">4. Tool returns</text><text xml:space="preserve" x="970.0" y="185.4" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" fill="#343a40">Note saved.</text><text xml:space="preserve" x="970.0" y="204.2" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" fill="#343a40">added to message history</text><path d="M265.0,177.5 L300.0,177.5" fill="none" stroke="#343a40" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#ah343a40)"/><path d="M540.0,177.5 L575.0,177.5" fill="none" stroke="#343a40" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#ah343a40)"/><path d="M815.0,177.5 L850.0,177.5" fill="none" stroke="#343a40" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#ah343a40)"/><rect x="25" y="290" width="1050" height="70" rx="9" fill="#f3f0ff" stroke="#7048e8" stroke-width="1.6"/><rect x="25.4" y="291.3" width="1050.2" height="69.7" rx="10" fill="none" stroke="#7048e8" stroke-width="1.1" stroke-opacity="0.45"/><text xml:space="preserve" x="550.0" y="317.1" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="16" font-weight="700" fill="#5f3dc4">5. Agent answers using the tool result</text><text xml:space="preserve" x="550.0" y="343.4" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="14" fill="#343a40">The application has actually written the file before confirming the save.</text><path d="M970.0,240.0 L965.0,290.0" fill="none" stroke="#343a40" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#ah343a40)"/><rect x="25" y="405" width="510" height="140" rx="9" fill="#e3fafc" stroke="#0c8599" stroke-width="1.6"/><rect x="26.4" y="403.6" width="511.1" height="139.4" rx="10" fill="none" stroke="#0c8599" stroke-width="1.1" stroke-opacity="0.45"/><text xml:space="preserve" x="280.0" y="456.9" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="16" font-weight="700" fill="#0b7285">Next question: what is in my note file?</text><text xml:space="preserve" x="280.0" y="483.2" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="14" fill="#343a40">read_notes() -&gt; hello world, Tim</text><text xml:space="preserve" x="280.0" y="503.5" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="14" fill="#343a40">A new process can read the same saved file.</text><rect x="565" y="405" width="510" height="140" rx="9" fill="#fff9db" stroke="#e8a300" stroke-width="1.6"/><rect x="563.9" y="403.9" width="509.4" height="140.9" rx="10" fill="none" stroke="#e8a300" stroke-width="1.1" stroke-opacity="0.45"/><text xml:space="preserve" x="820.0" y="456.9" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="16" font-weight="700" fill="#b35c00">A separate example: calculate</text><text xml:space="preserve" x="820.0" y="483.2" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="14" fill="#343a40">23 * 7 + 1 -&gt; 161 + 1 -&gt; 162</text><text xml:space="preserve" x="820.0" y="503.5" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="14" fill="#343a40">The Python calculator supplies the number.</text></svg>

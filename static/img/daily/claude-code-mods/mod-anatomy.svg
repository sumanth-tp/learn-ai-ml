" font-weight="700" fill="#5f3dc4">The ask decides the API</text><rect x="590" y="145" width="470" height="32.2" rx="6" fill="#7048e8"/><text xml:space="preserve" x="598" y="165.0" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" font-weight="700" fill="#ffffff">You ask for</text><text xml:space="preserve" x="828" y="165.0" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" font-weight="700" fill="#ffffff">A mod uses</text><line x1="590" y1="177.2" x2="1060" y2="177.2" stroke="#dee2e6"/><text xml:space="preserve" x="598" y="197.2" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" font-weight="400" fill="#343a40">hide or reshape rows</text><text xml:space="preserve" x="828" y="197.2" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" font-weight="400" fill="#343a40">ui.render hook</text><line x1="590" y1="209.39999999999998" x2="1060" y2="209.39999999999998" stroke="#dee2e6"/><rect x="590" y="209.39999999999998" width="470" height="32.2" fill="#f3f0ff"/><text xml:space="preserve" x="598" y="229.4" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" font-weight="400" fill="#343a40">a panel / sidebar</text><text xml:space="preserve" x="828" y="229.4" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" font-weight="400" fill="#343a40">$.ui.open + Pane</text><line x1="590" y1="241.59999999999997" x2="1060" y2="241.59999999999997" stroke="#dee2e6"/><text xml:space="preserve" x="598" y="261.6" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" font-weight="400" fill="#343a40">a bar above prompt</text><text xml:space="preserve" x="82
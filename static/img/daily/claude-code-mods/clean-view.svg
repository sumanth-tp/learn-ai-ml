ation Mono',monospace" font-size="14" fill="#343a40"></text><text xml:space="preserve" x="597" y="364.3" text-anchor="start" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="14" fill="#343a40">2 of 5 steps done</text><rect x="585" y="450" width="470" height="125" rx="9" fill="#e3fafc" stroke="#0c8599" stroke-width="1.6"/><rect x="583.6" y="449.8" width="468.7" height="123.8" rx="10" fill="none" stroke="#0c8599" stroke-width="1.1" stroke-opacity="0.45"/><text xml:space="preserve" x="820.0" y="495.5" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="15" font-weight="700" fill="#0b7285">When finished</text><text xml:space="preserve" x="820.0" y="520.4" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" fill="#343a40">a short summary of what it did</text><text xml:space="preserve" x="820.0" y="539.2" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" fill="#343a40">no tool rows, no code scrolling by</text></svg>

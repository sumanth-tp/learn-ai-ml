ospace" font-size="13" fill="#343a40">credit balance, top right</text><rect x="295" y="110" width="250" height="150" rx="9" fill="#e3fafc" stroke="#0c8599" stroke-width="1.6"/><rect x="295.1" y="109.6" width="248.7" height="150.0" rx="10" fill="none" stroke="#0c8599" stroke-width="1.1" stroke-opacity="0.45"/><text xml:space="preserve" x="420.0" y="168.0" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="15" font-weight="700" fill="#0b7285">2. Describe</text><text xml:space="preserve" x="420.0" y="192.9" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" fill="#343a40">one sentence:</text><text xml:space="preserve" x="420.0" y="211.7" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" fill="#343a40">me riding a train</text><rect x="565" y="110" width="250" height="150" rx="9" fill="#f3f0ff" stroke="#7048e8" stroke-width="1.6"/><rect x="563.6" y="109.8" width="248.7" height="148.8" rx="10" fill="none" stroke="#7048e8" stroke-width="1.1" stroke-opacity="0.45"/><text xml:space="preserve" x="690.0" y="158.6" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="15" font-weight="700" fill="#5f3dc4">3. Choose</text><text xml:space="preserve" x="690.0" y="183.4" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" fill="#343a40">photo or video</text><text xml:space="preserve" x="690.0" y="202.3" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" fill="#343a40">Nano Banana Pro</text><text xml:space="preserve" x="690.0" y="221.1" text-anchor="middle" font-family="'Cascadia Code','JetBrai
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1140 465" width="1140" height="465" role="img" aria-label="Personalised retrieval uses more than one signal"><defs></defs><rect x="0" y="0" width="1140" height="465" rx="18" fill="#fffdf7"/><text xml:space="preserve" x="570.0" y="44" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="24" font-weight="700" fill="#1864ab">Personalised retrieval uses more than one signal</text><text xml:space="preserve" x="570.0" y="70" text-anchor="middle" font-family="'Inter','Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="14" fill="#868e96">History can act as an implicit query, but new users and items need a fallback</text><rect x="30" y="130" width="335" height="155" rx="9" fill="#e7f5ff" stroke="#1c7ed6" stroke-width="1.6"/><rect x="29.5" y="129.0" width="335.5" height="153.7" rx="10" fill="none" stroke="#1c7ed6" stroke-width="1.1" stroke-opacity="0.45"/><text xml:space="preserve" x="197.5" y="173.7" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="19" font-weight="700" fill="#1864ab">Collaborative</text><text xml:space="preserve" x="197.5" y="204.3" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="17" fill="#343a40">similar users or items</text><text xml:space="preserve" x="197.5" y="229.0" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="17" fill="#343a40">rating and interaction matrix</text><text xml:space="preserve" x="197.5" y="253.7" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="17" fill="#343a40">cold start with no history</text><rect x="402" y="130" width="335" height="155" rx="9" fill="#f3f0ff" stroke="#7048e8" stroke-width="1.6"/><rect x="402.1" y="129.6" width="333.7" height="155.0" rx="10" fill="none" stroke="#7048e8" stroke-width="1.1" stroke-opacity="0.45"/><text xml:space="preserve" x="569.5" y="173.7" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="19" font-weight="700" fill="#5f3dc4">Content-based</text><text xml:space="preserve" x="569.5" y="204.3" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="17" fill="#343a40">item features match profile</text><text xml:space="preserve" x="569.5" y="229.0" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="17" fill="#343a40">works for a described new item</text><text xml:space="preserve" x="569.5" y="253.7" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="17" fill="#343a40">can narrow discovery</text><rect x="774" y="130" width="335" height="155" rx="9" fill="#ebfbee" stroke="#2f9e44" stroke-width="1.6"/><rect x="772.6" y="129.8" width="333.7" height="153.8" rx="10" fill="none" stroke="#2f9e44" stroke-width="1.1" stroke-opacity="0.45"/><text xml:space="preserve" x="941.5" y="173.7" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="19" font-weight="700" fill="#2b8a3e">Hybrid</text><text xml:space="preserve" x="941.5" y="204.3" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="17" fill="#343a40">combine candidate sources</text><text xml:space="preserve" x="941.5" y="229.0" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="17" fill="#343a40">rank for current context</text><text xml:space="preserve" x="941.5" y="253.7" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="17" fill="#343a40">check diversity and utility</text><rect x="220" y="340" width="700" height="75" rx="9" fill="#fff9db" stroke="#e8a300" stroke-width="1.6"/><rect x="219.8" y="341.0" width="698.9" height="74.2" rx="10" fill="none" stroke="#e8a300" stroke-width="1.1" stroke-opacity="0.45"/><text xml:space="preserve" x="570.0" y="367.9" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="20" font-weight="700" fill="#b35c00">Weighted-neighbour example</text><text xml:space="preserve" x="570.0" y="400.1" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="18" fill="#343a40">(0.8 × 4 + 0.6 × 5) / (0.8 + 0.6) = 4.43</text></svg>

le" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="17" fill="#343a40">know covariates by origin</text><text xml:space="preserve" x="960.0" y="253.7" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="17" fill="#343a40">score each horizon separately</text><rect x="210" y="360" width="740" height="90" rx="9" fill="#fff9db" stroke="#e8a300" stroke-width="1.6"/><rect x="209.8" y="361.0" width="738.9" height="89.2" rx="10" fill="none" stroke="#e8a300" stroke-width="1.1" stroke-opacity="0.45"/><text xml:space="preserve" x="580.0" y="395.9" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="19" font-weight="700" fill="#b35c00">A random shuffle changes the question</text><text xml:space="preserve" x="580.0" y="426.5" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="17" fill="#343a40">future neighbours and regime clues can enter the training set</text></svg>

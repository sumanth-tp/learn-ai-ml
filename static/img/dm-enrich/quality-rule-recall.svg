ation Mono',monospace" font-size="13" fill="#343a40">396 rows flagged for 200 duplicated keys</text><text xml:space="preserve" x="875.0" y="180.7" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" fill="#343a40">precision 0.500, recall 0.990</text><rect x="620" y="213.95" width="510" height="87.94999999999999" rx="9" fill="#fff4e6" stroke="#e8590c" stroke-width="1.6"/><rect x="618.6" y="213.8" width="508.7" height="86.7" rx="10" fill="none" stroke="#e8590c" stroke-width="1.1" stroke-opacity="0.45"/><text xml:space="preserve" x="875.0" y="240.9" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="15" font-weight="700" fill="#c2410c">Coercing to int hides truncation</text><text xml:space="preserve" x="875.0" y="265.8" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" fill="#343a40">mean 40.061 becomes 39.567</text><text xml:space="preserve" x="875.0" y="284.7" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" fill="#343a40">99.1% of rows changed, no error</text><rect x="620" y="317.9" width="510" height="87.94999999999999" rx="9" fill="#f3f0ff" stroke="#7048e8" stroke-width="1.6"/><rect x="619.8" y="318.9" width="508.9" height="87.1" rx="10" fill="none" stroke="#7048e8" stroke-width="1.1" stroke-opacity="0.45"/><text xml:space="preserve" x="875.0" y="344.9" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="15" font-weight="700" fill="#5f3dc4">Parsing with errors=coerce</text><text xml:space="preserve" x="875.0" y="369.8" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" fill="#343a40">3.1% become NaN</text><text xml:space="preserve" x="875.0" y="388.6" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" fill="#343a40">sum 777,725 against 801,225</text></svg>

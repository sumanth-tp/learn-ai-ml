0c8599" stroke-width="1.6"/><rect x="608.6" y="232.6" width="518.7" height="86.7" rx="10" fill="none" stroke="#0c8599" stroke-width="1.1" stroke-opacity="0.45"/><text xml:space="preserve" x="870.0" y="259.8" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="15" font-weight="700" fill="#0b7285">Inside Parquet only</text><text xml:space="preserve" x="870.0" y="284.7" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" fill="#343a40">16 columns summed 0.052 s</text><text xml:space="preserve" x="870.0" y="303.5" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" fill="#343a40">2 columns 0.004 s: 14.6x</text><rect x="610" y="336.75" width="520" height="106.8" rx="9" fill="#f3f0ff" stroke="#7048e8" stroke-width="1.6"/><rect x="609.8" y="337.7" width="518.9" height="106.0" rx="10" fill="none" stroke="#7048e8" stroke-width="1.1" stroke-opacity="0.45"/><text xml:space="preserve" x="870.0" y="363.8" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="15" font-weight="700" fill="#5f3dc4">Sorted against shuffled, one-day filter</text><text xml:space="preserve" x="870.0" y="388.6" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" fill="#343a40">row groups that can match: 1 of 8 against 8 of 8</text><text xml:space="preserve" x="870.0" y="407.5" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" fill="#343a40">query time 0.0031 s against 0.0050 s</text><text xml:space="preserve" x="870.0" y="426.3" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consola
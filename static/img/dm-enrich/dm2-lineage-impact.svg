<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 480" width="1120" height="480" role="img" aria-label="A lineage graph over-reports, and silent jobs hide the rest"><defs></defs><rect x="0" y="0" width="1120" height="480" rx="18" fill="#fffdf7"/><text xml:space="preserve" x="560.0" y="44" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="24" font-weight="700" fill="#1864ab">A lineage graph over-reports, and silent jobs hide the rest</text><text xml:space="preserve" x="560.0" y="70" text-anchor="middle" font-family="'Inter','Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="14" fill="#868e96">synthetic estate: 119 nodes, 172 edges, 6,060 run events, 60 models</text><text xml:space="preserve" x="40.0" y="112.0" text-anchor="start" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="14" font-weight="700" fill="#343a40">Models flagged when a source is bad from day 60 (mean over 10 sources)</text><text xml:space="preserve" x="40.0" y="151.0" text-anchor="start" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" font-weight="400" fill="#343a40">plain graph</text><rect x="190" y="130" width="420" height="26" rx="5" fill="#e9ecef"/><rect x="190" y="130" width="420.0" height="26" rx="5" fill="#e03131"/><text xml:space="preserve" x="620.0" y="151.0" text-anchor="start" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" font-weight="700" fill="#c92a2a">21.0</text><text xml:space="preserve" x="40.0" y="191.0" text-anchor="start" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" font-weight="400" fill="#343a40">time-aware</text><rect x="190" y="170" width="420" height="26" rx="5" fill="#e9ecef"/><rect x="190" y="170" width="196.0" height="26" rx="5" fill="#2f9e44"/><text xml:space="preserve" x="620.0" y="191.0" text-anchor="start" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" font-weight="700" fill="#2b8a3e">9.8</text><text xml:space="preserve" x="40.0" y="232.0" text-anchor="start" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" font-weight="400" fill="#868e96">factor 2.14; worst source: 39 flagged against 20 affected</text><text xml:space="preserve" x="40.0" y="290.0" text-anchor="start" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="14" font-weight="700" fill="#343a40">Recall of affected models as jobs stop emitting lineage</text><text xml:space="preserve" x="40.0" y="329.0" text-anchor="start" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" font-weight="400" fill="#343a40">0% jobs silent</text><rect x="190" y="308" width="420" height="26" rx="5" fill="#e9ecef"/><rect x="190" y="308" width="420.0" height="26" rx="5" fill="#2f9e44"/><text xml:space="preserve" x="620.0" y="329.0" text-anchor="start" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" font-weight="700" fill="#2b8a3e">1.000</text><text xml:space="preserve" x="40.0" y="369.0" text-anchor="start" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" font-weight="400" fill="#343a40">5% jobs silent</text><rect x="190" y="348" width="420" height="26" rx="5" fill="#e9ecef"/><rect x="190" y="348" width="365.0" height="26" rx="5" fill="#0c8599"/><text xml:space="preserve" x="620.0" y="369.0" text-anchor="start" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" font-weight="700" fill="#0b7285">0.869</text><text xml:space="preserve" x="40.0" y="409.0" text-anchor="start" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" font-weight="400" fill="#343a40">10% jobs silent</text><rect x="190" y="388" width="420" height="26" rx="5" fill="#e9ecef"/><rect x="190" y="388" width="289.4" height="26" rx="5" fill="#e8a300"/><text xml:space="preserve" x="620.0" y="409.0" text-anchor="start" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" font-weight="700" fill="#b35c00">0.689</text><text xml:space="preserve" x="40.0" y="449.0" text-anchor="start" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" font-weight="400" fill="#343a40">20% jobs silent</text><rect x="190" y="428" width="420" height="26" rx="5" fill="#e9ecef"/><rect x="190" y="428" width="202.0" height="26" rx="5" fill="#e03131"/><text xml:space="preserve" x="620.0" y="449.0" text-anchor="start" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" font-weight="700" fill="#c92a2a">0.481</text><rect x="680" y="130" width="400" height="130" rx="9" fill="#fff9db" stroke="#e8a300" stroke-width="1.6"/><rect x="679.5" y="129.0" width="400.5" height="128.7" rx="10" fill="none" stroke="#e8a300" stroke-width="1.1" stroke-opacity="0.45"/><text xml:space="preserve" x="880.0" y="159.2" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="15" font-weight="700" fill="#b35c00">Why the graph over-reports</text><text xml:space="preserve" x="880.0" y="184.0" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" fill="#343a40">It says could reach.</text><text xml:space="preserve" x="880.0" y="202.9" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" fill="#343a40">Models trained before the</text><text xml:space="preserve" x="880.0" y="221.7" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" fill="#343a40">change read good data, so</text><text xml:space="preserve" x="880.0" y="240.6" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" fill="#343a40">they are not affected.</text><rect x="680" y="290" width="400" height="150" rx="9" fill="#fff5f5" stroke="#e03131" stroke-width="1.6"/><rect x="680.1" y="289.6" width="398.7" height="150.0" rx="10" fill="none" stroke="#e03131" stroke-width="1.1" stroke-opacity="0.45"/><text xml:space="preserve" x="880.0" y="329.2" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="15" font-weight="700" fill="#c92a2a">Why recall falls so fast</text><text xml:space="preserve" x="880.0" y="354.0" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" fill="#343a40">A path crosses four or five jobs.</text><text xml:space="preserve" x="880.0" y="372.9" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" fill="#343a40">One silent job cuts the path.</text><text xml:space="preserve" x="880.0" y="391.7" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" fill="#343a40">20% silent jobs lose more than</text><text xml:space="preserve" x="880.0" y="410.6" text-anchor="middle" font-family="'Cascadia Code','JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" fill="#343a40">half of the affected models.</text></svg>

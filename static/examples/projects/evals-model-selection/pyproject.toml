[project]
name = "modelsel"
version = "0.1.0"
description = "Model-selection lab: custom benchmark, calibrated LLM judge and defensible statistics"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "fastapi>=0.141.1",
    "jinja2>=3.1.6",
    "langchain>=1.4.2",
    "langchain-anthropic>=1.7.4",
    "langchain-core>=1.6.5",
    "langchain-ollama>=1.1.0",
    "langchain-openai>=1.6.6",
    "numpy>=2.5.3",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "scipy>=1.18.1",
    "tenacity>=9.1.4",
    "uvicorn>=0.54.0",
]

[project.scripts]
modelsel = "modelsel.cli:main"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.9",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/modelsel"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-ra"

[tool.ruff]
line-length = 120
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "ASYNC"]
ignore = ["RUF001", "RUF002", "RUF003", "SIM905"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]
"src/modelsel/dataset.py" = ["E501"]  # the template table reads best one ticket per line

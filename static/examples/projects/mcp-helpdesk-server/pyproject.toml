[project]
name = "helpdesk-mcp"
version = "1.0.0"
description = "A production-grade remote MCP server for an internal IT helpdesk."
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "fastmcp>=4.0.10",
    "mcp>=2.2.0",
    "pydantic>=2.13",
    "pydantic-settings>=2.15.0",
    "sqlalchemy[asyncio]>=2.1.1",
    "aiosqlite>=0.22.1",
    "asyncpg>=0.31.0",
    "alembic>=1.20.0",
    "pyjwt[crypto]>=2.15.0",
    "structlog>=26.1.0",
    "prometheus-client>=0.26.0",
    "langchain>=1.4.2",
    "langchain-core>=1.6.5",
    "langchain-openai>=1.6.6",
    "uvicorn>=0.54.0",
    "httpx>=0.28.1",
    "starlette>=1.7.0",
]

[project.scripts]
helpdesk-mcp = "helpdesk_mcp.cli:main"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.9",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/helpdesk_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
addopts = "-ra"
filterwarnings = ["ignore::DeprecationWarning", "ignore:The logging capability is deprecated"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["src/helpdesk_mcp/migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC", "S", "RUF", "SIM"]
ignore = ["S101", "RUF012"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "S311"]

# Used only for authoring migrations from the command line, e.g.
#   uv run alembic revision --autogenerate -m "add sla_due_at"
# The URL comes from HELPDESK_DATABASE_URL (see migrations/env.py).
[alembic]
script_location = src/helpdesk_mcp/migrations
prepend_sys_path = src

[loggers]
keys = root

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[handler_console]
class = StreamHandler
args = (sys.stderr,)
formatter = generic

[formatter_generic]
format = %(levelname)s %(name)s %(message)s

[project]
name = "support-agent"
version = "0.1.0"
description = "Production customer-support agent for an e-commerce shop, built with LangGraph."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "langgraph>=1.2.12",
  "langchain>=1.4.2",
  "langchain-core>=1.6.5",
  "langchain-openai>=1.6.6",
  "langgraph-checkpoint-sqlite>=3.1.1",
  "langgraph-checkpoint-postgres>=3.1.2",
  "psycopg[binary,pool]>=3.3.6",
  "aiosqlite>=0.22.1",
  "sqlalchemy>=2.1.1",
  "pydantic>=2.13",
  "pydantic-settings>=2.15.0",
  "fastapi>=0.141.1",
  "uvicorn[standard]>=0.54.0",
  "httpx>=0.28.1",
  "langsmith>=0.14.1",
  "prometheus-client>=0.26.0",
]

[project.scripts]
support-agent = "support_agent.cli:main"

[dependency-groups]
dev = [
  "pytest>=9.1.1",
  "pytest-asyncio>=1.4.0",
  "ruff>=0.16.9",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/support_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-ra"
filterwarnings = ["ignore::DeprecationWarning:langchain_core.*"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "ASYNC", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]

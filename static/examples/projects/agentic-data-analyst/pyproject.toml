[project]
name = "agentic-data-analyst"
version = "0.1.0"
description = "Autonomous data-analyst agent: natural-language questions to safe SQL and charts over a business warehouse, built with LangGraph."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "duckdb>=1.5.5",
    "fastapi>=0.141.1",
    "langchain>=1.4.2",
    "langchain-core>=1.6.5",
    "langchain-openai>=1.6.6",
    "langgraph>=1.2.12",
    "langgraph-checkpoint-sqlite>=3.1.1",
    "matplotlib>=3.11.2",
    "numpy>=2.5.3",
    "pandas>=3.0.6",
    "prometheus-client>=0.26.0",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "python-dotenv>=1.2.3",
    "sqlglot>=30.19.0",
    "structlog>=26.1.0",
    "typer>=0.27.2",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "ruff>=0.16.9",
]

[project.scripts]
analyst = "data_analyst.cli:app"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/data_analyst"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "S", "RUF"]
ignore = ["S101", "S608", "S603", "RUF001"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "B"]
"src/data_analyst/warehouse/seed.py" = ["S311", "E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[project]
name = "mcp-gateway"
version = "0.1.0"
description = "Enterprise MCP gateway: one authenticated, policy-enforcing front door for many upstream MCP servers."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastmcp>=4.0.10",
    "httpx2>=2.13.1",
    "langchain>=1.4.2",
    "langchain-core>=1.6.5",
    "langchain-openai>=1.6.6",
    "prometheus-client>=0.26.0",
    "pydantic>=2.13",
    "pydantic-settings>=2.15.0",
    "pyjwt[crypto]>=2.15.0",
    "python-dotenv>=1.2.3",
    "pyyaml>=6.0.3",
    "structlog>=26.1.0",
    "uvicorn>=0.54.0",
]

[project.scripts]
mcp-gateway = "mcp_gateway.cli:main"
mcp-gateway-admin = "mcp_gateway.admin:main"

[build-system]
requires = ["uv_build>=0.12.15,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.9",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
addopts = "-ra"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [".venv"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "S", "RUF", "ASYNC"]
ignore = ["S101", "S104", "RUF001", "RUF012"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "S108", "S311", "B017"]
"src/mcp_gateway/evals.py" = ["S311"]

[project]
name = "research-analyst"
version = "0.1.0"
description = "Multi-agent research analyst that writes cited reports, built on LangGraph."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "langgraph>=1.2",
  "langgraph-checkpoint-sqlite>=3.0",
  "langchain>=1.4",
  "langchain-core>=1.6",
  "langchain-openai>=1.6",
  "langsmith>=0.14",
  "pydantic>=2.13",
  "pydantic-settings>=2.15",
  "fastapi>=0.141",
  "uvicorn>=0.54",
  "httpx>=0.28",
  "tenacity>=9.1",
]

[project.optional-dependencies]
anthropic = ["langchain-anthropic>=1.0"]
ollama = ["langchain-ollama>=1.0"]

[project.scripts]
research-analyst = "research_analyst.cli:main"

[dependency-groups]
dev = [
  "pytest>=9.1",
  "pytest-asyncio>=1.4",
  "ruff>=0.16",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/research_analyst"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF", "ASYNC"]
ignore = ["RUF001", "RUF002", "RUF003"]
